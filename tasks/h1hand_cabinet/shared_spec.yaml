reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/cabinet.py
      lines: 71-242
      symbol: Cabinet.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 4fd92938c1cf99a0ceec87f142f74ea9efc4c42e31f8f883f782d3a211c6947c
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.cabinet:Cabinet.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: 'A LADDER, not a sum: `0.2 * (stand_reward * small_control) + 0.8 * rung_reward` where rung_reward
      is the CURRENT subtask''s own shaping (door openness fraction for rungs one and two; a 0.5/0.5 mix
      of door openness and cube-to-compartment proximity for rungs three and four), plus a one-off `+100
      * rung` on each advance and a flat 1000 per step at rung five (which the terminal ends immediately).
      The ladder position lives on the task object in Python -- the reason this adapter carries an observation
      tail -- and advancing DISCARDS the old rung''s shaping income, which is what makes parking below
      a threshold profitable; see exploits.'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: 'Doors and drawers read well in a frame -- open versus shut is visible geometry --
    and the cubes are larger in frame than cube''s 5 cm dice thanks to the fixed compartments. What a
    still cannot show is the LADDER: which subtask is current is task state with no visual marker, so
    a judge sees cabinet-and-cubes, not progress.'
  camera:
    name: cam_hand_visible
    mode: tracking
    note: '`cam_hand_visible` is the task''s own camera, framing the hands and the cabinet face -- what
      a manipulation judge needs.'
  extra_views:
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past. A
      drawer or door pulled towards the robot reads as displacement in profile, where the shoulder camera
      sees it foreshortened.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: overhead
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 4 m directly above: the robot and everything
      within about two metres of it seen in plan, for where it is relative to nearby objects and which
      way it is heading. Height and posture do not read from here.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  subtasks_sequential: false
  telemetry_fields:
  - cabinet_stage
  - pull_door_slide
  - drawer_slide
domain_randomization: null
exploits:
- name: park_below_the_advance_threshold
  mechanism: Each rung pays its own shaping only WHILE CURRENT, and completing it swaps that income for
    the next rung's -- which starts near zero. Holding the first door at 94% open pays 0.8 * 0.94 per
    step forever; completing it pays +100 once and drops the per-step rate to the shut drawer's ~0. Over
    the ~900 steps that remain, parking just below the threshold out-earns advancing unless the LATER
    rungs can also be completed quickly -- the ladder's own bookkeeping punishes progress.
  status: open
  closed_by: null
  note: 'Arithmetic from the source (0.8 * 0.94 * 900 = 677 against 100 plus rung-two shaping from a shut
    drawer), not observed in a rollout. BIRD''s metric counts COMPLETED rungs only, so the
    parked door reads 0.0 and the completed one 0.25: the two behaviours are ordered oppositely by the
    metric and the reward, a sharp reward/ground-truth disagreement.'
- name: cube_rungs_advance_on_a_fly_through
  mechanism: Rungs three and four test the cube centre's instantaneous position against a fixed box, once
    per step, with no settledness conjunct -- a cube thrown so its arc passes through the compartment
    banks the +100 advance in transit and the ladder moves on while the cube lands on the floor.
  status: open
  closed_by: null
  note: 'Arithmetic from the source, not observed in a rollout. The metric inherits this shape
    DELIBERATELY: its rung tests are upstream''s own (they are the task''s definition of done, the same
    argument push makes for adopting the termination radius), so a fly-through advances the metric too,
    and the honest reading is that the TASK, not just the reward, accepts a throw. Recorded so nobody
    mistakes metric agreement here for the metric being unable to disagree.'
- name: nothing_ever_fails
  mechanism: The only terminal is success, so every degenerate behaviour -- collapsing on the first step
    included -- runs the full 1000 steps collecting the 0.2-weighted posture floor plus whatever rung-one
    openness it happened to cause. Every sibling task cuts a fallen robot's episode short; this one pays
    it out in full.
  status: open
  closed_by: null
  note: 'From get_terminated (lines 244-247: the subtask check is the whole function), not observed in
    a rollout. Not a route to a HIGH return, but it inflates every low return: two policies
    that fell at step 10 and step 990 are the same episode length here and different ones everywhere else
    in the tier.'
