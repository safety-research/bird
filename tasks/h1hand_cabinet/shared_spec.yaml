  rule: source and asset, not docstrings
  measured:
  - 'Built with mujoco==3.3.0 against humanoid-bench cb11890 on 2026-09-01. STATIC READ ONLY: the observation
    and actuator tables are the target model''s own, read from MjModel.from_xml_path on h1hand_pos_cabinet.xml
    (nq=109, nv=104: five scene joints at qposadr 76-80, four free cubes at 81, 88, 95, 102), robot block
    confirmed identical to the h1hand_walk donor by scripts/derive_humanoid_facts.py. The env has NOT
    been constructed or stepped: no reward-at-reset figure, no step-purity run, no frame, no anchor.'
  - 'The subtask ladder''s own constants, read from the source and adopted by the metric as task structure:
    pull door |qpos[79] / 0.4| > 0.95, drawer |qpos[76] / 0.45| > 0.95, drawer_cube into x in [0.6, 1.2],
    y in [-0.6, 0.6], z in [0.79, 1.09], lateral cube into the same footprint at z in [1.39, 1.69]. Joint
    ranges confirmed on the built model (drawer [0, 0.45], pull door [-0.4, 0], swing doors +/-1.57, pull-up
    door [0, 1.57]).'
  - Reward, ladder, terminal and keyframe cube positions read from humanoid_bench/envs/cabinet.py at sha256
    4fd92938c1cf99a0ceec87f142f74ea9efc4c42e31f8f883f782d3a211c6947c. The ladder is advanced by upstream's
    OWN get_reward called on the restored state (`_before_step`'s contract, maze's precedent), with its
    print noise muzzled; the +100 one-offs therefore appear in reference_reward exactly where upstream
    pays them.
  verified_by: BIRD authors
  date: '2026-09-01'
