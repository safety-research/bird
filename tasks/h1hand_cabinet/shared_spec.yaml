# h1hand_cabinet -- HumanoidBench `h1hand-cabinet-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 9 scene joint(s) and 1 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/cabinet's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_cabinet
env:
  env_id: h1hand-cabinet-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: 'The ONLY terminal is total success: the episode ends when all four subtasks are complete,
      with a flat 1000-per-step payout on the final step. Nothing else ends it -- there is NO fall terminal,
      so a collapsed robot''s episode runs its full 1000 steps.'
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 3057-3061
      symbol: H1HandCabinet._task_reset
    rng_note: One draw on the stream, the base `uniform(size=109)` at 942; `_task_reset` (2824-2828) resets
      the ladder and draws nothing.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 109 position
          coordinates (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`,
          line 968, upstream''s `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed
          componentwise and then renormalised by `set_state`''s `mj_forward`, so all four move. No literal
          box: keyframe plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: object_pose
      quantity: cabinet_joints_noise
      fields:
      - s.cabinet_joints
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the five panel joints (drawer slide, two swing-door
          hinges, pull-door slide, pull-up hinge) about their closed keyframe value 0 -- scalar slide
          and hinge coordinates, no quaternion. `set_state` does not clamp to `jnt_range`, so a panel
          can start up to 0.01 m or 0.01 rad past its lower limit.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: object_pose
      quantity: cabinet_cubes_noise
      fields:
      - s.drawer_cube_pose
      - s.lateral_cube_pose
      - s.pulling_cube_pose
      - s.pullup_cube_pose
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the four free cubes' seven pose coordinates
          each, about their keyframe resting places in the drawer, the middle compartment, the pulling
          cabinet and the top compartment. Free-body quaternions are perturbed componentwise and renormalised
          by `mj_forward`, so all four components move.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_cabinet.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: cabinet_velocities
      value: '0 -- the five panel joints and four cubes start at rest: the keyframe carries no qvel and
        the hook writes none.'
      fields:
      - s.cabinet_joint_velocities
      - s.drawer_cube_vel
      - s.lateral_cube_vel
      - s.pulling_cube_vel
      - s.pullup_cube_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: cabinet_stage
      value: 1 -- the ladder starts at rung one (slide the pulling-cabinet door), so the current goal
        is that door past 95% of its 0.4 m range; the four rung tests and the two compartment boxes (`_CABINET_MID_BOX`,
        `_CABINET_TOP_BOX`) are fixed. Carried in the tail.
      fields:
      - cabinet_stage
      source:
        path: bird/envs/humanoid_hand.py
        lines: '3060'
        symbol: H1HandCabinet._task_reset
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and `Cabinet.reset_model` (cabinet.py:249-251)
      draws nothing; this adapter draws everything from the episode Generator (`_reset`, 941-944), so
      a BIRD episode is reproducible from its seed where an upstream one is not.'
    prompt_states: The robot spawns standing at the origin, facing it.
    prompt_field: scene
    prompt_omits:
    - agent_pose
    - object_pose
