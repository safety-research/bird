discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    expr: current_subtask == 5 -- the reward's own subtask ladder having advanced past all four rungs.
      The same counter is the `success` key in the info dict and the whole of Cabinet.get_terminated.
    provenance:
      path: humanoid_bench/envs/cabinet.py
      lines: 94-247
      symbol: Cabinet.get_reward / Cabinet.get_terminated
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 4fd92938c1cf99a0ceec87f142f74ea9efc4c42e31f8f883f782d3a211c6947c
    sound: false
    unsoundness: 'Rungs three and four advance on an INSTANTANEOUS position test of a cube''s centre (a
      0.6 x 1.2 x 0.3 m box for rung three, its 1.54 m-high twin for rung four) with no settledness conjunct:
      a cube TOSSED through the compartment advances the ladder in transit, exactly the fly-through push''s
      spec records for its own terminal. The joint rungs (one and two) are sound -- a door 95% open is
      open.'
    reimplementation:
      repo: bird
      module: bird.envs.humanoid_hand
      symbol: H1HandCabinet._success_flag
      verified_against: 'Source-read transcription: the carried ladder slot (s[213]) at its terminal value
        5, which is the same counter upstream''s get_terminated reads -- the adapter advances it with
        upstream''s OWN get_reward on the restored state, so the flag cannot drift from the code it mirrors.
        NOT resolved by name from this file; recorded so the artifact names where the check lives.'
  hardened:
    module: null
    symbol: hardened_success
    status: pending
    tightened: null
    added_conjuncts: null
    not_tightened_because: null
    pending_plan: 'PLAN, not an implemented oracle: add a settledness conjunct to the two cube rungs (cube
      linear speed below a threshold while inside the compartment box) -- the same conjunct the push spec
      plans for the same fly-through defect. The two joint rungs need no hardening: a door 95% open is
      open.'
    conservatism: 'A per-step ladder cannot express "the robot did the placing": a cube knocked into its
      compartment by a collapsing arm counts the same as one set down deliberately.'
    invariant: hardened <= shipped
continuous_success:
  raw:
    name: cabinet_subtasks_completed_fraction
    expr: '(completed rungs) / 4, recomputed from the states: walk the arriving states in order, advancing
      a counter on upstream''s own four completion tests -- pull door |q/0.4| > 0.95, drawer |q/0.45|
      > 0.95, drawer_cube centre inside the middle compartment box, lateral cube centre inside the top
      compartment box -- each applied only once the previous rung is done. DELIBERATELY DISCRETE, quarters
      only: partial credit for a door 94% open would be the reward''s own shaping re-derived, and parking
      just below an advance threshold is this task''s central exploit. bird/envs/humanoid_hand.py::H1HandCabinet.task_metric'
    unit: fraction of the four subtasks completed, in order
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.25
