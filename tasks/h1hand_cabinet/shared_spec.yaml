description:
  natural_language: 'Work through a wall cabinet in a fixed order: slide open one door, pull open the
    drawer, then move two cubes into their compartments -- a four-rung ladder of subtasks.'
  l_task: Operate a large wall cabinet through four subtasks IN ORDER. First slide the pulling cabinet's
    door fully open; second, pull the middle drawer fully out; third, take the cube from the drawer and
    place it inside the middle cabinet compartment (opening either swing door to get in); fourth, lift
    the second cube up into the top compartment behind the pull-up door. Each completed subtask pays a
    one-off bonus and moves the ladder on; completing all four ends the episode as a success. The cabinet
    stands one metre ahead; the episode lasts up to 1000 control steps at 50 Hz.
  env_prose: 'The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder roll,
    shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators. The
    count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single command
    curls both. Every actuator is a POSITION servo -- the control signal names an angle for that joint
    to move towards, it does not apply a torque directly, and the same numeric command means a different
    angle at different joints because -1 and +1 are the two ends of each actuator''s own range. The pelvis
    is unattached to anything, so the robot is free to translate in all three directions and to rotate
    arbitrarily; it can and does fall over. The robot weighs about 53 kg. The ground is flat, infinite
    and empty -- no obstacle, no target, no scenery. The episode ends early only if the pelvis drops below
    0.2 m.'
  scene: 'Flat ground and a wall cabinet at x = 0.9 with five jointed panels -- a sliding pulling-cabinet
    door, a drawer, two swing doors on the middle compartment, and a pull-up door on the top compartment
    -- plus four free 5-6 cm cubes: one in the drawer (0.58 m), one in the middle compartment (0.87 m),
    one in the pulling cabinet (1.16 m) and one in the top compartment (1.45 m). The robot spawns standing
    at the origin, facing it.'
