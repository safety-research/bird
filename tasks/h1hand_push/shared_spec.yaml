      value: 769.57
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 115.01
      env_steps: 120320000
      success_bar: 700.0
      success_bar_source: >-
        humanoid-bench @ cb11890 (this spec's pinned commit), humanoid_bench/envs/push.py:26
        (`success_bar = 700`).
      source: >-
        FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_push
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final
        point of the authors' released plotting data behind that figure
        (data/humanoidbench_result.json @ 77922d0 in younggyoseo/FastTD3, committed 2025-09-21),
        key h1hand_push; std is half the released band width (return_min/return_max are exactly
        mean -/+ std).
      note: >-
        A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation
        point of the paper's own training run, not a separately evaluated frozen policy. Clears the
        task's 700 success bar, with two caveats that both cut against it. The released log runs
        far past Figure 9's 10,800 s x-limit (final point at 58,772 s / 120.3M steps); at the
        figure's visible end the curve reads ~473, below the bar. The value clears the 700 bar
        only in that extended log. THE VERDICT IS INSIDE THE SPREAD: 769.57 +/- 115.01
        straddles the 700 bar, so the three runs behind this mean do not agree on which side of it
        the task fell -- the mean is above it, which is not the same claim.
      date: '2026-09-01'
