discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    expr: >-
      goal_dist < 0.05, where goal_dist = ||qpos[-7:-4] - goal|| (Push.goal_dist). The same check
      is the +1000 bonus in Push.get_reward, the `success` key in its info dict, and the whole of
      Push.get_terminated.
    provenance:
      path: humanoid_bench/envs/push.py
      lines: '72-103'
      symbol: Push.goal_dist / Push.get_reward / Push.get_terminated
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: fa4aed41a2b5483ce1823c3412c10b0c80790dd76f2c951a76bba056f5247726
    sound: false
    unsoundness: >-
      Instantaneous on the box's centre with no settledness conjunct: a box batted hard enough
      registers success in transit through the 0.05 m ball -- and because the check is also the
      terminal, a fly-through ends the episode as a paid success with the box still moving. Separately,
      the target is drawn from a region containing the box's start, so about 0.65% of episodes are
      successes at t=0 that no policy earned (see `exploits`).
    reimplementation:
      repo: bird
      module: bird.envs.humanoid_hand
      symbol: H1HandPush._success_flag
      verified_against: >-
        Source-read transcription: ||s[76:79] - s[164:167]|| < 0.05, the same predicate over the
        box's qpos and the carried target. NOT resolved by name from this file -- the adapter
        implements it directly as a method and `step()` reports it in info['success']; recorded
        here so the artifact names where the transcription lives. Not yet executed against
        upstream's own info['success'] (see provenance.measured).
      sha256: null
  hardened:
    module: null
    symbol: hardened_success
    status: pending
    tightened: null
    added_conjuncts: null
    not_tightened_because: null
    pending_plan: >-
      PLAN, not an implemented oracle: add a settledness conjunct (box linear speed below a threshold
      while inside the radius) -- the same conjunct the Meta-World push spec plans for the same
      fly-through defect. Decide the threshold from source, recording each conjunct considered and rejected.
    conservatism: >-
      An instantaneous per-step check cannot express 'the robot did the pushing': a box that slides
      into the target off a collision with the robot's shin counts the same as a hand-guided push.
    invariant: hardened <= shipped
continuous_success:
  raw:
    name: box_target_progress
    expr: >-
      1.0 the moment any arriving state has the box's centre within 0.05 m of the target (the
      environment's own success radius, which also ends the episode); otherwise the episode's best
      approach as a fraction of the initial gap, clip(1 - d_min / max(d_0, 0.05), 0, 1).
      bird/envs/humanoid_hand.py::H1HandPush.task_metric
    unit: fraction of the initial box-target gap
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: >-
      identity -- the raw metric is already a fraction in [0, 1], and no anchor pair exists to
      normalise against (see `anchors`)
    success_threshold: 0.5
