reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/push.py
      lines: '72-95'
      symbol: Push.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: fa4aed41a2b5483ce1823c3412c10b0c80790dd76f2c951a76bba056f5247726
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: left_hand_position -- the one accessor this reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    import_path: humanoid_bench.envs.push:Push.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `-0.1 * ||left_hand - box|| - ||box - target|| + 1000 * [goal_dist < 0.05]`, with termination
      on the same check. The only h1hand task whose reward is a plain distance shaping with no
      `tolerance` kernel, and it is DENSE AND NEGATIVE until the terminal bonus -- the return of an
      episode that never succeeds is strictly negative and truncation at 500 steps is a mercy. Note
      it reads the LEFT hand only: a right-handed push pays the hand-distance term as if the robot
      were idle. Read against source at cb11890, not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS (the routes to the quantity a candidate is scored on in this repo), and
    `success_bar` is the benchmark symbol nothing upstream reads but a candidate could. `success`
    is DELIBERATELY ABSENT -- listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close). On this task the gate is
    also thinner than it looks, and honestly so: the shipped reward, the success check and the
    ground-truth metric all measure the SAME box-target distance, and that distance is legitimately
    in the observation (s[164:167] IS the target), so a candidate that re-derives it is writing the
    task, not reaching the fitness.
judge:
  vlm_legible: true
  legibility_note: >-
    A box on a table with a red target marker: the adapter reproduces upstream's goal marker inside
    its own render path (`H1HandPush._pre_render`), because upstream draws it only through
    `Task.render`, which this repo bypasses -- without that, a frame would show a box and no
    objective anywhere. Whether the 5 cm marker survives 448x320 at the tabletop camera's distance
    is UNMEASURED: no frame has been rendered.
  camera:
    name: cam_tabletop
    mode: tracking
    note: >-
      `cam_tabletop` is a `mode="trackcom"` camera at (2.5, 2, 1.5) relative to the robot's centre
      of mass, looking down across the tabletop -- the box, both hands and the marker are in frame
      at once, which is what a manipulation judge needs.
  extra_views:
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      The box and its target on the table read in plan; how far the box has moved is visible
      here and foreshortened from the table camera.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, with the robot at about three
      times the pixels the default camera gives it. Where the robot is in the room is not
      visible from here.
  subtasks_sequential: false
  telemetry_fields:
  - box_target_dist
  - hand_box_dist
  - box_z
domain_randomization: null
exploits:
- name: fly_through_success
  mechanism: >-
    The success check is instantaneous on the box's centre and doubles as the terminal, so a box
    batted hard enough to cross the 0.05 m ball in flight ends the episode as a paid success
    (+1000) with the box still moving. No settledness conjunct exists anywhere in the task.
  status: open
  closed_by: null
  note: >-
    The same defect the Meta-World push spec records of ITS benchmark, reproduced independently
    here. BIRD's `task_metric` does not close it -- any arriving state inside the radius scores
    1.0 -- so it is a known property of both the reward and the metric rather than a surprise in a
    rollout video. The hardened oracle's pending_plan is the close.
- name: born_terminated_freebie
  mechanism: >-
    `Push.reset_model` draws the target from x ~ U(0.7, 1.0), y ~ U(-0.5, 0.5) while the box starts
    at (0.7, 0, 1.0) plus a 0.01 perturbation, so about 0.65% of episodes (a 0.05-radius
    quarter-disc over the 0.3 x 1.0 sample region) begin inside the success radius: +1000 and a
    terminal at step one, for any policy whatsoever.
  status: open
  closed_by: null
  note: >-
    An initialisation defect rather than a shaping defect, and small -- but at a handful of eval
    episodes per candidate it is a rare +1000 outlier in a return average, which is exactly the
    scale of noise that reorders candidates. Computed from the sample geometry, not observed in a
    rollout. Reproduced by the adapter rather than corrected, because a different
    initial distribution is a different environment.
