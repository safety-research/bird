description:
  natural_language: >-
    Push the box across the table so that it ends up at the marked target. The box is a 20 cm,
    0.3 kg cube resting on a table in front of the robot; the target is a point on the tabletop,
    drawn afresh each episode and carried in the last three numbers of the observation. Sliding
    the box there with either hand counts; knocking it off the table does not -- the target sits
    at table height, so the floor is further from it than the box's start was. The episode ends
    the moment the box's centre is within 5 cm of the target.
  l_task: >-
    Push the box across the table so that it ends up at the marked target. The box is a 20 cm,
    0.3 kg cube resting on a table in front of the robot; the target is a point on the tabletop,
    drawn afresh each episode and carried in the last three numbers of the observation. Sliding
    the box there with either hand counts; knocking it off the table does not -- the target sits
    at table height, so the floor is further from it than the box's start was. The episode ends
    the moment the box's centre is within 5 cm of the target.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    In front of the robot stands a 232 kg table whose top surface is 0.9 m off the floor, and on it
    rests a 0.2 m cubic box weighing 0.3 kg, initially at (0.7, 0, 1.0) -- within arm's reach of a
    standing robot. Somewhere on the tabletop is a target point, drawn afresh each episode from
    x in [0.7, 1.0] and y in [-0.5, 0.5] at table height; its position is the last three numbers
    of the observation, s[164:167]. The episode ends only by success: the box's centre within
    0.05 m of the target. There is no failure terminal -- a fallen robot simply runs out the clock.
  scene: >-
    Flat infinite ground, a standing humanoid with two five-fingered hands, a table directly in
    front of it, a small box on the table, and a small red marker on the tabletop showing where
    the box is meant to go.
  success_criterion_prose: >-
    The box's centre within 0.05 m of the target -- the environment's own check, which also ends
    the episode the step it first holds.
  full_source:
    path: humanoid_bench/envs/push.py
    lines: 61-109
