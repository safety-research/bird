# h1hand_push -- HumanoidBench `h1hand-push-v0` on the Unitree H1 with two Shadow Hands.
#
# Upstream ships a real per-step success predicate here (box within 0.05 m of the target), the
# episode TERMINATES ON SUCCESS and on nothing else, and the reward is a plain dense distance
# shaping.
# What defects it does have are in `exploits` below, as data.
#
# THE OBSERVATION CARRIES TASK STATE THE SIMULATOR DOES NOT HOLD. `Push.reset_model` draws a
# 3-D target per episode that lives on the task object; the reward and the termination both
# read it. BIRD's observation is therefore qpos ++ qvel ++ target (167 = 83 + 81 + 3), so a
# stateless step stays a function of its arguments -- s[164:167] is the target, and
# bird/envs/humanoid_hand.py's module docstring (PUSH AND BASKETBALL section) is the contract.
#
# DERIVED, NOT TRANSCRIBED. Every row of `flat_fields`, every entry of `action_fields` and
# every joint range came from building `assets/envs/h1hand_pos_push.xml` with mujoco==3.1.6
# against humanoid-bench cb11890; the robot half is spliced verbatim from the h1hand_powerlift
# spec after asserting the two models' joint and actuator tables are identical.
# See `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py::H1HandPush`; read its module docstring first.

schema_version: 1
id: h1hand_push
env:
  env_id: h1hand-push-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 500
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately when the box's centre comes within 0.05 m of the target -- that
      is, it ends ON SUCCESS, and there is no failure terminal at all: a fallen robot keeps the
      episode running to its full 500 steps. About 0.65% of episodes are born terminated, because
      the target is drawn from a region that contains the box's own starting position.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: H1HandPush._task_reset
      lines: 1690-1709
    rng_note: >-
      Order: `rng.uniform(-0.01, 0.01, size=83)` in the base `_reset` (line 942), then in `_task_reset`
      goal x (line 1595) and goal y (line 1596). The goal lives on upstream's task object, not in qpos,
      and reaches the observation as s[164:167] through `_extra_state` (lines 1580-1581).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 83 position coordinates
          (76 robot + 7 box, the box's described separately; metres on the pelvis position, radians on the
          69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The keyframe stands
          the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity quaternion. The
          four pelvis quaternion components are perturbed componentwise and then renormalised by `set_state`'s
          `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal box: keyframe
          plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: object_pose
      quantity: box_keyframe_noise
      fields:
      - s.box_pose
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- entries 76:83: the box's
          keyframe pose (0.7, 0, 1.0) m on the tabletop with the identity quaternion (`h1hand_pos_push.xml`
          `<key>`) plus U(-0.01, 0.01) on x, y, z and on each quaternion component, renormalised by `mj_forward`.
          `_task_reset` leaves qpos untouched (line 1597), as upstream's `Push.reset_model` does (push.py:105-109).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: goal
      quantity: target_xy
      fields:
      - target_x
      - target_y
      distribution:
        family: uniform
        text: >-
          Target x ~ U(0.7, 1.0) m, y ~ U(-0.5, 0.5) m, independent, written into `task.goal[0:2]`. The
          region contains the box's own start, so about 0.65% of episodes (a 0.05 m disc over a 0.3 x 1.0
          m rectangle) are born inside `_GOAL_RADIUS` and terminate at step 1 (lines 1590-1592).
        low:
        - 0.7
        - -0.5
        high:
        - 1.0
        - 0.5
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1698-1700
      basis: read
      note: >-
        `Push.reset_model` (push.py:105-107) draws the same two uniforms, from the GLOBAL `np.random`. `tests/test_humanoid_hand.py:817-818`
        pins that the goal is a function of the seed where humanoid_bench is installed -- not in this venv.
    constants:
    - role: goal
      quantity: target_z
      fields:
      - target_z
      value: >-
        1.0 m -- `Push.__init__` sets `self.goal = np.array([1.0, 0.0, 1.0])` (push.py:46) and `reset_model`
        writes indices 0 and 1 only (push.py:106-107; adapter 1562-1563), so z is never written; `_PUSH_GOAL_LOW[2]
        == _PUSH_GOAL_HIGH[2] == 1.0` pins it in the observation bounds.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 518-519
      basis: read
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_push.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: box_velocities
      fields:
      - s.box_vel
      value: >-
        0 -- the box's six velocities start at rest: the keyframe carries no qvel (`assets/envs/h1hand_pos_push.xml`
        `<key>` declares `qpos` only) and no hook writes a velocity.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
        symbol: _H1HandBase._reset
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Push.reset_model` draws the target from the GLOBAL `np.random` (push.py:105-107)
      while leaving qpos to the base perturbation, as the adapter does (1553-1564); this adapter draws everything
      from the episode Generator (`_reset`, 941-944; `_task_reset`, 1561-1563), so a BIRD episode is reproducible
      from its seed where an upstream one is not.
    prompt_states: >-
      the target is a point on the tabletop, drawn afresh each episode and carried in the last three numbers
      of the observation
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
