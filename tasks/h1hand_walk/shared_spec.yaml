discrete_success:
  kind: continuous_only
  no_discrete_success_because: >-
    This task ships no boolean success check: `Walk.get_reward`'s info dict carries only its own
    reward terms, and `Walk.get_terminated` is a collapse terminal, not a success. What the class does declare is `success_bar` (700), a threshold on the episode
    RETURN of the task's own hand-written reward, read by zero lines of upstream code -- a plotting
    constant from the paper. Adopting it would make ground truth a monotone function of the shipped
    reward. Ground truth is therefore the state-derived continuous metric below.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: walk_mean_speed_fraction
    expr: >-
      clip((x_T - x_0) / (T * dt), 0, 1.0) / 1.0 -- mean forward speed over the episode against the
      task's own 1 m/s bound (the `bounds=(1, inf)` on the reward's move term, the same normaliser
      `h1hand_crawl` uses). Endpoints over elapsed steps, so backwards travel reads 0.0 rather than a
      negative number. bird/envs/humanoid_hand.py::H1HandWalk.task_metric
    unit: fraction of the task's 1 m/s full pace
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: >-
      identity -- the raw metric is already a fraction in [0, 1], and no anchor pair exists to
      normalise against (see `anchors`)
    success_threshold: 0.25
anchors:
  # null: no policy in `policies/` attempts this task honestly -- the `h1hand_hb_hacks`
  # entries for it are deliberate metric hacks, registered at status `reference`.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: >-
      NOT MEASURED: no uniform-random population has been scored on this task, so read any number
      from it as unanchored. A uniform-random policy is expected to score ~0.0: random position
      targets take a 61-DoF humanoid to the floor within a couple of seconds, mean forward
      displacement stays around zero, and the pelvis terminal at 0.2 m ends the episode early.
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: >-
      No expert exists in any sense the schema accepts: no scripted policy, no demonstrations, and
      HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None
      and fitness stays RAW, per the absence-is-explicit rule.
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 928.26
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 21.88
      env_steps: 6400000
      success_bar: 700.0
      success_bar_source: >-
        humanoid-bench @ cb11890 (this spec's pinned commit),
        humanoid_bench/envs/basic_locomotion_envs.py:31 (`Walk.success_bar = 700`).
      source: >-
        FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_walk
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final
        point of the authors' released plotting data behind that figure
        (data/humanoidbench_result.json @ 77922d0 in younggyoseo/FastTD3, committed 2025-09-21),
        key h1hand_walk; std is half the released band width (return_min/return_max are exactly
        mean -/+ std).
      note: >-
        A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation
        point of the paper's own training run, not a separately evaluated frozen policy. Clears
        the task's 700 success bar.
      date: '2026-09-01'
