# h1hand_walk -- HumanoidBench `h1hand-walk-v0` on the Unitree H1 with two Shadow Hands.
#
# An ordinary qpos+qvel locomotion task (151-D, no extra state). Its one
# recorded exploit is the `(5*move+1)/6` floor every HumanoidBench locomotion reward carries.
#
# DERIVED, NOT TRANSCRIBED -- model facts from a mujoco==3.1.6 build of the
# task's own asset at cb11890; the whole observation table is spliced verbatim from the
# h1hand_hurdle spec after asserting the two models' joint and actuator tables are equal.
# See `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py::H1HandWalk`; read its module docstring first.
schema_version: 1
id: h1hand_walk
env:
  env_id: h1hand-walk-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately if the pelvis drops below 0.2 m -- that is, if the robot collapses.
      Otherwise it runs its full 1000 steps. There is no way to finish early by succeeding.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: _H1HandBase._reset
      lines: 936-986
    rng_note: >-
      One call, `rng.uniform(-0.01, 0.01, size=76)` (line 942), and nothing else: H1HandWalk defines no
      `_task_reset`, so the base hooks are the identity (lines 970-978). `domain_randomization` is null
      on this spec, so no DR draw precedes it (bird/envs/base.py:401-406).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 76 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream's
          `DEFAULT_RANDOMNESS`). The keyframe stands the robot at the origin facing +x, pelvis at (0, 0,
          0.98) m with the identity quaternion. The four pelvis quaternion components are perturbed componentwise
          and then renormalised by `set_state`'s `mj_forward`, so all four move; hinges are not clamped
          to `jnt_range`. No literal box: keyframe plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_walk.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: goal
      value: >-
        none -- there is no goal object or target point. `task_metric` is the mean forward pelvis speed
        over the episode against `_LOCO_V_REF` = 1.0 m/s (line 537), and `_success_flag` is pelvis x >=
        1.0 m; both are constants of the metric, not of the reset.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1905-1925
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Walk` adds nothing (`class Walk(Task)`, basic_locomotion_envs.py:21;
      no `reset_model` of its own, so `Task.reset_model`, tasks.py:44-45, just returns the observation);
      this adapter draws everything from the episode Generator (`_reset`, 941-944), so a BIRD episode is
      reproducible from its seed where an upstream one is not.
    prompt_states: there is no destination, no obstacle and no way to finish early
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
