reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/basic_locomotion_envs.py
      lines: '46-97'
      symbol: Walk.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: d05cb3ee859fa523aa0fd42b4b70c8ade40f29d491d6c96cef04036d3b6e8fbb
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.basic_locomotion_envs:Walk.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `small_control * stand_reward * move`, all tolerance kernels: `stand_reward = standing *
      upright` over head height and torso uprightness, and `move = (5 * tolerance(com_vx, bounds=(1,
      inf), margin=1, linear) + 1) / 6` -- note the floor: `move` never reads below 1/6, which is
      the recorded exploit. Read against source at cb11890, not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in this repo --
    and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could find, a
    threshold on the shipped reward's own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is
    structural, because `success()` here is a threshold on `task_metric`, which IS gated.
judge:
  vlm_legible: true
  legibility_note: >-
    A walking gait reads clearly in a frame; DISTANCE does not. `cam_default` is a trackcom camera
    centred on the robot over a bare floor, so the only motion cue is the floor texture sliding --
    whether that survives 448x320 is UNMEASURED (no frame has been rendered). A judge sees gait
    quality, not speed, and the two are exactly what the `(5*move+1)/6` floor pays apart.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis, so the robot stays centred and
      absolute travel is hidden. On a scenery-free plain this hides almost all progress.
  extra_views:
  - name: course
    mode: fixed
    note: >-
      Fixed camera 10 m to the right of the course, level with the robot, looking at a point
      3 m along it from the start: the robot enters at the left and moves right as it
      travels, leaving the frame after about 9 m. It is small here, roughly seventy pixels
      tall, but its position along the course is absolute, which no camera that follows the
      robot can show.
    pose:
      lookat: [3.0, 0.0, 0.8]
      azimuth: 90
      elevation: -8
      distance: 10.0
  - name: side
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from its right-hand side, level with it
      and 3 m away: a side profile in which lean, gait, crouch and the height of anything
      held read directly. It moves with the robot, so absolute position is not visible; only
      the floor grid slides past.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_x
  - forward_velocity
  - pelvis_z
domain_randomization: null
exploits:
- name: move_floor_pays_standing
  mechanism: >-
    `move = (5 * tolerance(com_vx, bounds=(1, inf), margin=1, linear) + 1) / 6` floors at 1/6 for
    any velocity at or below zero, so a robot that simply stands upright collects `small_control *
    stand_reward / 6` -- roughly 0.16 per step -- for all 1000 steps while travelling nowhere. The
    same floor construction appears in every HumanoidBench locomotion reward (hurdle's spec records
    its instance), and it makes standing a stable local optimum on the way to walking.
  status: open
  closed_by: null
  note: >-
    Arithmetic from the source (the floor is a literal), not observed in a rollout.
    BIRD's `task_metric` reads mean forward speed and scores the behaviour exactly 0.0, so the gap
    between fitness and return is the measurement, as on powerlift.
- name: speed_metric_pays_two_footed_hop
  mechanism: >-
    BIRD's own ground truth on this task reads displacement and nothing else. `task_metric` is
    `clip((x_T - x_0) / (T * dt), 0, 1)` -- endpoint mean forward pelvis speed against 1 m/s
    (`bird/envs/humanoid_hand.py::H1HandWalk.task_metric`); `success()` is that number at or above
    `success_threshold` 0.25 (`bird/envs/base.py`); the per-step `info["success"]` latch is
    `_success_flag`, pelvis `s[0] >= 1.0` m. None of the three reads a contact, which foot is down,
    whether the feet alternate or how long either spends in single support -- the 151-D observation
    carries no contact at all -- so a two-footed hop that moves the pelvis at 1 m/s is a walk to
    every one of them. Observed, not arithmetic: `policies/h1hand_hb_hacks/hop` commands both legs
    identically on every step (a Raibert kangaroo hop; the feet CANNOT alternate, by construction)
    and on the adapter, seeds 0-99, scores `task_metric` mean 1.0000 (min 0.9997 on seed 74; 99 of
    100 seeds exactly 1.0), `success()` 100/100, all 1000 steps on every seed
    (`policies/h1hand_hb_hacks/records/eval_hop_2026-09-23_153654_af6678f1.json`, mujoco 3.1.6) -- the
    metric's maximum, so it cannot tell this gait from a walk. A gait census of the same
    policy, on gym seeds 1000-1099 over a plain gym.make (not the adapter): both feet
    airborne on 55.7 % of steps, exactly one foot down on 1.6 %, fore-aft ankle separation never
    above 3.2 cm, 53-55 hops per episode at ~1.035 m/s.
  status: open
  closed_by: null
  note: >-
    Built deliberately, not a learner's discovery -- an intentional metric hack, registered at status `reference`, which claims nothing about solving the task. The shipped reward is
    fooled by the same gait (HB return 890.65 mean on the same 100 seeds, 100/100 at or above the
    700 bar); this entry is about BIRD's check. Nothing closes it. A fix needs a footfall conjunct
    the state cannot supply: read the two ankle contacts per step from the simulator and require alternating
    single-support phases -- or bound the
    both-airborne fraction -- on the rows that count toward the metric. Composes with
    `speed_metric_pays_backwards_travel`: the backwards hop is also a hop.
- name: speed_metric_pays_backwards_travel
  mechanism: >-
    The same three reductions read world-frame +x displacement and never the heading: `task_metric`
    is `x_T - x_0` over elapsed time, `success()` a threshold on it, `_success_flag` `s[0] >= 1.0`.
    The pelvis quaternion is in the observation at `s[3:7]` and no reduction looks at it, so a robot
    yawed 180 degrees and travelling +x -- facing AWAY from where it is going -- pays exactly what a
    robot facing +x pays. Observed: `policies/h1hand_hb_hacks/moonhop` (the hopper above under a
    heading servo slewed 0 -> pi from 1.5 s, then a negative speed command in its own frame) hops
    round on the spot and hops backwards for the rest of the episode. On the adapter, seeds 0-99:
    `task_metric` 1.0 on all 95 full episodes (mean 0.9655), `success()` 99/100
    (`policies/h1hand_hb_hacks/records/eval_moonhop_2026-09-23_153642_6bae96e5.json`, mujoco 3.1.6).
    The five seeds that fell during or just after the turn (14, 31, 38, 73, 82, at steps 127-306)
    still read 0.17-0.42 on the metres hopped before the fall, and four of the five clear the 0.25
    threshold; seed 31 at 0.1657 is the one failure. A heading census of the same policy, on gym
    seeds 90-149 over a plain gym.make (not the adapter): the turn completes at steps
    156-159, and thereafter the pelvis faces within 0.5 rad of -x on 98.6-100 % of steps (mean 99.5
    %) while moving +x at 1.22-1.24 m/s, 20.5-21.1 m net.
  status: open
  closed_by: null
  note: >-
    Built deliberately, with the same `reference` status as the entry above. The shipped reward is
    fooled by the same behaviour (HB return 767.23 mean on the 100 seeds, 95/100 at or above 700 --
    the ~158-step turn spends `move` at its floor, so it pays less than the forward hop's 890.65,
    and facing backwards costs nothing); this entry is about BIRD's check. Nothing closes it. A fix
    needs a heading gate, and the state can supply one: body-frame forward velocity in place of
    world-frame delta-x, or a conjunct that the pelvis yaw from `s[3:7]` stays within a band of +x
    on the rows that count. Independent of the gait blind spot: a walker that alternates its feet
    and walks backwards would pass a footfall check and still needs this one.
