# h1hand_package -- HumanoidBench `h1hand-package-v0` on the Unitree H1 with two Shadow Hands.
#
# A 167-D task: nq 83, nv 81 and a THREE-DIMENSIONAL task tail, and
# unlike push's goal that tail is MODEL state -- `Package.reset_model` writes
# `model.body_pos[-1]`, so it survives `set_state` and the adapter must restore it explicitly.
#
# DERIVED, NOT TRANSCRIBED -- model facts from a mujoco==3.1.6 build of the task's
# own asset at cb11890 (nq 83, nv 81, nu 61, nbody 73, last body `package_destination`). The robot
# half of the observation table is spliced from the h1hand_push spec, whose nq/nv are identical,
# after asserting both against the built model; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py::H1HandPackage`; read its module docstring first.
schema_version: 1
id: h1hand_package
env:
  env_id: h1hand-package-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends the moment the package's centre comes within 0.1 m of the destination marker --
      that is the task's only early ending, and it pays a large one-off bonus. Otherwise it runs its
      full 1000 steps. The robot collapsing does NOT end the episode.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: H1HandPackage._task_reset
      lines: 3369-3384
    rng_note: >-
      Order: `rng.uniform(-0.01, 0.01, size=83)` in the base `_reset` (line 942), then in `_task_reset`
      package x (3108), package y (3109), destination x, destination y (3111-3112). The destination is MODEL
      state (`model.body_pos[-1]`), not qpos; it reaches the observation as s[164:167] through the `destination_loc`
      site after `set_state`'s `mj_forward` (lines 3127-3131).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 83 position coordinates
          (76 robot + 7 package, the package's described separately; metres on the pelvis position, radians
          on the 69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The keyframe
          stands the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity quaternion.
          The four pelvis quaternion components are perturbed componentwise and then renormalised by `set_state`'s
          `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal box: keyframe
          plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: object_pose
      quantity: package_xy
      fields:
      - package_x
      - package_y
      distribution:
        family: uniform
        text: >-
          Package x ~ U(-2, 2) m, y ~ U(-2, 2) m, independent, overwriting the keyframe noise on qpos[76:78].
          Drawn from the same 4 x 4 m square as the destination, so about 0.2% of episodes (a 0.1 m disc
          over 16 m^2) are born delivered and terminate at step 1 (lines 3168-3170).
        low:
        - -2.0
        - -2.0
        high:
        - 2.0
        - 2.0
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3379-3380
      basis: read
      note: >-
        `Package.reset_model` (package.py:157-158) draws the same two uniforms, from the GLOBAL `np.random`.
    - role: object_pose
      quantity: package_orientation_noise
      fields:
      - package_quat_w
      - package_quat_x
      - package_quat_y
      - package_quat_z
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- entries 79:83: the package's
          keyframe quaternion, the identity (`h1hand_pos_package.xml` `<key>`: package at (0.75, 0, 0.35)),
          plus U(-0.01, 0.01) per component, renormalised by `mj_forward`. `_task_reset` overwrites the
          package's x, y, z but not its orientation, as upstream's `Package.reset_model` does (package.py:157-159).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: goal
      quantity: destination_xy
      fields:
      - destination_x
      - destination_y
      distribution:
        family: uniform
        text: >-
          Destination body x ~ U(-2, 2) m, y ~ U(-2, 2) m, independent, written into `model.body_pos[-1]`
          (the `package_destination` body); the observed site position equals the body position in x and
          y (`_PACKAGE_SITE_OFFSET` is (0, 0, 0.35), line 615).
        low:
        - -2.0
        - -2.0
        high:
        - 2.0
        - 2.0
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3382-3383
      basis: read
      note: >-
        `Package.reset_model` (package.py:163-165) draws the same two uniforms, from the GLOBAL `np.random`,
        into `model.body_pos[-1]` with z 0.
    constants:
    - role: object_pose
      quantity: package_z
      fields:
      - package_z
      value: >-
        0.35 m -- pinned after the noise (upstream package.py:159 likewise), so the package always starts
        resting on the floor.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '3381'
      basis: read
    - role: goal
      quantity: destination_z
      fields:
      - destination_z
      value: >-
        0.35 m -- the destination body is placed at z = 0 (line 3177; upstream package.py:163-165) and the
        observed `destination_loc` site sits at `pos="0 0 0.35"` inside it (upstream `assets/tasks/package.xml:13-14`,
        restated as `_PACKAGE_SITE_OFFSET`, line 615); `_PACKAGE_DEST_LOW[2] == _PACKAGE_DEST_HIGH[2] ==
        0.35` pins it in the bounds (lines 610-611).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3382-3383
        symbol: H1HandPackage._task_reset
      basis: read
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_package.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: package_velocities
      fields:
      - s.package_vel
      value: >-
        0 -- the package's six velocities start at rest: the keyframe carries no qvel (`assets/envs/h1hand_pos_package.xml`
        `<key>` declares `qpos` only) and no hook writes a velocity.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
        symbol: _H1HandBase._reset
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Package.reset_model` draws the package's x, y and the destination's
      from the GLOBAL `np.random` (package.py:157-158, 163-165); this adapter draws everything from the
      episode Generator (`_reset`, 941-944; `_task_reset`, 3108-3112), so a BIRD episode is reproducible
      from its seed where an upstream one is not. One OBSERVATION difference, not a distribution one: upstream
      moves `body_pos[-1]` AFTER its `set_state` (package.py:162-165) and returns `get_obs()` without another
      forward pass, so its reset observation carries the destination site where it stood BEFORE the move
      (the previous episode's, or the keyframe's on a fresh env); the adapter moves the body in `_task_reset`
      and the base `set_state` (945) runs `mj_forward` after it, so s[164:167] is the current destination
      from the first observation.
    prompt_states: Both are in different places every episode
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
