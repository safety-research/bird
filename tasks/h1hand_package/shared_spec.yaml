description:
  natural_language: >-
    Pick up the package and carry it to the marked spot on the floor, then put it down there. The
    package is a light box that starts somewhere on the floor nearby; the destination is a small
    marked circle somewhere else on the floor. Both are in different places every episode. The task
    is transport -- reaching the package, lifting it, walking it across, and leaving it at the
    marker -- not merely touching it or holding it up.
  l_task: >-
    Pick up the package and carry it to the marked spot on the floor, then put it down there. The
    package is a light box that starts somewhere on the floor nearby; the destination is a small
    marked circle somewhere else on the floor. Both are in different places every episode. The task
    is transport -- reaching the package, lifting it, walking it across, and leaving it at the
    marker -- not merely touching it or holding it up.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    On the floor with the robot are a light cardboard package (a 0.4 x 0.2 x 0.7 m box weighing about
    0.28 kg, free to move and to be picked up) and a marked destination circle. Both are placed
    randomly within a 4 x 4 m square every episode. The episode ends as soon as the package reaches
    the destination.
  scene: >-
    A humanoid on flat ground with a cardboard box on the floor and a small translucent teal sphere
    marking the destination. Nothing else is in the scene. The box and the marker are in different
    places every episode, so where the robot must go is only visible from the marker itself.
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/package.py
    lines: 1-166
state_surface:
  fields:
  - name: s.pelvis_pos
    shape: (3,)
    units: m
    slice: 0:3
    description: World position of the pelvis (the free root body).
  - name: s.pelvis_quat
    shape: (4,)
    units: null
    slice: '3:7'
    description: Pelvis orientation as a unit quaternion in (w, x, y, z) order.
  - name: s.joint_angles
    shape: (69,)
    units: rad
    slice: 7:76
    description: >-
      All sixty-nine hinge angles: twenty-one body joints then twenty-four in each Shadow Hand. Individual
      names and ranges are in flat_fields.
  - name: s.package_pose
    shape: (7,)
    units: mixed
    slice: 76:83
    description: 'Free-body pose of the package: three world positions then a (w, x, y, z) quaternion.'
  - name: s.pelvis_linvel
    shape: (3,)
    units: m/s
    slice: 83:86
    description: Linear velocity of the pelvis in world axes.
  - name: s.pelvis_angvel
    shape: (3,)
    units: rad/s
    slice: 86:89
    description: >-
      Angular velocity of the pelvis. NOTE three numbers where the orientation above is four -- that
      is why the state has 83 positions and 81 velocities.
  - name: s.joint_velocities
    shape: (69,)
    units: rad/s
    slice: 89:158
    description: The sixty-nine hinge velocities, in the same order as the angles.
  - name: s.package_vel
    shape: (6,)
    units: mixed
    slice: 158:164
    description: Linear then angular velocity of the package.
  - name: s.destination_pos
    shape: (3,)
    units: m
    slice: 164:167
    description: >-
      The destination the package is meant to reach: a marker on the FLOOR, its x and y drawn afresh
      each episode from U(-2, 2) and its z always 0.35 (the `destination_loc` site's own offset
      inside `package_destination`). NOT simulator state, and not task-object state either -- it is
      MODEL state, `model.body_pos[-1]`, which is why the adapter restores it explicitly.
  helpers:
  - name: pelvis_pos
    signature: pelvis_pos(s)
    description: = s[0:3], the robot's root position in metres
    kind: inline_expression
    expression: s[0:3]
  - name: pelvis_height
    signature: pelvis_height(s)
    description: = s[2], about 0.98 when standing
    kind: inline_expression
    expression: s[2]
  - name: uprightness
    signature: uprightness(s)
    description: >-
      = 1 - 2*(s[4]**2 + s[5]**2), the world-z component of the pelvis's own z axis: +1 upright, 0
      horizontal, -1 upside-down
    kind: inline_expression
    expression: 1 - 2*(s[4]**2 + s[5]**2)
  - name: joint_angles
    signature: joint_angles(s)
    description: = s[7:76], all sixty-nine hinge angles
    kind: inline_expression
    expression: s[7:76]
  - name: control_cost
    signature: control_cost(a)
    description: = np.sum(np.square(a)), a measure of commanded effort
    kind: inline_expression
    expression: np.sum(np.square(a))
  - name: pelvis_linvel
    signature: pelvis_linvel(s)
    description: = s[83:86], the pelvis's linear velocity in m/s
    kind: inline_expression
    expression: s[83:86]
  - name: forward_velocity
    signature: forward_velocity(s)
    description: = s[83], the pelvis's forward (+x) velocity in m/s
    kind: inline_expression
    expression: s[83]
  - name: joint_velocities
    signature: joint_velocities(s)
    description: = s[89:158], the sixty-nine hinge velocities in rad/s
    kind: inline_expression
    expression: s[89:158]
  - name: package_pos
    signature: package_pos(s)
    description: = s[76:79], the package's centre in metres
    kind: inline_expression
    expression: s[76:79]
  - name: package_height
    signature: package_height(s)
    description: = s[78], the package's height above the floor in metres (0.35 where it starts)
    kind: inline_expression
    expression: s[78]
  - name: package_velocity
    signature: package_velocity(s)
    description: = s[158:161], the package's linear velocity in m/s
    kind: inline_expression
    expression: s[158:161]
  - name: destination_pos
    signature: destination_pos(s)
    description: = s[164:167], this episode's destination marker in metres, constant for the episode
    kind: inline_expression
    expression: s[164:167]
  - name: package_to_destination
    signature: package_to_destination(s)
    description: = s[164:167] - s[76:79], the vector from the package's centre to the destination
    kind: inline_expression
    expression: s[164:167] - s[76:79]
  - name: package_destination_distance
    signature: package_destination_distance(s)
    description: = np.linalg.norm(s[164:167] - s[76:79]), the scalar the environment's own success check thresholds at 0.1 m
    kind: inline_expression
    expression: np.linalg.norm(s[164:167] - s[76:79])
  helpers_note: >-
