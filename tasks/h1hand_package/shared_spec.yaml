discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    expr: >-
      dist_package_destination < 0.1, where dist_package_destination = ||qpos['free_package'][:3] -
      site_xpos['destination_loc']||. The same predicate is the +1000 bonus in Package.get_reward,
      the `success` key in its info dict, and the whole of Package.get_terminated.
    provenance:
      path: humanoid_bench/envs/package.py
      lines: '91-153'
      symbol: Package.get_reward / Package.get_terminated
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 272208df8e7cb47d93d622e483ac47e50d937fb0c25dfe609fc749dfc308df0d
    sound: false
    unsoundness: >-
      Instantaneous on the package's centre with no settledness conjunct and no conjunct that the
      robot let go: a package still in both hands, held over the marker, is a paid success, and a
      package thrown so it passes through the 0.1 m ball registers in transit. Because the same
      check is also the terminal, either ends the episode as a success. Separately the reset draws
      the package's x, y and the destination's x, y from the SAME U(-2, 2) square, so about 0.2% of
      episodes begin already delivered (see `exploits`).
    reimplementation:
      repo: bird
      module: bird.envs.humanoid_hand
      symbol: H1HandPackage._success_flag
      verified_against: >-
        Source-read transcription: ||s[76:79] - s[164:167]|| < 0.1, the same predicate over the
        package's qpos and the carried destination. NOT resolved by name from this file -- the
        adapter implements it as a method and `step()` reports it in info['success']. Not yet
        executed against upstream's own info['success'] (see provenance.measured).
      sha256: null
  hardened:
    module: null
    symbol: hardened_success
    status: pending
    tightened: null
    added_conjuncts: null
    not_tightened_because: null
    pending_plan: >-
      PLAN, not an implemented oracle: add a settledness conjunct (package linear speed below a
      threshold while inside the radius) AND a released conjunct (neither hand within grasp range
      of the package), which together are what distinguish delivering a package from holding one
      over the marker. Decide both thresholds from source, recording each conjunct considered and rejected.
    conservatism: >-
      An instantaneous per-step check cannot express 'the robot carried it there': a package that
      slides to the marker after being kicked counts the same as one carried and set down.
    invariant: hardened <= shipped
continuous_success:
  raw:
    name: package_delivered_fraction
    expr: >-
      mean over arriving states of (||s[76:79] - s[164:167]|| < 0.1) -- the fraction of the episode the
      package spends at the destination, using the ENVIRONMENT's own success radius (its terminal
      condition) and never the reward's shaping constants. DELIVERY, not approach, so a policy that
      hovers just outside the radius holding the package up scores 0.0.
      bird/envs/humanoid_hand.py::H1HandPackage.task_metric
    unit: fraction of arriving states with the package delivered
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: >-
      identity -- the raw metric is already a fraction in [0, 1], and no anchor pair exists to
      normalise against (see `anchors`)
    success_threshold: 0.0005
