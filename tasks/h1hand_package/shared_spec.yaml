      path: humanoid_bench/envs/package.py
      lines: '91-145'
      symbol: Package.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 272208df8e7cb47d93d622e483ac47e50d937fb0c25dfe609fc749dfc308df0d
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.package:Package.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      Additive, NOT a product: `stand_reward * small_control - 3 * dist_package_destination - 0.1 *
      (dist_hand_package_left + dist_hand_package_right) + package_height + 1000 * success`, where
      `package_height = min(package_z, 1)`. Two of those terms pay for things other than
      transporting the package -- see `exploits`. Read against source at cb11890, not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in this repo --
    and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could find, a
    threshold on the shipped reward's own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is
    structural, because `success()` here is a threshold on `task_metric`, which IS gated.
judge:
  vlm_legible: true
  legibility_note: >-
    Carrying reads well in a frame -- a box held against the chest is unmistakable -- but WHETHER IT
    IS AT THE MARKER may not, because the marker is a small translucent sphere on a bare floor and
    the box is large enough to occlude it at exactly the moment that matters. UNMEASURED (no frame has been rendered). A judge may see 'holding the box' and score the hover exploit as success,
    which is the one confusion this task's metric is built to avoid.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis, so the robot stays centred and the
      destination marker leaves the frame whenever the robot is not facing it. On a task whose whole
      objective is a location, that matters.
  extra_views:
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      The package and the floor marker it must reach read in plan.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, with the robot at about three
      times the pixels the default camera gives it. Where the robot is in the room is not
      visible from here. Shows whether the package is held.
  subtasks_sequential: false
  telemetry_fields:
  - package_pos
  - package_height
  - destination_pos
  - package_destination_distance
domain_randomization: null
exploits:
- name: hold_high_and_hover
  mechanism: >-
    Success TERMINATES the episode (Package.get_terminated is the same 0.1 m check as the bonus),
    while the dense terms keep paying. `stand_reward * small_control` is about 1 per step for
    standing upright, and `package_height = min(package_z, 1)` pays up to another 1 for simply
    holding the package at or above z = 1 -- no transport required. A policy that carries the
    package to just outside the radius and stands there holding it up collects roughly 1.7 per
    step, about 1700 over 1000 steps, against the task's own success_bar of 1500 and against the
    +1000 a delivery pays before ending the episode. Not reaching the goal is worth more than
    reaching it.
  status: open
  closed_by: bird task_metric (package_delivered_fraction)
  note: >-
    Arithmetic from the source's own literals (the height cap, the bonus, the terminal), not
    observed in a rollout. BIRD's `task_metric`
    is DELIVERY rather than approach precisely because of this: a hover just outside the radius
    scores exactly 0.0, where any best-approach metric would score it near 1.0.
- name: package_height_pays_lifting
  mechanism: >-
    `package_height = np.min((package_location[2], 1))` is an unconditional additive term on the
    package's height alone -- nothing ties it to the destination, the hands, or progress. Lifting
    the package to z = 1 anywhere in the arena pays +1 per step, offset only by the -3 * distance
    term. It is the component that makes `hold_high_and_hover` profitable rather than merely
    survivable.
  status: open
  closed_by: bird task_metric (package_delivered_fraction)
  note: >-
    Read off package.py:131-141. The metric ignores height entirely, so lifting without delivering
    scores 0.0.
- name: stand_still_and_collect
  mechanism: >-
    The additive `stand_reward * small_control` term pays about 1 per step for standing upright and
    quiet, independent of the package. Every HumanoidBench task composing this term inherits the
    same floor; here it is at weight 1.0 (door's is 0.1).
  status: open
  closed_by: bird task_metric (package_delivered_fraction)
  note: >-
    Offset by -3 * dist_package_destination, so standing still FAR from the marker is punished --
    the floor is only profitable once the package is near the destination, which is exactly the
    hover above. Metric scores it 0.0.
- name: born_delivered_freebie
  mechanism: >-
    `Package.reset_model` draws the package's x, y from U(-2, 2) and then the destination body's
    x, y from U(-2, 2) -- the same square. About 0.2% of episodes (a 0.1-radius disc over a 4 x 4
    region) therefore begin inside the success radius: +1000 and a terminal at step one, for any
    policy whatsoever.
  status: open
  closed_by: null
  note: >-
    An initialisation defect rather than a shaping defect, and small -- but at a handful of eval
    episodes per candidate it is a rare +1000 outlier in a return average, the scale of noise that
    reorders candidates. Computed from the sample geometry, not observed. Reproduced by
    the adapter rather than corrected, because a different initial distribution is a different
    environment. The metric scores such an episode 1.0, honestly: the package IS at the marker.
