# h1hand_cube -- HumanoidBench `h1hand-cube-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 2 scene joint(s) and 4 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/cube's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_cube
env:
  env_id: h1hand-cube-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 500
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: The episode ends immediately if the pelvis drops below 0.58 m, or if EITHER cube falls
      below 0.6 m -- dropping one cube ends the episode. There is no success terminal. Note the horizon
      is 500 steps here, half the tier's usual 1000.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 2920-2929
      symbol: H1HandCube._task_reset
    rng_note: Base `uniform(size=90)` at 942, then three `uniform(-3.14, 3.14, 3)` Euler triples in the
      order left cube, right cube, target (2713-2715) -- upstream's order (cube.py:174-177).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 90 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: object_pose
      quantity: cube_positions_noise
      fields:
      - left_cube_x
      - left_cube_y
      - left_cube_z
      - right_cube_x
      - right_cube_y
      - right_cube_z
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the two hand cubes' positions about their keyframe
          (0.45, +/-0.21, 1.125). Their quaternions receive the same noise and are then OVERWRITTEN by
          the two orientation draws below, so only the six position entries carry this jitter.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: object_pose
      quantity: left_cube_orientation
      fields:
      - left_cube_quat_w
      - left_cube_quat_x
      - left_cube_quat_y
      - left_cube_quat_z
      distribution:
        family: uniform
        text: roll, pitch, yaw ~ U(-3.14, 3.14)^3 rad, mapped through upstream's `Cube.euler_to_quat`
          (transcribed as `_euler_to_quat`, 664-675) to a (w, x, y, z) quaternion, written over qpos[79:83];
          no box in quaternion components -- the box is on the Euler angles.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '2926'
      basis: read
    - role: object_pose
      quantity: right_cube_orientation
      fields:
      - right_cube_quat_w
      - right_cube_quat_x
      - right_cube_quat_y
      - right_cube_quat_z
      distribution:
        family: uniform
        text: roll, pitch, yaw ~ U(-3.14, 3.14)^3 rad, mapped through upstream's `Cube.euler_to_quat`
          (transcribed as `_euler_to_quat`, 664-675) to a (w, x, y, z) quaternion, written over qpos[86:90].
      source:
        path: bird/envs/humanoid_hand.py
        lines: '2927'
      basis: read
    - role: goal
      quantity: target_orientation
      fields:
      - s.target_quat
      distribution:
        family: uniform
        text: roll, pitch, yaw ~ U(-3.14, 3.14)^3 rad, mapped through upstream's `Cube.euler_to_quat`
          (transcribed as `_euler_to_quat`, 664-675) to a (w, x, y, z) quaternion, written into `model.body_quat[-1]`
          -- the joint-less floating target cube -- and carried in the observation tail; constant for
          the episode.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '2928'
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_cube.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: cube_velocities
      value: '0 -- both hand cubes'' six velocities start at rest: the keyframe carries no qvel and the
        hook writes none.'
      fields:
      - s.left_cube_vel
      - s.right_cube_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: target_position
      value: (0.5, 0, 1.5) m, fixed -- the target cube's `body_pos` (cube.xml:18) is never written; only
        its orientation is drawn. Not in the observation.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2920-2929
        symbol: H1HandCube._task_reset
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'DISTRIBUTION differs, not only the RNG: `HumanoidEnv.__init__` (`env.py:206-209`)
      forces `randomness = 0` when the task is Cube (or BookshelfHard/BookshelfSimple/Kitchen), so upstream
      applies NO keyframe perturbation here -- its initial state is the keyframe exactly plus the three
      Euler draws. This adapter''s class-level `_randomness = 0.01` (968, overridden only by HighBar)
      applies the +/-0.01 jitter anyway, to every robot AND cube coordinate, so BIRD''s initial distribution
      is wider than upstream''s on all 90 qpos entries. Separately, upstream draws the Euler triples from
      the GLOBAL `np.random` (cube.py:174-177) and the (zero-width) base draw from `np_random`; the adapter
      draws from the episode Generator.'
    prompt_states: a target cube floating ahead at eye level, drawn in a fresh random orientation each
      episode; both hand cubes also start at random orientations
    prompt_field: l_task
    prompt_omits:
    - agent_pose
  spaces:
    obs_dim: 181
    action_dim: 61
    action_low: -1.0
    action_high: 1.0
    action_semantics: Sixty-one position targets, each in [-1, 1]. -1 and +1 are the two ends of that
