      commit: null
      sha256: null
    import_path: humanoid_bench.envs.cube:Cube.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: '`0.2 * (small_control * stand_reward * dont_move) + 0.5 * orientation_alignment + 0.3 * cube_closeness`,
      where alignment is `tolerance(||q_cube - q_target||, margin=0.3)` averaged over the two cubes --
      a kernel on the EUCLIDEAN DISTANCE BETWEEN QUATERNIONS, see the exploit inventory -- and closeness
      is a hand-to-cube proximity kernel already satisfied at spawn (the cubes start in the palms).'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: false
  legibility_note: 'Why this task is hard to judge from frames, recorded as data: the objects are 5 cm
    cubes inside the fingers of a Shadow Hand, and the judgment that matters is a three-dimensional orientation
    match against a display cube -- faces must be distinguished, at 448x320, partially occluded by fingers.
    A VLM judging stills cannot plausibly read the quantity this task scores; expect judge-scored methods
    to grade posture instead. Measured on rendered clips: at 448x320 `cam_inhand` frames the WHOLE robot
    and each cube is roughly ten pixels; a human rater could not tell the cube positions apart and flagged
    the single-view clips as unjudgeable. The posed `hands` view below is what makes the cubes and the
    display cube visible; record and judge this task with `output.video.n_views` of at least 2.'
  camera:
    name: cam_inhand
    mode: tracking
    note: '`cam_inhand` is the camera upstream names for this task (its `camera_name`), a `trackcom` camera
      on the pelvis: despite the name it frames the whole robot, and at 448x320 a 5 cm cube is about ten
      pixels -- enough to see that a cube is held, not which way it faces. The `hands` extra view is the
      close one.'
  extra_views:
  - name: hands
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 1.8 m directly ahead, looking slightly down:
      the torso, both arms and both hands fill the frame, at four times the pixels the default camera
      gives the hands. Anything above head height or below the knees is out of frame, and nothing about
      where the robot is. The closest view of the cubes, and still not close enough to tell
      their faces apart at 448x320; it shows whether each hand holds its cube and roughly how it is turned.'
    pose:
      track_body: pelvis
      azimuth: 180
      elevation: -20
      distance: 1.8
  - name: cam_hand_visible
    mode: tracking
    note: 'Camera following the pelvis from behind the robot''s left shoulder, close and low: the hands
      and whatever is in front of them fill the frame, with the robot at about three times the pixels
      the default camera gives it. Where the robot is in the room is not visible from here.'
  subtasks_sequential: false
  telemetry_fields:
  - left_cube_angle_to_target
  - right_cube_angle_to_target
  - pelvis_z
domain_randomization: null
exploits:
- name: stand_and_hold_income
  mechanism: '`cube_closeness` (0.3 weight) is a hand-to-cube proximity kernel that is SATISFIED AT SPAWN
    -- the cubes start in the palms -- and the posture product (0.2 weight) pays for standing still. A
    robot that simply holds still and does not drop the cubes collects ~0.5 per step for the whole episode
    without attempting a rotation; the alignment term idles at whatever the random draws happen to give.'
  status: open
  closed_by: null
  note: Arithmetic from the source, not observed in a rollout. The metric reads alignment
    only, so the freeze-and-hold scores 0.0 here barring a lucky draw (a 20-degree ball is under 2% of
    orientation space per cube, squared for two).
- name: quaternion_distance_is_not_a_rotation_metric
  mechanism: '`orientation_alignment` is a kernel on ||q_cube - q_target|| -- Euclidean distance between
    quaternions. Quaternions double-cover rotations: q and -q are the SAME orientation, yet their Euclidean
    distance is 2, the maximum possible. A cube physically matching the target can therefore read as maximally
    misaligned and earn nothing, purely by the sign of the quaternion the integrator settled on -- the
    reward can punish exact success. The defect points the wrong way (it underpays rather than overpays),
    so it is mainly a mis-ranking -- but not purely: which sign a cube ends on is set by the PATH it was
    turned along, so a controller can buy reward for the same physical result by choosing the rotation
    route. It is also recorded because a candidate reward
    compared against this reference by similarity inherits the same blindness.'
  status: open
  closed_by: null
  note: 'Arithmetic from the source: the norm is over raw quaternion components and nothing
    canonicalises the sign. BIRD''s metric uses the geodesic angle through |dot|, which
    is sign-blind by construction.'
