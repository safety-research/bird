discrete_success:
  kind: continuous_only
  no_discrete_success_because: 'This task ships no boolean success check: `Cube.get_terminated` reports
    FAILURE (fall, or a dropped cube) and never a success, no info key says "matched", and `success_bar`
    (370) is a threshold on the episode RETURN of the shipped reward, a different quantity.'
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: cube_both_aligned_horizon_fraction
    expr: '(number of arriving states with [ geodesic angle between each hand cube''s orientation and
      the target''s <= 20 degrees, BOTH cubes at once ]) / 500 -- NORMALISED BY THE FULL HORIZON, because
      dropping a cube terminates: a visited-states mean would score an align-then-drop near 1.0. The angle
      is 2*arccos(|<q_cube, q_target>|), which treats q and -q as the same rotation; the 20-degree tolerance
      is a stated convention, NOT the reward''s margin=0.3 on raw quaternion L2 distance -- see the exploit
      inventory for why that distance is not a rotation metric. bird/envs/humanoid_hand.py::H1HandCube.task_metric'
    unit: fraction of the full 500-step horizon with both cubes matching the target
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.25
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
