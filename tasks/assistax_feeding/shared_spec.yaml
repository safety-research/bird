provenance:
  authored_from:
  - path: bird/envs/assets/assistax/feeding_scene.xml
    lines: null
    what: the joint inventory and every `range=`, the actuator gains/ctrlrange, the geom sizes, the sites
      and the camera (vendored verbatim from upstream by scripts/vendor_assistax_assets.py, meshes decimated)
  - path: bird/envs/assistax.py
    lines: null
    what: 'the row: tool, human geoms, task slots, derived fields, reset, the per-step check, the threshold
      and the reference reward'
  - path: 'refs: assistive-autonomy/assistax @ a7d94f4e2063, assistax/envs/feeding.py, assistax/envs/base_env.py,
      assistax/envs/README.md'
    lines: null
    what: upstream's reset, observation, reward terms and weights, termination and agent/actuator mapping
      for this task
  rule: source and asset, not docstrings
  measured:
  - 'Step purity: bitwise over shuffled replay, tests/test_assistax.py (2026-09-08); 0/40 mismatches on
    every task once the actuators are written before the restoring forward (11-28/40 at ~1e-14 with them
    written after it).'
  - 'Random-action rollouts: the tool touches the human within 300 steps only on armmanipulation, where
    the hook starts under the forearm (about one seed in three, forces up to 286 N); on the other four
    tasks the two never meet. Under zero actuation the seated human''s bodies move down by at most 3.3-3.6
    cm over the first 2.4 s on the wheelchair scenes and rise slightly (no settling) on the bed scenes;
    0.4-0.5 ms per control step.'
  - 'Upstream under its own stack (jax 0.8.0, mujoco 3.4.0, CPU, 2026-09-08): 828 ms per control step
    after a 20-40 s JIT; from the same keyframe under zero actions the MJX solve (iterations 1) and this
    port''s C solve (iterations 100) part by a max |dq| of 0.003 after 1 step, 0.020 after 10 and 0.060
    after 100 -- same model, different physics.'
  - Upstream reads the tool-human force at hard-coded MJX contact-array indices, which denote whatever
    geom pair the MJX collision enumeration puts there (a property of the build, not of the task; mjx.make_data
    reports 250-282 static contact rows per scene, and this repo has not confirmed which pairs the indices
    denote against a stepped MJX Data -- a reconstruction of the enumeration puts them on tool-vs-human
    pairs, which is recorded as unverified); this port sums the live tool-human contacts by geom pair
    instead.
  verified_by: generated by scripts/gen_assistax_specs.py
  date: '2026-09-08'
