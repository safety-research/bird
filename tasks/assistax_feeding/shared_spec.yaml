      sha256: null
    import_path: null
    verified_against: assistive-autonomy/assistax @ a7d94f4e2063, read 2026-09-08
    notes: 'Upstream''s Feeding.step reward, transcribed into `bird/envs/assistax.py` term by term at
      the constructor defaults, with four stated substitutions: the tool speed is the simulator''s instantaneous
      site velocity rather than the finite difference of two frames; contact forces are summed over the
      live tool-human contact pairs (and read back off the observation when a stored state is re-scored)
      rather than read at fixed MJX contact-array indices; the control cost squares the 7-D robot action
      clipped to [-1, 1] where upstream squares the concatenated robot+human action; bedbathing''s per-point
      bonus (needs the previous flags) is dropped. Transcribed, not imported: upstream is JAX/MJX.'
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    - math
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, over the FLAT observation array. There is no `self` and no env handle:
      the compiler binds arguments by name and maps `self`/`env` to None deliberately.'
    reward_utils: []
  forbidden_symbols: []
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - success
    - reference_reward
    - _model
    - _data
    - _forward
    - _Derived
    - _derived_now
    - _TASKS
    - _FAMILIES
    - gt_reward
    - _metric_bedbathing
  forbidden_symbols_note: 'The BIRD entries name adapter internals -- how a candidate could reach the
    metric it is scored on IN THIS REPO -- which are not properties of the task and cannot be expressed
    in the flat list above (empty: upstream ships no forbidden-symbol set).'
judge:
  vlm_legible: true
  legibility_note: 'A seated adult and a Panda at 448x320 from the scene''s `default` camera at (1.3,
    2.1, 1.8), which re-aims at the person''s centre of mass from above and in front of their right side,
    so the face, the chair and the whole robot share the frame and the framing drifts slightly as the
    person settles. Whether the spoon is up at the face or elsewhere in the air, whether the gripper has
    been driven into the head (it cannot collide with it and visibly passes inside), whether the head
    has been turned or the trunk shoved, and in a clip whether the spoon is still or moving all read from
    the pixels. The spoon''s most visible part is the blue 6 cm mounting cube at the gripper; the mouth
    is a green dot of radius 0.01 m and the bowl a light-grey ellipse about 7 cm long with a translucent
    green face, both small in frame, so ''at the mouth'' against ''a few centimetres off'', hovering against
    touching (the bowl is 4 mm thick) and level to within a few degrees are not legible, though inverted
    or edge-on against level is. Two red spheres on the right upper arm and forearm are leftover itch
    markers from the scratchitch humanoid, not targets. The legend prints only the task name: neither
    the spoon-to-mouth distance nor any contact force is printed, so those numbers have no route into
    a VLM''s verdict beyond the pixels described above.'
  camera:
    name: default
    mode: tracking
    note: 'the scene''s `default` camera: `targetbodycom` on the humanoid, from (1.3, 2.1, 1.8) -- it
      re-aims at the human''s centre of mass, so the framing follows the human''s slow settling into the
      chair and the Panda''s base stays in frame'
  subtasks_sequential: false
  telemetry_fields:
  - dist_tool_mouth
  - tip_force_mag
  - contact_force_magnitude
  - spoon_up_dot_world_up
  - mouth_z
domain_randomization: null
exploits:
- name: hover_without_touching
  status: open
  closed_by: null
  mechanism: The force clause is an upper bound with no floor and there is no contact clause, so a spoon
    parked with its centre a few centimetres in front of the mouth and never touching the face satisfies
    both clauses on every step it stays there. A policy that reaches that hover early and freezes scores
    close to 1.0 without feeding anyone.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: any_orientation_counts
  status: open
  closed_by: null
  mechanism: The spoon's level-ness (spoon_up_dot_world_up) is in the observation and in upstream's reward
    but not in the check, and the spoon starts on its side; a bowl that arrives edge-on or inverted, which
    would have spilled, scores exactly as a level one does.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: press_with_the_uncounted_geoms
  status: open
  closed_by: null
  mechanism: 'Only the thin green face (spoon_right_side) feeds tip_force_mag: the bowl body''s head contacts
    enter the tool-force field but not that one, the handle and the 6 cm mounting cube do collide with
    the head yet enter neither, and the Panda''s hand and finger geoms cannot collide with the head at
    all. Pressing the bowl''s underside, the handle or the mounting cube into the face pushes the head
    with a force the check never sees, so long as the penetration does not reach the green face, and a
    gripper driven into the head passes through without contact -- the counted force stays at 0 N while
    the spoon centre sits within range.'
  note: Present in the check this repo wrote, not in a benchmark's.
- name: carry_the_mouth_along
  status: open
  closed_by: null
  mechanism: The mouth is fixed to a passive head whose centre of mass sits at the neck joints (no gravity
    torque) and which is held only by damping 1, armature 0.1 and a 0.625 N m/rad actuator spring, on
    an uncommanded trunk; a spoon that turns the head toward the robot or presses head and trunk further
    into the chair carries the mouth with it, and the distance is measured to wherever the mouth has gone.
    Shoving and holding scores identically to a careful approach as long as the counted face force stays
    under 5 N or the pushing is done with an uncounted geom.
  note: Present in the check this repo wrote, not in a benchmark's.
