# AUTHORED FOR BIRD. This environment is implemented in this repo rather than
# vendored from a benchmark, so this spec has no upstream counterpart
# -- but the same rules apply as everywhere else in the catalogue: absence is explicit, and every claim came
# off the adapter or a config rather than a docstring.
schema_version: 1
id: pendulum_discrete
env:
  env_id: pendulum_discrete
  library:
    name: bird
    version_verified: in-repo
    commit: null
    stack:
      numpy: '>=1.24'
      python: '>=3.10'
  horizon: 200
  control_hz: null
  termination:
    early_terminate: false
    autoreset: false
    partial_reset: null
    prompt_states: The episode always runs the full 200 steps; reaching the goal does not end
      it.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/control.py
      symbol: PendulumDiscrete._reset
      lines: 583-591
    rng_note: 'Four draws, all from the episode Generator: `super()._reset(rng)` takes theta then theta_dot
      from `rng` (control.py:312-313), then `_round` takes one `self._rng.random()` per coordinate (control.py:579),
      angle first. `self._rng` IS `rng` -- `reset()` stores it before calling `_reset` (bird/envs/base.py:404)
      -- so the projection is seeded too. Measured: reset(default_rng(3)) twice is bitwise-equal.'
    draws:
    - role: agent_pose
      quantity: theta_cell
      fields:
      - cos_theta
      - sin_theta
      distribution:
        family: other
        text: 'theta ~ U(-pi, pi) rad (Pendulum._reset), then randomised rounding onto the 31 angular cell
          centres (cell width 2pi/31 = 0.203 rad, wrapping): the upper neighbouring cell is taken with probability
          equal to the fractional cell offset, so the mean of the continuous start is preserved. Marginal
          over cells: all 31 are hit, measured over 2000 seeded resets.'
        low: null
        high: null
      source:
        path: bird/envs/control.py
        lines: 583-591
      basis: measured
      note: 'Every one of 2000 seeded resets lands exactly on a cell centre. The rounding is genuinely random:
        one fixed continuous start projected under 50 different Generators reached 4 distinct cells.'
    - role: agent_velocity
      quantity: theta_dot_cell
      fields:
      - theta_dot
      distribution:
        family: other
        text: theta_dot ~ U(-1.0, 1.0) rad/s (Pendulum._reset), then randomised rounding onto the 31-cell
          velocity grid over [-8, 8] (cell width 16/31 = 0.516 rad/s, clamped). Support is the five centres
          {-1.032, -0.516, 0.0, 0.516, 1.032} rad/s, measured over 2000 seeded resets, with most of the
          mass on the inner three.
        low: null
        high: null
      source:
        path: bird/envs/control.py
        lines: 583-591
      basis: measured
      note: 24 seeded resets show only {-0.516, 0.0, 0.516, 1.032}; the outer cells need the continuous
        draw near +/-1 AND the coin to fall outward.
    constants:
    - role: goal
      quantity: upright_target
      value: 'none -- the goal is theta = 0 (upright) with |theta_dot| < 1.0 rad/s, a constant of the metric:
        task_metric counts the final third of the episode with |theta| < upright_angle (0.2 rad) and |theta_dot|
        < upright_speed (1.0 rad/s). Nothing in the observation carries it.'
      source:
        path: bird/envs/control.py
        lines: 224-225
      basis: read
      note: 'Inherited from Pendulum: task_metric at control.py:374-404; the per-step `success` flag at
        control.py:603-604 applies the same two constants to the cell centre.'
    stochastic_transitions: '`_step` (control.py:593-600) advances the continuous dynamics one Euler step
      and re-projects onto the grid with `_round` (control.py:567-581), which draws `self._rng.random()`
      once per coordinate -- two draws from the episode Generator every step. The upper neighbouring cell
      is taken with probability equal to the fractional cell offset, so E[next cell] equals the continuous
      successor; the class docstring (control.py:528-546) explains why a deterministic snap would freeze
      the rod. Measured: the same (s, a) under two Generators gave different successors.'
    upstream_divergence: 'No benchmark defines this env (env.library.name: bird). The continuous start is
      gymnasium Pendulum-v1''s (theta ~ U(-pi, pi), theta_dot ~ U(-1, 1)); the randomised projection onto
      BIRD''s 31x31 grid is this repo''s construction (control.py:516-547), so the initial marginal over
      cells belongs to no upstream env.'
    prompt_states: null
    prompt_field: null
    prompt_omits:
    - agent_pose
    - agent_velocity
  spaces:
    obs_dim: 3
    action_dim: 1
    action_low:
    - -2.0
    action_high:
    - 2.0
    action_semantics: 'torque: one of -2, -1, 0, +1, +2'
    action_fields:
    - name: torque
      description: one of -2, -1, 0, +1, +2
      low: -2.0
      high: 2.0
description:
  env_prose: 'A rigid rod is attached to a fixed pivot and swings in a vertical plane under gravity.
    The angle theta is measured from straight up, so theta = 0 is upright and theta = pi is hanging
    down. Both the angle and the angular velocity take values on a fixed grid: 31 angles evenly
    spaced over [-pi, pi] and 31 angular velocities evenly spaced over [-8, 8] rad/s, giving 961
    distinct states. The action is one of five torques: -2, -1, 0, +1 or +2. That torque is too
    weak to lift the rod directly from horizontal, so the rod must be swung back and forth to
    build up energy before it can be brought over the top. Motion between grid cells is stochastic:
    a step that would move the rod part of the way to the next cell moves it all the way with
    the corresponding probability. The task is to swing the rod up and then hold it upright and
    motionless for the rest of the episode. The episode always runs its full length.'
  l_task: Swing the pendulum up to the upright position and keep it balanced there with as little
    torque as possible.
  natural_language: 'A rigid rod is attached to a fixed pivot and swings in a vertical plane under
    gravity. The angle theta is measured from straight up, so theta = 0 is upright and theta =
    pi is hanging down. Both the angle and the angular velocity take values on a fixed grid: 31
    angles evenly spaced over [-pi, pi] and 31 angular velocities evenly spaced over [-8, 8] rad/s,
    giving 961 distinct states. The action is one of five torques: -2, -1, 0, +1 or +2. That torque
    is too weak to lift the rod directly from horizontal, so the rod must be swung back and forth
    to build up energy before it can be brought over the top. Motion between grid cells is stochastic:
    a step that would move the rod part of the way to the next cell moves it all the way with
    the corresponding probability. The task is to swing the rod up and then hold it upright and
    motionless for the rest of the episode. The episode always runs its full length.'
  scene: The same rod and pivot as `pendulum`, on a 31x31 grid over (angle, angular velocity).
    The discretisation is a BIJECTION -- `exact_states` is set -- which is what makes tabular
    Q-learning honest here rather than a binning approximation, and is why Singh's 2009 point
    runs on this env and not on the continuous one.
  success_criterion_prose: null
  full_source:
    path: bird/envs/control.py
    lines: null
state_surface:
  fields:
  - name: cos_theta
    shape: scalar
    units: null
    description: cosine of the angle from upright; +1 upright, -1 hanging
    source: null
    slice: 0:1
  - name: sin_theta
    shape: scalar
    units: null
    description: sine of the angle from upright; sign gives which side
    source: null
    slice: '1:2'
  - name: theta_dot
    shape: scalar
    units: null
    description: angular velocity in rad/s, one of 31 grid values in [-8, 8]
    source: null
    slice: '2:3'
  helpers:
  - name: angle
    signature: angle(s)
    description: signed angle from upright in radians, in [-pi, pi]
    kind: inline_expression
    expression: null
  - name: angular_velocity
    signature: angular_velocity(s)
    description: s[2], the angular velocity in rad/s
    kind: inline_expression
    expression: null
  - name: is_upright
    signature: is_upright(s)
    description: True when |angle(s)| < 0.2 and |s[2]| < 1.0
    kind: inline_expression
    expression: null
  helpers_note: 'Advertised as inlineable EXPRESSIONS and deliberately not implemented as methods:
    verification binds a proxy `self` and training binds `self=None`, so a helper that existed
    would let a `self.x(s)` candidate pass the gate and then die in training -- a wasted policy
    run charged to the reward that did not cause it.'
  flat_fields:
  - index: 0
    name: cos_theta
    description: cosine of the angle from upright; +1 upright, -1 hanging
  - index: 1
    name: sin_theta
    description: sine of the angle from upright; sign gives which side
  - index: 2
    name: theta_dot
    description: angular velocity in rad/s, one of 31 grid values in [-8, 8]
discrete_success:
  kind: continuous_only
  no_discrete_success_because: This environment ships no benchmark success check, because
    it is implemented in this repo. `EnvAdapter.success()` here is a threshold WE chose on a metric
    WE wrote, so recording it as a `shipped` check would claim an independence it does not
    have. That caveat is the reason the benchmark suites, whose success checks are their own
    (Meta-World above all), carry the evaluation.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: upright_fraction
    expr: fraction of the episode's arriving states within the upright cone
    unit: fraction of steps
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: 'identity -- the raw metric is already a fraction of steps and therefore already
      in [0, 1]. `method: anchors` would need an expert anchor this environment cannot have.'
    success_threshold: 0.5
anchors:
  scripted:
    value: 0.96
    method: scripted_policy
    policy_id: simple_suite/pendulum_discrete_energy
    status: partial
    unit: bird_task_metric
    reduction: per_step_fraction
    n_seeds: 25
    n_episodes: 25
    reason: null
    date: '2026-09-03'
    source: 'REGISTRY 2026-09-04: policies/simple_suite/policies.yaml entry `simple_suite/pendulum_discrete_energy`
      (status partial), score 0.96 bird_task_metric under per_step_fraction, n=25, verified through bird_adapter.
      The manifest is the primary record. n_episodes equals n_seeds: one episode per seed, as the registry
      counts them.'
  reduction: per_step_fraction
  by_reduction:
    per_step_fraction:
      random:
        value: 0.0
        method: random_policy
        source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, `scripts/measure_anchors.py
          --env pendulum_discrete --n 30`, seed 0.'
        n_seeds: 30
        n_episodes: 30
        reason: null
        date: '2026-08-25'
      expert:
        value: null
        method: unavailable
        source: null
        n_seeds: null
        n_episodes: null
        reason: No scripted expert exists for this environment. It is implemented in this repo
          and ships no reference policy, and inventing a ceiling would make every `human_normalised`
          number on it a ratio against a number nobody measured. Recorded as absent so `baselines_of`
          returns None and `_normalise_pool` leaves fitness raw.
        date: null
  random:
    value: 0.0
    method: random_policy
    source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, seed 0.
      See anchors.by_reduction.'
    n_seeds: 30
    n_episodes: 30
    reason: null
    date: '2026-08-25'
  expert:
    value: null
    method: unavailable
    source: null
    n_seeds: null
    n_episodes: null
    reason: No scripted expert exists for this environment. It is implemented in this repo and
      ships no reference policy, and inventing a ceiling would make every `human_normalised` number
      on it a ratio against a number nobody measured. Recorded as absent so `baselines_of` returns
      None and `_normalise_pool` leaves fitness raw.
    date: null
budget:
  train_steps: 12000
  learning_verified:
    verified: false
    reward_used: none
    algo: null
    seeds: null
    result: Not established as a floor by a dedicated sweep.
    date: null
  saturates_at: null
reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: bird/envs/control.py
      lines: null
      symbol: PendulumDiscrete.reference_reward
      commit: null
      sha256: null
    depends_on: []
    import_path: bird.envs.control:PendulumDiscrete.reference_reward
    verified_against: This repo at the commit that ran. The environment is implemented here, so there
      is no external library to pin -- what pins it is the repository version (tag or commit) a sweep
      is launched from.
    notes: As `pendulum`; the dynamics are identical and only the state and action spaces are
      discretised.
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    - math
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, over the FLAT observation array. There is no `self` and no env
      handle: the compiler binds arguments by name and maps `self`/`env` to None deliberately.'
    reward_utils: []
  forbidden_symbols: []
judge:
  vlm_legible: false
  legibility_note: 'As `pendulum`, and more so: the state is a grid cell.'
  camera:
    name: none
    mode: fixed
    note: 'No camera: frames are rasterised in pure numpy where a renderer exists at all.'
  subtasks_sequential: false
  telemetry_fields:
  - angle
  - angular_velocity
  - torque
domain_randomization:
  parameters:
    mass:
    - 0.5
    - 2.0
    length:
    - 0.5
    - 2.0
    gravity:
    - 5.0
    - 15.0
    torque_scale:
    - 0.5
    - 1.5
    action_noise:
    - 0.0
    - 0.5
  nominal:
    mass: 1.0
    length: 1.0
    gravity: 10.0
    torque_scale: 1.0
    action_noise: 0.0
exploits: []
symbol_mapping:
  angle: np.arctan2(s[1], s[0])
  pendulum_angle: np.arctan2(s[1], s[0])
  cos_angle: s[0]
  sin_angle: s[1]
  angular_velocity: s[2]
  upright_error: np.abs(np.arctan2(s[1], s[0]))
  applied_torque: a[0]
