description:
  env_prose: 'A Franka Panda arm stands beside a single bed, at the human''s right, level with the shoulder
    and elbow. The human lies supine, head on a pillow, right arm on the mattress on the robot''s side,
    upper arm angled outward, forearm along the body. The human is passive: no joint is commanded, so
    the body rests on the mattress under gravity and its joint stiffness, and the robot can push it. The
    Panda''s tool is a wiper: a red square pad, 10 cm on a side and 1.2 cm thick, on a small base cube,
    its reference point at the pad''s centre. Fifty-two wipe points lie on the arm''s surface, twenty-six
    in one helical turn around each of the upper arm and the forearm; they move with the arm and are not
    drawn. The action is seven numbers in [-1, 1], one per Panda joint: normalised position targets for
    stiff servos (about pi times the value in radians, clipped to the joint''s range), not torques. A
    control step is 8 ms; an episode is 1000 steps (8 s) and nothing ends it early. The observation is
    the whole simulator state, then derived fields: the human''s root pose (position and quaternion),
    every hinge angle (human then Panda), all velocities, the 52 wipe flags (1 still to wipe, 0 wiped,
    upper arm first; a flag flips when the wiper, touching the human, passes close over its point, and
    never back), the wiper''s position, orientation quaternion and velocity, the contact force it applies
    to the human in newtons, the nearest unwiped point''s position and distance (a large sentinel once
    all are wiped), the wiped count, and the upper-arm and forearm body positions. Every episode starts
    from the same lying pose and robot pose with small random jitter on every position and velocity coordinate,
    the human''s root pose included; the 52 points are fixed to the arm and identical in every episode.'
  l_task: 'Give the person a bed bath: bring the wiper pad into contact with their right arm and sweep
    it over the whole surface of the upper arm and the forearm, so that every one of the fifty-two wipe
    points has been passed over while the wiper was pressing on the arm. The robot is commanded with seven
    joint-position targets, one per Panda joint, which stiff position servos track; the person is passive
    and will neither help nor move out of the way.'
  natural_language: 'A Franka Panda arm stands beside a single bed, at the human''s right, level with
    the shoulder and elbow. The human lies supine, head on a pillow, right arm on the mattress on the
    robot''s side, upper arm angled outward, forearm along the body. The human is passive: no joint is
    commanded, so the body rests on the mattress under gravity and its joint stiffness, and the robot
    can push it. The Panda''s tool is a wiper: a red square pad, 10 cm on a side and 1.2 cm thick, on
    a small base cube, its reference point at the pad''s centre. Fifty-two wipe points lie on the arm''s
    surface, twenty-six in one helical turn around each of the upper arm and the forearm; they move with
    the arm and are not drawn. The action is seven numbers in [-1, 1], one per Panda joint: normalised
    position targets for stiff servos (about pi times the value in radians, clipped to the joint''s range),
    not torques. A control step is 8 ms; an episode is 1000 steps (8 s) and nothing ends it early. The
    observation is the whole simulator state, then derived fields: the human''s root pose (position and
    quaternion), every hinge angle (human then Panda), all velocities, the 52 wipe flags (1 still to wipe,
    0 wiped, upper arm first; a flag flips when the wiper, touching the human, passes close over its point,
    and never back), the wiper''s position, orientation quaternion and velocity, the contact force it
    applies to the human in newtons, the nearest unwiped point''s position and distance (a large sentinel
    once all are wiped), the wiped count, and the upper-arm and forearm body positions. Every episode
    starts from the same lying pose and robot pose with small random jitter on every position and velocity
    coordinate, the human''s root pose included; the 52 points are fixed to the arm and identical in every
    episode.'
  scene: 'A single bed seen obliquely from the robot''s side and from beyond its foot, looking down toward
    the head: a person lying on their back with their head on a pillow, and a Franka Panda arm standing
    on the floor beside the bed by the person''s right arm, holding a small red square pad that points
    downward.'
  success_criterion_prose: 'wiped_fraction: the number of the 52 wipe points marked wiped by the final
    step of the episode, divided by 52. A point is marked wiped on any step where the wiper centre is
    within 0.1 m of it while the wiper (the pad or its base cube) is in contact with the human''s right
    upper arm, forearm or hand -- any non-zero summed tool-human contact force, upstream''s own marking
    rule -- and it stays wiped for the rest of the episode. Success is a provisional threshold of 0.5
    on that fraction, i.e. at least 26 of the 52 points wiped by the end. This is a check this repo wrote:
    upstream ships no success criterion for the task and reports only the return of its own dense reward.'
  full_source:
    path: bird/envs/assistax.py
    lines: null
state_surface:
  fields:
  - name: human_root_pose
    shape: (7,)
    units: m, unit quaternion
    description: the human's root position and orientation (w, x, y, z)
    source: bed_scene.xml
    slice: 0:7
  - name: human_joint_angles
    shape: (17,)
    units: rad
    description: every humanoid hinge joint angle in model order
    source: bed_scene.xml
    slice: '7:24'
  - name: robot_joint_angles
    shape: (7,)
    units: rad
    description: the Panda's seven joint angles, joint1..joint7
    source: bed_scene.xml
    slice: '24:31'
  - name: human_root_velocity
    shape: (6,)
    units: m/s, rad/s
    description: the human's root linear velocity (world frame) then angular velocity (body frame)
    source: bed_scene.xml
    slice: '31:37'
  - name: joint_velocities
    shape: (24,)
    units: rad/s
    description: every hinge joint velocity in model order (human then Panda)
    source: bed_scene.xml
    slice: 37:61
  - name: task_slots
    shape: (52,)
    units: task-specific
    description: the 52 wipe flags, 1 = still to wipe (26 upper-arm points then 26 lower-arm points)
    source: bird/envs/assistax.py::_TASKS
    slice: 61:113
  - name: tool_pose_velocity_force
    shape: (13,)
    units: m, unit quaternion, m/s, N
    description: 'tool position (3), tool orientation quaternion (4), tool linear velocity (3), net contact
      force the row''s tool geoms apply to the row''s human geoms (3; the right arm on the arm tasks,
      the head on the head tasks; a range, not a bound: stiff-contact transients can exceed it), world
      frame'
    source: bird/envs/assistax.py::_COMMON_TAIL
    slice: 113:126
  - name: task_fields
    shape: (11,)
    units: m (positions and distance), count (n_wiped), m (arm positions)
    description: 'nearest_unwiped_x: position x of the nearest still-unwiped point, metres, world frame
      (the tool''s own position when none remain); nearest_unwiped_y: position y of the nearest still-unwiped
      point, metres, world frame; nearest_unwiped_z: position z of the nearest still-unwiped point, metres,
      world frame; dist_tool_nearest_unwiped: distance from the wiper centre to the nearest still-unwiped
      point, metres (10.0, a sentinel, once every point is wiped); n_wiped: how many of the 52 points
      have been wiped so far; uarm_x: human right upper arm body position x, metres, world frame; uarm_y:
      human right upper arm body position y, metres, world frame; uarm_z: human right upper arm body position
      z, metres, world frame; larm_x: human right lower arm body position x, metres, world frame; larm_y:
      human right lower arm body position y, metres, world frame; larm_z: human right lower arm body position
      z, metres, world frame'
    source: bird/envs/assistax.py::_TASKS
    slice: 126:137
  helpers:
  - name: tool_position
    signature: tool_position(s)
    description: the tool reference point's position, metres, world frame
    kind: inline_expression
    expression: s[113:116]
  - name: tool_velocity
