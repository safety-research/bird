      are the same 26-point helix per capsule but placed in the capsule GEOM frame, on the arm''s surface,
      where upstream maps them through the arm BODY frame so its points lie 0-0.12 m off the arm surface
      with 8 of 52 inside the mattress and the upper-arm set reaching 13 cm above the shoulder; the marking
      rule is the same 0.1 m radius but gated on a non-zero 3-vector world-frame force summed over the
      live contacts between the two wiper geoms and the human''s right upper arm, forearm and hand (mj_contactForce)
