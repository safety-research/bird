judge:
  vlm_legible: true
  legibility_note: 'The scene''s `default` camera is fixed in the world at (1.5, -2.8, 1.5) and looks
    across and down the bed from the robot''s side, beyond the foot end, so the lying human, the whole
    Panda and the red pad are all in frame and the right arm is on the near side rather than behind the
    torso. A VLM can read whether the pad is over the arm or elsewhere in the air, roughly where along
    the arm it is, whether the arm has been shoved off its resting line or the body disturbed, and gross
    pad motion between frames. It cannot see the 52 wipe points (they are virtual: no geom, no site, nothing
    is rendered for them here or upstream), which of them remain, or anything on the underside of the
    arm; a small blue sphere on the upper arm (radius 0.01 m) is a leftover marker from the scratchitch
    scene, not a wipe point, and reads as a target. The legend prints only the task name: the wiped count
    (which IS the metric, `task_metric * 52`), the distance to the nearest unwiped point and the contact
    force are deliberately not printed, so a judge has no route to the count at all and wiping progress
    is not legible from a frame on this task. At 448x320 from that distance the 10 cm pad is small in
    frame and a gap of the pad''s own 1.2 cm thickness between pad and skin is below what the frame resolves,
    so touching versus hovering just above is not legible from the pixels.'
  camera:
    name: default
    mode: fixed
    note: 'the scene''s `default` camera: a fixed camera at (1.5, -2.8, 1.5) looking obliquely across
      and down the bed from the robot''s side and beyond its foot (view direction (-0.47, 0.81, -0.34)
      from its xyaxes), the whole Panda and the lying human in frame'
