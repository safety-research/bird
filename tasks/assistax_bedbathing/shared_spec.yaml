      where upstream runs MJX with iterations=1, ls_iterations=4 and EULERDAMP disabled; measured against
      upstream''s own package from the keyframe under zero actions, the two solves part by a max |dq|
      of 0.0026 after one control step, 0.0234 after 10 and 0.0682 after 100, and MJX costs 513 ms per
      control step on CPU against 0.5 ms here. The human is a zero-action passive body in place of upstream''s
      trained partner on right_shoulder1, right_shoulder2 and right_elbow, and the episode always runs
      its 1000 steps where upstream sets done the step the 52nd point is wiped (and, at its brax-level
      API, carries the unwiped vector across an auto-reset because state.info is not restored -- here
      the flags live in the state and reset to ones). The observation is the whole state (qpos, qvel,
      the 52 flags, derived tool, force and target fields) rather than upstream''s 25-D robot and 36-D
      human vectors, whose qpos slices are indexed by joint id and so carry the human''s arm angles as
