exploits:
- name: press_dont_sweep
  status: open
  closed_by: null
  mechanism: The marking radius is 0.1 m from the wiper centre while the arm capsules have radii of only
    0.04 m (upper arm) and 0.031 m (forearm) and adjacent points along each helix sit 0.0147 m and 0.0134
    m apart, so one pad pressed onto the top of the arm marks a whole run of points at once, including
    those on the underside it never touched. A few firm presses spaced along each segment, with no sweeping
    motion at all, can clear the 0.5 threshold.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: base_cube_or_hand_contact_gate
  status: open
  closed_by: null
  mechanism: The contact clause is any non-zero summed force between either tool geom (the red pad or
    the base cube behind it) and the upper-arm, forearm or hand geoms, with no requirement on direction,
    magnitude or which face touches. A corner of the base cube jabbed edge-on into the arm, or the tool
    resting against the hand while its centre sits within 0.1 m of forearm points, marks those points
    exactly as a flat wipe would.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: shove_the_passive_arm
  status: open
  closed_by: null
  mechanism: The human is uncommanded and the mattress is the only thing under the arm, so the robot can
    press the arm into the mattress or drag the forearm sideways across it; the check has no force ceiling,
    no gentleness term and no notion of the arm staying put, and points carried to the wiper by the arm's
    own displacement count the same as points the wiper travelled to.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: one_segment_clears_the_bar
  status: open
  closed_by: null
  mechanism: 'The threshold is 0.5 of 52 points and each segment carries exactly 26, so wiping only the
    forearm (or only the upper arm), or only the 26 points nearest the robot''s base, passes success with
    the other half of the arm untouched: the check counts flags, not coverage of both segments.'
  note: Present in the check this repo wrote, not in a benchmark's.
