      step the last point is wiped, but its reward does see that regime through its auto-reset defect
      (the flags persist, so r_dist is 0 and done is set on every further step until the wrapper resets
      them). Two more consequences of dropping the bonus are stated in the adapter: the nearest-unwiped
      distance is taken on the arriving flags, so the reference DROPS on a wipe step (32 of 34 measured),
      and nothing in it pays for wiping -- hovering near an unwiped point scores 946 over an episode against
      305 for wiping all 52.'
