description:
  env_prose: 'A point mass slides on a 2-D plane bounded by [-1, 1] in each axis. The action is a force
    in [-1, 1]^2; velocity is damped, so the mass carries momentum and overshoots if it is not slowed
    down. The task is to move the mass to the goal and remain there for the rest of the episode. The reward
    is written in `jax.numpy` and traced with `jax.jit` and `jax.vmap` (generate.reward_language: jax).'
  l_task: move the end effector to the goal and stay there
