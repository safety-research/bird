schema_version: 1
id: inverted_pendulum_balance
env:
  env_id: InvertedPendulum-v5
  library:
    name: mujoco
    version_verified: 3.3.0
    commit: null
    stack:
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 25
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: The episode ends the moment the pole leans more than about 0.2 radians from
      vertical.
  reset:
    kind: stochastic
    mechanism: library_reseeded
    n_instances: null
    instance_seed: null
    entry:
      path: bird/envs/gym_mujoco.py
      symbol: GymMujoco._reset
      lines: '1368-1381'
    rng_note: 'One draw from the episode Generator -- int(rng.integers(2 ** 31 - 1)) in GymMujoco._reset, the entry above -- is
      passed to gymnasium Env.reset(seed=), which reseeds the wheel np_random before MujocoEnv.reset
      calls mj_resetData and reset_model (gymnasium/envs/mujoco/mujoco_env.py:174-178); every draw
      below is then made by that reseeded np_random in reset_model order: qpos, qvel. The row _reset
      returns is the raw concat(qpos, qvel) (4 entries), which here IS the 4-entry gymnasium
      observation (inverted_pendulum_v5.py:188-189 builds _get_obs the same way); fields are still
      a:b slices of that row because state_surface names its entries with no slice attribute. This
      adapter has no DR axes (dr_parameters is empty), so no draw precedes _reset at any DR
      setting.'
    draws:
      - role: agent_pose
        quantity: qpos
        fields: ['0:1', '1:2']
        distribution:
          family: uniform
          text: 'init_qpos (zeros) + U(-0.01, 0.01) on the cart position (m) and the pole angle from
            vertical (rad); the v5 default reset_noise_scale 0.01 (inverted_pendulum_v5.py:125), no
            override. The pole therefore starts within 0.01 rad of upright, one twentieth of the 0.2
            rad terminal band.'
          low: [-0.01, -0.01]
          high: [0.01, 0.01]
        source:
          path: gymnasium/envs/mujoco/inverted_pendulum_v5.py
          lines: '179-181'
        basis: measured
        note: 'Measured by hand (no committed test): the registry env gym_inverted_pendulum_balance built
          with ctx {}, reset 24 times with np.random.default_rng(i) for i in 0..23, observations stacked;
          columns 0-1 move within [-0.01, 0.01].'
      - role: agent_velocity
        quantity: qvel
        fields: ['2:3', '3:4']
        distribution:
          family: uniform
          text: 'init_qvel (zeros) + U(-0.01, 0.01) on the cart velocity (m/s) and the pole angular
            velocity (rad/s).'
          low: [-0.01, -0.01]
          high: [0.01, 0.01]
        source:
          path: gymnasium/envs/mujoco/inverted_pendulum_v5.py
          lines: '182-184'
        basis: measured
        note: 'Measured by hand (no committed test): the registry env gym_inverted_pendulum_balance built
          with ctx {}, reset 24 times with np.random.default_rng(i) for i in 0..23, observations stacked;
          columns 2-3 move within [-0.01, 0.01].'
    constants:
      - role: goal
        quantity: goal
        value: 'none -- balance_fraction is (steps survived) / horizon; upright (pole angle 0) is the
          implicit reference and the 0.2 rad terminal band is a constant of the env
          (inverted_pendulum_v5.py:162-164), neither sampled'
        source:
          path: bird/envs/gym_mujoco.py
          lines: '295-302'
          symbol: _fit_balance_fraction
        basis: read
    stochastic_transitions: null
    upstream_divergence: null
    prompt_states: 'The pole starts nearly vertical'
    prompt_field: natural_language
    prompt_omits: [agent_pose, agent_velocity]
  spaces:
    obs_dim: 4
    action_dim: 1
    action_low: -3.0
    action_high: 3.0
    action_semantics: Force on the cart along the rail, in [-3, 3].
description:
  natural_language: |-
    A cart slides along a horizontal rail with a rigid pole hinged to its top. The pole
    starts nearly vertical and gravity wants to topple it. Keep the pole balanced
    upright for as long as possible: push the cart left and right along the rail so the
    pole never tips over, holding the whole system steady rather than drifting off along
    the rail or oscillating ever harder. The episode ends the moment the pole leans more
    than about 0.2 radians from vertical, so every additional step the pole stays up is
    progress; balancing through the full episode is best.
  scene: |-
    - Body: a cart constrained to a horizontal rail, with a rigid pole attached to its
      top by an unactuated hinge. Two degrees of freedom — the cart's position on the
      rail and the pole's hinge angle — and only the cart is actuated.
    - Observation: a (4,) float array — 2 position entries then 2 velocity entries.
      obs[0] is the cart's position on the rail (metres, 0 = centre), obs[1] the pole's
      angle from vertical (radians, 0 = upright), obs[2] the cart's velocity (m/s) and
      obs[3] the pole's angular velocity (rad/s).
    - Control: 1 force on the cart along the rail, clipped to [-3, 3].
    - Timing: one control step holds the force for 2 simulator substeps of 0.02 s, so
      dt = 0.04 s per control step; the episode is at most 1000 steps (40 s).
    - Termination: the episode ends early the moment |obs[1]| > 0.2 rad (the pole has
      tipped over) or any state value stops being finite. An episode that reaches all
      1000 steps kept the pole up the whole time.
    - Convention: pole angle 0 is upright; positive and negative angles lean to the two
      sides. Balance means keeping obs[1] near 0.
  success_criterion_prose: null
  full_source:
    path: gymnasium/envs/mujoco/inverted_pendulum_v5.py
    lines: null
state_surface:
  fields:
  - name: s.cart_position
    shape: scalar
    units: null
    description: cart position on the rail, metres, 0 = centre (obs[0])
    source: null
  - name: s.pole_angle
    shape: scalar
    units: null
    description: pole angle from vertical, radians, 0 = upright; the episode ends when |angle|
      > 0.2 (obs[1])
    source: null
  - name: s.cart_velocity
    shape: scalar
    units: null
    description: cart velocity along the rail, m/s (obs[2])
    source: null
  - name: s.pole_angvel
    shape: scalar
    units: null
    description: pole angular velocity, rad/s (obs[3])
    source: null
  - name: s.obs
    shape: (4,)
    units: null
    description: 'the raw observation: [cart position, pole angle, cart velocity, pole angular
      velocity]'
    source: null
  - name: action
    shape: (1,)
    units: null
    description: the force applied to the cart this step, in [-3, 3]
    source: null
  helpers: []
  helpers_note: |-
    This task has no precomputed boolean helpers. Balance needs none: the pole angle, the
    cart position and both velocities are already named scalar fields of `s` above, and
    every quantity the reward plausibly wants is a direct function of those four
    numbers.
discrete_success:
  kind: continuous_only
  no_discrete_success_because: Gymnasium's control envs ship no discrete success check and no
    info['success']; there is no shipped success check to game and nothing for a hardened oracle to
    tighten. Ground truth is the continuous success metric in continuous_success.raw.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: balance_fraction
    expr: steps survived / nominal horizon (1000); episodes end at the first fall
    unit: fraction of horizon
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: anchors
    formula: null
    success_threshold: 0.9
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: 0.004
    method: random_policy
    source: 'Random baseline
      over n=5 episodes.'
    n_seeds: 5
    n_episodes: 5
    reason: null
    date: '2026-08-20'
  expert:
    value: 1.0
    method: trained_policy
    source: >-
      MEASURED 2026-08-28 by `scripts/train_expert.py`: PPO (sb3) trained for 1,001,472 env steps on
      `env.reference_reward` -- the adapter's own hand-written reward, NOT `task_metric`, which
      would be optimising the evaluation metric -- then rolled out with deterministic actions for 30
      evaluation episodes per seed and scored by `task_metric`, i.e. `continuous_success.raw`
      (balance_fraction, fraction of the 1000-step horizon), the same quantity the `random` anchor
      above reports. Seeds 0/1/2 scored 1.0 / 1.0 / 1.0. Engine: mujoco 3.3.0 / gymnasium 1.3.0 /
      stable-baselines3 2.9.0 -- BIRD's own pinned stack and the version this spec declares, so the
      expert side needs no engine caveat; the `random` side may still carry one (see
      `tasks/SOURCE.md`). The value recorded is the MAX (seed 0), which
      makes it a FLOOR ON THE CEILING and not an expectation: a trained policy is whatever its run
      reached, so this anchor may move UP if a better one is trained and must never be read as the
      benchmark's own answer the way a `scripted_policy` anchor is. This is the metric's own ceiling
      (1.0), so the anchor is SATURATED rather than a floor -- a better policy cannot raise it.
      `any_step_episode_fraction` was 0.0 on all three seeds -- the discrete success check never
      fired even for this policy -- so no any-step expert is claimed. Note this pair stays FLAT and
      unlabelled, so `bird/envs/spec.py::baselines_of` still refuses it and fitness on this task
      stays RAW; filling this anchor records the measurement and does not switch normalisation on.
      The measurement's own confidence interval is deliberately NOT reproduced here:
      `measure_anchors.interval` clamps to [0, 1] as though the metric were a fraction, and on a
      raw-valued metric that returns lo > hi (or hi = 1.0 below the mean), so only the per-seed
      means are sound. The trained policies are not distributed with this repository.
    n_seeds: 3
    n_episodes: 30
    date: '2026-08-28'
budget:
  train_steps: 15000
  learning_verified:
    verified: true
    reward_used: simple_correct
    algo: sb3 PPO
    seeds: 1
    result: 0.118 balance fraction vs random 0.004 (~30x), n=5 episodes, 44 s wall-clock — a small-scale check; PASS.
    date: '2026-08-20'
  saturates_at: null
reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: gymnasium/envs/mujoco/inverted_pendulum_v5.py
      lines: 157-173
      symbol: InvertedPendulumEnv.step
      commit: null
      sha256: 860e8436475689a42ae10003638e5320668d32d39a9bedc502957b8e7b3aac48
    depends_on: []
    import_path: null
    verified_against: gymnasium 1.3.0 (mujoco 3.3.0)
    notes: +1 per step while the pole stays within the healthy angle range — the classic alive bonus.
      Verified against source; whole-file sha256 from the installed wheel (the artifact the adapter runs
      against), commit null for that reason. Self-contained — no shared shaping helpers, hence the empty
      depends_on.
  contract:
    signature: |-
      MAX_REWARD = <float>   # tight upper bound on `reward` below

      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          """
          Args:
            s:      frozen state namespace, fields documented above; no env handle
            action: (1,) float array, the action applied this step
          Returns:
            reward:     a single float in [0, MAX_REWARD]
            components: dict mapping term name -> float
          """
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch: a single Python float for reward and for each component.
      Single environment, plain NumPy.'
    reward_utils: []
  forbidden_symbols: []
judge:
  vlm_legible: true
  legibility_note: The pole is either up or falling — readable, but frames are near-static, so
    the judge-reliability risk is scoring on nothing.
  camera:
    name: free (default)
    mode: fixed
    note: 'No camera element in the env XML; the default free camera is fixed. Near-static frames:
      a sloppy judge scores everything 1.0 here, which is why this task doubles as the judge-reliability
      probe.'
  subtasks_sequential: false
  telemetry_fields:
  - pole_angle
  - cart_position
domain_randomization:
  # Multiplicative scales
  # on the arrays bird/envs/gym_mujoco.py captures at construction, nominal 1.0; the
  # adapter's _GYM_AXES table says what each writes. Only axes with a mechanical path on
  # THIS model are declared (no fluid on a legged model, no collider on Reacher).
  parameters:
    body_mass_scale:
    - 0.25
    - 4.0
    gravity_scale:
    - 0.7
    - 1.3
    motor_strength_scale:
    - 0.5
    - 2.0
    joint_damping_scale:
    - 0.1
    - 5.0
  nominal:
    body_mass_scale: 1.0
    gravity_scale: 1.0
    motor_strength_scale: 1.0
    joint_damping_scale: 1.0
exploits: []
symbol_mapping: null
provenance:
  authored_from:
  - path: bird/envs/gym_mujoco.py
    lines: null
    what: '`_fit_balance_fraction`, the ground-truth fitness (`_FITNESSES["balance_fraction"]`, selected by
      `continuous_success.raw.name`)'
  - path: gymnasium/envs/mujoco/inverted_pendulum_v5.py
    lines: null
    what: 'gymnasium 1.3.0 env source: spaces, cameras, built-in reward'
  rule: source, not docstrings
  measured:
  - Random baseline 0.004 balance fraction (n=5).
  verified_by: BIRD authors
  date: '2026-08-24'
