reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: assistax/envs/armmanipulation.py
      lines: null
      symbol: ArmManipulation.step
      commit: a7d94f4e20636b9b0c07370344b8a2b521db58b2
      sha256: null
    depends_on:
    - path: assistax/envs/base_env.py
      lines: null
      symbol: null
      commit: a7d94f4e20636b9b0c07370344b8a2b521db58b2
      sha256: null
    - path: assistax/envs/README.md
      lines: null
      symbol: null
      commit: a7d94f4e20636b9b0c07370344b8a2b521db58b2
      sha256: null
    import_path: null
    verified_against: assistive-autonomy/assistax @ a7d94f4e2063, read 2026-09-08
    notes: 'Upstream''s ArmManipulation.step reward, transcribed into `bird/envs/assistax.py` term by
      term at the constructor defaults, with four stated substitutions: the tool speed is the simulator''s
      instantaneous site velocity rather than the finite difference of two frames; contact forces are
      summed over the live tool-human contact pairs (and read back off the observation when a stored state
      is re-scored) rather than read at fixed MJX contact-array indices; the control cost squares the
      7-D robot action clipped to [-1, 1] where upstream squares the concatenated robot+human action;
      bedbathing''s per-point bonus (needs the previous flags) is dropped. Transcribed, not imported:
      upstream is JAX/MJX.'
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    - math
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, over the FLAT observation array. There is no `self` and no env handle:
      the compiler binds arguments by name and maps `self`/`env` to None deliberately.'
    reward_utils: []
  forbidden_symbols: []
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - success
    - reference_reward
    - _model
    - _data
    - _forward
    - _Derived
    - _derived_now
    - _TASKS
    - _FAMILIES
    - gt_reward
    - _metric_bedbathing
  forbidden_symbols_note: 'The BIRD entries name adapter internals -- how a candidate could reach the
    metric it is scored on IN THIS REPO -- which are not properties of the task and cannot be expressed
    in the flat list above (empty: upstream ships no forbidden-symbol set).'
judge:
  vlm_legible: true
  legibility_note: 'The scene''s `default` camera is fixed in the world at (1.5, -2.8, 1.5) and looks
    obliquely across and down the bed from the robot''s side, beyond the foot end, so the lying human,
    the whole Panda and the hook are in frame with the right arm on the near side, about 3 m from the
    camera. Both targets are rendered: an opaque green capsule of radius 0.04 m wrapping the mid-forearm
    (hook_target) and a half-transparent cyan sphere of the same radius beside the right hip (arm_target),
    so a VLM can read where the arm lies (out at the mattress edge or in beside the hip), whether the
    green marker has reached the cyan sphere, whether the arm was lifted or dragged along the mattress,
    whether the hook is at the forearm or elsewhere in the air, and whether the torso or legs have been
    shoved. It cannot tell whether the hook is engaged under the forearm or merely beside it -- the plate
    is 12 mm thick and 60 mm wide and the gap under the arm is below what 448x320 resolves at that distance
    -- nor read contact force or speed from a still. The legend prints only the task name -- neither the
    hook-to-forearm distance, the forearm-to-waist distance the check gates on nor any force is printed
    -- so the gated distance reaches a judge only through the two markers'' separation.'
  camera:
    name: default
    mode: fixed
    note: 'the scene''s `default` camera: a fixed camera at (1.5, -2.8, 1.5) looking obliquely across
      and down the bed from the robot''s side and beyond its foot (view direction (-0.47, 0.81, -0.34)
      from its xyaxes), the whole Panda and the lying human in frame'
  subtasks_sequential: false
  telemetry_fields:
  - dist_forearm_waist_target
  - dist_tool_hook_target
  - hook_rot_err
  - contact_force_magnitude
  - hook_target_z
domain_randomization: null
exploits:
- name: drag_not_hook
  status: open
  closed_by: null
  mechanism: The check reads only the forearm hook point's distance to the waist site; dist_tool_hook_target
    and hook_rot_err are in the observation and in upstream's reward but in no clause. The forearm can
    therefore be shoved across the mattress with the flat of the plate, the outside of the lip, or the
    Panda's own wrist, hand and finger collision geoms (which carry the same collision masks as the hook,
    so they touch the human exactly as it does, and whose force on the human is not in the observation's
    force field, which sums only the two hook geoms' contacts), and the arm is never hooked; the check
    pays the same.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: slide_along_the_mattress_no_lift
  status: open
  closed_by: null
  mechanism: The waist site is at z 0.713 m, about 4 cm above the mattress top at 0.67 m, and a forearm
    of radius 0.031 m lying on the mattress has its centreline near 0.67 + 0.031 m -- inside the 0.08
    m ball. A purely horizontal drag of the forearm across the mattress toward the hip, roughly the 0.33
    m initial separation, satisfies the check on every step it holds, with the arm never leaving the mattress,
    although the task is stated as a lift to waist level.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: pin_with_unbounded_force
  status: open
  closed_by: null
  mechanism: The check has no force term and pays per step, so once the hook point is inside the ball,
    pressing the forearm down into the mattress or wedging it against the hip holds it there for the remaining
    steps, and doing so at the Panda's full joint torque (up to 87 N.m on the first four joints) scores
    exactly as a gentle placement does; upstream's ee_force is info-only, so the reference reward does
    not penalise it either.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: move_the_hips_to_the_arm
  status: open
  closed_by: null
  mechanism: The waist site is fixed to the pelvis of a free-floating passive body with no weld to the
    bed, and the check is a relative distance, so pushing the pelvis or legs sideways bends the trunk
    at the abdomen joints -- held only by the idle actuators' restoring torque of 40-45 N.m per radian
    plus 10-20 N.m per radian of joint stiffness, well within what the Panda's 87 N.m proximal joints
    can apply -- and swings the pelvis-fixed waist site toward the arm without the arm moving; combined
    with a shorter drag, the point enters the ball while the arm stays well out at the side.
  note: Present in the check this repo wrote, not in a benchmark's.
