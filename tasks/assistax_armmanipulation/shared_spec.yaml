    source: bed_scene_armmanip.xml
    slice: '7:24'
  - name: robot_joint_angles
    shape: (7,)
    units: rad
    description: the Panda's seven joint angles, joint1..joint7
    source: bed_scene_armmanip.xml
    slice: '24:31'
  - name: human_root_velocity
    shape: (6,)
    units: m/s, rad/s
    description: the human's root linear velocity (world frame) then angular velocity (body frame)
    source: bed_scene_armmanip.xml
    slice: '31:37'
  - name: joint_velocities
    shape: (24,)
    units: rad/s
    description: every hinge joint velocity in model order (human then Panda)
    source: bed_scene_armmanip.xml
    slice: 37:61
  - name: tool_pose_velocity_force
    shape: (13,)
    units: m, unit quaternion, m/s, N
    description: 'tool position (3), tool orientation quaternion (4), tool linear velocity (3), net contact
      force the row''s tool geoms apply to the row''s human geoms (3; the right arm on the arm tasks,
      the head on the head tasks; a range, not a bound: stiff-contact transients can exceed it), world
      frame'
    source: bird/envs/assistax.py::_COMMON_TAIL
    slice: 61:74
  - name: task_fields
    shape: (15,)
    units: m (positions and distances), dimensionless (hook_rot_err, a Frobenius norm), m (arm positions)
    description: 'hook_target_x: position x of the point on the human forearm the hook should engage,
      metres, world frame; hook_target_y: position y of the forearm hook point, metres, world frame; hook_target_z:
      position z of the forearm hook point, metres, world frame; waist_target_x: position x of the waist-level
      target the forearm should be brought to, metres, world frame; waist_target_y: position y of the
      waist-level target, metres, world frame; waist_target_z: position z of the waist-level target, metres,
      world frame; dist_tool_hook_target: distance from the hook''s platform centre to the forearm hook
      point, metres; dist_forearm_waist_target: distance from the forearm hook point to the waist-level
      target, metres; hook_rot_err: Frobenius norm of the difference between the hook site''s and the
      forearm hook point''s rotation matrices (0 when aligned, at most 2*sqrt(2) = 2.83; the README''s
      5.66 doubles it); uarm_x: human right upper arm body position x, metres, world frame; uarm_y: human
      right upper arm body position y, metres, world frame; uarm_z: human right upper arm body position
      z, metres, world frame; larm_x: human right lower arm body position x, metres, world frame; larm_y:
      human right lower arm body position y, metres, world frame; larm_z: human right lower arm body position
      z, metres, world frame'
    source: bird/envs/assistax.py::_TASKS
    slice: 74:89
  helpers:
  - name: tool_position
    signature: tool_position(s)
    description: the tool reference point's position, metres, world frame
    kind: inline_expression
    expression: s[61:64]
  - name: tool_velocity
    signature: tool_velocity(s)
    description: the tool reference point's linear velocity, m/s, world frame
    kind: inline_expression
    expression: s[68:71]
  - name: tool_speed
