description:
  env_prose: 'A Franka Panda arm stands beside a bed at the human''s right. The human lies supine, right
    arm out toward the robot, forearm at the mattress edge and pressed into it. The human is passive:
    the body rests under gravity, held by joint stiffness and its idle trunk and hip actuators'' restoring
    torques, and can be pushed; the right arm resists only lightly. The tool is an L-shaped hook whose
    reference point (the crook) sits in the L''s angle beneath the lip; it collides with the mattress.
    Two body points matter: a hook point midway along the right forearm and a waist target beside the
    right hip, about 4 cm above the mattress, initially about 33 cm away toward the feet and in toward
    the body; the crook starts about 31 cm from the hook point. The action is seven numbers in [-1, 1],
    one per Panda joint: normalised position targets for stiff servos (about pi times the value in radians,
    clipped to the joint''s range), not torques. Only the wrist links, hand, fingers and hook collide;
    other links pass through everything. A control step is 4 ms (250 Hz); an episode is 1000 steps (4
    s) and nothing ends it early. The observation is the whole simulator state -- the human''s root position
    and quaternion, every hinge angle (human, then the seven Panda joints), then all velocities, same
    order -- then derived fields: crook position, hook orientation quaternion, crook velocity, the contact
    force in newtons the hook applies to the right arm and hand, the hook point''s and waist target''s
    positions, the two distances (crook to hook point, hook point to waist target), a hook-to-hook-point
    rotation mismatch (zero when aligned), and the right upper-arm and forearm positions. Every episode
    starts from the same lying pose and robot pose with small random jitter on every position and velocity
    coordinate; both target points are fixed to the body.'
  l_task: 'Help the person lying in the bed move their weak right arm: slide the L-shaped hook on the
    Panda''s hand under the forearm where it rests at the edge of the mattress, then lift and carry the
    forearm in across the bed and bring it to rest beside the right hip at waist level, and keep it there
    for as much of the episode as you can. The arm is commanded with seven joint-position targets, one
    per Panda joint, each a normalised target angle that a stiff position servo tracks rather than a torque;
    the person is passive and will neither help nor resist beyond the light stiffness and damping of their
    own arm.'
  natural_language: 'A Franka Panda arm stands beside a bed at the human''s right. The human lies supine,
    right arm out toward the robot, forearm at the mattress edge and pressed into it. The human is passive:
    the body rests under gravity, held by joint stiffness and its idle trunk and hip actuators'' restoring
    torques, and can be pushed; the right arm resists only lightly. The tool is an L-shaped hook whose
    reference point (the crook) sits in the L''s angle beneath the lip; it collides with the mattress.
    Two body points matter: a hook point midway along the right forearm and a waist target beside the
    right hip, about 4 cm above the mattress, initially about 33 cm away toward the feet and in toward
    the body; the crook starts about 31 cm from the hook point. The action is seven numbers in [-1, 1],
    one per Panda joint: normalised position targets for stiff servos (about pi times the value in radians,
    clipped to the joint''s range), not torques. Only the wrist links, hand, fingers and hook collide;
    other links pass through everything. A control step is 4 ms (250 Hz); an episode is 1000 steps (4
    s) and nothing ends it early. The observation is the whole simulator state -- the human''s root position
    and quaternion, every hinge angle (human, then the seven Panda joints), then all velocities, same
    order -- then derived fields: crook position, hook orientation quaternion, crook velocity, the contact
    force in newtons the hook applies to the right arm and hand, the hook point''s and waist target''s
    positions, the two distances (crook to hook point, hook point to waist target), a hook-to-hook-point
    rotation mismatch (zero when aligned), and the right upper-arm and forearm positions. Every episode
    starts from the same lying pose and robot pose with small random jitter on every position and velocity
    coordinate; both target points are fixed to the body.'
  scene: 'A single bed seen obliquely from the robot''s side and from beyond its foot, looking down toward
    the head: a person lying on their back with their head on a pillow, right arm out at the mattress
    edge with a green marker around the forearm and a translucent cyan ball beside the right hip, and
    a Franka Panda arm standing on the floor beside the bed holding a blue L-shaped hook with a red lip.'
  success_criterion_prose: 'arm_at_waist_fraction is a check this repository wrote, not a benchmark criterion:
    upstream Assistax ships no success test for this task and reports only the return of its own reward.
    It is the fraction of the episode''s 1000 arriving states on which the hook_target point midway along
    the human''s right forearm is within 0.08 m of the arm_target site beside the right hip at waist level
    -- one distance clause, with no requirement that the hook be engaged, on contact force, or on how
    the arm got there. success() is this fraction reaching 0.3, a provisional threshold. The check gates
    on the same forearm-to-waist distance that dominates upstream''s reward (its 10 x exp(-d^2/0.1) term),
    so it is not independent of that reward the way a benchmark''s success flag would be; and the waist
    target sits only about 4 cm above the mattress top, so the check does not by itself require the forearm
    to leave the mattress. A uniform-random policy scores exactly 0 over 30 episodes.'
  full_source:
    path: bird/envs/assistax.py
    lines: null
state_surface:
  fields:
  - name: human_root_pose
    shape: (7,)
    units: m, unit quaternion
    description: the human's root position and orientation (w, x, y, z)
    source: bed_scene_armmanip.xml
    slice: 0:7
