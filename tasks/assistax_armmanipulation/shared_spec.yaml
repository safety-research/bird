discrete_success:
  kind: continuous_only
  no_discrete_success_because: Assistax ships no boolean success check for any task -- its agents are
    judged by the return of its own dense reward -- so there is no benchmark criterion to state. `EnvAdapter.success()`
    here is a threshold WE chose on a per-step check WE wrote, and recording it as a `shipped` check would
    claim an independence it does not have.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: arm_at_waist_fraction
    expr: fraction of arriving states with dist_forearm_waist_target < 0.08 m
    unit: fraction of arriving states
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1].
    success_threshold: 0.3
anchors:
  reduction: per_step_fraction
  by_reduction:
    per_step_fraction:
      random:
        value: 0.0
        method: random_policy
        source: 'MEASURED 2026-09-08: mean `task_metric` over n=30 uniform-random episodes, `scripts/measure_anchors.py
          --env assistax_armmanipulation --n 30`, seed 0; 95% Wilson interval half-width (every episode
          scored exactly 0) 0.0568.'
        n_seeds: 30
        n_episodes: 30
        reason: null
        date: '2026-09-08'
      expert:
        value: null
