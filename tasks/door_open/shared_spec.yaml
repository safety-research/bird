    - { path: metaworld/assets/objects/assets/doorlockB.xml,   lines: null,      what: "door_link, `doorjoint` hinge about +z with range [-2, 0] rad, handle geoms" }
    - { path: metaworld/utils/reward_utils.py,                 lines: "97-244",  what: "the shaping primitives the published reward is built from" }
  rule: "source, not docstrings"
  measured:
    - "The shipped band is theta in [-1.81558, -1.38272] rad on every one of 12 (seed, goal) pairs, swept on a 1e-5 rad grid; it does not move with the randomization because the door body's x cancels between obs[4] and _target_pos[0]."
    - "Meta-World's scripted expert over 30 (seed, goal) pairs: complete-at-least-once 29/30, complete-on-the-last-step 0/30, final theta -1.84 to -1.99."
    - "The named `handle` geom has contype = conaffinity = 0; collision proxies are four unnamed `dl_col` cylinders on door_link."
    - "env.touching_main_object raises KeyError: Invalid name 'objGeom' on this env."
