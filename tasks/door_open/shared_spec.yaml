exploits:
  - name: overshoot_past_the_band
    mechanism: >-
      Drive the door past the far edge of the 0.08 m band to the hinge stop. The shipped
      check reads False at the horizon even though the door is fully open.
    status: open
    closed_by: null
    note: "Affects the shipped success check's at-end reading, not the once reading."
  - name: bat_open_without_the_handle
    mechanism: >-
      Open the door with the gripper's body or fingers on the panel rather than grasping the
      handle (the arm links and wrist have no collision geometry that can touch the door), or
      knock it and abandon it while it coasts through the band.
    status: open
    closed_by: null
    note: >-
      The planned `gripper_on_handle` conjunct (`discrete_success.hardened.pending_plan`) would
      close it, and only as a distance, not a contact: a gripper hovering beside the handle while
      something else does the work would still pass. A contact version is not writable from `s`:
      the frozen state namespace exposes no contact quantity, and Meta-World's
      `touching_main_object` KeyErrors on this env. (The named `handle` geom is visual-only,
      but the handle's four unnamed `dl_col` collision cylinders on `door_link` exist and are
      addressable by geom or body id -- the gap is the state surface, not the asset.)
  - name: flung_past_then_counted_on_the_way_back
    mechanism: "Fling the door past the band, then let it swing back shut and be counted again as it re-crosses."
    status: open
    closed_by: null
    note: "The planned `hinge_opening` conjunct would close it with an instantaneous velocity test, so holding the door still inside the band would still pass."
  - name: once_vs_at_end_gap
    mechanism: >-
      The gap between complete-at-least-once and complete-on-the-last-step is sometimes
      proposed as a hack detector.
    status: undetectable_here
    closed_by: null
    note: >-
      On THIS task that gap is 29/30 vs 0/30 for Meta-World's own scripted expert, i.e. ~100%
      for a reference-competent policy, so it detects nothing. Recorded so the detector is not
      applied here in good faith.

symbol_mapping:
  distance_to_goal: np.linalg.norm(s[4:7] - s[36:39])
  object_to_goal: np.linalg.norm(s[4:7] - s[36:39])
  gripper_to_object: np.linalg.norm(s[0:3] - s[4:7])
  gripper_to_goal: np.linalg.norm(s[0:3] - s[36:39])
  hand_position: s[0:3]
  object_position: s[4:7]
  object_orientation: s[7:11]
  object_height: s[6]
  goal_position: s[36:39]
  gripper_open: s[3]
  hand_velocity: ((s[0:3] - s[18:21]) / 0.0125)
  object_velocity: ((s[4:7] - s[22:25]) / 0.0125)
  action_magnitude: np.linalg.norm(a[0:3])
  gripper_action: a[3]

