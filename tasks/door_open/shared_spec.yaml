reward:
  human:
    kind: published_dense
    # value_determining, not text_only: this reward is built almost entirely out of
    # metaworld.utils.reward_utils primitives, which can change while the compute_reward
    # text does not. A digest over the body alone would assert provenance it does not have.
    # Not with_success_branch either: the reward re-derives the shipped check INLINE at
    # :199-201 and hard-overrides itself to 10.0, so that code is already inside `reference`.
    # The shipped success check's own definition (:67-91) is pinned on discrete_success.shipped.provenance,
    # where it belongs.
    scope: value_determining
    reference:
      path: metaworld/envs/sawyer_door_v3.py
      # 180-205 is the `v2` branch specifically, not the whole method: the version
      # check sits at :186 and that branch returns at :205 (the v1 branch runs to
      # :237). Verified against source — v2 is the branch that executes.
      lines: "180-205"
      symbol: SawyerDoorEnvV3.compute_reward
      commit: 2da74b23c2928e92db3a9daa586ea6fef4dda930
      sha256: "8169e20d95a476d789c2fab312dc1cf403c27fe5d97fb4350f3d62c483d628c9"
    depends_on:
      - path: metaworld/utils/reward_utils.py
        lines: "97-244"
        symbol: "tolerance, inverse_tolerance, hamacher_product"
        commit: 2da74b23c2928e92db3a9daa586ea6fef4dda930
        sha256: "46478c0139f923f0d090c8e2324b45375cac02ee74a258ca35de597d8ad1f3bb"
    import_path: "metaworld.envs.sawyer_door_v3:SawyerDoorEnvV3.compute_reward"
    verified_against: "metaworld 3.1.1 (PyPI wheel, digests taken 2026-08-24)"
    notes: >-
      The v2 branch of the reward. It re-derives the shipped check and hard-overrides itself
      to 10.0 when it fires (sawyer_door_v3.py:199-201) - which is why s.door_qpos /
      s.handle_pos / s.target_pos are exposed to the model: withholding an input the human
      baseline has would invalidate the headline comparison. The hardened oracle is what is
      actually withheld, and it is not derivable from these fields.
  contract:
    signature: |-
      MAX_REWARD = <float>   # tight upper bound on `reward` below

      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          """
          Args:
            s:      frozen state namespace, fields documented above; no env handle
            action: (4,) float array, the action applied this step
          Returns:
            reward:     a single float in [0, MAX_REWARD]
            components: dict mapping term name -> float
          """
    framework: numpy
    batched: false
    allowed_modules: [numpy]
    returns: "(scalar, components)"
    max_reward: "<float>, declared by the candidate"
    idiom_rule: >-
      One scalar out, not a batch. Return a single Python float for `reward` and a float for
      each entry of `components`. A NumPy scalar or size-1 array is unwrapped for you; an
      array with more than one element is refused and the run stops.
    reward_utils:
      - { name: tolerance,         signature: "tolerance(x, bounds, margin, sigmoid='long_tail')", provenance: { path: metaworld/utils/reward_utils.py, lines: "97-244" } }
      - { name: inverse_tolerance, signature: null, provenance: { path: metaworld/utils/reward_utils.py, lines: "97-244" } }
      - { name: hamacher_product,  signature: "hamacher_product(a, b)",                            provenance: { path: metaworld/utils/reward_utils.py, lines: "97-244" } }
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - gt_reward
    - evaluate_state
    - reward_source
    - _env
  forbidden_symbols_note: 'BIRD''s gate, and it is a different SET from the flat list above rather than
    a superset. Four of these six name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `reward_source`,
    `_env` -- which are not properties of the task at all; they are the routes by which a candidate could
    reach the metric it is scored on IN THIS REPO. Upstream''s list names benchmark symbols, which is
    right for a consumer that calls the benchmark directly.
    
    `success` is DELIBERATELY ABSENT, and the omission is measured rather than an oversight. Meta-World''s
    `info["success"]` is a threshold on the distance between obj (obs[4:7]) and goal (obs[36:39]), both
    of which are IN the observation a generated reward receives -- so an identifier gate is both too strict
    and too weak. Measured: listing it rejected 15 of 15 candidates and no policy was trained, and
    every rejected program''s offence was naming its OWN proxy `success`. A candidate that spells the
    same quantity `hit` passes either way. The defence that does hold is structural: a generated reward
    can influence the POLICY and nothing else, so a candidate that re-derives the check has written a
    SPARSE reward -- a legitimate design point that trains poorly at this tier''s budget and loses on
    its merits.'
  forbidden_symbols:
    - hardened_success
    - evaluate_state
    - touching_main_object

judge:
  vlm_legible: true
  legibility_note: >-
    A door is either visibly swung open or it is not, and the gripper is either on the handle
    or elsewhere on the panel - both are readable from a frame. Contrast pendulum-style tasks,
    where every frame differs from every other only by an angle.
  camera:
    name: corner
    mode: fixed
    note: >-
      Fixed deliberately. A tracking camera hides absolute progress, which was a diagnosed
      cause of judge score inflation.
  extra_views:
  - name: topview
    mode: fixed
    note: >-
      Fixed camera looking straight down at the table. Shows the arm and the objects in the
      table plane: where the gripper is relative to the goal marker and how far the door has
      travelled. Height above the table is not visible from here, and an object directly under
      the gripper is hidden by the arm. The door's opening angle is a rotation in this plane, so
      how far it has swung reads directly here.
  - name: behindGripper
    mode: tracking
    note: >-
      Tracking camera mounted behind and above the gripper, moving with it. A close view of the
      fingers and whatever they touch, for grasp and contact; the scene shifts as the arm moves,
      so it shows no absolute position, and early in an episode it can be filled by the arm's
      own link. Shows whether the handle is between the fingers.
  subtasks_sequential: true
  telemetry_fields: [door_qpos, door_qvel, handle_to_target_x, gripper_handle_distance]

