exploits:
- name: shallow_insertion
  mechanism: 'Insert only the first ~2 cm of the peg. The head site sits 2 cm behind the tip, so the
    weighted success ball -- which reaches 4 mm in front of the face for the SITE (hole site minus
    target is 0.066 m in x on every pinned instance) -- is first entered with the tip 1.6 cm inside
    the mouth, and at 2 cm of insertion tolerates about 1.2 cm of combined lateral error. The check
    has no depth requirement beyond that, so a peg barely in the 19 cm channel scores on every step
    it is held there. Zero insertion does NOT register: a tip resting on the face leaves the head
    0.086 m from the target.'
  status: open
  closed_by: null
  note: The hardened plan's `depth_upper` conjunct (head at least some distance INSIDE the mouth)
    is the closure; this is the case that makes it concrete.
symbol_mapping:
  # the observed object point is pegGrasp, 13 cm from the HEAD the check scores: measured from
  # pegGrasp the distance is never below ~7 cm when the task is solved (13.04 cm at full insertion)
  distance_to_goal: 'np.linalg.norm((s[4:7] + (lambda u, w, v: v + 2 * w * np.cross(u, v) + 2 *
    np.cross(u, np.cross(u, v)))(s[7:10], s[10], np.array([-0.13, 0.0, -0.01]))) - s[36:39])'
  object_to_goal: 'np.linalg.norm((s[4:7] + (lambda u, w, v: v + 2 * w * np.cross(u, v) + 2 *
    np.cross(u, np.cross(u, v)))(s[7:10], s[10], np.array([-0.13, 0.0, -0.01]))) - s[36:39])'
  gripper_to_object: np.linalg.norm(s[0:3] - s[4:7])
  gripper_to_goal: np.linalg.norm(s[0:3] - s[36:39])
  hand_position: s[0:3]
  object_position: s[4:7]
  object_orientation: s[7:11]
  object_height: s[6]
  goal_position: s[36:39]
  gripper_open: s[3]
  hand_velocity: ((s[0:3] - s[18:21]) / 0.0125)
  object_velocity: ((s[4:7] - s[22:25]) / 0.0125)
  action_magnitude: np.linalg.norm(a[0:3])
  gripper_action: a[3]
  peg_head: '(s[4:7] + (lambda u, w, v: v + 2 * w * np.cross(u, v) + 2 * np.cross(u, np.cross(u,
    v)))(s[7:10], s[10], np.array([-0.13, 0.0, -0.01])))'
