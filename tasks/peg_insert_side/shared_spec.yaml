schema_version: 1
id: peg_insert_side
env:
  env_id: peg-insert-side-v3
  library:
    name: metaworld
    version_verified: 3.1.1
    commit: null
    stack:
      mujoco: 3.3.0
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 500
  control_hz: null
  termination:
    early_terminate: false
    autoreset: false
    partial_reset: null
    prompt_states: The episode always runs the full 500 steps; reaching the criterion does not
      end it.
  reset:
    kind: stochastic
    mechanism: pinned_instances
    n_instances: 50
    instance_seed: 0
    instances_source: '`metaworld.MT1("peg-insert-side-v3", seed=0).train_tasks`
      (bird/envs/metaworld.py:1135-1136; `benchmark_seed = 0` is a class attribute at :951). `_make_tasks`
      (metaworld/__init__.py:114-179) seeds the GLOBAL `np.random` to 0, constructs the env with
      `_freeze_rand_vec = False`, calls `reset()` 50 times keeping each `_last_rand_vec` -- one
      `np.random.uniform` over `_random_reset_space` per call (sawyer_xyz_env.py:711-719), re-drawn by
      this task''s own rejection loop in `reset_model` (sawyer_peg_insertion_side_v3.py:140-141) while
      the two x-y positions are < 0.1 m apart (a guard the boxes'' 0.25 m x-gap keeps from ever firing)
      -- asserts the 50 are distinct, then restores the global RNG state. Every run, cfg.seed and
      candidate shares the same 50 vectors.'
    entry:
      path: bird/envs/metaworld.py
      symbol: MetaWorld._reset
      lines: 1747-1765
    rng_note: 'One draw per reset: `rng.integers(50)` picks the instance (metaworld.py:1761). `env.reset()`
      is then called UNSEEDED (:1762) and `reset_model` reads the frozen `_last_rand_vec` that `set_task`
      installed (sawyer_xyz_env.py:308-309, :699-701) -- twice per reset (SawyerXYZEnv.reset:677, then
      gymnasium MujocoEnv.reset:178), idempotently. A seed is a choice over 50 points: two seeds collide
      with probability 1/50, and `default_rng(0..23)` lands on 21 distinct instances (measured). `_sample_dr`
      reads the same Generator BEFORE `_reset` (base.py:401-406) but consumes nothing at nominal (`_dr_ranges`
      is empty, base.py:685-686); with DR ranges installed the same seed lands on a different instance.'
    draws:
      - role: object_pose
        quantity: peg_xy
        fields:
          - object_x
          - object_y
          - prev_object_x
          - prev_object_y
        distribution:
          family: uniform
          text: 'peg body x ~ U(0.0, 0.2), y ~ U(0.5, 0.7) m, z = 0.02 fixed (obj_low/obj_high, :48-49):
            entries 0:3 of ONE 6-D `_random_reset_space` Box drawn jointly with the box (:76-79), the
            whole vector re-drawn while the peg-box x-y distance is < 0.1 m (:140-141; 0.1 here, not the
            0.15 of reach/push/pick-place) -- a guard that can never fire: peg x in [0, 0.2] and box x
            in [-0.35, -0.25] are >= 0.25 m apart by construction, and the smallest peg-box x-y
            separation over the 50 instances is 0.301 m. Written by `_set_obj_xyz` (:142-144). The
            observed object is the `pegGrasp` site (:130-131), a rigid (+0.03, 0, +0.01) m from the body
            (measured), so no literal box on these fields: object_x in [0.0338, 0.2281], object_y in
            [0.5026, 0.6996] over the 50 instances.'
          low: null
          high: null
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: 139-144
        basis: measured
        note: 'measured through the registry adapter (`registry.get("env", "mt10_peg-insert-side-v3")(None)`):
          24 resets with `np.random.default_rng(0..23)` move exactly the `fields` listed across this block''s
          draws and nothing else; resetting on each of the 50 pinned instances gives the ranges quoted in `text`. `prev_*`
          equal the current entries at reset (SawyerXYZEnv.reset:679-680), so they move with their source.'
      - role: object_pose
        quantity: box_pos
        fields: []
        not_observed_because: the box body (`model.body("box").pos`, :145) is not in the 39-D observation
          -- obs[4:11] is the peg alone and obs[11:18] is zero padding; the box reaches the observation
          only through the goal, a fixed offset from it.
        distribution:
          family: uniform
          text: 'box body x ~ U(-0.35, -0.25), y ~ U(0.4, 0.7), z ~ U(-0.001, 0.001) m
            (goal_low/goal_high, :50-51): entries 3:6 of the same 6-D Box, coupled to the peg by the >=
            0.1 m x-y rejection (:140), which the disjoint x ranges make vacuous.'
          low: null
          high: null
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: 139-145
        basis: read
      - role: goal
        quantity: hole
        fields:
          - goal_x
          - goal_y
          - goal_z
        distribution:
          family: derived
          text: '`_target_pos = pos_box + (0.03, 0.0, 0.13)` (:146-147): a fixed offset from the box draw.
            All three columns move -- z by the box''s +/- 1 mm. Over the 50 instances: x in [-0.3189, -0.2232],
            y in [0.4035, 0.6983], z in [0.1291, 0.131].'
        derived_from: box_pos
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: 146-147
        basis: measured
        note: The only rendering that tells the model this varies is flat_fields[goal_x].description ("goal
          position x for this episode; re-randomised every reset"), which reaches it under the state-API
          stub alone; l_task and env_prose describe a fixed scene.
    constants:
      - role: agent_pose
        quantity: hand start
        value: hand_init_pos = (0, 0.6, 0.2) m (sawyer_peg_insertion_side_v3.py:74); `_reset_hand` drives
          the mocap weld there for 50 frames with the fingers commanded open (sawyer_xyz_env.py:684-695),
          no draw. Settles to (0.00458, 0.60139, 0.19514) with gripper_opening 1.0 on every one of the 50
          instances (measured, identical to 1e-6).
        fields:
          - hand_x
          - hand_y
          - hand_z
          - gripper_opening
          - prev_hand_x
          - prev_hand_y
          - prev_hand_z
          - prev_gripper_opening
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: '74'
        basis: measured
      - role: agent_velocity
        quantity: arm and gripper velocity
        value: none -- velocity is not in the 39-D observation; `SawyerXYZEnv.reset` copies the current
          frame into obs[18:36] (sawyer_xyz_env.py:679-680), so the finite-difference velocity `(s[0:18]
          - s[18:36]) / dt` is exactly zero at step 0 on every instance.
        source:
          path: metaworld/sawyer_xyz_env.py
          lines: 664-682
        basis: read
      - role: object_pose
        quantity: peg height and orientation
        value: '`pegGrasp` site z = 0.03 m (peg body z 0.02, low == high, :48-49, plus the site offset);
          orientation from the site xmat (:133-135) is identity (qx, qy, qz, qw) = (0, 0, 0, 1) on every
          instance -- the peg always lies along the same axis.'
        fields:
          - object_z
          - object_qx
          - object_qy
          - object_qz
          - object_qw
          - prev_object_z
          - prev_object_qx
          - prev_object_qy
          - prev_object_qz
          - prev_object_qw
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: 130-135
        basis: measured
      - role: object_velocity
        quantity: peg velocity
        value: zero -- `_set_obj_xyz` writes the peg position and zeroes `qvel[9:15]` (sawyer_xyz_env.py:351-361);
          not observed except through `prev_*`, which equal the current frame at reset.
        source:
          path: metaworld/envs/sawyer_peg_insertion_side_v3.py
          lines: '144'
        basis: read
      - role: object_pose
        quantity: second object slot
        value: none -- `_obs_obj_max_len = 14` zero padding for a second object this task does not have;
          all 14 entries (7 current, 7 previous) are exactly 0.0 on every instance.
        fields:
          - object2_x
          - object2_y
          - object2_z
          - object2_qx
          - object2_qy
          - object2_qz
          - object2_qw
          - prev_object2_x
          - prev_object2_y
          - prev_object2_z
          - prev_object2_qx
          - prev_object2_qy
          - prev_object2_qz
          - prev_object2_qw
        source:
          path: metaworld/sawyer_xyz_env.py
          lines: 475-511
        basis: measured
    stochastic_transitions: null
    upstream_divergence: 'Same 50 instances and the same uniform choice over them as Meta-World''s own MT1
      route (`RandomTaskSelectWrapper._set_random_task`: `np_random.choice(len(self.tasks))`, metaworld/wrappers.py:98-100),
      drawn from BIRD''s episode Generator instead of the wrapper''s `np_random`; `env.reset()` is never
      handed a seed (metaworld.py:1762). Against the env class''s own continuous `_random_reset_space` this
      is a 50-point discretisation -- a run never sees a 51st initial condition -- which is the benchmark''s
      protocol, not the adapter''s. Nothing else is added or removed.'
    prompt_states: A Sawyer robot arm stands at a table with a peg lying on it and a box whose near face
      has a horizontal hole in it.
    prompt_field: l_task
    prompt_omits:
      - object_pose
      - goal
  spaces:
    action_fields:
      - name: delta_x
        description: commanded gripper displacement along x, in [-1, 1]; scaled and integrated into
          the mocap target by `set_xyz_action`, so this is a velocity command, not a position
        low: -1.0
        high: 1.0
      - name: delta_y
        description: commanded gripper displacement along y, in [-1, 1]
        low: -1.0
        high: 1.0
      - name: delta_z
        description: commanded gripper displacement along z, in [-1, 1]
        low: -1.0
        high: 1.0
      - name: gripper
        description: gripper command in [-1, 1]; -1 opens, +1 closes
        low: -1.0
        high: 1.0
    obs_dim: 39
    action_dim: 4
    action_low:
    - -1.0
    - -1.0
    - -1.0
    - -1.0
    action_high:
    - 1.0
    - 1.0
    - 1.0
    - 1.0
    action_semantics: '[dx, dy, dz, grip]: mocap-driven — the first three command a change in
      the gripper''s world xyz at action_scale = 0.01 m/step, the fourth is gripper effort (sawyer_xyz_env.py:182,
      320-336).'
description:
  env_prose: 'A Sawyer arm must grasp a peg and insert it sideways into a hole in a box. What is
    scored is the position of the peg''s HEAD, not the point the gripper holds, and lateral error is
    weighted twice as heavily as error along the insertion axis (upstream''s [1, 2, 2] weighting,
    which it says is there to force a lift-then-insert; the hole is a 6 cm square channel through
    the box, 3 cm wider than the 3 cm peg in total -- 1.5 cm of clearance on each side -- not a
    slot). The peg must be picked up first: it cannot be slid in from the table.'
  l_task: A Sawyer robot arm stands at a table with a peg lying on it and a box whose near face has
    a horizontal hole in it. Grasp the peg, carry it to the hole, and insert it sideways, and keep
    it inserted for the rest of the episode. What is scored is where the HEAD of the peg ends up
    rather than the point the gripper holds; the hole is a 6 cm square channel, only 1.5 cm wider
    than the 3 cm peg on each side (3 cm of total clearance), and error across the hole counts
    double against error along the insertion axis. The peg has to be picked up -- it cannot be slid
    in from the table. The arm is commanded by a small Cartesian displacement of the gripper each
    step plus an open/close command for the fingers.
  natural_language: 'A Sawyer arm must grasp a peg and insert it sideways into a hole in a box. What
    is scored is the position of the peg''s HEAD, not the point the gripper holds, and lateral error
    is weighted twice as heavily as error along the insertion axis (upstream''s [1, 2, 2] weighting,
    which it says is there to force a lift-then-insert; the hole is a 6 cm square channel through
    the box, 3 cm wider than the 3 cm peg in total -- 1.5 cm of clearance on each side -- not a
    slot). The peg must be picked up first: it cannot be slid in from the table.'
  scene: A Sawyer arm with a parallel-jaw gripper over a table, mocap-driven; the manipulated
    thing is a peg inserted sideways into a hole. The 39-D observation carries the hand, one object
    pose, the previous frame and the goal.
  success_criterion_prose: 'Complete on any step where the peg HEAD is within 0.07 m of the target
    under an anisotropic norm that doubles lateral (y, z) error: ||(pegHead - target) * [1, 2, 2]||
    <= 0.07. The head is a site 13 cm from the grasp point the observation carries and 2 cm inside
    the peg from its leading tip, and the hole''s mouth is 0.066 m in front of the target on every
    instance, so the check cannot fire with the peg outside the box: with the tip resting on the
    face the head is 0.086 m from the target. It first fires with the tip about 1.6 cm inside the 19
    cm channel (zero lateral error), and at 2 cm of insertion tolerates about 1.2 cm of combined
    lateral error -- a barely-inserted peg counts as fully as a seated one.'
  full_source:
    path: metaworld/envs/sawyer_peg_insertion_side_v3.py
    lines: null
state_surface:
  fields:
  - name: s.obs
    slice: "0:39"
    shape: (39,)
    units: null
    description: 'the raw observation: 18 current-frame entries, the same 18 for the previous
      frame (obs[18:36]), then the goal position (obs[36:39]). Layout verified at sawyer_xyz_env.py:513-527.'
    source: sawyer_xyz_env.py:513-527
  - name: s.hand_pos
    slice: "0:3"
    shape: (3,)
    units: m
    description: 'obs[0:3] = data.body(''hand'').xpos. NOT tcp_center: the tool centre the built-in
      rewards use sits ~4.5 cm below this in z.'
    source: null
  - name: s.gripper_openness
    slice: "3:4"
    shape: scalar
    units: null
    description: obs[3], normalised finger separation in [0, 1].
    source: null
  - name: s.obj_pos
    slice: "4:7"
    shape: (3,)
    units: m
    description: obs[4:7], the manipulated object (handle/button/puck/peg grasp point).
    source: null
  - name: s.obj_quat
    slice: "7:11"
    shape: (4,)
    units: null
    description: 'obs[7:11], object orientation quaternion in scipy (x, y, z, w) order on this task
      -- the scalar part LAST, opposite MuJoCo''s convention. The component order is task-specific;
      see object_qx.'
    source: null
  - name: s.goal_pos
    slice: "36:39"
    shape: (3,)
    units: m
    description: obs[36:39], the goal position.
    source: null
  - name: action
    shape: (4,)
    units: null
    description: 'the action applied this step: [dx, dy, dz, grip]'
    source: null
  helpers:
    - name: hand_pos
      signature: hand_pos(s)
      description: = s[0:3]
      kind: inline_expression
      expression: s[0:3]
    - name: object_pos
      signature: object_pos(s)
      description: = s[4:7]
      kind: inline_expression
      expression: s[4:7]
    - name: object_quat
      signature: object_quat(s)
      description: '= s[7:11]; component order is task-specific (see object_qx): scipy x,y,z,w on reach/push/pick_place/door_open/peg_insert_side, MuJoCo w,x,y,z on drawer_open/button_press_topdown, zeros on drawer_close/window_open/window_close'
      kind: inline_expression
      expression: s[7:11]
    - name: goal_pos
      signature: goal_pos(s)
      description: = s[36:39]
      kind: inline_expression
      expression: s[36:39]
    - name: gripper_opening
      signature: gripper_opening(s)
      description: = s[3], 1.0 open
      kind: inline_expression
      expression: s[3]
    - name: hand_velocity
      signature: hand_velocity(s)
      description: = (s[0:3] - s[18:21]) / 0.0125
      kind: inline_expression
      expression: (s[0:3] - s[18:21]) / 0.0125
    - name: tolerance
      signature: tolerance(x, bounds, margin, sigmoid='long_tail')
      description: 'Meta-World''s shaping kernel: 1.0 inside `bounds`, decaying over `margin`'
      kind: inline_expression
      expression: null
    - name: hamacher_product
      signature: hamacher_product(a, b)
      description: = a*b / (a + b - a*b); Meta-World's soft AND
      kind: inline_expression
      expression: null
  flat_fields:
    - index: 0
      name: hand_x
      description: 'gripper body x, `data.body(''hand'').xpos`. NOTE this is NOT tcp_center: the tool centre
        point used by the built-in rewards sits 4.5 cm below this in z'
    - index: 1
      name: hand_y
      description: gripper body y
    - index: 2
      name: hand_z
      description: gripper body z; the table surface is near z = 0
    - index: 3
      name: gripper_opening
      description: distance between the two claws, normalised to [0, 1]; 1.0 = fully open, 0.0 = fully closed
    - index: 4
      name: object_x
      description: manipulated object x (the handle/button/peg position for the fixture tasks)
    - index: 5
      name: object_y
      description: manipulated object y
    - index: 6
      name: object_z
      description: manipulated object z
    - index: 7
      name: object_qx
      description: 'object orientation quaternion, slot 1 of 4 (the name is a slot label, not a component).
        The component ORDER is per task and is stated in the task''s spec: scipy (x, y, z, w) where the task
        converts a rotation matrix, MuJoCo (w, x, y, z) where it reads the body''s xquat; all four zero on
        the fixture tasks that report none. On the MT10 ten: scipy on reach, push, pick_place, door_open and
        peg_insert_side; MuJoCo on drawer_open and button_press_topdown -- where it is also CONSTANT, (1,
        0, 0, 0) and (0.7074, -0.7068, 0, 0), because those bodies translate on slide joints and never rotate;
        all four components constant zeros on drawer_close, window_open and window_close'
    - index: 8
      name: object_qy
      description: object orientation quaternion, slot 2 of 4 (order per task, see object_qx)
    - index: 9
      name: object_qz
      description: object orientation quaternion, slot 3 of 4 (order per task, see object_qx)
    - index: 10
      name: object_qw
      description: 'object orientation quaternion, slot 4 of 4: the scalar w on the scipy-order tasks, z on
        the MuJoCo-order tasks, 0 where the task reports no orientation'
    - index: 11
      name: object2_x
      description: second object x -- exactly zero (padding) on every MT10 task and on every other task with
        one object; hammer carries the nail here, stick-push and stick-pull the container's insertion point
    - index: 12
      name: object2_y
      description: second object y -- zero padding (always on MT10) except on hammer, stick-push, stick-pull
    - index: 13
      name: object2_z
      description: second object z -- zero padding (always on MT10) except on hammer, stick-push, stick-pull
    - index: 14
      name: object2_qx
      description: second object quaternion, slot 1 of 4 -- zero (always on MT10) except on hammer (the nail
        body's xquat, w, x, y, z)
    - index: 15
      name: object2_qy
      description: second object quaternion, slot 2 of 4 -- zero except on hammer
    - index: 16
      name: object2_qz
      description: second object quaternion, slot 3 of 4 -- zero except on hammer
    - index: 17
      name: object2_qw
      description: second object quaternion, slot 4 of 4 -- zero except on hammer
    - index: 18
      name: prev_hand_x
      description: 'the PREVIOUS step''s hand_x, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 19
      name: prev_hand_y
      description: 'the PREVIOUS step''s hand_y, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 20
      name: prev_hand_z
      description: 'the PREVIOUS step''s hand_z, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 21
      name: prev_gripper_opening
      description: 'the PREVIOUS step''s gripper_opening, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 22
      name: prev_object_x
      description: 'the PREVIOUS step''s object_x, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 23
      name: prev_object_y
      description: 'the PREVIOUS step''s object_y, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 24
      name: prev_object_z
      description: 'the PREVIOUS step''s object_z, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 25
      name: prev_object_qx
      description: 'the PREVIOUS step''s object_qx, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 26
      name: prev_object_qy
      description: 'the PREVIOUS step''s object_qy, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 27
      name: prev_object_qz
      description: 'the PREVIOUS step''s object_qz, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 28
      name: prev_object_qw
      description: 'the PREVIOUS step''s object_qw, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 29
      name: prev_object2_x
      description: 'the PREVIOUS step''s object2_x, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 30
      name: prev_object2_y
      description: 'the PREVIOUS step''s object2_y, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 31
      name: prev_object2_z
      description: 'the PREVIOUS step''s object2_z, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 32
      name: prev_object2_qx
      description: 'the PREVIOUS step''s object2_qx, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 33
      name: prev_object2_qy
      description: 'the PREVIOUS step''s object2_qy, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 34
      name: prev_object2_qz
      description: 'the PREVIOUS step''s object2_qz, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 35
      name: prev_object2_qw
      description: 'the PREVIOUS step''s object2_qw, verbatim. Velocity is not observed: finite-difference
        s[0:18] - s[18:36] and divide by dt = 0.0125'
    - index: 36
      name: goal_x
      description: goal position x for this episode; re-randomised every reset
    - index: 37
      name: goal_y
      description: goal position y
    - index: 38
      name: goal_z
      description: goal position z
  helpers_note: 'The seven-field `s` namespace -- obs, hand_pos, gripper_openness, obj_pos, obj_quat,
    goal_pos, action -- is identical on every MT10 spec, so a consumer that honours one Meta-World spec
    honours them all. `info` is deliberately not part of it even though the trainer passes it: Meta-World''s
    info carries `success`, and `s` reaches the candidate''s reward, so reading it there would put the
    oracle inside the barrier. obs[11:18] (a second object''s pose slots) is exactly zero on every MT10
    task and is deliberately not surfaced. Suite hazard recorded on door_open: `touching_main_object`
    raises on assets without an `objGeom`, so no contact helper is proposed until each task''s geometry
    is read.'
discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    reimplementation:
