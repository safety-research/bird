    - reference_reward
    - gt_reward
    - evaluate_state
    - reward_source
    - _env
  forbidden_symbols_note: 'BIRD''s gate, and it is a different SET from the flat list above rather than
    a superset. Four of these six name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `reward_source`,
    `_env` -- which are not properties of the task at all; they are the routes by which a candidate could
    reach the metric it is scored on IN THIS REPO. Upstream''s list names benchmark symbols, which is
    right for a consumer that calls the benchmark directly.
    
    `success` is DELIBERATELY ABSENT, and the omission is measured rather than an oversight. Meta-World''s
    `info["success"]` is a threshold on the distance between obj (obs[4:7]) and goal (obs[36:39]), both
    of which are IN the observation a generated reward receives -- so an identifier gate is both too strict
    and too weak. Measured: listing it rejected 15 of 15 candidates and no policy was trained, and
    every rejected program''s offence was naming its OWN proxy `success`. A candidate that spells the
    same quantity `hit` passes either way. The defence that does hold is structural: a generated reward
    can influence the POLICY and nothing else, so a candidate that re-derives the check has written a
    SPARSE reward -- a legitimate design point that trains poorly at this tier''s budget and loses on
    its merits.'
  forbidden_symbols:
  - evaluate_state
  - hardened_success
  - touching_main_object
  - info["success"]
judge:
  vlm_legible: true
  legibility_note: >-
    Manipulation stages (approach, engage, move) are readable from frames; the centimetre-scale
    tolerances are not — the distance telemetry carries what frames cannot. Whether the peg ENTERED
    the hole is not readable from the primary camera at all: `corner` sits on the -X side of the
    table and the hole is on the box's +X face, so at every frame of a real insertion the opening is
    behind the block (measured on registry-policy insertions, seeds 0 and 7; a human rater flagged
    the single-view clips as unjudgeable). `hole_face` below is the view that shows it; a judge of
    completion needs it beside `corner`.
  camera:
    name: corner
    mode: fixed
    note: >-
      Meta-World's corner cameras are fixed; the whole workspace stays in frame, so absolute
      progress is visible — no tracking-camera caveat. It looks at the box's closed back: the
      hole faces away from it, so insertion itself is out of view.
  extra_views:
  - name: hole_face
    mode: fixed
    note: >-
      Free camera 0.6 m from the box, 45 degrees off the hole face from the far side of the
      table (azimuth 225, elevation -20), aimed at the box's centre of mass at hole height and
      re-aimed per episode as the box position is randomised. The 6 cm opening is a dark square
      of roughly 64 px at 480 px and the peg's green shaft is visible crossing into it; the
      gripper stays above and left of the face and never covers the opening. Shows whether the
      peg entered the hole, which no fixed corner camera can. The box never moves within an
      episode, so the view is fixed for the clip.
    pose:
      track_body: box
      distance: 0.6
      azimuth: 225
      elevation: -20
  - name: topview
    mode: fixed
    note: >-
      Fixed camera looking straight down at the table. Shows the arm and the objects in the
      table plane: where the gripper is relative to the goal marker and how far the peg has
      travelled. Height above the table is not visible from here, and an object directly under
      the gripper is hidden by the arm. The peg's lateral alignment with the hole and how much
      of it has entered the box both read in this plane; the peg is a thin bar the corner camera
      shows at under two hundred pixels.
  - name: behindGripper
    mode: tracking
    note: >-
      Tracking camera mounted behind and above the gripper, moving with it. A close view of the
      fingers and whatever they touch, for grasp and contact; the scene shifts as the arm moves,
      so it shows no absolute position, and early in an episode it can be filled by the arm's
      own link. Shows whether the peg is held and how it is oriented in the fingers.
  subtasks_sequential: true
  telemetry_fields:
  - peg_head_to_goal_dist
  - obj_speed
