description:
  natural_language: Stand on a board that rests on a LOOSE sphere and keep standing. The sphere can roll
    away underneath, so the support point itself wanders.
  l_task: 'Balance on a board resting on a free-rolling sphere. The robot starts standing on a flat board
    (1.1 m by 0.3 m) laid across a 0.17 m-radius sphere that is itself FREE to roll -- every shift of
    weight moves the support point, and the board can slide off the sphere entirely. Stay upright and
    stay on the board: touching the ground, touching the sphere, or letting the pelvis drop below 0.8
    m all end the episode immediately. Surviving the full 1000 control steps at 50 Hz while standing tall
    is a perfect performance. This is the hard variant of balance_simple, whose sphere is fixed to the
    world.'
  env_prose: 'The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder roll,
    shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators. The
    count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single command
    curls both. Every actuator is a POSITION servo -- the control signal names an angle for that joint
    to move towards, it does not apply a torque directly, and the same numeric command means a different
    angle at different joints because -1 and +1 are the two ends of each actuator''s own range. The pelvis
    is unattached to anything, so the robot is free to translate in all three directions and to rotate
    arbitrarily; it can and does fall over. The robot weighs about 53 kg. The ground is flat, infinite
    and empty -- no obstacle, no target, no scenery. The episode ends early only if the pelvis drops below
    0.2 m.'
