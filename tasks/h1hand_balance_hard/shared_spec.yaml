discrete_success:
  kind: continuous_only
  no_discrete_success_because: 'This task ships no boolean success check: `BalanceBase.get_terminated`
    reports three kinds of FAILURE and never a success, and `success_bar` (800) is a threshold on the
    episode RETURN of the shipped reward, a different quantity.'
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: balance_upright_horizon_fraction
    expr: '(number of arriving states with [ pelvis_z - board_z >= 0.8 AND uprightness >= 0.9 ]) / 1000
      -- the count NORMALISED BY THE FULL HORIZON, not by the states visited, because on this task leaving
      the scoring posture is what ENDS the episode: a robot that balanced for ten steps and fell would
      score ~1.0 on a visited-states mean while failing the task almost entirely. Duration is the task,
      so duration is the denominator. The height gate is relative to the board''s own carried z (s[78]),
      the posture gates are stand''s. Shared with balance_simple by function identity -- upstream shares
      one reward and one terminal between the two, so BIRD shares one metric. bird/envs/humanoid_hand.py::_H1HandBalance.task_metric'
    unit: fraction of the full 1000-step horizon spent standing tall on the board
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.5
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: 'NOT MEASURED: no uniform-random population has been scored on this task, so read any number
      from it as unanchored. A uniform-random policy is expected to score ~0.0: random position targets
      take a 61-DoF humanoid to the floor within a couple of seconds, mean forward displacement stays
      around zero, and the pelvis terminal at 0.2 m ends the episode early.'
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: 'No expert exists in any sense the schema accepts: no scripted policy, no demonstrations,
      and HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None and
      fitness stays RAW, per the absence-is-explicit rule.'
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 244.0
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 38.38
      env_steps: 127360000
      success_bar: 800.0
      success_bar_source: humanoid-bench @ cb11890 (this spec's pinned commit), humanoid_bench/envs/balance.py:13
        (`BalanceBase.success_bar = 800`; `BalanceHard`, :120, declares none of its own).
      source: 'FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_balance_hard
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final point
        of the authors'' released plotting data behind that figure (data/humanoidbench_result.json @ 77922d0
        in younggyoseo/FastTD3, committed 2025-09-21), key h1hand_balance_hard; std is half the released
        band width (return_min/return_max are exactly mean -/+ std).'
      note: A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation point of
        the paper's own training run, not a separately evaluated frozen policy. Below the task's 800 success
        bar. The released log runs past Figure 9's 10,800 s x-limit (final point at 36,090 s / 127.4M
        steps; ~166 at the visible end).
      date: '2026-09-02'
