# h1hand_balance_hard -- HumanoidBench `h1hand-balance_hard-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 2 scene joint(s) and 0 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/balance_hard's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_balance_hard
env:
  env_id: h1hand-balance_hard-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: 'Three ways to end early, all failures: the pelvis drops below 0.8 m; the pivot sphere
      touches anything that is not the floor or the board (a foot on the sphere ends the episode); or
      the floor is touched by anything that is not the sphere -- so stepping off the board onto the ground
      ends the episode, and so does the board itself tipping far enough to touch down. There is no success
      terminal.'
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 936-986
      symbol: _H1HandBase._reset
    rng_note: 'One draw on the stream: `rng.uniform(-0.01, 0.01, size=90)` at line 942. The task defines
      no reset hook, so `_task_reset` is the base identity (970-972).'
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 90 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: object_pose
      quantity: board_keyframe_noise
      fields:
      - s.board_pose
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the free board's seven pose coordinates about
          its keyframe (0, 0, 0.37), identity orientation -- top surface at 0.40 m. Free-body quaternions
          are perturbed componentwise and renormalised by `mj_forward`, so all four components move.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: object_pose
      quantity: sphere_keyframe_noise
      fields:
      - s.sphere_pose
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the free pivot sphere's seven pose coordinates
          about its keyframe at (0, 0, 0.17) -- radius 0.17 m, resting on the ground -- identity orientation.
          Free-body quaternions are perturbed componentwise and renormalised by `mj_forward`, so all four
          components move.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_balance_hard.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: board_velocities
      value: '0 -- the board''s six velocities start at rest: the keyframe carries no qvel and the hook
        writes none.'
      fields:
      - s.board_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: sphere_velocities
      value: '0 -- the sphere''s six velocities start at rest: the keyframe carries no qvel and the hook
        writes none.'
      fields:
      - s.sphere_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: goal
      value: none -- no target; `_H1HandBalance.task_metric` is a duration -- arriving states with the
        pelvis >= 0.8 m above the board's carried z and upright, over the full 1000-step horizon.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2730-2747
        symbol: _H1HandBalance.task_metric
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and `BalanceHard` defines no `reset_model`
      (balance.py); this adapter draws everything from the episode Generator (`_reset`, 941-944), so a
