      commit: null
      sha256: null
    import_path: humanoid_bench.envs.balance:BalanceBase.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: '`small_control * stand_reward * dont_move` -- stand''s reward verbatim, with the head-height
      bound raised by the board''s 0.37 m, IDENTICAL between balance_simple and balance_hard: the two
      variants differ only in whether the sphere has a free joint. NO TERM READS THE BOARD OR THE SPHERE;
      the entire balance content of the task lives in `get_terminated` (lines 62-82), and the hard variant''s
      extra difficulty is entirely a property of the model.'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: A robot on a rocking board reads clearly, and on this variant the sphere visibly creeps
    -- but slowly, so consecutive frames look alike right up until the collapse. Recovering and losing
    balance look identical in one frame.
  camera:
    name: cam_default
    mode: tracking
    note: '`cam_default` is a `mode="trackcom"` camera on the pelvis; the board and sphere sit directly
      underneath and stay in frame.'
  extra_views:
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past. The
      board''s tilt over the pivot reads in profile.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: front
    mode: tracking
    note: 'Camera following the robot''s centre of mass from directly ahead, 3 m away and slightly above:
      a face-on view for left-right symmetry and where the arms are. It moves with the robot, so absolute
      position is not visible. The board''s sideways tilt reads face-on.'
    pose:
      track_body: pelvis
      azimuth: 180
      elevation: -15
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_z
  - board_z
  - sphere_x
  - uprightness
domain_randomization: null
exploits:
- name: vertical_motion_is_unpriced
  mechanism: '`dont_move` reads `center_of_mass_velocity()[[0, 1]]` -- horizontal components only -- so
    bouncing on the board costs the reward nothing as long as the head stays high on average. Stand''s
    entry, inherited with the reward; on a board whose support rolls, the unpriced axis is also the one
    every recovery excites.'
  status: open
  closed_by: null
  note: Arithmetic from the source (the `[[0, 1]]` index is a literal), not observed in a rollout. The metric gates on pelvis height above the BOARD, so every step the pelvis dips is a step lost.
- name: reward_never_reads_the_board
  mechanism: 'No reward term mentions the board or the sphere, so within an episode the reward ranks a
    lucky rigid stand above a skilful recovery that dipped for a moment -- the quantity the task is named
    for is priced only by death. On the hard variant this blindness is total: the one thing that distinguishes
    it from balance_simple (the rolling sphere) appears nowhere in the reward at all.'
  status: open
  closed_by: null
  note: A structural reading of lines 30-60 (the term list is exhaustive), not a rollout observation. Recorded because a candidate reward judged by similarity to this reference is being compared
    against a function that ignores the task's object.
