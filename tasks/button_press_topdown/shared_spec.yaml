symbol_mapping:
  distance_to_goal: np.linalg.norm(s[4:7] - s[36:39])
  object_to_goal: np.linalg.norm(s[4:7] - s[36:39])
  gripper_to_object: np.linalg.norm(s[0:3] - s[4:7])
  gripper_to_goal: np.linalg.norm(s[0:3] - s[36:39])
  hand_position: s[0:3]
  object_position: s[4:7]
  object_orientation: s[7:11]
  object_height: s[6]
  goal_position: s[36:39]
  gripper_open: s[3]
  hand_velocity: ((s[0:3] - s[18:21]) / 0.0125)
  object_velocity: ((s[4:7] - s[22:25]) / 0.0125)
  action_magnitude: np.linalg.norm(a[0:3])
  gripper_action: a[3]
  # the shipped check is on the REMAINING gap |s[38] - s[6]| <= 0.024; the depth pressed is the
  # unpressed gap 0.0935 m (`maxDist`, sawyer_button_press_topdown_v3.py) minus that gap
  gap_to_target_height: np.abs(s[38] - s[6])
  press_depth: np.clip(0.0935 - np.abs(s[38] - s[6]), 0.0, None)
