  forbidden_symbols_note: 'BIRD''s gate, and it is a different SET from the flat list above rather than
    a superset. Four of these six name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `reward_source`,
    `_env` -- which are not properties of the task at all; they are the routes by which a candidate could
    reach the metric it is scored on IN THIS REPO. Upstream''s list names benchmark symbols, which is
    right for a consumer that calls the benchmark directly.

    `success` is DELIBERATELY ABSENT, and the omission is measured rather than an oversight. Meta-World''s
    `info["success"]` is a threshold on the distance between obj (obs[4:7]) and goal (obs[36:39]), both
    of which are IN the observation a generated reward receives -- so an identifier gate is both too strict
    and too weak. Measured: listing it rejected 15 of 15 candidates and no policy was trained, and every
    rejected program''s offence was naming its OWN proxy `success`. A candidate that spells the same quantity
    `hit` passes either way. The defence that does hold is structural: a generated reward can influence
    the POLICY and nothing else, so a candidate that re-derives the check has written a SPARSE reward
    -- a legitimate design point that trains poorly at this tier''s budget and loses on its merits.'
  forbidden_symbols:
  - evaluate_state
  - hardened_success
  - touching_main_object
  - info["success"]
judge:
  vlm_legible: true
  legibility_note: Manipulation stages (approach, engage, move) are readable from frames; the centimetre-scale
    tolerances are not -- the distance telemetry carries what frames cannot.
  camera:
    name: corner
    mode: fixed
    note: Meta-World's corner cameras are fixed; the whole workspace stays in frame, so absolute progress
      is visible — no tracking-camera caveat.
  extra_views:
  - name: topview
    mode: fixed
    note: 'Shows the cube and the hole in the table plane: this IS the success check''s plane, so progress
      reads directly. Height above the table is not visible from here, and an object directly under the
      gripper is hidden by the arm.'
  - name: behindGripper
    mode: tracking
    note: Shows the fingers behind the cube and the cube sliding toward the hole. The scene shifts as
      the arm moves, so this view shows no absolute position, and early in an episode it can be filled
      by the arm's own link.
  subtasks_sequential: true
  telemetry_fields:
  - obj_to_goal_dist_xy
  - obj_height
  - obj_speed
