description:
  env_prose: 'A Franka Panda arm on a small table 0.9 m to the right of a seated wheelchair user faces
    them, holding a toothbrush hanging straight down. The person is a capsule-limbed humanoid of about
    42 kg; the head is a 0.09 m radius sphere on the headrest, the mouth a marked point low on its front
    and no teeth. The brush head is a 12 by 12 by 36 mm box on a thin handle; one long side is the high-friction
    bristle face, its centre the tool''s reference point. The person is passive (no humanoid actuator
    is commanded): the body rests on the chair under gravity, pelvis anchored to the seat, and the head
    sits on a soft neck the brush can push. The brush collides only with the head and the left arm, passing
    through all else; only head contact is measured. Each action is seven numbers in [-1, 1], one per
    Panda joint: a normalised position target for a stiff servo (about pi times the value, clipped to
    the joint range), not a torque. The observation is the whole simulator state then derived fields:
    the human''s root position and quaternion, every hinge angle (human then Panda), every velocity, the
    brush reference point''s position, the brush body''s quaternion, the reference point''s velocity,
    the world-frame contact force the brush applies to the head, the mouth''s position, the brush-to-mouth
    distance, the bristle direction''s cosine with the brush-to-mouth direction, the force the bristle
    face alone applies to the head, and the brush''s speed across the mouth''s surface. Every episode
    starts from one seated keyframe pose with the brush hanging about 0.8 m from the mouth, with small
    random jitter on every position and velocity coordinate of both the human and the arm; the mouth is
    a fixed point on the head and is never re-placed. Control is 125 Hz; an episode is 1000 steps (8 s);
    nothing ends it early. The reward is written in `jax.numpy` and traced with `jax.jit` and `jax.vmap`
    (generate.reward_language: jax).'
  l_task: 'Brush the seated person''s teeth: bring the toothbrush across to their mouth, press its bristle
    face gently against the front of the mouth, and keep the brush moving back and forth over it for as
    much of the episode as you can, without shoving the head about. The arm is commanded by seven joint-position
    targets, one per Panda joint, each a normalised target angle that a stiff position servo tracks rather
    than a torque; the person is passive and will neither help nor turn toward the brush.'
  natural_language: 'A Franka Panda arm on a small table 0.9 m to the right of a seated wheelchair user
    faces them, holding a toothbrush hanging straight down. The person is a capsule-limbed humanoid of
    about 42 kg; the head is a 0.09 m radius sphere on the headrest, the mouth a marked point low on its
    front and no teeth. The brush head is a 12 by 12 by 36 mm box on a thin handle; one long side is the
    high-friction bristle face, its centre the tool''s reference point. The person is passive (no humanoid
    actuator is commanded): the body rests on the chair under gravity, pelvis anchored to the seat, and
    the head sits on a soft neck the brush can push. The brush collides only with the head and the left
    arm, passing through all else; only head contact is measured. Each action is seven numbers in [-1,
    1], one per Panda joint: a normalised position target for a stiff servo (about pi times the value,
    clipped to the joint range), not a torque. The observation is the whole simulator state then derived
    fields: the human''s root position and quaternion, every hinge angle (human then Panda), every velocity,
    the brush reference point''s position, the brush body''s quaternion, the reference point''s velocity,
    the world-frame contact force the brush applies to the head, the mouth''s position, the brush-to-mouth
    distance, the bristle direction''s cosine with the brush-to-mouth direction, the force the bristle
    face alone applies to the head, and the brush''s speed across the mouth''s surface. Every episode
    starts from one seated keyframe pose with the brush hanging about 0.8 m from the mouth, with small
    random jitter on every position and velocity coordinate of both the human and the arm; the mouth is
    a fixed point on the head and is never re-placed. Control is 125 Hz; an episode is 1000 steps (8 s);
    nothing ends it early. The reward is written in `jax.numpy` and traced with `jax.jit` and `jax.vmap`
    (generate.reward_language: jax).'
  scene: A person sits in a wheelchair with their head on the headrest, seen from above and from their
    front-right; a Franka Panda arm stands on a small pedestal table 0.9 m to their right holding a toothbrush
    on a blue mounting block that hangs straight down, and a small green dot low on the front of the plain
    spherical head marks the mouth. The camera re-aims at the person's centre of mass, so the chair, the
    table and the robot share the frame.
  success_criterion_prose: 'brushing_fraction is a check this repository wrote, not a benchmark criterion:
    upstream Assistax ships no success test for this task and reports only the return of its own reward.
    It is the fraction of the episode''s 1000 arriving states on which all three of the following hold
    at once: the brush head''s reference point (the centre of the bristle face) is within 0.03 m of the
    mouth site, the bristle-face plate presses on the head with a contact force of at least 0.1 N (the
    magnitude of the summed plate-to-head contact force in the world frame, friction included), and the
    brush head is moving across the mouth''s surface at 0.01 m/s or faster (the component of the reference
    point''s world-frame velocity perpendicular to the line from the brush head to the mouth). success()
    is this fraction reaching 0.2, a provisional threshold; all three gates are on the same quantities
    upstream''s reward is shaped on (distance, bristle-face force, tangential speed), so the check is
    not independent of that reward the way a benchmark''s success flag would be. A uniform-random policy
    scores exactly 0 over 30 episodes.'
  full_source:
    path: bird/envs/upstream_assistax.py
    lines: null
state_surface:
  fields:
  - name: human_root_pose
    shape: (7,)
    units: m, unit quaternion
    description: the human's root position and orientation (w, x, y, z)
    source: teethbrushing_scene.xml
    slice: 0:7
  - name: human_joint_angles
    shape: (19,)
    units: rad
    description: every humanoid hinge joint angle in model order
    source: teethbrushing_scene.xml
    slice: '7:26'
  - name: robot_joint_angles
    shape: (7,)
    units: rad
    description: the Panda's seven joint angles, joint1..joint7
    source: teethbrushing_scene.xml
    slice: '26:33'
  - name: human_root_velocity
    shape: (6,)
    units: m/s, rad/s
    description: the human's root linear velocity (world frame) then angular velocity (body frame)
    source: teethbrushing_scene.xml
    slice: '33:39'
  - name: joint_velocities
    shape: (26,)
    units: rad/s
    description: every hinge joint velocity in model order (human then Panda)
    source: teethbrushing_scene.xml
    slice: 39:65
  - name: tool_pose_velocity_force
    shape: (13,)
    units: m, unit quaternion, m/s, N
    description: 'tool position (3), tool orientation quaternion (4), tool linear velocity (3), net contact
      force the row''s tool geoms apply to the row''s human geoms (3; the right arm on the arm tasks,
      the head on the head tasks; a range, not a bound: stiff-contact transients can exceed it), world
      frame'
    source: bird/envs/assistax.py::_COMMON_TAIL
    slice: 65:78
  - name: task_fields
    shape: (7,)
    units: m (positions and distance), cosine (bristle_dot_to_mouth), N (tip_force_mag), m/s (brush_tangential_speed)
    description: 'mouth_x: the human''s mouth position x, metres, world frame; mouth_y: the human''s mouth
      position y, metres, world frame; mouth_z: the human''s mouth position z, metres, world frame; dist_tool_mouth:
      distance from the brush-head plate centre (the tool site) to the mouth, metres; bristle_dot_to_mouth:
      cosine between the bristle direction and the direction from the brush head to the mouth: 1 when
      the bristles point at the mouth; tip_force_mag: magnitude of the contact force between the brush''s
      bristle face and the head, newtons (range typical, not a bound); brush_tangential_speed: speed of
      the brush head across the mouth''s surface (the velocity component perpendicular to the head-to-mouth
      direction), m/s'
    source: bird/envs/assistax.py::_TASKS
    slice: 78:85
  helpers:
  - name: tool_position
    signature: tool_position(s)
    description: the tool reference point's position, metres, world frame
    kind: inline_expression
    expression: s[65:68]
  - name: tool_velocity
    signature: tool_velocity(s)
    description: the tool reference point's linear velocity, m/s, world frame
    kind: inline_expression
    expression: s[72:75]
  - name: tool_speed
    signature: tool_speed(s)
    description: the tool reference point's speed, m/s
    kind: inline_expression
    expression: (((s[72:75]) ** 2).sum() ** 0.5)
  - name: tool_force
    signature: tool_force(s)
    description: the net contact force the tool applies to the human, newtons, world frame
    kind: inline_expression
    expression: s[75:78]
  - name: tool_force_magnitude
    signature: tool_force_magnitude(s)
    description: how hard the tool presses on the human, newtons
    kind: inline_expression
    expression: (((s[75:78]) ** 2).sum() ** 0.5)
  - name: goal_position
    signature: goal_position(s)
    description: the mouth position the task is about, metres, world frame
    kind: inline_expression
    expression: s[78:81]
  - name: distance_to_goal
    signature: distance_to_goal(s)
    description: the distance the task's check gates on, metres
    kind: inline_expression
    expression: s[81]
  - name: robot_joint_angles
    signature: robot_joint_angles(s)
    description: the Panda's seven joint angles in actuator order, radians
    kind: inline_expression
    expression: s[[26, 27, 28, 29, 30, 31, 32]]
