judge:
  vlm_legible: true
  legibility_note: 'A seated adult and a Panda at 448x320 from the scene''s `default` camera at (1.3,
    2.1, 1.8), which re-aims at the person''s centre of mass from above and from their front-right, about
    2.7 m from the head: whether the arm has crossed to the face, which side of the head the brush is
    on, whether the head has been pushed sideways or turned on its neck, and (in a clip) whether the brush
    is moving all read from the pixels. The brush head is a 12 mm box -- a pixel or two wide at that distance
    -- and the head is a featureless sphere with a green mouth marker of radius 0.01 m a few pixels across,
    drawn in the same green as the bristle plate, so ''at the mouth'' against ''on the skin beside it''
    cannot be told from pixels, nor can light contact from a near miss, and neither the bristle-face force
    nor the tangential speed is visible in a still. The person also settles about three centimetres into
    the chair over the first two seconds on their own, so early head motion is not evidence of a push.
    The legend prints only the task name: neither the brush-to-mouth distance nor any force is printed,
    so those numbers have no route into a VLM''s verdict beyond the pixels.'
  camera:
    name: default
    mode: tracking
    note: 'the scene''s `default` camera: `targetbodycom` on the humanoid, from (1.3, 2.1, 1.8) -- it
      re-aims at the human''s centre of mass, so the framing follows the human''s slow settling into the
      chair and the Panda''s base stays in frame'
  subtasks_sequential: false
  telemetry_fields:
  - dist_tool_mouth
  - tip_force_mag
  - brush_tangential_speed
  - bristle_dot_to_mouth
  - mouth_z
domain_randomization: null
exploits:
- name: rub_the_chin_or_cheek
  status: open
  closed_by: null
  mechanism: The distance clause is a 0.03 m ball around a single mouth point on a featureless sphere
    of radius 0.09 m, and the model has no teeth, lips or jaw, so pressing the bristle face onto any patch
    of the head inside that ball -- above the mouth marker, beside it or below it -- and sliding it there
    satisfies every clause exactly as brushing the teeth would; nothing in the check distinguishes the
    mouth's surface from the skin around it, and the bristle-direction cosine the observation carries
    is not part of the check.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: dither_in_place
  status: open
  closed_by: null
  mechanism: The speed clause is a floor of 0.01 m/s on the tangential component of the brush reference
    point's instantaneous velocity, read every 8 ms with no requirement on stroke length or reversal,
    so a wrist tremor of under a tenth of a millimetre per control step while the brush stays pressed
    on one spot clears it on every step; a vibrating touch scores a full-episode brush without any stroke.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: drag_the_head_with_the_brush
  status: open
  closed_by: null
  mechanism: 'The speed clause reads the brush''s world-frame velocity, not its motion relative to the
    face, and the passive head rides on a neck whose only restoring torque is a spring well under one
    newton-metre per radian plus light damping, while the bristle face carries a friction coefficient
    of 2: a brush pressed into the face from the person''s right and swept along carries the head with
    it on its neck, so the distance and force clauses hold, the world speed reads as brushing, and bristles
    and skin never slide against each other. Pushing the head around scores as brushing on every step
    it lasts.'
  note: Present in the check this repo wrote, not in a benchmark's.
- name: lean_on_the_face
  status: open
  closed_by: null
  mechanism: The force clause has a floor and no ceiling and the human cannot resist, so once the brush
    is at the mouth and moving, grinding it into the face as hard as the arm can push and shoving the
    head sideways on its neck scores identically to a gentle brush, and a head pinned by the brush is
    easier to keep the distance clause on. Upstream's own force shaping peaks at 1 N and is metrics-only;
    the check has nothing above 0.1 N.
  note: Present in the check this repo wrote, not in a benchmark's.
