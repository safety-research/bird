  - path: bird/envs/toy.py
    lines: null
    what: '`ToyHungryThirsty` -- the observation and action tables, the helper vocabulary, the
      symbol map, the randomisation axes, the horizon and the success threshold, all read off
      the class'
  - path: configs/_default.yaml
    lines: null
    what: the l_task, the forbidden-symbol list and the step budget
  rule: source, not docstrings
  measured:
  - 'Random anchor: n=30 uniform-random episodes through the adapter, 2026-08-25.'
  verified_by: BIRD authors
  date: '2026-08-25'
