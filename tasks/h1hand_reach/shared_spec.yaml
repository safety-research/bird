discrete_success:
  kind: continuous_only
  no_discrete_success_because: 'This task ships no boolean success flag and no terminal: `Reach.get_reward`
    pays a +10 bonus per step while `hand_dist < 0.05` and its info dict reports the distance, but nothing
    emits a success boolean and `get_terminated` is the base class''s constant False. `success_bar` (12000
    -- per-step income over a 1000-step episode, not a one-off) is a threshold on the RETURN, a different
    quantity.'
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: reach_hand_at_target_fraction
    expr: mean over arriving states of [ ||left_hand - target|| <= 0.10 ], both read from the observation
      tail (s[151:154] and s[154:157]). The 0.10 m radius is a stated convention -- roughly the span of
      the Shadow Hand's palm -- and deliberately NOT the reward's own 0.05 bonus radius, which is a shaping
      constant this metric must stay independent of. bird/envs/humanoid_hand.py::H1HandReach.task_metric
    unit: fraction of arriving states with the left hand at the target
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.25
