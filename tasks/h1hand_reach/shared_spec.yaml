# h1hand_reach -- HumanoidBench `h1hand-reach-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 0 scene joint(s) and 6 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/reach's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_reach
env:
  env_id: h1hand-reach-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: false
    autoreset: false
    partial_reset: null
    prompt_states: NOTHING ends this episode early. `Reach` never overrides the base `get_terminated`,
      which is constantly False -- there is no fall terminal and no success terminal, so every episode
      runs its full 1000 steps however the robot ends up, and reaching the target just keeps paying per
      step.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 2606-2612
      symbol: H1HandReach._task_reset
    rng_note: Base `uniform(size=76)` at 942, then `uniform(target_low, target_high)` (size 3) at 2412;
      nothing else touches the stream.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 76 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: goal
      quantity: target
      fields:
      - target_x
      - target_y
      - target_z
      distribution:
        family: uniform
        text: U(-2, 2) x U(-2, 2) x U(0.2, 2.0) m in the world frame -- `task.target_low/high`, set in
          upstream `Reach.__init__` (reach.py:35-36) and restated by the adapter as `_REACH_TARGET_LOW/HIGH`
          (2283-2284). Stored on the task object and carried in the observation tail; constant for the
          episode.
        low:
        - -2.0
        - -2.0
        - 0.2
        high:
        - 2.0
        - 2.0
        - 2.0
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2610-2611
      basis: read
      note: Upstream draws it from the GLOBAL `np.random` (reach.py:82-84).
    - role: agent_pose
      quantity: left_hand_fk
      fields:
      - s.left_hand_pos
      distribution:
        family: derived
        text: 'the left hand''s world position: forward kinematics of the perturbed pelvis pose and arm
          joints, recomputed by the simulator and appended to the observation as upstream''s own `get_obs`
          does (`_extra_state`, 2394-2398). Not a draw of its own.'
      derived_from: robot_keyframe_noise
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2593-2597
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_reach.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and the target from the GLOBAL `np.random`
      (`Reach.reset_model`, reach.py:82-84); this adapter draws everything from the episode Generator
      (`_reset`, 941-944), so a BIRD episode is reproducible from its seed where an upstream one is not.'
    prompt_states: The target is drawn per episode, uniform over x in [-2, 2], y in [-2, 2], z in [0.2,
      2.0]
    prompt_field: l_task
    prompt_omits:
    - agent_pose
  spaces:
    obs_dim: 157
    action_dim: 61
    action_low: -1.0
    action_high: 1.0
    action_semantics: Sixty-one position targets, each in [-1, 1]. -1 and +1 are the two ends of that
