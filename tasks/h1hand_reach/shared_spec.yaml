description:
  natural_language: Move the left hand to a target point in space and keep it there. The target is drawn
    afresh each episode, anywhere from ankle height to above head height.
  l_task: Reach a target point with the LEFT hand and hold it there. The target is drawn per episode,
    uniform over x in [-2, 2], y in [-2, 2], z in [0.2, 2.0] -- it can be at ankle height or above head
    height, ahead or behind -- and is fixed for the whole episode. Only the left hand counts. The episode
    always lasts 1000 control steps at 50 Hz; nothing ends it early, and holding the hand at the target
    keeps scoring, so the task is to get there and stay.
  env_prose: 'The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder roll,
    shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators. The
    count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single command
    curls both. Every actuator is a POSITION servo -- the control signal names an angle for that joint
    to move towards, it does not apply a torque directly, and the same numeric command means a different
    angle at different joints because -1 and +1 are the two ends of each actuator''s own range. The pelvis
    is unattached to anything, so the robot is free to translate in all three directions and to rotate
    arbitrarily; it can and does fall over. The robot weighs about 53 kg. The ground is flat, infinite
    and empty -- no obstacle, no target, no scenery. The episode ends early only if the pelvis drops below
    0.2 m.'
  scene: Flat infinite ground, a standing humanoid with two Shadow Hands, and nothing else -- the target
    is a point, drawn as a small red marker in rendered frames, with no physical presence at all.
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/basic_locomotion_envs.py
    lines: 12-105
state_surface:
  fields:
  - name: s.pelvis_pos
    shape: (3,)
    units: m
    slice: 0:3
    description: World position of the pelvis (the free root body).
  - name: s.pelvis_quat
    shape: (4,)
    units: null
    slice: '3:7'
    description: Pelvis orientation as a unit quaternion in (w, x, y, z) order.
  - name: s.joint_angles
    shape: (69,)
    units: rad
    slice: 7:76
    description: 'All sixty-nine hinge angles: twenty-one body joints then twenty-four in each Shadow
      Hand. Individual names and ranges are in flat_fields.'
  - name: s.pelvis_linvel
    shape: (3,)
    units: m/s
    slice: 76:79
    description: Linear velocity of the pelvis in world axes.
  - name: s.pelvis_angvel
    shape: (3,)
    units: rad/s
    slice: 79:82
    description: Angular velocity of the pelvis. NOTE three numbers where the orientation above is four
      -- that is why the state has 76 positions and 75 velocities.
  - name: s.joint_velocities
    shape: (69,)
    units: rad/s
    slice: 82:151
    description: The sixty-nine hinge velocities, in the same order as the angles.
  - name: s.left_hand_pos
    shape: (3,)
    units: m
    slice: 151:154
    description: 'The left hand''s world position -- upstream''s own get_obs appends it, so BIRD''s observation
      does too. DERIVED state: it is forward kinematics of the qpos block, recomputed by the simulator
      every step, and restoring it is meaningless -- unlike the target below, it carries no information
      the rest of the state lacks. It rides along because a reward for a reaching task should not need
      to do forward kinematics to know where the hand is.'
  - name: s.target_pos
    shape: (3,)
    units: m
    slice: 154:157
    description: 'The target the left hand is meant to reach, drawn afresh each episode from x, y ~ U(-2,
      2), z ~ U(0.2, 2.0) and constant thereafter. NOT simulator state: it lives on the task object and
      the adapter carries it in the observation so a stateless step stays a function of its arguments.'
  helpers:
  - name: pelvis_pos
    signature: pelvis_pos(s)
    description: = s[0:3], the robot's root position in metres
    kind: inline_expression
    expression: s[0:3]
  - name: pelvis_height
    signature: pelvis_height(s)
    description: = s[2], about 0.98 when standing
    kind: inline_expression
    expression: s[2]
  - name: uprightness
    signature: uprightness(s)
    description: '= 1 - 2*(s[4]**2 + s[5]**2), the world-z component of the pelvis''s own z axis: +1 upright,
      0 horizontal, -1 upside-down'
    kind: inline_expression
    expression: 1 - 2*(s[4]**2 + s[5]**2)
  - name: joint_angles
    signature: joint_angles(s)
    description: = s[7:76], all sixty-nine hinge angles
    kind: inline_expression
    expression: s[7:76]
  - name: control_cost
    signature: control_cost(a)
    description: = np.sum(np.square(a)), a measure of commanded effort
    kind: inline_expression
    expression: np.sum(np.square(a))
  - name: pelvis_linvel
    signature: pelvis_linvel(s)
    description: = s[76:79], the pelvis's linear velocity in m/s
    kind: inline_expression
    expression: s[76:79]
  - name: forward_velocity
    signature: forward_velocity(s)
    description: = s[76], the pelvis's forward (+x) velocity in m/s
    kind: inline_expression
    expression: s[76]
  - name: joint_velocities
    signature: joint_velocities(s)
    description: = s[82:151], the sixty-nine hinge velocities in rad/s
    kind: inline_expression
    expression: s[82:151]
  - name: left_hand
    signature: left_hand(s)
    description: = s[151:154], the left hand's world position in metres
    kind: inline_expression
    expression: s[151:154]
  - name: target
    signature: target(s)
    description: = s[154:157], this episode's target point in metres
    kind: inline_expression
    expression: s[154:157]
  - name: hand_target_distance
    signature: hand_target_distance(s)
    description: = np.linalg.norm(s[151:154] - s[154:157]), how far the reaching hand is from the target
    kind: inline_expression
    expression: np.linalg.norm(s[151:154] - s[154:157])
