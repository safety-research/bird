reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/reach.py
      lines: 60-80
      symbol: Reach.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: f8dfc62b7af7bafe216e20ea718f267ab8d73203e3592c9782fe6097430baf2c
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.reach:Reach.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: 'ADDITIVE, unlike every kernel-product locomotion reward in this family: `healthy_reward -
      0.0001 * motion_penalty + reward_close + reward_success`, where `healthy_reward = xmat[1, -1] *
      5` (torso uprightness scaled to [-5, 5]), `reward_close` is a flat +5 per step while the hand is
      within 1 m, and `reward_success` a flat +10 per step within 0.05 m. No term is bounded to [0, 1]
      and the motion penalty is unbounded below, so this reward''s codomain is unlike the rest of the
      tier''s.'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: 'The target is drawn as a 5 cm marker through the viewer, which the adapter reproduces
    inside its own render path (push''s `_pre_render` precedent) -- without that a frame would show a
    robot gesturing at nothing. Whether a 5 cm marker survives 448x320 at the tracking camera''s distance
    is UNMEASURED: no frame has been rendered. Hand-to-marker proximity in three dimensions is hard to
    read from one viewpoint; depth error is invisible.'
  camera:
    name: cam_default
    mode: tracking
    note: '`cam_default` is a `mode="trackcom"` camera on the pelvis. The marker can be up to ~2.8 m from
      the robot''s centre, so early-episode frames may show robot or marker poorly.'
  extra_views:
  - name: hands
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 1.8 m directly ahead, looking slightly down:
      the torso, both arms and both hands fill the frame, at four times the pixels the default camera
      gives the hands. Anything above head height or below the knees is out of frame, and nothing about
      where the robot is. Shows the left hand and the target point it must reach, at close range.'
    pose:
      track_body: pelvis
      azimuth: 180
      elevation: -20
      distance: 1.8
  - name: cam_hand_visible
    mode: tracking
    note: 'Camera following the pelvis from behind the robot''s left shoulder, close and low: the hands
      and whatever is in front of them fill the frame, with the robot at about three times the pixels
      the default camera gives it. Where the robot is in the room is not visible from here.'
  subtasks_sequential: false
  telemetry_fields:
  - hand_target_distance
  - pelvis_z
  - uprightness
domain_randomization: null
exploits:
- name: proximity_income_without_touching
  mechanism: '`reward_close` pays a flat +5 per step anywhere within 1 METRE of the target and `healthy_reward`
    up to +5 per step for standing upright, so a robot that walks near the target and stands with an arm
    vaguely extended collects ~10 per step -- 10,000 over the episode, against a success_bar of 12,000
    -- while never coming within the 0.05 m radius. The dense shaping is five orders of magnitude larger
    than the motion penalty that is supposed to discourage loitering.'
  status: open
  closed_by: null
  note: Arithmetic from the source, not observed in a rollout. BIRD's metric pays nothing
    outside 0.10 m, so the loiterer reads 0.0 here and ~0.8 of the bar to the reward.
- name: upright_income_for_existing
  mechanism: '`healthy_reward = xmat[1, -1] * 5` pays up to +5 per step for torso uprightness alone, with
    no connection to the hand or the target -- a robot that ignores the task and simply stands still collects
    ~5,000 over the episode, and nothing ever terminates it. Income for existing, at the same order as
    the task''s own success income.'
  status: open
  closed_by: null
  note: Arithmetic from the source, not observed in a rollout. Standing still reads exactly
    0.0 on BIRD's metric unless the target happens to be drawn inside the resting hand's 0.10 m ball,
    which has probability under 0.1%.
