description:
  natural_language: 'Tidy a bookshelf to order: five of the twelve loose objects on it, chosen afresh
    each episode, must each be moved to its own drawn spot -- one at a time, in the given order.'
  l_task: Rearrange objects on a bookshelf, one at a time, in a prescribed order. The shelf ahead holds
    twelve loose objects (five upright books, a flat book, a thick book, a trophy, a soda can, a chalk
    stick, a snow globe and a pair of headphones). Each episode picks FIVE of them at random and assigns
    each a target spot from a shuffled list of five shelf positions; the current object and its target
    are the task's state, and only the current one counts -- moving a later object early earns nothing
    until its turn. Placing the current object within 0.15 m of its spot advances to the next. Placing
    all five ends the episode as a success; dropping the current object below 0.5 m, or collapsing, ends
    it as a failure. Up to 1000 control steps at 50 Hz.
  env_prose: 'The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder roll,
    shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators. The
    count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single command
    curls both. Every actuator is a POSITION servo -- the control signal names an angle for that joint
    to move towards, it does not apply a torque directly, and the same numeric command means a different
    angle at different joints because -1 and +1 are the two ends of each actuator''s own range. The pelvis
    is unattached to anything, so the robot is free to translate in all three directions and to rotate
    arbitrarily; it can and does fall over. The robot weighs about 53 kg. The ground is flat, infinite
    and empty -- no obstacle, no target, no scenery. The episode ends early only if the pelvis drops below
    0.2 m.'
  scene: 'Flat ground and a two-tier bookshelf at x = 0.95: an upper shelf at 1.25 m holding five upright
    books, a flat book and a soda can, and a lower shelf at 0.65 m holding a trophy, a thick book, chalk
    and a snow globe, with headphones draped at 1.58 m. All twelve are free bodies. Five translucent colour-coded
    ghosts mark the chosen objects'' target spots, tinted from pink to dark red in placement order.'
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/basic_locomotion_envs.py
    lines: 13-254
