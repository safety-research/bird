reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/bookshelf.py
      lines: 128-188
      symbol: BookshelfBase.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 7abd58f56702bed99c71b6a0699934c4f88af4e7bbac703f93431d689e074f36
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.bookshelf:BookshelfBase.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: '`0.2 * (stand_reward * small_control) + 0.4 * tolerance(obj_goal_dist, bounds=(0, 0.15), margin=1)
      + 0.4 * exp(-min(hand-to-object distance))`, plus a one-off `+100 * index` on each placement. Everything
      is measured against the CURRENT object only -- `bookshelf_objects[task_index]` -- and that list,
      the shuffled goals and the counter all live on the task object in Python, which is why this adapter
      carries a 21-slot observation tail. `BookshelfHard` is `fixed = False`: the base class with the
      choice and permutation actually drawn.'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: The colour-coded ghost markers are real model geometry (translucent twins at the target
    spots, tinted in placement order), so unlike most of the tier the OBJECTIVE is visible in a frame
    -- but which object is CURRENT is a counter with no marker, the twelve objects are small at shelf
    distance, and occlusion by the shelf boards is constant. Expect a judge to read tidiness, not order.
  camera:
    name: cam_hand_visible
    mode: tracking
    note: '`cam_hand_visible` is the task''s own camera, framing the hands and the shelf face.'
  extra_views:
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past. An
      object carried from the table to the shelf reads as displacement in profile.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: overhead
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 4 m directly above: the robot and everything
      within about two metres of it seen in plan, for where it is relative to nearby objects and which
      way it is heading. Height and posture do not read from here.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  subtasks_sequential: false
  telemetry_fields:
  - bookshelf_stage
  - pelvis_z
domain_randomization: null
exploits:
- name: hover_hand_income
  mechanism: '`0.4 * exp(-min(left_hand_dist, right_hand_dist))` pays per step for a hand being NEAR the
    current object, moving nothing -- a robot that parks a palm against the current book collects ~0.4
    per step for the whole episode, on top of the 0.2 posture floor and whatever the proximity term pays
    at spawn. Waiting out the episode beside the shelf clears several hundred return without one placement.'
  status: open
  closed_by: null
  note: Arithmetic from the source, not observed in a rollout. The metric counts completed
    placements only, so the hoverer reads exactly 0.0.
- name: proximity_term_is_partly_prepaid
  mechanism: '`tolerance(obj_goal_dist, bounds=(0, 0.15), margin=1)` pays partial credit from a metre
    out, and the shelf is compact: the chosen object typically SPAWNS 0.3-1.2 m from its drawn goal, so
    a fraction of the 0.4-weighted term is paid at reset for free, before any behaviour. How large a fraction
    depends on the episode''s draw, which also makes raw returns incomparable across episodes.'
  status: open
  closed_by: null
  note: Geometry from the keyframe (object spawns) against the five goal positions in reset_model, not
    observed in a rollout. The metric pays nothing short of the 0.15 m radius.
- name: fly_through_placement
  mechanism: 'The 0.15 m advance test is instantaneous on the object''s centre -- an object thrown through
    its target volume banks the +100*k and the counter moves on while the object lands on the floor. Dropping
    a PLACED object afterwards is also free: only the current object''s height is guarded by the terminal.'
  status: open
  closed_by: null
  note: 'Arithmetic from the source, not observed in a rollout. The metric''s advance test
    is upstream''s own (task structure, the same argument push makes for its terminal radius), so a fly-through
    advances the metric too: the honest reading is that the TASK accepts a throw, and the disagreement
    to watch is placed-then- knocked-off, which the counter keeps and a tidiness reading would not.'
