# h1hand_bookshelf_hard -- HumanoidBench `h1hand-bookshelf_hard-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 12 scene joint(s) and 21 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/bookshelf_hard's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_bookshelf_hard
env:
  env_id: h1hand-bookshelf_hard-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: 'Three ways to end early: the pelvis drops below 0.58 m (a fall); the CURRENT object
      -- the one the reward is asking about -- falls below 0.5 m (dropping the workpiece); or all five
      placements are done, which is the success terminal.'
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 3221-3233
      symbol: H1HandBookshelfHard._task_reset
    rng_note: Base `uniform(size=160)` at 942, then `permutation` of the five spots (2974), then `choice`
      of five ids without replacement (2975-2976) -- upstream's order (bookshelf.py:213, 218). The ghost
      markers' positions and tints are a function of those two draws (`_paint_targets`, 2945-2963), not
      draws of their own.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 160 position
          coordinates (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`,
          line 968, upstream''s `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed
          componentwise and then renormalised by `set_state`''s `mj_forward`, so all four move. No literal
          box: keyframe plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: object_pose
      quantity: shelf_objects_noise
      fields:
      - s.book_a_pose
      - s.book_b_pose
      - s.book_c_pose
      - s.book_d_pose
      - s.book_e_pose
      - s.trophy_pose
      - s.book_flat_pose
      - s.soda_can_pose
      - s.book_thick_pose
      - s.chalk_pose
      - s.snow_globe_pose
      - s.headphone_pose
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to all twelve loose objects' seven pose coordinates
          each, about their keyframe shelf positions, chosen or not. Free-body quaternions are perturbed
          componentwise and renormalised by `mj_forward`, so all four components move.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Ten of the twelve object quaternions are written `0 0 0 0` in the keyframe text of `h1hand_pos_bookshelf_hard.xml`
        (all but `book_flat` and `headphone`). MuJoCo''s compiler normalises them to the identity in `model.key_qpos`
        (checked under mujoco 3.1.6, the adapter''s pin, in a throwaway venv: the compiled keyframe reads
        1 0 0 0), so `_init_qpos` (line 816) holds the identity and the jitter is about it -- not a random
        direction on the 3-sphere, which is what adding noise to a literal zero quaternion and normalising
        would give.'
    - role: scene_selection
      quantity: chosen_objects
      fields:
      - s.task_objects
      distribution:
        family: other
        text: '5 of the 12 signed body indices [-24, -13] drawn WITHOUT replacement, kept in draw order
          (an ordered 5-subset: 12!/7! = 95,040 equiprobable outcomes); index i names the free body whose
          qpos block starts at 76 + 7(i + 24). Upstream: `np.random.choice(np.arange(-24, -12), 5, replace=False)`,
          bookshelf.py:218-220. Carried in the tail; the counter walks it.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3226-3227
      basis: read
    - role: goal
      quantity: placement_order
      fields:
      - s.placement_goals
      distribution:
        family: permutation
        text: 'the five fixed spots `_BOOKSHELF_GOALS` (2860-2861) in a uniformly random order (120 equiprobable
          orders); slot k is the k-th chosen object''s target, so every one of the 15 tail entries moves
          while the SET of spots never does. Upstream: `np.random.permutation(self.placement_goals)`,
          bookshelf.py:213.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: '3225'
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_bookshelf_hard.xml` declares `qpos` only, so
        MuJoCo's `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: shelf_object_velocities
      value: '0 -- all twelve objects'' six velocities each start at rest: the keyframe carries no qvel
        and the hook writes none.'
      fields:
      - s.book_a_vel
      - s.book_b_vel
      - s.book_c_vel
      - s.book_d_vel
      - s.book_e_vel
      - s.trophy_vel
      - s.book_flat_vel
      - s.soda_can_vel
      - s.book_thick_vel
      - s.chalk_vel
      - s.snow_globe_vel
      - s.headphone_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: bookshelf_stage
      value: 0 -- the placement counter starts at the first chosen object. Carried in the tail.
      fields:
      - bookshelf_stage
      source:
        path: bird/envs/humanoid_hand.py
        lines: '3229'
      basis: read
    - role: goal
      quantity: spot_coordinates
      value: fixed -- the five spots are (0.75, -0.25, 1.55), (0.8, 0.05, 0.95), (0.8, -0.25, 0.95), (0.85,
        0.05, 0.35), (0.85, -0.25, 0.35) m every episode; only their assignment to the chosen objects
        is drawn (the `placement_order` draw).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3100-3101
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'DISTRIBUTION differs, not only the RNG: `HumanoidEnv.__init__` (`env.py:206-209`)
      forces `randomness = 0` when the task is BookshelfHard (or BookshelfSimple/Kitchen/Cube), so upstream
      applies NO keyframe perturbation here -- robot and all twelve objects start at the keyframe exactly.
      This adapter''s class-level `_randomness = 0.01` (968, overridden only by HighBar) applies the +/-0.01
      jitter anyway, to all 160 qpos entries, so BIRD''s initial distribution is wider than upstream''s.
      Separately, upstream draws the spot permutation and the object choice from the GLOBAL `np.random`
      (`BookshelfBase.reset_model`, bookshelf.py:202-221); the adapter draws from the episode Generator.
      Dressing (ghost-marker positions and order tints) is replayed from the draw on both sides.'
    prompt_states: Each episode picks FIVE of them at random and assigns each a target spot from a shuffled
      list of five shelf positions
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
