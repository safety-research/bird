discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    expr: task_index == 5 -- the reward's own placement counter having advanced past all five objects.
      The same counter is the `success` key in the info dict and one of the three clauses of BookshelfBase.get_terminated.
    provenance:
      path: humanoid_bench/envs/bookshelf.py
      lines: 128-200
      symbol: BookshelfBase.get_reward / BookshelfBase.get_terminated
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 7abd58f56702bed99c71b6a0699934c4f88af4e7bbac703f93431d689e074f36
    sound: false
    unsoundness: 'The 0.15 m placement test is instantaneous on the object''s centre with no settledness
      conjunct: an object THROWN through its target volume advances the counter in transit (push''s fly-through,
      recorded there too), and with five advances chained, five lucky arcs are formally a success while
      every object ends on the floor.'
    reimplementation:
      repo: bird
      module: bird.envs.humanoid_hand
      symbol: H1HandBookshelfHard._success_flag
      verified_against: 'Source-read transcription: the carried placement counter (s[307]) at its terminal
        value 5 -- the same counter upstream''s get_terminated reads; the adapter advances it with upstream''s
        OWN get_reward on the restored state, so the flag cannot drift from the code it mirrors. NOT resolved
        by name from this file; recorded so the artifact names where the check lives.'
  hardened:
    module: null
    symbol: hardened_success
    status: pending
    tightened: null
    added_conjuncts: null
    not_tightened_because: null
    pending_plan: 'PLAN, not an implemented oracle: add a settledness conjunct per placement (object linear
      speed below a threshold while inside the 0.15 m radius) -- the same conjunct the push spec plans
      for the same fly-through defect -- and consider a stays-placed conjunct, since upstream''s counter
      keeps a placement whose object is later knocked to the floor.'
    conservatism: 'A per-step counter cannot express "the robot did the placing": an object that slides
      into its spot off a collision counts the same as one set down deliberately, and one placed then
      knocked away stays counted.'
    invariant: hardened <= shipped
continuous_success:
  raw:
    name: bookshelf_placements_fraction
    expr: '(placements completed, in order) / 5, recomputed from the states: the five chosen object ids
      and their goals ride in the observation tail (s[308:313], s[313:328]), each id naming a free body
      whose position is at qpos[76 + 7k : 76 + 7k + 3] for k = id + 24, and the counter advances when
      the CURRENT object''s centre comes within 0.15 m of its goal -- upstream''s own advance radius,
      task structure since the counter''s terminal value is the success terminal. bird/envs/humanoid_hand.py::H1HandBookshelfHard.task_metric'
    unit: fraction of the five ordered placements completed
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.2
