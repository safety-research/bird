# AUTHORED FOR BIRD. This environment is implemented in this repo rather than
# vendored from a benchmark, so this spec has no upstream counterpart
# -- but the same rules apply as everywhere else in the catalogue: absence is explicit, and every claim came
# off the adapter or a config rather than a docstring.
schema_version: 1
id: toy_gridworld
env:
  env_id: toy_gridworld
  library:
    name: bird
    version_verified: in-repo
    commit: null
    stack:
      numpy: '>=1.24'
      python: '>=3.10'
  horizon: 30
  control_hz: null
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: The episode ends early if the agent steps into lava; otherwise it runs the
      full 30 steps.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/toy.py
      symbol: ToyGridworld._reset
      lines: 297-305
    rng_note: 'Rejection loop: two `rng.integers(6)` per attempt (x then y), repeated until the cell is
      neither lava nor the goal, so the number of draws consumed varies per episode (acceptance 31/36 per
      attempt). `_sample_dr` consumes nothing first at nominal DR (bird/envs/base.py:682-686).'
    draws:
    - role: agent_pose
      quantity: start_cell
      fields:
      - x
      - y
      distribution:
        family: uniform
        text: 'uniform over the 31 cells of the 6x6 grid that are neither lava ((1,1), (2,2), (3,3), (4,4))
          nor the goal (5,5): x, y ~ integers(6) each, rejected and redrawn otherwise. Not a box, so no
          low/high.'
        low: null
        high: null
      source:
        path: bird/envs/toy.py
        lines: 301-305
      basis: measured
      note: 5000 seeded resets hit exactly 31 distinct cells, none of them lava or the goal, with per-cell
        counts 130-181 against 161 expected; reset(default_rng(3)) twice is bitwise-equal.
    constants:
    - role: goal
      quantity: goal_cell
      value: (5, 5), the far corner (`goal_cell`), fixed for every episode and written into the observation
        at every step; task_metric is 1.0 iff the LAST state is this cell.
      fields:
      - goal_x
      - goal_y
      source:
        path: bird/envs/toy.py
        lines: '274'
      basis: measured
      note: Written by `_obs` at toy.py:293-294; task_metric at toy.py:331-337. Constant across 24 seeded
        resets.
    - role: agent_pose
      quantity: on_hazard_flag
      value: 0.0 -- the rejection loop never starts the agent in lava, so the hazard indicator is 0 at every
        reset.
      fields:
      - on_hazard
      source:
        path: bird/envs/toy.py
        lines: '304'
        symbol: ToyGridworld._reset
      basis: measured
      note: A function of the start cell, filed under agent_pose for that reason. 0.0 across 5000 seeded
        resets.
    stochastic_transitions: null
    upstream_divergence: null
    prompt_states: The agent starts on a random safe cell and must reach the goal at (5, 5).
    prompt_field: env_prose
    prompt_omits: []
    note: 'Deterministic at nominal DR only: `_step` (toy.py:311-315) draws `self._rng.random()` for
      sticky_prob and for slip_prob (plus `integers(4)` on a slip) when either is > 0; both are nominal
      0.0, so the per-step draws exist only under domain randomisation.'
  spaces:
    obs_dim: 5
    action_dim: 1
    action_low:
    - 0.0
    action_high:
    - 3.0
    action_semantics: 'move: 0 = +y (north), 1 = -y (south), 2 = +x (east), 3 = -x (west)'
    action_fields:
    - name: move
      description: 0 = +y (north), 1 = -y (south), 2 = +x (east), 3 = -x (west)
      low: 0.0
      high: 3.0
description:
  env_prose: 'A 6x6 grid. The agent starts on a random safe cell and must reach the goal at (5,
    5). Cells (1,1), (2,2), (3,3) and (4,4) are lava: entering one ends the episode immediately
    and the task is failed. Reaching the goal ends the episode successfully. Otherwise the episode
    runs for 30 steps. Moving off the edge of the grid leaves the agent where it is.'
  l_task: A 6x6 grid.
  natural_language: 'A 6x6 grid. The agent starts on a random safe cell and must reach the goal
    at (5, 5). Cells (1,1), (2,2), (3,3) and (4,4) are lava: entering one ends the episode immediately
    and the task is failed. Reaching the goal ends the episode successfully. Otherwise the episode
    runs for 30 steps. Moving off the edge of the grid leaves the agent where it is.'
  scene: A 6x6 grid with a goal at (5, 5) and a ridge of lava cells between the start region and
    the goal. Discrete states and actions; the discretisation is exact.
  success_criterion_prose: null
  full_source:
    path: bird/envs/toy.py
    lines: null
state_surface:
  fields:
  - name: x
    shape: scalar
    units: null
    description: agent column, integer 0..5
    source: null
    slice: 0:1
  - name: y
    shape: scalar
    units: null
    description: agent row, integer 0..5
    source: null
    slice: '1:2'
  - name: goal_x
    shape: scalar
    units: null
    description: goal column (always 5)
    source: null
    slice: '2:3'
  - name: goal_y
    shape: scalar
    units: null
    description: goal row (always 5)
    source: null
    slice: '3:4'
  - name: on_hazard
    shape: scalar
    units: null
    description: 1.0 if the agent is standing in lava, else 0.0
    source: null
    slice: '4:5'
  helpers:
  - name: manhattan_to_goal
    signature: manhattan_to_goal(s)
    description: '|x - goal_x| + |y - goal_y|'
    kind: inline_expression
    expression: null
  - name: is_hazard
    signature: is_hazard(x, y)
    description: True when (x, y) is one of the four lava cells
    kind: inline_expression
    expression: null
  - name: at_goal
    signature: at_goal(s)
    description: True when the agent stands on the goal cell
    kind: inline_expression
    expression: null
  helpers_note: 'Advertised as inlineable EXPRESSIONS and deliberately not implemented as methods:
    verification binds a proxy `self` and training binds `self=None`, so a helper that existed
    would let a `self.x(s)` candidate pass the gate and then die in training -- a wasted policy
    run charged to the reward that did not cause it.'
  flat_fields:
  - index: 0
    name: x
    description: agent column, integer 0..5
  - index: 1
    name: y
    description: agent row, integer 0..5
  - index: 2
    name: goal_x
    description: goal column (always 5)
  - index: 3
    name: goal_y
    description: goal row (always 5)
  - index: 4
    name: on_hazard
    description: 1.0 if the agent is standing in lava, else 0.0
discrete_success:
  kind: native_authored
  no_discrete_success_because: This env is authored end to end in this repo, so the repo IS the vendor
    and `EnvAdapter.success()` here (a threshold on this repo's own task_metric) IS the native success
    -- there is no separate vendor-shipped block to record (shipped and hardened null). `kind` is `native_authored`
    to mark exactly this under the native-signal rule -- a repo-owned env whose own success check counts
    as native_success.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: at_goal_fraction
    expr: fraction of the episode's arriving states on the goal cell
    unit: fraction of steps
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: 'identity -- the raw metric is already a fraction of steps and therefore already
      in [0, 1]. `method: anchors` would need an expert anchor this environment cannot have.'
    success_threshold: 0.5
anchors:
  scripted:
    value: 1.0
    method: scripted_policy
    policy_id: simple_suite/toy_gridworld_bfs
    status: solved
    unit: bird_task_metric
    reduction: per_step_fraction
    n_seeds: 25
    n_episodes: 25
    reason: null
    date: '2026-09-03'
    source: 'REGISTRY 2026-09-04: policies/simple_suite/policies.yaml entry `simple_suite/toy_gridworld_bfs`
      (status solved), score 1.0 bird_task_metric under per_step_fraction, n=25, verified through bird_adapter.
      The manifest is the primary record. n_episodes equals n_seeds: one episode per seed, as the registry
      counts them.'
  reduction: per_step_fraction
  by_reduction:
    per_step_fraction:
      random:
        value: 0.0
        method: random_policy
        source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, `scripts/measure_anchors.py
          --env toy_gridworld --n 30`, seed 0.'
        n_seeds: 30
        n_episodes: 30
        reason: null
        date: '2026-08-25'
      expert:
        value: null
        method: unavailable
        source: null
        n_seeds: null
        n_episodes: null
        reason: No scripted expert exists for this environment. It is implemented in this repo
          and ships no reference policy, and inventing a ceiling would make every `human_normalised`
          number on it a ratio against a number nobody measured. Recorded as absent so `baselines_of`
          returns None and `_normalise_pool` leaves fitness raw.
        date: null
  random:
    value: 0.0
    method: random_policy
    source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, seed 0.
      See anchors.by_reduction.'
    n_seeds: 30
    n_episodes: 30
    reason: null
    date: '2026-08-25'
  expert:
    value: null
    method: unavailable
    source: null
    n_seeds: null
    n_episodes: null
    reason: No scripted expert exists for this environment. It is implemented in this repo and
      ships no reference policy, and inventing a ceiling would make every `human_normalised` number
      on it a ratio against a number nobody measured. Recorded as absent so `baselines_of` returns
      None and `_normalise_pool` leaves fitness raw.
    date: null
budget:
  train_steps: 2000
  learning_verified:
    verified: false
    reward_used: none
    algo: null
    seeds: null
    result: Not established as a floor by a dedicated sweep.
    date: null
  saturates_at: null
reward:
  human:
    kind: tuned_dense
    scope: value_determining
    reference:
      path: bird/envs/toy.py
      lines: null
      symbol: ToyGridworld.reference_reward
      commit: null
      sha256: null
    depends_on: []
    import_path: bird.envs.toy:ToyGridworld.reference_reward
    verified_against: This repo at the commit that ran. The environment is implemented here, so there
      is no external library to pin -- what pins it is the repository version (tag or commit) a sweep
      is launched from.
    notes: 'Written for this repo, and written so that reward hacking is EXPRESSIBLE: the lava
      cells are terminal and a reward that prices them wrongly produces a policy that ends the
      episode early.'
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    - math
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, over the FLAT observation array. There is no `self` and no env
      handle: the compiler binds arguments by name and maps `self`/`env` to None deliberately.'
    reward_utils: []
  forbidden_symbols: []
judge:
  vlm_legible: false
  legibility_note: No renderer.
  camera:
    name: none
    mode: fixed
    note: 'No camera: frames are rasterised in pure numpy where a renderer exists at all.'
  subtasks_sequential: false
  telemetry_fields:
  - cell
  - on_lava
domain_randomization:
  parameters:
    slip_prob:
    - 0.0
    - 0.4
    sticky_prob:
    - 0.0
    - 0.4
  nominal:
    slip_prob: 0.0
    sticky_prob: 0.0
exploits:
- name: terminate_on_lava
  status: open
  closed_by: null
  mechanism: Stepping into lava ends the episode. A reward with any per-step cost and no lava
    penalty is maximised by ending the episode as fast as possible.
  note: Deliberate. This env exists partly to make that failure reachable in a test that runs
    in a second.
symbol_mapping:
  agent_position: s[0:2]
  goal_position: s[2:4]
  on_hazard: s[4]
  distance_to_goal: np.abs(s[0:2] - s[2:4]).sum()
provenance:
  authored_from:
  - path: bird/envs/toy.py
    lines: null
    what: '`ToyGridworld` -- the observation and action tables, the helper vocabulary, the symbol
      map, the randomisation axes, the horizon and the success threshold, all read off the class'
  - path: configs/_default.yaml
    lines: null
    what: the l_task, the forbidden-symbol list and the step budget
  rule: source, not docstrings
  measured:
  - 'Random anchor: n=30 uniform-random episodes through the adapter, 2026-08-25.'
  verified_by: BIRD authors
  date: '2026-08-25'
