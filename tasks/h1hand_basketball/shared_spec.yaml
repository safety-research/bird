      names and ranges are in flat_fields.
  - name: s.ball_pose
    shape: (7,)
    units: mixed
    slice: 76:83
    description: 'Free-body pose of the basketball: three world positions then a (w, x, y, z) quaternion.'
  - name: s.pelvis_linvel
    shape: (3,)
    units: m/s
    slice: 83:86
    description: Linear velocity of the pelvis in world axes.
  - name: s.pelvis_angvel
    shape: (3,)
    units: rad/s
    slice: 86:89
    description: >-
      Angular velocity of the pelvis. NOTE three numbers where the orientation above is four -- that
      is why the state has 83 positions and 81 velocities.
  - name: s.joint_velocities
    shape: (69,)
    units: rad/s
    slice: 89:158
    description: The sixty-nine hinge velocities, in the same order as the angles.
  - name: s.ball_vel
    shape: (6,)
    units: mixed
    slice: 158:164
    description: Linear then angular velocity of the basketball.
  - name: s.throw_stage
    shape: (1,)
    units: null
    slice: 164:165
    description: >-
      0.0 until the ball's first contact with anything, 1.0 afterwards. NOT simulator state: it
      mirrors the stage latch inside the environment's own reward, carried in the observation so a
      stateless step stays a function of its arguments.
  helpers:
  - name: pelvis_pos
    signature: pelvis_pos(s)
    description: = s[0:3], the robot's root position in metres
    kind: inline_expression
    expression: s[0:3]
  - name: pelvis_height
    signature: pelvis_height(s)
    description: = s[2], about 0.98 when standing
    kind: inline_expression
    expression: s[2]
  - name: uprightness
    signature: uprightness(s)
    description: >-
      = 1 - 2*(s[4]**2 + s[5]**2), the world-z component of the pelvis's own z axis: +1 upright, 0
      horizontal, -1 upside-down
    kind: inline_expression
    expression: 1 - 2*(s[4]**2 + s[5]**2)
  - name: joint_angles
    signature: joint_angles(s)
    description: = s[7:76], all sixty-nine hinge angles
    kind: inline_expression
    expression: s[7:76]
  - name: control_cost
    signature: control_cost(a)
    description: = np.sum(np.square(a)), a measure of commanded effort
    kind: inline_expression
    expression: np.sum(np.square(a))
  - name: pelvis_linvel
    signature: pelvis_linvel(s)
    description: = s[83:86], the pelvis's linear velocity in m/s
    kind: inline_expression
    expression: s[83:86]
  - name: forward_velocity
    signature: forward_velocity(s)
    description: = s[83], the pelvis's forward (+x) velocity in m/s
    kind: inline_expression
    expression: s[83]
  - name: joint_velocities
    signature: joint_velocities(s)
    description: = s[89:158], the sixty-nine hinge velocities in rad/s
    kind: inline_expression
    expression: s[89:158]
  - name: ball_pos
    signature: ball_pos(s)
    description: = s[76:79], the basketball's centre in metres
    kind: inline_expression
    expression: s[76:79]
  - name: ball_height
    signature: ball_height(s)
    description: = s[78], the basketball's height above the floor in metres (the episode ends below 0.5)
    kind: inline_expression
    expression: s[78]
  - name: ball_velocity
    signature: ball_velocity(s)
    description: = s[158:161], the basketball's linear velocity in m/s
    kind: inline_expression
    expression: s[158:161]
  - name: ball_to_hoop
    signature: ball_to_hoop(s)
    description: >-
      = np.array([5.9, 0.0, 2.25]) - s[76:79], the vector from the ball's centre to the hoop centre
      (a fixed world site)
    kind: inline_expression
    expression: np.array([5.9, 0.0, 2.25]) - s[76:79]
  - name: throw_stage
    signature: throw_stage(s)
    description: = s[164], 0.0 before the ball's first contact and 1.0 after
    kind: inline_expression
    expression: s[164]
  helpers_note: >-
    Every entry is an INLINE EXPRESSION, not a method: nothing of that name exists on the adapter.
    As on h1hand_push, this vocabulary deliberately stands one norm away from the ground truth,
    because here the shipped reward's own largest term and the metric measure the same ball-hoop
    distance -- the quantity is the task, not a leak. The gate blocks the ROUTES (adapter
    internals, success_bar), not the quantity.
