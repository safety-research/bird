discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    expr: >-
      ||xpos['basketball'] - site_xpos['hoop_center']|| < 0.05 -- the `success` key of
      Basketball.get_reward's info dict, and the success arm of Basketball.get_terminated.
    provenance:
      path: humanoid_bench/envs/basketball.py
      lines: '64-156'
      symbol: Basketball.get_reward / Basketball.get_terminated
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: c734d7b5fb4601792fd82dea741c57f61220b32d0314cdc31f099ab9795c8ea2
    sound: true
    unsoundness: null
    reimplementation:
      repo: bird
      module: bird.envs.humanoid_hand
      symbol: H1HandBasketball._success_flag
      verified_against: >-
        Source-read transcription: ||s[76:79] - (5.9, 0, 2.25)|| < 0.05, the hoop centre being a
        fixed world site read off the built model. NOT resolved by name from this file -- the
        adapter implements it directly as a method and `step()` reports it in info['success'];
        recorded here so the artifact names where the transcription lives. Not yet executed
        against upstream's own info['success'] (see provenance.measured).
      sha256: null
  hardened:
    module: null
    symbol: hardened_success
    status: pending
    tightened: null
    added_conjuncts: null
    not_tightened_because: null
    pending_plan: >-
      PLAN, not an implemented oracle: decide from source whether a free-flight conjunct (no
      robot-ball contact for the last K steps before the success state) is wanted -- it would
      distinguish a thrown ball from one carried to the hoop and pressed against its centre.
      Whether a carried dunk is non-task behaviour is a judgment call the considered/rejected
      record should argue; the hoop's own net and board geometry may already make the carry
      physically awkward, which a stepped rollout can measure.
    conservatism: >-
      The check is on the ball's CENTRE against the hoop's centre at 0.05 m, tighter than an
      actual basket: a ball that rattles through the hoop off-centre -- a made basket by any human
      reading -- can pass 6 cm from the site and register nothing.
    invariant: hardened <= shipped
continuous_success:
  raw:
    name: ball_hoop_progress
    expr: >-
      1.0 the moment any arriving state has the ball's centre within 0.05 m of the hoop centre (the
      environment's own success radius, which also ends the episode); otherwise the episode's best
      approach as a fraction of the initial gap, clip(1 - d_min / max(d_0, 0.05), 0, 1). The launch
      geometry makes this falsify the hold exploit: the ball is fired TOWARD the robot -- away from
      the hoop -- so catch-and-hold leaves the best approach at roughly the launch distance and the
      metric at ~0.0. bird/envs/humanoid_hand.py::H1HandBasketball.task_metric
    unit: fraction of the launch-to-hoop gap
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: >-
      identity -- the raw metric is already a fraction in [0, 1], and no anchor pair exists to
      normalise against (see `anchors`)
    success_threshold: 0.5
