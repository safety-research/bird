# h1hand_basketball -- HumanoidBench `h1hand-basketball-v0` on the Unitree H1 with two Shadow Hands.
#
# Upstream ships a real per-step success predicate (ball within 0.05 m of the hoop centre) and
# the episode terminates on it -- but the shipped REWARD has a documented failure
# mode: basketball's is a reward-design failure, and `exploits` below
# records the mechanism (a catch-and-hold local optimum whose escape route -- throwing -- is
# punished by the very terminal that was meant to punish dropping the ball).
#
# THE OBSERVATION CARRIES TASK STATE THE SIMULATOR DOES NOT HOLD. `Basketball.get_reward` runs
# a two-stage latch ("catch" until the ball's first contact, "throw" after) that switches the
# reward's weights and lives on the task object, not in qpos/qvel. BIRD's observation is
# therefore qpos ++ qvel ++ stage (165 = 83 + 81 + 1): s[164] is 0.0 in the catch stage and 1.0
# after -- bird/envs/humanoid_hand.py's module docstring (PUSH AND BASKETBALL section) is the
# contract.
#
# DERIVED, NOT TRANSCRIBED -- same provenance discipline as h1hand_push: model
# facts from mujoco==3.1.6 builds of the task's own asset at cb11890, robot tables spliced from
# the h1hand_powerlift spec after asserting equality. The exploit arithmetic below is computed
# from the scene geometry, not observed in a rollout.
#
# The adapter is `bird/envs/humanoid_hand.py::H1HandBasketball`; read its module docstring first.

schema_version: 1
id: h1hand_basketball
env:
  env_id: h1hand-basketball-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 500
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      Three terminals: the ball's centre dropping below 0.5 m (a missed catch or a failed throw --
      the ball is 0.12 m in radius, so this is the ball essentially on the floor), the pelvis
      dropping below 0.5 m (collapse), and the ball's centre coming within 0.05 m of the hoop
      centre (success). A robot that catches the ball and stands still is the one behaviour that
      runs the full 500 steps.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: H1HandBasketball._task_reset_state
      lines: 1828-1854
    rng_note: >-
      Order: `rng.uniform(-0.01, 0.01, size=83)` in the base `_reset` (line 942); then in `_task_reset_state`
      `set_state` of that noised pose (line 1718) so the left-hand site can be read, then `rng.random()`
      for the angle magnitude and `rng.random()` for its sign (line 1721). The base then calls `set_state`
      a second time with the ball written in (line 945) -- upstream's own double-set. The stage latch is
      set to "catch" (line 1728) and reaches s[164] via `_extra_state`.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 83 position coordinates
          (76 robot + 7 ball, the ball's described separately; metres on the pelvis position, radians on
          the 69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The keyframe
          stands the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity quaternion.
          The four pelvis quaternion components are perturbed componentwise and then renormalised by `set_state`'s
          `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal box: keyframe
          plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: object_pose
      quantity: ball_orientation_noise
      fields:
      - ball_quat_w
      - ball_quat_x
      - ball_quat_y
      - ball_quat_z
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- entries 79:83: the ball's
          keyframe quaternion, the identity (`h1hand_pos_basketball.xml` `<key>`: ball at (0.35, 0.9, 2.0)),
          plus U(-0.01, 0.01) per component, renormalised by `mj_forward`. The launch below overwrites the
          ball's position but not its orientation, as upstream's `Basketball.reset_model` does (basketball.py:164-166).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: object_pose
      quantity: launch_angle
      fields:
      - ball_x
      - ball_y
      distribution:
        family: other
        text: >-
          theta = U(0, 1) * 1.45 * s with s = +1 if U(0, 1) < 0.5 else -1 (two `rng.random()` calls), i.e.
          theta ~ U(-1.45, 1.45) rad; ball_x = 1.5 cos(theta), ball_y = 1.5 sin(theta) m -- the ball starts
          1.5 m from the world origin on an arc of +/-83 deg about +x. Not a box in (x, y).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1846-1849
      basis: read
      note: >-
        `Basketball.reset_model` (basketball.py:159, 164-165): `np.random.random() * 1.45 * np.random.choice([1,
        -1])` from the GLOBAL `np.random`, the same law. `tests/test_humanoid_hand.py:841-847` pins seed-dependence
        where humanoid_bench is installed -- not in this venv.
    - role: object_pose
      quantity: ball_height
      fields:
      - ball_z
      distribution:
        family: derived
        text: >-
          0.3924 m plus the world z of the `left_hand` site after `set_state` of the noised robot pose --
          forward kinematics of `robot_keyframe_noise`, so it moves only through that +/-0.01 noise, about
          1.47 m at the keyframe. Not a draw of its own.
      derived_from: robot_keyframe_noise
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1843-1845
      basis: read
      note: >-
        Upstream's ordering exactly: `HumanoidEnv.reset_model` calls `set_state` (env.py:237-239) before
        `Basketball.reset_model` reads `site_xpos['left_hand', 'z']` (basketball.py:166); line 1725 writes
        it.
    - role: object_velocity
      quantity: ball_launch_velocity
      fields:
      - ball_vx
      - ball_vy
      distribution:
        family: derived
        text: >-
          (-7.5 cos(theta), -7.5 sin(theta)) m/s for the theta of `launch_angle`: 7.5 m/s straight at the
          world origin with no vertical component. It reaches the observation as s[158:160].
      derived_from: launch_angle
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1851-1852
      basis: read
      note: basketball.py:162-163, the same two entries.
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_basketball.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: ball_other_velocities
      fields:
      - ball_vz
      - ball_wx
      - ball_wy
      - ball_wz
      value: >-
        0 -- `qvel[-4]` (ball vz) and the three angular rates are never written (adapter 1693-1694 and upstream
        basketball.py:162-163 write vx, vy only), and `h1hand_pos_basketball.xml`'s `<key>` declares `qpos`
        only, so `key_qvel` is zeros: the ball leaves with no vertical speed and no spin.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1851-1852
      basis: read
    - role: mode
      quantity: throw_stage
      fields:
      - throw_stage
      value: >-
        0.0 -- the reward-stage latch is reset to "catch" on every episode (line 1728) and flips to "throw"
        (1.0) only on the ball's first contact during a step (`_after_step`, lines 1679-1701).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '1853'
      basis: read
      note: basketball.py:168 resets `self.stage = 'catch'` at the same point.
    - role: goal
      quantity: goal
      value: >-
        none -- the hoop is fixed world geometry at `_HOOP_POS` = (5.9, 0, 2.25) m (line 525) and is not
        in the observation; `task_metric` is the ball's best approach to it as a fraction of the launch
        gap, 1.0 inside `_GOAL_RADIUS` = 0.05 m (line 516).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1856-1879
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Basketball.reset_model` draws the launch angle from the GLOBAL `np.random`
      (basketball.py:159); position, velocity and the hand-height read follow the same lines and order (basketball.py:160-168);
      this adapter draws everything from the episode Generator (`_reset`, 941-944; `_task_reset_state`,
      1685-1695), so a BIRD episode is reproducible from its seed where an upstream one is not.
    prompt_states: >-
      Each episode the ball is thrown at the robot from about 1.5 m away at 7.5 m/s, at chest height
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
    - object_velocity
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
  spaces:
