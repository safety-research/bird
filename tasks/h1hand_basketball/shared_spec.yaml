description:
  natural_language: >-
    Catch the basketball and throw it through the hoop. Each episode the ball is thrown at the
    robot from about 1.5 m away at 7.5 m/s, at chest height; letting it fall ends the episode, so
    it must be caught or at least kept up. The hoop is 5.9 m in front of the robot with its centre
    2.25 m off the floor. The episode ends as a success the moment the ball's centre passes within
    5 cm of the hoop's centre -- upstream describes the task as catch-then-throw, and the reward
    switches from paying for hand-ball proximity to paying for ball-hoop proximity at the ball's
    first contact.
  l_task: >-
    Catch the basketball and throw it through the hoop. Each episode the ball is thrown at the
    robot from about 1.5 m away at 7.5 m/s, at chest height; letting it fall ends the episode, so
    it must be caught or at least kept up. The hoop is 5.9 m in front of the robot with its centre
    2.25 m off the floor. The episode ends as a success the moment the ball's centre passes within
    5 cm of the hoop's centre -- upstream describes the task as catch-then-throw, and the reward
    switches from paying for hand-ball proximity to paying for ball-hoop proximity at the ball's
    first contact.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    At each reset a 0.12 m-radius, 0.25 kg basketball is launched at the robot from 1.5 m away at
    7.5 m/s, horizontally, from roughly hand height -- it arrives in about a fifth of a second. A
    basketball hoop stands 5.9 m in front of the robot, its centre 2.25 m off the floor. The episode
    ends if the ball's centre drops below 0.5 m (dropped), if the pelvis drops below 0.5 m
    (collapse), or when the ball's centre comes within 0.05 m of the hoop centre (success). The
    last number of the observation, s[164], is 0.0 until the ball first touches anything and 1.0
    afterwards -- it mirrors the stage machine inside the environment's own reward, which stops
    paying for hand-ball proximity and starts paying for ball-hoop proximity at that moment.
  scene: >-
    Flat infinite ground, a standing humanoid with two five-fingered hands, a basketball incoming
    at it, and a hoop on a stand several metres in front with a backboard. Nothing else is in the
    scene.
  success_criterion_prose: >-
    The ball's centre within 0.05 m of the hoop centre (a fixed world site at (5.9, 0, 2.25)) --
    the environment's own check, which also ends the episode the step it first holds.
  full_source:
    path: humanoid_bench/envs/basketball.py
    lines: 64-156
state_surface:
  fields:
  - name: s.pelvis_pos
    shape: (3,)
    units: m
    slice: 0:3
    description: World position of the pelvis (the free root body).
  - name: s.pelvis_quat
    shape: (4,)
    units: null
    slice: '3:7'
    description: Pelvis orientation as a unit quaternion in (w, x, y, z) order.
  - name: s.joint_angles
    shape: (69,)
    units: rad
