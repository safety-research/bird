reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/basketball.py
      lines: '64-141'
      symbol: Basketball.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: c734d7b5fb4601792fd82dea741c57f61220b32d0314cdc31f099ab9795c8ea2
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces -- the stand and effort terms' inputs
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.basketball:Basketball.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      A TWO-STAGE reward on a latch the observation now mirrors (s[164]): in the catch stage, `0.5 *
      (stand * small_control) + 0.5 * hand_proximity`; from the ball's first contact onwards, `0.15
      * (stand * small_control) + 0.05 * hand_proximity + 0.8 * tolerance(ball_hoop_distance,
      margin=7, sigmoid=linear)`, plus a one-off +1000 inside the success radius. THIS REWARD HAS A
      REWARD-DESIGN FAILURE -- see `exploits` for the mechanism. Read against source at cb11890, not
      executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS (the routes to the quantity a candidate is scored on in this repo), and
    `success_bar` is the benchmark symbol nothing upstream reads but a candidate could. `success`
    is DELIBERATELY ABSENT -- listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close). As on
    h1hand_push the gate is thinner than it looks: the shipped reward's largest term and the
    ground-truth metric measure the same ball-hoop distance, so re-deriving it is writing the
    task, not reaching the fitness.
judge:
  vlm_legible: true
  legibility_note: >-
    A humanoid with a ball in its hands and a hoop on a stand are legible objects, and
    `cam_basketball` frames the robot from the front-side. What is UNMEASURED (no frame has been rendered): whether the hoop, 5.9 m away, is in frame at all under a trackcom camera centred on
    the robot -- a judge may see the catch clearly and the throw's outcome not at all. Grade
    catches with confidence and baskets with suspicion until a rendered frame is measured.
  camera:
    name: cam_basketball
    mode: tracking
    note: >-
      `cam_basketball` is a `mode="trackcom"` camera at (-1.8, 3.5, 3) relative to the robot's
      centre of mass. It keeps the robot centred; the hoop's visibility depends on the robot's
      position and heading, and has not been measured.
  extra_views:
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, with the robot at about three
      times the pixels the default camera gives it. Where the robot is in the room is not
      visible from here. Shows the ball at the hands during the catch.
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      The direction the ball leaves in relative to the robot's heading reads in plan; the
      hoop, 6 m away, is out of this frame.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  subtasks_sequential: true
  telemetry_fields:
  - ball_hoop_dist
  - ball_z
  - throw_stage
domain_randomization: null
exploits:
- name: catch_and_hold
  mechanism: >-
    From the ball's first contact the reward is `0.15 * (stand * small_control) + 0.05 *
    hand_proximity + 0.8 * tolerance(ball_hoop_distance, margin=7, sigmoid=linear)`. A robot that
    catches the ball and STANDS STILL holds the ball about 5.7 m from the hoop (geometry: hoop at
    (5.9, 0, 2.25), a held ball at roughly (0.3, 0, 1.3)), so the linear kernel pays about 0.8 *
    (1 - 5.7/7) = 0.15 per step, plus the stand and proximity terms -- roughly 0.35/step for up to
    500 steps with no throw ever attempted. The escape route is punished by the terminal that was
    meant to punish dropping: A MISSED THROW IS A DROPPED BALL (ball z < 0.5 ends the episode), so
    attempting the throw risks ending the income stream and the episode at once, while holding
    risks nothing.
  status: open
  closed_by: null
  note: >-
    This is a reward-design rather than a control failure, and the reason the task discriminates
    between reward candidates rather than only between optimisers. All arithmetic is computed from
    the scene geometry read off the built model, not observed in a rollout. BIRD's
    `task_metric` is built to score this behaviour ~0.0: the ball is launched toward the robot, away
    from the hoop, so a hold's best ball-hoop approach is the launch distance itself.
- name: any_contact_ends_catch_shaping
  mechanism: >-
    The catch->throw latch flips on ANY contact pair involving the ball's geom -- hands, chest,
    forearm, the floor. A ball that glances off the torso mid-flight switches the reward to the
    throw stage while the ball is still in the air, dropping the hand-proximity weight from 0.5 to
    0.05 at the moment the robot most needs to be paid for reaching toward the ball.
  status: open
  closed_by: null
  note: >-
    Read off `Basketball.get_reward`'s contact scan, which checks only that the ball's collision
    geom appears in the pair, never what it touched. The floor arm of this defect self-limits (a
    floor contact means the ball is at ~0.12 m, already past the 0.5 m terminal), so the live case
    is ball-on-robot-body. The adapter reproduces the latch exactly (`_after_step`), including
    this.
