      on CPU against 0.5 ms here, and from one keyframe under zero actions the two solves part by a max
      |dq| of 0.02-0.13 within 10 control steps. Upstream''s human is a second trained agent driving right_shoulder1,
      right_shoulder2 and right_elbow (up to 10 N.m each) from a zoo of JAX partner policies; here every
      humanoid actuator receives zero, so the person is passive and the itch moves only when gravity,
      the reset transient or the robot moves the arm. Neither side terminates early: upstream''s step
      hard-codes done = 0 and its EpisodeWrapper truncates at 1000, which is the horizon here. The observation
      is the whole simulator state (positions and velocities) plus derived fields rather than upstream''s
      69-dim global vector sliced into a 29-dim robot view and a 40-dim human view, which carries no velocities
      and has an indexing defect this port does not reproduce: qpos is sliced by joint id, so the robot''s
      ''joint angles'' are the human''s six arm joints and the Panda''s joints appear nowhere. The reference
      reward transcribes upstream''s terms at the constructor defaults (dist 1.0 with scale 0.1, scratching
      4.0 with targets 0.1 m/s and 3.0 N, ctrl 1e-6, gate on distance below 0.1 m as the code has it and
