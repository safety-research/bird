  kind: continuous_only
  no_discrete_success_because: Assistax ships no boolean success check for any task -- its agents are
    judged by the return of its own dense reward -- so there is no benchmark criterion to state. `EnvAdapter.success()`
    here is a threshold WE chose on a per-step check WE wrote, and recording it as a `shipped` check would
    claim an independence it does not have.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: scratching_fraction
    expr: fraction of arriving states with dist_tool_target < 0.05 m, the contact force the scratcher
      applies to the human's right arm or hand >= 0.5 N and the scratcher tip's speed >= 0.02 m/s
    unit: fraction of arriving states
    direction: maximize
    saturates_at: 1.0
  normalized:
