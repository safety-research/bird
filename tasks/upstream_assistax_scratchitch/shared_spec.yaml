description:
  env_prose: 'A Panda arm stands 0.75 m to the right of a person seated in a wheelchair, facing them.
    Its hand carries a scratcher: a cube with a thin 0.1 m stick of radius 0.01 m whose far end is the
    tip. Each action is seven numbers in [-1, 1], one per Panda joint: a normalised position target for
    a stiff servo (about pi times the value), not a torque. The person is passive (every humanoid actuator
    receives zero): the body rests under gravity on its joint stiffness, its actuators'' springs, the
    chair and a pelvis-to-chair anchor, settles about three centimetres over the first two seconds, and
    can be pushed about. The right upper arm and forearm are capsules of radius 0.04 m and 0.031 m; the
    stick collides only with that arm, the hand and the chair, passing through everything else. Each episode
    draws a fresh itch: a coin toss picks the upper arm or the forearm, then a point on that segment''s
    skin at a random height along it and a random angle around it; the itch rides with the arm for the
    rest of the episode. Human and robot start from one seated keyframe pose with a few millimetres of
    jitter on every position coordinate and a small random velocity; the tool hangs beside the robot''s
    upright column, its tip a little under half a metre from the arm. The observation is the whole simulator
    state then derived fields: the human''s root position and quaternion, every hinge angle (human then
    Panda), every velocity likewise, the task slots (which segment carries the itch and where, fixed for
    the episode), tip position, tool quaternion, tip velocity, the world-frame contact force in newtons
    the stick alone applies to the right arm and hand, the itch''s world position, the tip-to-itch distance
    and both arm segment positions. Control is 125 Hz; an episode is 1000 steps (8 s); nothing ends it
    early. The reward is written in `jax.numpy` and traced with `jax.jit` and `jax.vmap` (generate.reward_language:
    jax).'
  l_task: 'Scratch the itch on the seated person''s right arm: bring the tip of the scratcher fixed to
    the Panda''s hand onto the itch, whose location is given, press it gently against the skin and rub,
    and keep scratching there for as much of the episode as you can without shoving the arm about. The
    arm is commanded by seven joint-position targets, one per Panda joint, each a normalised target angle
    for that joint''s servo rather than a torque.'
  natural_language: 'A Panda arm stands 0.75 m to the right of a person seated in a wheelchair, facing
    them. Its hand carries a scratcher: a cube with a thin 0.1 m stick of radius 0.01 m whose far end
    is the tip. Each action is seven numbers in [-1, 1], one per Panda joint: a normalised position target
    for a stiff servo (about pi times the value), not a torque. The person is passive (every humanoid
    actuator receives zero): the body rests under gravity on its joint stiffness, its actuators'' springs,
    the chair and a pelvis-to-chair anchor, settles about three centimetres over the first two seconds,
    and can be pushed about. The right upper arm and forearm are capsules of radius 0.04 m and 0.031 m;
    the stick collides only with that arm, the hand and the chair, passing through everything else. Each
    episode draws a fresh itch: a coin toss picks the upper arm or the forearm, then a point on that segment''s
    skin at a random height along it and a random angle around it; the itch rides with the arm for the
    rest of the episode. Human and robot start from one seated keyframe pose with a few millimetres of
    jitter on every position coordinate and a small random velocity; the tool hangs beside the robot''s
    upright column, its tip a little under half a metre from the arm. The observation is the whole simulator
    state then derived fields: the human''s root position and quaternion, every hinge angle (human then
    Panda), every velocity likewise, the task slots (which segment carries the itch and where, fixed for
    the episode), tip position, tool quaternion, tip velocity, the world-frame contact force in newtons
    the stick alone applies to the right arm and hand, the itch''s world position, the tip-to-itch distance
    and both arm segment positions. Control is 125 Hz; an episode is 1000 steps (8 s); nothing ends it
    early. The reward is written in `jax.numpy` and traced with `jax.jit` and `jax.vmap` (generate.reward_language:
    jax).'
  scene: A person sits in a wheelchair, trunk leaning forward, forearms on the armrests and head on the
    headrest; a Panda arm stands on the floor at their right holding a blue scratcher stick, and a small
    red dot on the right upper arm or forearm marks the itch. The scene's camera sits above and in front
    of the person's right side, aimed at their body's centre of mass, so the chair and the robot beside
    it share the frame.
  success_criterion_prose: 'scratching_fraction is a check this repository wrote, not a benchmark criterion:
    upstream Assistax ships no success test for this task and reports only the return of its own reward.
    It is the fraction of the episode''s 1000 arriving states on which all three of the following hold
    at once: the scratcher tip is within 0.05 m of the itch, the stick presses on the person''s right
    arm or hand with a net contact force of at least 0.5 N, and the tip is moving at 0.02 m/s or faster.
    success() is this fraction reaching 0.3, a provisional threshold; the check gates on the same quantities
    upstream''s reward is shaped on (distance, contact force, tip speed), so it is not independent of
    that reward the way a benchmark''s success flag would be. A uniform-random policy scores exactly 0
    over 30 episodes.'
  full_source:
    path: bird/envs/upstream_assistax.py
    lines: null
state_surface:
  fields:
  - name: human_root_pose
    shape: (7,)
    units: m, unit quaternion
    description: the human's root position and orientation (w, x, y, z)
    source: wheelchair_scene.xml
    slice: 0:7
  - name: human_joint_angles
    shape: (17,)
    units: rad
    description: every humanoid hinge joint angle in model order
    source: wheelchair_scene.xml
    slice: '7:24'
  - name: robot_joint_angles
    shape: (7,)
    units: rad
    description: the Panda's seven joint angles, joint1..joint7
    source: wheelchair_scene.xml
    slice: '24:31'
  - name: human_root_velocity
    shape: (6,)
    units: m/s, rad/s
    description: the human's root linear velocity (world frame) then angular velocity (body frame)
    source: wheelchair_scene.xml
    slice: '31:37'
  - name: joint_velocities
    shape: (24,)
    units: rad/s
    description: every hinge joint velocity in model order (human then Panda)
    source: wheelchair_scene.xml
    slice: 37:61
  - name: task_slots
    shape: (4,)
    units: task-specific
    description: 'target_arm: which arm segment carries the itch: 0 = upper arm, 1 = lower arm; fixed
      for the episode; target_local_x: the itch position in the target arm segment''s own frame, x, metres
      (on the capsule surface); fixed for the episode; target_local_y: the itch position in the target
      arm segment''s own frame, y, metres; target_local_z: the itch position in the target arm segment''s
      own frame, z (along the segment), metres'
    source: bird/envs/assistax.py::_TASKS
    slice: 61:65
  - name: tool_pose_velocity_force
    shape: (13,)
    units: m, unit quaternion, m/s, N
    description: 'tool position (3), tool orientation quaternion (4), tool linear velocity (3), net contact
      force the row''s tool geoms apply to the row''s human geoms (3; the right arm on the arm tasks,
      the head on the head tasks; a range, not a bound: stiff-contact transients can exceed it), world
      frame'
    source: bird/envs/assistax.py::_COMMON_TAIL
    slice: 65:78
  - name: task_fields
    shape: (10,)
    units: m (positions and distance)
    description: 'target_x: the itch target position x, metres, world frame (on the arm''s surface); target_y:
      the itch target position y, metres, world frame; target_z: the itch target position z, metres, world
      frame; dist_tool_target: distance from the scratcher tip to the itch target, metres; uarm_x: human
      right upper arm body position x, metres, world frame; uarm_y: human right upper arm body position
      y, metres, world frame; uarm_z: human right upper arm body position z, metres, world frame; larm_x:
      human right lower arm body position x, metres, world frame; larm_y: human right lower arm body position
      y, metres, world frame; larm_z: human right lower arm body position z, metres, world frame'
    source: bird/envs/assistax.py::_TASKS
    slice: 78:88
  helpers:
  - name: tool_position
    signature: tool_position(s)
    description: the tool reference point's position, metres, world frame
    kind: inline_expression
    expression: s[65:68]
  - name: tool_velocity
    signature: tool_velocity(s)
    description: the tool reference point's linear velocity, m/s, world frame
    kind: inline_expression
    expression: s[72:75]
  - name: tool_speed
    signature: tool_speed(s)
    description: the tool reference point's speed, m/s
    kind: inline_expression
    expression: (((s[72:75]) ** 2).sum() ** 0.5)
  - name: tool_force
    signature: tool_force(s)
    description: the net contact force the tool applies to the human, newtons, world frame
    kind: inline_expression
    expression: s[75:78]
