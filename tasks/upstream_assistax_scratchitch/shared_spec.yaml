judge:
  vlm_legible: true
  legibility_note: 'A seated adult and a Panda at 448x320 from the scene''s camera above and in front
    of the person''s right side: which arm segment the blue stick is near, whether the arm is still resting
    on the armrest or has been shoved off it, and (in a clip) whether the stick is rubbing all read from
    the pixels. The itch is a red marker of the tip''s own radius, a few pixels wide, so ''on the itch''
    against ''a few centimetres off'' cannot be told from pixels, nor can light contact from a near miss,
    and neither contact force nor tip speed is visible in a still. The frame''s legend prints only the
    task name: the tip-to-itch distance and the contact force the check gates on are not printed, so neither
    has a route into a VLM''s verdict beyond the pixels. The camera re-aims at the human''s centre of
    mass, so the framing drifts slightly as the person settles.'
  camera:
    name: default
    mode: tracking
    note: 'the scene''s `default` camera: `targetbodycom` on the humanoid, from (1.3, 2.1, 1.8) -- it
      re-aims at the human''s centre of mass, so the framing follows the human''s slow settling into the
      chair and the Panda''s base stays in frame'
  subtasks_sequential: false
  telemetry_fields:
  - dist_tool_target
  - contact_force_magnitude
  - ee_speed
  - target_z
  - larm_z
domain_randomization: null
exploits:
- name: drag_the_arm
  status: open
  closed_by: null
  mechanism: 'The itch is a point fixed in the arm segment''s frame and the human is passive (the right
    arm has almost no joint stiffness), so a stick that hooks or shoves the forearm carries the itch along
    with it: the tip stays inside the 0.05 m gate, the shove supplies the 0.5 N, and the drag supplies
    the 0.02 m/s. Pushing the arm around the chair scores as scratching on every step it lasts.'
  note: Present in the check this repo wrote, not in a benchmark's.
- name: tremble_in_contact
  status: open
  closed_by: null
  mechanism: The speed clause reads the tip's total speed, not its motion along the skin, so a tip that
    is in range and stays pressed on the arm clears it with any 0.02 m/s oscillation -- including a push-and-ease
    straight into the arm that never breaks contact. A vibrating touch scores a full-episode scratch without
    ever rubbing.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: stick_side_contact
  status: open
  closed_by: null
  mechanism: Force is summed over the whole stick capsule while distance is measured from the tip site,
    so laying the stick along the arm and pressing with its side while the tip point sits within 0.05
    m of the itch satisfies both clauses with nothing touching the itch itself; the same tolerance accepts
    contact anywhere within 0.05 m of the itch, including on the hand when the itch is near the wrist
    end of the forearm.
  note: Present in the check this repo wrote, not in a benchmark's.
- name: unbounded_pressure
  status: open
  closed_by: null
  mechanism: The force clause has a floor and no ceiling, so once the tip is near the itch and moving,
    pinning the arm hard against the armrest and grinding scores identically to a gentle scratch; any
    force above 0.5 N reads the same. Upstream's reward peaks at 3 N and falls off above it; the check
    does not.
  note: Present in the check this repo wrote, not in a benchmark's.
