  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: bird/envs/upstream_assistax.py
      lines: null
      symbol: UpstreamAssistax.reference_reward
      commit: null
      sha256: null
    depends_on:
    - path: assistax/envs/base_env.py
      lines: null
      symbol: null
      commit: a7d94f4e20636b9b0c07370344b8a2b521db58b2
      sha256: null
    - path: assistax/envs/README.md
      lines: null
      symbol: null
      commit: a7d94f4e20636b9b0c07370344b8a2b521db58b2
      sha256: null
    import_path: bird.envs.upstream_assistax:UpstreamAssistax.reference_reward
    verified_against: assistive-autonomy/assistax @ a7d94f4e2063, read 2026-09-08
    notes: 'Upstream''s ScratchItch.step reward, transcribed into `bird/envs/assistax.py` term by term
      at the constructor defaults, with four stated substitutions: the tool speed is the simulator''s
      instantaneous site velocity rather than the finite difference of two frames; contact forces are
      summed over the live tool-human contact pairs (and read back off the observation when a stored state
      is re-scored) rather than read at fixed MJX contact-array indices; the control cost squares the
      7-D robot action clipped to [-1, 1] where upstream squares the concatenated robot+human action;
      bedbathing''s per-point bonus (needs the previous flags) is dropped. Transcribed, not imported:
      upstream is JAX/MJX.'
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: jax
    batched: false
    allowed_modules:
    - abc
    - collections
    - dataclasses
    - enum
    - functools
    - gym
    - gymnasium
    - itertools
    - jax
    - math
    - numpy
    - operator
    - random
    - statistics
    - torch
    - typing
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'Write the body in `jax.numpy`, which is in scope as `jnp` (`jax` and `math` are

      too; `numpy` as `np` is available for constants only). The function is traced

      with `jax.jit` and `jax.vmap`, so it must be a pure array program: no Python

      `if`/`while` on values (use `jnp.where`), no `.item()`, `float()` or `bool()`

      on a traced value, and no in-place mutation (use `.at[...].set(...)`). Every

      value you return -- the total and each component -- must be a scalar.'
    reward_utils: []
  forbidden_symbols: []
  forbidden_symbols_by_consumer:
