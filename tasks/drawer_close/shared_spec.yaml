schema_version: 1
id: drawer_close
env:
  env_id: drawer-close-v3
  library:
    name: metaworld
    version_verified: 3.1.1
    commit: null
    stack:
      mujoco: 3.3.0
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 500
  control_hz: null
  termination:
    early_terminate: false
    autoreset: false
    partial_reset: null
    prompt_states: The episode always runs the full 500 steps; reaching the criterion does not
      end it.
  reset:
    kind: stochastic
    mechanism: pinned_instances
    n_instances: 50
    instance_seed: 0
    instances_source: '`metaworld.MT1("drawer-close-v3", seed=0).train_tasks`
      (bird/envs/metaworld.py:1135-1136; `benchmark_seed = 0` is a class attribute at :951). `_make_tasks`
      (metaworld/__init__.py:114-179) seeds the GLOBAL `np.random` to 0, constructs the env with
      `_freeze_rand_vec = False`, calls `reset()` 50 times keeping each `_last_rand_vec` -- one
      `np.random.uniform` over `_random_reset_space` per call (sawyer_xyz_env.py:711-719), and no
      rejection loop: this task''s `reset_model` (sawyer_drawer_close_v3.py:108) takes the vector as
      drawn -- asserts the 50 are distinct, then restores the global RNG state. Every run, cfg.seed and
      candidate shares the same 50 vectors.'
    entry:
      path: bird/envs/metaworld.py
      symbol: MetaWorld._reset
      lines: 1747-1765
    rng_note: 'One draw per reset: `rng.integers(50)` picks the instance (metaworld.py:1761). `env.reset()`
      is then called UNSEEDED (:1762) and `reset_model` reads the frozen `_last_rand_vec` that `set_task`
      installed (sawyer_xyz_env.py:308-309, :699-701) -- twice per reset (SawyerXYZEnv.reset:677, then
      gymnasium MujocoEnv.reset:178), idempotently. A seed is a choice over 50 points: two seeds collide
      with probability 1/50, and `default_rng(0..23)` lands on 21 distinct instances (measured). `_sample_dr`
      reads the same Generator BEFORE `_reset` (base.py:401-406) but consumes nothing at nominal (`_dr_ranges`
      is empty, base.py:685-686); with DR ranges installed the same seed lands on a different instance.'
    draws:
      - role: object_pose
        quantity: drawer_x
        fields:
          - object_x
          - prev_object_x
        distribution:
          family: uniform
          text: 'drawer body x ~ U(-0.1, 0.1) m; y = 0.9 and z = 0.0 are fixed (low == high; obj_low/obj_high
            :29-30, Box :55-57), written to `model.body("drawer").pos` (:111). Only x varies. The drawer
            is then pulled fully OUT, `_set_obj_xyz(-maxDist)` with maxDist = 0.15 (:60, :98-102, :115),
            and `obj_init_pos` is overwritten with the handle position (:116). Observed object is `get_body_com("drawer_link")
            + (0, -0.16, 0.05)` (:92-93), whose x equals the drawn x exactly. Over the 50 instances: object_x
            in [-0.0991, 0.0923].'
          low:
            - -0.1
            - -0.1
          high:
            - 0.1
            - 0.1
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: 108-116
        basis: measured
        note: 'measured through the registry adapter (`registry.get("env", "mt10_drawer-close-v3")(None)`):
          24 resets with `np.random.default_rng(0..23)` move exactly the `fields` listed across this block''s
          draws and nothing else; resetting on each of the 50 pinned instances gives the ranges quoted in `text`. `prev_*`
          equal the current entries at reset (SawyerXYZEnv.reset:679-680), so they move with their source.'
      - role: goal
        quantity: target_x
        fields:
          - goal_x
        distribution:
          family: derived
          text: '`_target_pos = obj_init_pos + (0.0, -0.16, 0.09)` (:113), computed from the drawer BODY
            draw before the handle overwrite: goal = (x, 0.74, 0.09), the closed-handle position, so only
            goal_x moves.'
        derived_from: drawer_x
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: '113'
        basis: measured
        note: The only rendering that tells the model this varies is flat_fields[goal_x].description ("goal
          position x for this episode; re-randomised every reset"), which reaches it under the state-API
          stub alone; l_task and env_prose describe a fixed scene.
    constants:
      - role: agent_pose
        quantity: hand start
        value: hand_init_pos = (0, 0.6, 0.2) m (sawyer_drawer_close_v3.py:46); `_reset_hand` drives the
          mocap weld there for 50 frames with the fingers commanded open (sawyer_xyz_env.py:684-695), no
          draw. Settles to (0.00458, 0.60139, 0.19514) with gripper_opening 1.0 on every one of the 50 instances
          (measured, identical to 1e-6).
        fields:
          - hand_x
          - hand_y
          - hand_z
          - gripper_opening
          - prev_hand_x
          - prev_hand_y
          - prev_hand_z
          - prev_gripper_opening
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: '46'
        basis: measured
      - role: agent_velocity
        quantity: arm and gripper velocity
        value: none -- velocity is not in the 39-D observation; `SawyerXYZEnv.reset` copies the current
          frame into obs[18:36] (sawyer_xyz_env.py:679-680), so the finite-difference velocity `(s[0:18]
          - s[18:36]) / dt` is exactly zero at step 0 on every instance.
        source:
          path: metaworld/sawyer_xyz_env.py
          lines: 664-682
        basis: read
      - role: goal
        quantity: goal y, z
        value: (0.74, 0.09) m -- 0.9 - 0.16 and 0.0 + 0.09 (:113).
        fields:
          - goal_y
          - goal_z
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: '113'
        basis: measured
      - role: object_pose
        quantity: drawer slide, handle y/z and orientation
        value: 'drawer starts fully OPEN: slide joint qpos[9] = -0.15 (`_set_obj_xyz(np.array(-self.maxDist))`,
          :115). Handle y = 0.58, z = 0.14 m (measured); `_get_quat_objects` returns `np.zeros(4)`
          (:95-96), so all four quaternion columns are 0.0 on every instance.'
        fields:
          - object_y
          - object_z
          - object_qx
          - object_qy
          - object_qz
          - object_qw
          - prev_object_y
          - prev_object_z
          - prev_object_qx
          - prev_object_qy
          - prev_object_qz
          - prev_object_qw
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: 92-102
        basis: measured
      - role: object_velocity
        quantity: drawer slide velocity
        value: zero -- the drawer-specific `_set_obj_xyz` (:98-102) copies qvel unchanged and `mj_resetData`
          had zeroed it; measured `prev_object_*` == `object_*` at reset.
        source:
          path: metaworld/envs/sawyer_drawer_close_v3.py
          lines: 98-102
        basis: read
      - role: object_pose
        quantity: second object slot
        value: none -- `_obs_obj_max_len = 14` zero padding for a second object this task does not have;
          all 14 entries (7 current, 7 previous) are exactly 0.0 on every instance.
        fields:
          - object2_x
          - object2_y
          - object2_z
          - object2_qx
          - object2_qy
          - object2_qz
          - object2_qw
          - prev_object2_x
          - prev_object2_y
          - prev_object2_z
          - prev_object2_qx
          - prev_object2_qy
          - prev_object2_qz
          - prev_object2_qw
        source:
          path: metaworld/sawyer_xyz_env.py
          lines: 475-511
        basis: measured
    stochastic_transitions: null
    upstream_divergence: 'Same 50 instances and the same uniform choice over them as Meta-World''s own MT1
      route (`RandomTaskSelectWrapper._set_random_task`: `np_random.choice(len(self.tasks))`, metaworld/wrappers.py:98-100),
      drawn from BIRD''s episode Generator instead of the wrapper''s `np_random`; `env.reset()` is never
      handed a seed (metaworld.py:1762). Against the env class''s own continuous `_random_reset_space` this
      is a 50-point discretisation -- a run never sees a 51st initial condition -- which is the benchmark''s
      protocol, not the adapter''s. Nothing else is added or removed.'
    prompt_states: A Sawyer robot arm stands at a table with a drawer pulled out 15 cm (1 cm short
      of its slide stop).
    prompt_field: l_task
    prompt_omits:
      - object_pose
      - goal
  spaces:
    action_fields:
      - name: delta_x
        description: commanded gripper displacement along x, in [-1, 1]; scaled and integrated into
          the mocap target by `set_xyz_action`, so this is a velocity command, not a position
        low: -1.0
        high: 1.0
      - name: delta_y
        description: commanded gripper displacement along y, in [-1, 1]
        low: -1.0
        high: 1.0
      - name: delta_z
        description: commanded gripper displacement along z, in [-1, 1]
        low: -1.0
        high: 1.0
      - name: gripper
        description: gripper command in [-1, 1]; -1 opens, +1 closes
        low: -1.0
        high: 1.0
    obs_dim: 39
    action_dim: 4
    action_low:
    - -1.0
    - -1.0
    - -1.0
    - -1.0
    action_high:
    - 1.0
    - 1.0
    - 1.0
    - 1.0
    action_semantics: '[dx, dy, dz, grip]: mocap-driven — the first three command a change in
      the gripper''s world xyz at action_scale = 0.01 m/step, the fourth is gripper effort (sawyer_xyz_env.py:182,
      320-336).'
description:
  env_prose: A Sawyer arm must push an open drawer closed. The drawer starts pulled out 15 cm (1 cm
    short of its slide stop) and slides on one axis.
  l_task: 'A Sawyer robot arm stands at a table with a drawer pulled out 15 cm (1 cm short of its
    slide stop). Push the drawer shut along its sliding axis until it is fully closed, and keep it
    closed for the rest of the episode. The arm is commanded by a small Cartesian displacement of
    the gripper each step plus an open/close command for the fingers; there is no direct control of
    the drawer, which moves when anything pushes it -- at reset one fingertip of the open gripper
    already rests on the top edge of the drawer''s front wall, so the gripper''s first motion toward
    the drawer (+y) shoves it and it coasts once moving; descending alone seldom closes it.'
  natural_language: A Sawyer arm must push an open drawer closed. The drawer starts pulled out 15 cm
    (1 cm short of its slide stop) and slides on one axis.
  scene: A Sawyer arm with a parallel-jaw gripper over a table, mocap-driven; the manipulated
    thing is a drawer pushed closed. The 39-D observation carries the hand, one object pose, the
    previous frame and the goal.
  success_criterion_prose: 'Complete on any step where the observed handle point is within 0.065 m
    of the goal -- TARGET_RADIUS (0.05, from the base class) plus 0.015. The observed point obs[4:7]
    sits 5 cm above and 1 cm in front of the handle bar whose closed position the goal marks, so the
    observed distance is 0.051 m with the drawer at its nominal closed stop (the stop is soft -- the
    scripted expert overshoots to q = +0.004 and reads 0.0504 m) and the 0.065 m tolerance is what
    lets a closed drawer register. The slide moves the observed point along y, the same axis as its
    1 cm offset, so the ball is entered when sqrt((0.01 + remaining travel)^2 + 0.05^2) <= 0.065,
    i.e. with at most 3.15 cm of travel remaining (measured: success iff slide q >= -0.0315) --
    about 12 cm of its 15 cm travel from the open start. The class''s own `_TARGET_RADIUS = 0.04` at
    :16 is dead code that nothing reads; deriving the threshold from it is the obvious way to get
    this task wrong.'
  full_source:
    path: metaworld/envs/sawyer_drawer_close_v3.py
    lines: null
state_surface:
  fields:
  - name: s.obs
    slice: "0:39"
    shape: (39,)
    units: null
    description: 'the raw observation: 18 current-frame entries, the same 18 for the previous
      frame (obs[18:36]), then the goal position (obs[36:39]). Layout verified at sawyer_xyz_env.py:513-527.'
    source: sawyer_xyz_env.py:513-527
  - name: s.hand_pos
    slice: "0:3"
    shape: (3,)
    units: m
    description: 'obs[0:3] = data.body(''hand'').xpos. NOT tcp_center: the tool centre the built-in
      rewards use sits ~4.5 cm below this in z.'
    source: null
  - name: s.gripper_openness
    slice: "3:4"
    shape: scalar
    units: null
    description: obs[3], normalised finger separation in [0, 1].
    source: null
  - name: s.obj_pos
    slice: "4:7"
    shape: (3,)
    units: m
    description: obs[4:7], the manipulated object (handle/button/puck/peg grasp point).
    source: null
  - name: s.obj_quat
    slice: "7:11"
    shape: (4,)
    units: null
    description: 'obs[7:11], constant zeros on this task: `_get_quat_objects` returns np.zeros(4) --
      the fixture slides and reports no orientation. The component order is task-specific elsewhere;
      see object_qx.'
    source: null
  - name: s.goal_pos
    slice: "36:39"
    shape: (3,)
    units: m
    description: obs[36:39], the goal position.
    source: null
  - name: action
    shape: (4,)
    units: null
    description: 'the action applied this step: [dx, dy, dz, grip]'
    source: null
  helpers:
    - name: hand_pos
      signature: hand_pos(s)
      description: = s[0:3]
      kind: inline_expression
      expression: s[0:3]
    - name: object_pos
      signature: object_pos(s)
      description: = s[4:7]
      kind: inline_expression
      expression: s[4:7]
    - name: object_quat
      signature: object_quat(s)
      description: '= s[7:11]; component order is task-specific (see object_qx): scipy x,y,z,w on reach/push/pick_place/door_open/peg_insert_side, MuJoCo w,x,y,z on drawer_open/button_press_topdown, zeros on drawer_close/window_open/window_close'
      kind: inline_expression
      expression: s[7:11]
    - name: goal_pos
      signature: goal_pos(s)
      description: = s[36:39]
      kind: inline_expression
      expression: s[36:39]
    - name: gripper_opening
      signature: gripper_opening(s)
      description: = s[3], 1.0 open
      kind: inline_expression
      expression: s[3]
    - name: hand_velocity
      signature: hand_velocity(s)
      description: = (s[0:3] - s[18:21]) / 0.0125
      kind: inline_expression
      expression: (s[0:3] - s[18:21]) / 0.0125
    - name: tolerance
      signature: tolerance(x, bounds, margin, sigmoid='long_tail')
      description: 'Meta-World''s shaping kernel: 1.0 inside `bounds`, decaying over `margin`'
      kind: inline_expression
      expression: null
    - name: hamacher_product
      signature: hamacher_product(a, b)
      description: = a*b / (a + b - a*b); Meta-World's soft AND
      kind: inline_expression
      expression: null
  flat_fields:
    - index: 0
      name: hand_x
      description: 'gripper body x, `data.body(''hand'').xpos`. NOTE this is NOT tcp_center: the tool centre
        point used by the built-in rewards sits 4.5 cm below this in z'
    - index: 1
      name: hand_y
      description: gripper body y
    - index: 2
      name: hand_z
      description: gripper body z; the table surface is near z = 0
    - index: 3
      name: gripper_opening
      description: distance between the two claws, normalised to [0, 1]; 1.0 = fully open, 0.0 = fully closed
    - index: 4
      name: object_x
      description: manipulated object x (the handle/button/peg position for the fixture tasks)
    - index: 5
      name: object_y
      description: manipulated object y
    - index: 6
      name: object_z
      description: manipulated object z
    - index: 7
      name: object_qx
      description: 'object orientation quaternion, slot 1 of 4 (the name is a slot label, not a component).
        The component ORDER is per task and is stated in the task''s spec: scipy (x, y, z, w) where the task
        converts a rotation matrix, MuJoCo (w, x, y, z) where it reads the body''s xquat; all four zero on
        the fixture tasks that report none. On the MT10 ten: scipy on reach, push, pick_place, door_open and
        peg_insert_side; MuJoCo on drawer_open and button_press_topdown -- where it is also CONSTANT, (1,
        0, 0, 0) and (0.7074, -0.7068, 0, 0), because those bodies translate on slide joints and never rotate;
        all four components constant zeros on drawer_close, window_open and window_close'
    - index: 8
      name: object_qy
      description: object orientation quaternion, slot 2 of 4 (order per task, see object_qx)
    - index: 9
      name: object_qz
      description: object orientation quaternion, slot 3 of 4 (order per task, see object_qx)
    - index: 10
      name: object_qw
      description: 'object orientation quaternion, slot 4 of 4: the scalar w on the scipy-order tasks, z on
        the MuJoCo-order tasks, 0 where the task reports no orientation'
    - index: 11
      name: object2_x
      description: second object x -- exactly zero (padding) on every MT10 task and on every other task with
        one object; hammer carries the nail here, stick-push and stick-pull the container's insertion point
    - index: 12
      name: object2_y
      description: second object y -- zero padding (always on MT10) except on hammer, stick-push, stick-pull
    - index: 13
      name: object2_z
      description: second object z -- zero padding (always on MT10) except on hammer, stick-push, stick-pull
    - index: 14
      name: object2_qx
      description: second object quaternion, slot 1 of 4 -- zero (always on MT10) except on hammer (the nail
        body's xquat, w, x, y, z)
    - index: 15
      name: object2_qy
      description: second object quaternion, slot 2 of 4 -- zero except on hammer
    - index: 16
      name: object2_qz
      description: second object quaternion, slot 3 of 4 -- zero except on hammer
    - index: 17
      name: object2_qw
      description: second object quaternion, slot 4 of 4 -- zero except on hammer
    - index: 18
      name: prev_hand_x
      description: 'the PREVIOUS step''s hand_x, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 19
      name: prev_hand_y
      description: 'the PREVIOUS step''s hand_y, verbatim. Velocity is not observed: finite-difference s[0:18]
        - s[18:36] and divide by dt = 0.0125'
    - index: 20
      name: prev_hand_z
      description: 'the PREVIOUS step''s hand_z, verbatim. Velocity is not observed: finite-difference s[0:18]
