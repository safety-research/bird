exploits:
- name: free_credit_at_reset
  mechanism: 'One fingertip of the open gripper starts resting on the top edge of the drawer''s
    front wall, so an undirected +y push drags the drawer shut without a deliberate close (500 steps
    of pure +y: 37 of 50 instances; pure -z: 12 of 50; a single +y step moves it 1.6 cm and it
    coasts ~70 steps); once shut it stays there.'
  status: open
  closed_by: null
  note: 'Measured by BIRD: the random policy of tasks/_anchors_2026-08-25.json scores 0.1511 per-step
    on this task and 0.000 on every other MT10 task; those values are reproduced to five digits by the
    adapter''s 15-action discrete action_set draw and not by the uniform draw scripts/measure_anchors.py
    makes (that record was taken with the discrete draw). A uniform-random policy scores 0.15 per-step
    at n=100 here and at most 0.0017 elsewhere (reach). Any any-step metric is worse.'
