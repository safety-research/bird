      description: goal position z
  helpers_note: 'The seven-field `s` namespace -- obs, hand_pos, gripper_openness, obj_pos, obj_quat,
    goal_pos, action -- is identical on every MT10 spec, so a consumer that honours one Meta-World spec
    honours them all. `info` is deliberately not part of it even though the trainer passes it: Meta-World''s
    info carries `success`, and `s` reaches the candidate''s reward, so reading it there would put the
    oracle inside the barrier. obs[11:18] (a second object''s pose slots) is exactly zero on every MT10
    task and is deliberately not surfaced. Suite hazard recorded on door_open: `touching_main_object`
    raises on assets without an `objGeom`, so no contact helper is proposed until each task''s geometry
    is read.'
discrete_success:
  kind: discrete
  no_discrete_success_because: null
  shipped:
    reimplementation:
      repo: bird
      module: bird.envs.metaworld
      symbol: _success_drawer_close
      verified_against: 'info["success"] from the untouched evaluate_state, over 600 steps on each of
        the ten MT10 tasks: 0 mismatches on nine, `reach` the exception (its tcp_center is not recoverable
        from the 39-D observation, so the transcription approximates it). Resolved through the closed
        _SUCCESS_CHECKS allow-list in that module, never by importlib on this string.'
      sha256: null
    expr: float(target_to_obj <= self.TARGET_RADIUS + 0.015) = 0.065, NOT the dead _TARGET_RADIUS=0.04
      at :16
    provenance:
      path: metaworld/envs/sawyer_drawer_close_v3.py
      lines: '81'
      symbol: SawyerXYZEnv.evaluate_state
      commit: null
      sha256: 5219b0c3f87fd8432d996444b37a61fab21f78c30fc48f9b7879160d8cc25eca
    sound: false
    unsoundness: 'One fingertip of the open gripper starts resting on the top edge of the drawer''s front
      wall (contact at reset on all 50 instances, 0.1-0.3 mm gap, vertical normal; it separates under
      a zero action), so an undirected push in +y drags the drawer, which coasts on a lightly damped slide
      (0.38 kg, damping 2 N s/m; a one-step shove travels 1.6 cm over ~70 steps) and stays shut. Descent
      alone seldom does it: 500 steps of pure -z reach success on 12 of 50 instances, 500 steps of pure
      +y on 37. The start state itself is 0.168 m from the goal, 2.6x the tolerance, so nothing scores
