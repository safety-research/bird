reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/maze.py
      lines: 51-127
      symbol: MazeBase.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 5d97ac90c8487205aeda83c1df04d6e51f1c9d672bbcd19b27d6ce12b924a9f2
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.maze:MazeBase.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: '`(0.2 * (stand_reward * small_control) + 0.4 * move + 0.4 * checkpoint_proximity) * wall_collision_discount
      + stage_convert_reward`. The move term is a 2-D velocity match toward the CURRENT stage''s commanded
      direction at 2 m/s (`_MOVE_SPEED`), floored by the `(5*move+1)/6` construction; `checkpoint_proximity`
      is `tolerance(dist to the current checkpoint, margin=1)`; the collision discount watches every geom
      from `block_collision_00` up, i.e. ALL maze walls -- unlike hurdle, wall contact really is priced
      here. `stage_convert_reward` is a one-off `+100 * stage` paid by `Maze.update_move_direction` (lines
      149-196) each time the pelvis enters 0.4 m of the current checkpoint, and that stage counter lives
      on the task object in Python -- it is the reason this adapter carries an observation tail; see the
      flat_fields entry for s[151].'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: Walls and junction markers give the frame real scenery, and which corridor the robot
    is in reads clearly. What a still cannot show is the STAGE -- which checkpoint is currently commanded
    -- and upstream colours the junction markers as stages pass (reached markers turn green, the next
    turns red); the adapter reproduces that colouring from the carried stage so a rendered frame shows
    the same progress cue a live viewer would see.
  camera:
    name: cam_maze
    mode: tracking
    note: '`cam_maze` is the task''s own camera: a `mode="trackcom"` camera on the pelvis like `cam_default`,
      but 3 m ahead of the robot, 3 m to its left and 3 m up (read off the live camera pose),
      high enough that the walls and junction markers around the
      robot stay in frame, so which corridor it is in reads in a way the lower default camera could not
      show. It moves with the robot, so absolute progress along the route is not visible; the recoloured
      junction markers are the progress cue.'
  extra_views:
  - name: overhead
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 4 m directly above: the robot and everything
      within about two metres of it seen in plan, for where it is relative to nearby objects and which
      way it is heading. Height and posture do not read from here. The walls around the robot and the
      corridor it is in read in plan.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_x
  - pelvis_y
  - maze_stage
domain_randomization: null
exploits:
- name: spawn_checkpoint_is_free
  mechanism: The checkpoint list begins with (0, 0) -- the spawn itself -- so the first call to `update_move_direction`
    finds the pelvis already inside the 0.4 m radius, advances the stage and pays `+100 * 1` before the
    robot has taken any action. One hundred reward for existing, once per episode.
  status: open
  closed_by: null
  note: Arithmetic from the source (`checkpoints[0]` is `[0, 0, 1]` and `dist_cp < 0.4` at reset), not
    observed in a rollout. BIRD's metric counts only the three checkpoints that require travel,
    so the free advance is worth exactly nothing to it.
- name: move_floor_and_proximity_pay_for_parking
  mechanism: '`(5*move+1)/6` floors the move term at 1/6 however still the robot stands, and `checkpoint_proximity
    = tolerance(dist, margin=1)` pays partial credit per step for merely being NEAR the current checkpoint.
    A robot that walks one leg and then parks beside the junction collects roughly 0.2 * stand + 0.4/6
    + 0.4 * proximity every step for the rest of the episode -- income for waiting, at the reward''s second-largest
    weight.'
  status: open
  closed_by: null
  note: 'Arithmetic from the source, not observed in a rollout. BIRD''s metric is a high-water
    progress fraction: parking freezes it at the value already earned, while the reward keeps accruing
    per step. The gap between the two over an episode is the measurement.'
- name: wall_contact_undetectable_in_state
  mechanism: The 0.1 wall-collision discount reads the live contact list, which is not a function of the
    recorded observation -- two states with identical qpos+qvel can differ in whether a wall contact fired
    during the preceding step. A candidate reward can neither reproduce nor be audited against it from
    state alone.
  status: undetectable_here
  closed_by: null
  note: 'Recorded for honesty: BIRD''s metric does not attempt a contact term. Unlike hurdle, the shipped
    reward''s own discount does watch every wall here, so wall-scraping is at least priced by the reference
    reward.'
