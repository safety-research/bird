  kind: continuous_only
  no_discrete_success_because: 'This task ships no boolean success check: `MazeBase.get_terminated` is
    a collapse terminal (pelvis below 0.2 m) and never a success, and the stage counter reaching 4 switches
    the move term to 1 without ending the episode. `success_bar` (1200) is a threshold on the episode
    RETURN of the shipped reward, a different quantity. The stage counter itself is the closest thing
    to a success signal and BIRD''s metric is built on the same geometry that advances it.'
