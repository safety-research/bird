continuous_success:
  raw:
    name: maze_checkpoints_reached_fraction
    expr: '(k + clip(1 - min_dist_to_next / leg_length, 0, 1)) / 3, where k counts how many of the three
      real checkpoints -- (3, 0), (3, 6), (6, 6), radius 0.4 m, in order -- the pelvis has entered, and
      the fractional term is the best approach toward the first unreached checkpoint over that checkpoint''s
      own leg length (3 m, 6 m, 3 m). The spawn checkpoint (0, 0) is not counted: the robot starts inside
      it. bird/envs/humanoid_hand.py::H1HandMaze.task_metric'
    unit: fraction of the maze's three checkpoints reached, with partial credit for the leg in progress
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.33
