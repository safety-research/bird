# h1hand_maze -- HumanoidBench `h1hand-maze-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 0 scene joint(s) and 1 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/maze's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_maze
env:
  env_id: h1hand-maze-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: 'The episode ends immediately if the pelvis drops below 0.2 m -- that is, if the robot
      collapses. Otherwise it runs its full 1000 steps: reaching the goal corner does not end the episode,
      it just switches the move term to full marks.'
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 2416-2421
      symbol: H1HandMaze._task_reset
    rng_note: One draw on the stream, the base `uniform(size=76)` at 942; `_task_reset` (2218-2223) resets
      the stage latch and repaints the markers and draws nothing.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 76 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_maze.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: maze_stage
      value: '0 -- the checkpoint counter is reset to the spawn checkpoint, so the current target is (3,
        0), then (3, 6), then (6, 6) (`_MAZE_CHECKPOINTS`, 2076): a fixed route whose waypoints never
        move. Carried in the observation tail.'
      fields:
      - maze_stage
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2416-2421
        symbol: H1HandMaze._task_reset
      basis: read
    - role: command
      quantity: move_direction
      value: (1, 0, 0) -- the commanded direction at stage 0 (`_MAZE_DIRECTIONS[0]`, 2087-2088), set on
        the task object by `_restore_extra`; not in the observation, the reward reads it.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2386-2407
        symbol: H1HandMaze._restore_extra
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and `Maze.reset_model` (maze.py:198-201) draws
      nothing; this adapter draws everything from the episode Generator (`_reset`, 941-944), so a BIRD
      episode is reproducible from its seed where an upstream one is not. Dressing only: the adapter repaints
      the four junction markers from the restored stage at every reset, where upstream recolours them
      only inside `get_reward` and never resets them, so an upstream second episode starts wearing the
      first one''s greens.'
    prompt_states: The robot spawns at the origin, which is itself the first (free) checkpoint.
    prompt_field: scene
    prompt_omits:
    - agent_pose
