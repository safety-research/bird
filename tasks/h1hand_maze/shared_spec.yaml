    description: right thumb tip flexion -- angular velocity, rad/s
  - index: 151
    name: maze_stage
    description: 'the reward''s checkpoint stage: 0 until the (free) spawn checkpoint registers, then
      1 after (0,0), 2 after (3,0), 3 after (3,6), 4 after the goal (6,6). Stages 0-1 command +x, 2 commands
      +y, 3 commands +x, and at 4 the move term is fixed at full marks. Advances when the pelvis comes
      within 0.4 m of the current checkpoint; never goes back down within an episode.'
