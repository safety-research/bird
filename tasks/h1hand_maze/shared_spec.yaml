    description: = s[82:151], the sixty-nine hinge velocities in rad/s
    kind: inline_expression
    expression: s[82:151]
  - name: maze_stage
    signature: maze_stage(s)
    description: = s[151], the reward's checkpoint counter (0 at reset, 4 at the goal)
    kind: inline_expression
    expression: s[151]
