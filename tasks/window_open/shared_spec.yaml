symbol_mapping:
  # the check is one-axis: the goal marker sits 9.5 cm off the handle's line of travel in y, so a 3-D
  # norm has a floor of ~0.10 m and can never enter the 0.05 m success region
  distance_to_goal: np.abs(s[4] - s[36])
  object_to_goal: np.abs(s[4] - s[36])
  handle_to_goal_x: (s[4] - s[36])
  gripper_to_object: np.linalg.norm(s[0:3] - s[4:7])
  gripper_to_goal: np.linalg.norm(s[0:3] - s[36:39])
  hand_position: s[0:3]
  object_position: s[4:7]
  object_orientation: s[7:11]
  object_height: s[6]
  goal_position: s[36:39]
  gripper_open: s[3]
  hand_velocity: ((s[0:3] - s[18:21]) / 0.0125)
  object_velocity: ((s[4:7] - s[22:25]) / 0.0125)
  action_magnitude: np.linalg.norm(a[0:3])
  gripper_action: a[3]
