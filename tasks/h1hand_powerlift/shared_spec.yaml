description:
  natural_language: >-
    Lift the barbell off the floor and raise it, then hold it up. The barbell is a loaded bar lying
    on the ground half a metre in front of the robot; it weighs about 104 kg, roughly twice the robot's
    own mass, so it has to be gripped and driven up by the legs and back rather than plucked with
    the arms. Staying upright while never touching the bar does not count as doing this task, and
    neither does tipping the bar over or dragging it along the floor.
  l_task: >-
    Lift the barbell off the floor and raise it, then hold it up. The barbell is a loaded bar lying
    on the ground half a metre in front of the robot; it weighs about 104 kg, roughly twice the robot's
    own mass, so it has to be gripped and driven up by the legs and back rather than plucked with
    the arms. Staying upright while never touching the bar does not count as doing this task, and
    neither does tipping the bar over or dragging it along the floor.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    In front of the robot, half a metre away and lying on flat ground, is a barbell: a 1.3 m steel
    post with a 0.2 m-radius weight plate on each end, one free body of about 104 kg. Nothing constrains
    it -- it can be lifted, tipped, rolled, or ignored. The episode ends early if the pelvis drops
    below 0.2 m.
  scene: >-
    Flat infinite ground, a standing humanoid with two five-fingered hands, and a barbell resting
    on the floor half a metre in front of it with its axis across the robot's line of sight. Nothing
    else is in the scene: no target marker, no rack, and no indication of how high the bar is meant
    to go.
  success_criterion_prose: null
