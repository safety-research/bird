reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/powerlift.py
      lines: 63-96
      symbol: Powerlift.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: a9c97daa5b2653152f47675c63d442547f920328784b6747a3fefe7f24d37e63
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.powerlift:Powerlift.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `0.2 * (small_control * stand_reward) + 0.8 * reward_dumbbell_lifted`, where `stand_reward =
      standing * upright` over the head height and torso uprightness, and `reward_dumbbell_lifted =
      tolerance(dumbbell_z, bounds=(1.9, 2.1), margin=2)`. THIS IS THE ARTIFACT UNDER CRITICISM, not
      a baseline BIRD is trying to match -- see `exploits`. Read against source at cb11890, not
      executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    BIRD's gate, and it is a different SET from the flat list above rather than a superset. Three
    of the four name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `_env` -- which are not
    properties of the task; they are the routes by which a candidate could reach the quantity it is
    scored on IN THIS REPO. `success_bar` is the fourth and it is a BENCHMARK symbol: HumanoidBench
    declares one on every task class, and while nothing upstream reads it, a candidate that found
    it would be reading a threshold on the shipped reward's own episode return.


    `success` IS DELIBERATELY ABSENT. Listing it would reject any candidate that names its own
    proxy `success`, which on Meta-World rejected 15 of 15 candidates (tasks/drawer_close). An
    identifier gate on this word is both too strict and too weak -- a candidate that spells the same
    quantity `hit` passes either way.


    The defence that does hold is STRUCTURAL and needs no gate: a generated reward can influence the
    POLICY and nothing else, and `success()` here is a threshold on `task_metric`, which IS gated.
    A candidate that re-derives the check from the observation has written a sparse reward -- a legitimate
    design point that trains poorly at this tier's budget and loses on its merits.
judge:
  vlm_legible: true
  legibility_note: >-
    A barbell on the floor and a barbell overhead are trivially different pictures, which makes this
    one of the most VLM-legible tasks in the suite. What frames do NOT show is grip: the Shadow
    Hand renders at a few dozen pixels, so whether the bar is held or balanced is not readable.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis, so the robot stays centred. That
      hides absolute travel, which does not matter here -- this task is about a height, and height
      relative to the robot is exactly what the frame shows.
  extra_views:
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, with the robot at about three
      times the pixels the default camera gives it. Where the robot is in the room is not
      visible from here. Shows whether the bar is in the hands or resting on them.
  - name: side
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from its right-hand side, level with it
      and 3 m away: a side profile in which lean, gait, crouch and the height of anything
      held read directly. It moves with the robot, so absolute position is not visible; only
      the floor grid slides past. The bar's height against the body reads directly in
      profile.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - barbell_z
  - pelvis_z
  - barbell_z_minus_pelvis_z
domain_randomization: null
exploits:
- name: stand_still_and_collect
  mechanism: >-
    The reward is `0.2 * (small_control * stand_reward) + 0.8 * reward_dumbbell_lifted`. A robot that
    simply stands upright and never touches the barbell collects the whole 0.2 stand term for all
    1000 steps and pays nothing, and because the episode terminates only on collapse it is never cut
    short. Over an episode that is a large, monotone, entirely lift-free return.
  status: open
  closed_by: null
  note: >-
    This is the shipped reward's central defect, so it is open by design and must stay open: closing
    it would change the reward being described. A later paper excluded powerlift from its own study on the grounds
    that the reward gives no appropriate signal for actually lifting the barbell. BIRD's `task_metric`
    is deliberately blind to the stand term -- it scores 0.0 for this behaviour -- so the gap between
    fitness and return IS the measurement.
- name: barbell_term_pays_at_rest
  mechanism: >-
    `reward_dumbbell_lifted = tolerance(dumbbell_z, bounds=(1.9, 2.1), margin=2)`. A margin of 2 m
    on a bound at 1.9 m means the kernel is still paying out at the barbell's resting height of 0.2
    m, so the 0.8-weighted term is not zero for a barbell that has never moved. The reward's largest
    component therefore does not distinguish 'untouched' from 'slightly nudged'.
  status: open
  closed_by: null
  note: >-
    Measured off the source, not inferred: bounds and margin are literals in `Powerlift.get_reward`.
    The interaction with the exploit above is what makes the task hard to learn from this reward at
    all -- both of its terms are already partly satisfied at t=0.
- name: tip_or_roll_instead_of_lift
  mechanism: >-
    The barbell is a free body with 0.2 m weight plates. Tipping it up on one plate raises its centre
    without any load being taken, and the reward reads only `xpos['dumbbell', 'z']`, which has no
    notion of the robot holding it.
  status: undetectable_here
  closed_by: null
  note: >-
    BIRD's `task_metric` does not close this either -- it also reads only the barbell's height, relative
    to the pelvis. Recorded so it is a known property of both the reward and the metric rather than
    a surprise in a rollout video. Closing it would need a contact or grasp conjunct, which is not
    in the observation.
