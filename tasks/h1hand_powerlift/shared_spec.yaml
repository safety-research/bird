# h1hand_powerlift -- HumanoidBench `h1hand-powerlift-v0` on the Unitree H1 with two Shadow Hands.
#
# THIS TASK'S SHIPPED REWARD HAS DOCUMENTED DEFECTS. `exploits` below records each one: a
# documented way in which the published reward pays for something other than the task,
# recorded as data rather than prose so that tooling and a screen can both read it. They
# are `status: open` BY DESIGN -- they describe the shipped reward as published, which
# BIRD does not modify.
#
# CONSEQUENCES, ACCEPTED AND NOT BUGS. There is no trustworthy ground-truth fitness and no
# human-designed reference reward here: `anchors.expert` is null, `anchors.random` is
# unmeasured, `budget.learning_verified.verified` is false, and `evaluate.fitness.source:
# none` is the right setting for a run on this task. `continuous_success` is a STATED
# PROXY built from state and fixed scene geometry -- read its `formula` before quoting a
# number from it.
#
# DERIVED, NOT TRANSCRIBED. Every row of `flat_fields`, every entry of `action_fields` and
# every joint range came from building `assets/envs/h1hand_pos_powerlift.xml` with mujoco==3.1.6
# against humanoid-bench cb11890; `tests/test_humanoid_hand.py::
# test_the_flat_fields_are_the_models_own_joint_table` rebuilds the table from the live
# model and fails if this file drifts from the asset.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.

schema_version: 1
id: h1hand_powerlift
env:
  env_id: h1hand-powerlift-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately if the pelvis drops below 0.2 m -- that is, if the robot collapses.
      Otherwise it runs its full 1000 steps. There is no way to finish early by succeeding.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: _H1HandBase._reset
      lines: 936-986
    rng_note: >-
      One call, `rng.uniform(-0.01, 0.01, size=83)` (line 942), and nothing else: H1HandPowerlift defines
      no `_task_reset`, so the base hooks are the identity (lines 970-978). `domain_randomization` is null
      on this spec, so no DR draw precedes it (bird/envs/base.py:401-406).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 83 position coordinates
          (76 robot + 7 barbell, the barbell's described separately; metres on the pelvis position, radians
          on the 69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The keyframe
          stands the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity quaternion.
          The four pelvis quaternion components are perturbed componentwise and then renormalised by `set_state`'s
          `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal box: keyframe
          plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: object_pose
      quantity: barbell_keyframe_noise
      fields:
      - s.dumbbell_pose
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- entries 76:83: the barbell's
          keyframe pose (0.5, 0, 0.2) m with the identity quaternion (`h1hand_pos_powerlift.xml` `<key>`,
          resting on the floor 0.5 m ahead), plus U(-0.01, 0.01) on x, y, z (m) and on each quaternion component,
          renormalised by `mj_forward`.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_powerlift.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: barbell_velocities
      fields:
      - s.dumbbell_vel
      value: >-
        0 -- the barbell's six velocities start at rest: the keyframe carries no qvel (`assets/envs/h1hand_pos_powerlift.xml`
        `<key>` declares `qpos` only) and no hook writes a velocity.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
        symbol: _H1HandBase._reset
      basis: read
    - role: goal
      quantity: goal
      value: >-
        none -- no target height or marker. `task_metric` is RELATIVE: the fraction of arriving steps with
        barbell z (s[78]) above pelvis z (s[2]) while pelvis z >= `_POWERLIFT_STANDING_Z` = 0.5 m (line
        510); both operands are state, neither is a reset draw.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1403-1420
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Powerlift` adds nothing (`class Powerlift(Task)`, powerlift.py:16;
      no `reset_model`, so `Task.reset_model`, tasks.py:44-45, just returns the observation); this adapter
      draws everything from the episode Generator (`_reset`, 941-944), so a BIRD episode is reproducible
      from its seed where an upstream one is not.
    prompt_states: The barbell is a loaded bar lying on the ground half a metre in front of the robot
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
