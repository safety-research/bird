reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/window.py
      lines: 62-162
      symbol: Window.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 3eb811d9f8d16d0a799a44686a1c236cfae833c71f629b9ef38071018fed71ea
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: 'H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads'
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.window:Window.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: '`0.5 * manipulation + 0.5 * window_contact_filter * window_contact_reward`, where manipulation
      is `0.2 * (stand * small_control * head_distance) + 0.4 * moving_wipe + 0.4 * hand_tool_proximity`.
      Three readings worth having before trusting a number from it: `moving_wipe` pays for the tool''s
      VERTICAL SPEED anywhere in space, gated by nothing; the contact half is gated by a live contact-pair
      scan between the wipe blade and the pane (binary, not in the state); and `head_distance` is a kernel
      on how far the robot''s HEAD has moved from where it spawned -- `reset_model` stores `head_pos0`
      on the task object, which is why this adapter carries a three-slot observation tail.'
  contract:
    signature: "def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:\n    # single env,\
      \ plain NumPy; `s` is the flat observation documented above"
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, not a batch. Single environment, plain NumPy: return a Python float for
      `reward` and a float for each entry of `components`.'
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: 'The same gate as the other h1hand specs, for the same reasons: three of the
    four BIRD entries name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in
    this repo -- and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could
    find, a threshold on the shipped reward''s own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is structural, because
    `success()` here is a threshold on `task_metric`, which IS gated.'
judge:
  vlm_legible: true
  legibility_note: Tool-in-hands and tool-at-glass both read clearly in a frame; SWEEPING does not --
    motion is exactly what a still cannot show, and the sweep is the half of the task the reward's moving_wipe
    term prices. A judge sees posture and contact geometry, not wiping.
  camera:
    name: cam_hand_visible
    mode: tracking
    note: '`cam_hand_visible` is the task''s own camera, framing the hands and the tool -- what a manipulation
      judge needs, at the cost of hiding the lower body.'
  extra_views:
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past. The
      wiper''s stroke across the pane reads in profile.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: overhead
    mode: tracking
    note: 'Camera following the robot''s centre of mass from 4 m directly above: the robot and everything
      within about two metres of it seen in plan, for where it is relative to nearby objects and which
      way it is heading. Height and posture do not read from here.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  subtasks_sequential: false
  telemetry_fields:
  - tool_z
  - tool_vz
  - pelvis_z
domain_randomization: null
exploits:
- name: air_wiping_pays_without_the_window
  mechanism: '`moving_wipe = tolerance(|tool subtree vertical speed|, bounds=(0.5, 0.5), margin=0.5)`
    reads speed and nothing else -- no position gate, no contact gate. With `hand_tool_proximity` (0.4
    weight) satisfied by simply holding the tool, a robot standing anywhere shaking the wiper up and down
    collects nearly the whole manipulation half -- about 0.45 per step of the 1.0 maximum -- while never
    approaching the window. The contact-gated half stays 0, but half of a reward for free is a strong
    local optimum.'
  status: open
  closed_by: null
  note: 'Arithmetic from the source, not observed in a rollout. The metric''s position gate
    is what falsifies it: shaking the tool in the air scores exactly 0.0 here, because the wiper head
    is nowhere near the pane.'
- name: press_without_sweeping
  mechanism: The contact half (`window_contact_filter * window_contact_reward`) pays for the blade TOUCHING
    the pane with the contact sites at the right depth -- a static press satisfies it completely, since
    only `moving_wipe` (0.4 of the OTHER half) prices motion. Pressing the wiper to the glass and holding
    still collects roughly 0.75 of the maximum per step while wiping nothing.
  status: open
  closed_by: null
  note: 'Arithmetic from the source, not observed in a rollout. The metric''s sweep conjunct
    (|tool vertical velocity| >= 0.25 m/s) reads the static press as 0.0. That conjunct does not close
    the loophole for a press that moves: see `rock_the_pole_on_a_planted_blade` below.'
- name: rock_the_pole_on_a_planted_blade
  mechanism: Both the reward's `moving_wipe` term and the metric's sweep conjunct read the TOOL's centre-of-mass
    vertical velocity (`window_wiping_tool_subtreelinvel`, dominated by the 1 m pole), not the blade's
    motion on the glass. Rocking the pole about a blade held nearly still on the pane therefore passes
    the sweep check and earns the wipe term while the blade scrubs a few centimetres -- the press above,
    with the pole doing the sweeping.
  status: open
  closed_by: null
  note: 'Follows from the source: both terms read the tool''s centre-of-mass velocity, not the
    blade''s. A sweep check on the blade''s own velocity would close it.'
- name: blade_contact_undetectable_in_state
  mechanism: The contact filter reads the live contact list, which is not a function of the recorded observation.
    The metric's 0.10 m standoff gate is a proximity PROXY for pressing -- a blade hovering nine centimetres
    off the glass while sweeping reads the same as one pressed against it.
  status: undetectable_here
  closed_by: null
  note: 'Recorded for honesty: contact is not in the state, so no state-function can distinguish a genuine
    press from a close hover. The reward''s own filter does price it.'
