# h1hand_window -- HumanoidBench `h1hand-window-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec
# (robot block spliced, 2 scene joint(s) and 3 tail dim(s) generated from the target model), after scripts/derive_humanoid_facts.py confirmed
# h1hand/window's own model carries the identical robot: the same 61 actuators
# and the same 76+75 qpos/qvel robot block. The observation table below is
# therefore the target model's fact, not a resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_window
env:
  env_id: h1hand-window-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: The episode ends immediately if the pelvis drops below 0.58 m, OR if the wiping tool
      falls below 0.58 m -- dropping the tool ends the episode just as falling does. There is no success
      terminal.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 2822-2833
      symbol: H1HandWindow._task_reset_state
    rng_note: One draw on the stream, the base `uniform(size=87)` at 942; the hook (2613-2624) sets the
      state, READS the head site and draws nothing.
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 87 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    - role: object_pose
      quantity: tool_keyframe_noise
      fields:
      - s.tool_pose
      distribution:
        family: uniform
        text: the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the wiper handle's seven free-body coordinates
          about its keyframe at (0.45, 0, 1.085), identity orientation (the body's XML `pos` is z = 1.2;
          the keyframe qpos is what `_init_qpos` reads). Free-body quaternions are perturbed componentwise
          and renormalised by `mj_forward`, so all four components move.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: '`h1hand_pos_window.xml` writes this quaternion and the wiper head''s as `0 0 0 0` in the
        keyframe text. MuJoCo''s compiler normalises them to the identity in `model.key_qpos` (checked
        under mujoco 3.1.6, the adapter''s pin, in a throwaway venv: the compiled keyframe reads 1 0 0
        0), so `_init_qpos` (line 816) holds the identity and the jitter is about it -- not a random direction
        on the 3-sphere, which is what adding noise to a literal zero quaternion and normalising would
        give.'
    - role: object_pose
      quantity: wiper_head_keyframe_noise
      fields:
      - s.wiper_head_quat
      distribution:
        family: uniform
        text: 'the SAME base draw as the robot''s -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos
          coordinates, scene joints included -- applied to the wiper head''s ball-joint quaternion about
          the identity: four components perturbed componentwise, then renormalised by `mj_forward`, so
          all four move (measured under mujoco 3.1.6: |q| = 1.0057 in, 1.0 out).'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    - role: agent_pose
      quantity: head_pos0
      fields:
      - s.head_pos0
      distribution:
        family: derived
        text: 'the ROBOT''s `head` site (a torso site in `h1hand_pos.xml`, local (0, 0, 0.7)) in world
          coordinates, read off the already-set perturbed state (2620-2623): forward kinematics of the
          pelvis pose and torso joints, stored on the task object as the reward''s head-anchor and carried
          in the tail. Not the wiper head, and not a draw of its own -- upstream `Window.reset_model`
          (window.py:171-173) makes the same read.'
      derived_from: robot_keyframe_noise
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2829-2832
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_window.xml` declares `qpos` only, so MuJoCo's
        `key_qvel` is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: tool_velocities
      value: '0 -- the handle''s six velocities start at rest: the keyframe carries no qvel and the hook
        writes none.'
      fields:
      - s.tool_vel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: wiper_head_angvel
      value: '0 -- the head''s three angular rates start at rest: the keyframe carries no qvel and the
        hook writes none.'
      fields:
      - s.wiper_head_angvel
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: goal
      value: 'none as a drawn object -- the glass is fixed geometry (window body at x = 1: pane near face
        x = 0.95, |y| <= 0.95, 0.70 <= z <= 1.91), which is what `task_metric` compares the wiper head
        against; the reward''s own anchor is `head_pos0`, listed as a derived draw.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2835-2857
        symbol: H1HandWindow.task_metric
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and `Window.reset_model` (window.py:171-173)
      draws nothing; this adapter draws everything from the episode Generator (`_reset`, 941-944), so
      a BIRD episode is reproducible from its seed where an upstream one is not.'
    prompt_states: the robot starts holding a metre-long wiper whose head pivots on the end of the handle
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
