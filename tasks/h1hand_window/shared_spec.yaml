discrete_success:
  kind: continuous_only
  no_discrete_success_because: 'This task ships no boolean success check: `Window.get_terminated` reports
    two kinds of FAILURE (pelvis or tool below 0.58 m) and never a success, and `success_bar` (650) is
    a threshold on the episode RETURN of the shipped reward, a different quantity. There is no notion
    of "the window is clean" anywhere in the code -- the task is the sustained activity.'
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: window_wiping_horizon_fraction
    expr: '(number of arriving states with [ wiper head within 0.10 m of the pane''s near face (head_x
      >= 0.85), inside the glass extent (|head_y| <= 0.95, 0.70 <= head_z <= 1.91), and the tool sweeping
      (|tool vertical velocity| >= 0.25 m/s) ]) / 1000 -- NORMALISED BY THE FULL HORIZON, because dropping
      the tool terminates: a visited-states mean would score a wipe-then-drop near 1.0. The head position
      is forward kinematics of the carried tool pose (s[76:83]) and its own local offset; the pane plane
      and glass extent are fixed scene facts; the 0.10 m standoff and the 0.25 m/s sweep floor are stated
      conventions, NOT the reward''s constants (its site bound is 0.92, its sweep kernel peaks at 0.5).
      bird/envs/humanoid_hand.py::H1HandWindow.task_metric'
    unit: fraction of the full 1000-step horizon spent actually wiping the glass
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: identity -- the raw metric is already a fraction in [0, 1]
    success_threshold: 0.25
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: 'NOT MEASURED: no uniform-random population has been scored on this task, so read any number
      from it as unanchored. A uniform-random policy is expected to score ~0.0: random position targets
      take a 61-DoF humanoid to the floor within a couple of seconds, mean forward displacement stays
      around zero, and the pelvis terminal at 0.2 m ends the episode early.'
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: 'No expert exists in any sense the schema accepts: no scripted policy, no demonstrations,
      and HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None and
      fitness stays RAW, per the absence-is-explicit rule.'
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 613.33
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 111.24
      env_steps: 32000000
      success_bar: 650.0
      success_bar_source: humanoid-bench @ cb11890 (this spec's pinned commit), humanoid_bench/envs/window.py:45
        (`success_bar = 650`).
      source: 'FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_window
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final point
        of the authors'' released plotting data behind that figure (data/humanoidbench_result.json @ 77922d0
        in younggyoseo/FastTD3, committed 2025-09-21), key h1hand_window; std is half the released band
        width (return_min/return_max are exactly mean -/+ std).'
      note: 'A published BASELINE in HB episode-return units -- not this spec''s task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation point of
        the paper''s own training run, not a separately evaluated frozen policy. Below the task''s 650
        success bar. The released log runs past Figure 9''s 10,800 s x-limit (final point at 18,783 s
        / 32.0M steps; ~646 at the visible end). THE VERDICT IS INSIDE THE SPREAD: 613.33 +/- 111.24 straddles
        the 650 bar, so the three runs behind this mean do not agree on which side of it the task fell
        -- the mean is below it, which is not the same claim.'
