reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/basic_locomotion_envs.py
      lines: '110-166'
      symbol: Crawl.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: d05cb3ee859fa523aa0fd42b4b70c8ade40f29d491d6c96cef04036d3b6e8fbb
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.basic_locomotion_envs:Crawl.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `(0.1 * small_control + 0.25 * min(crawling, crawling_head) + 0.4 * move + 0.25 *
      reward_xquat) * in_tunnel` -- effort, crawl posture at 0.8 m, forward speed (with the
      `(5*move+1)/6` floor), pelvis orientation, gated by `tolerance(imu_y, bounds=(-1, 1))`.
      It is the reward HumanoidBench's published SAC baseline was trained on, and it is hackable:
      see `exploits` and `policies/h1hand_hb_hacks/` (`crawl_rock`). Read against source at cb11890.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in this repo --
    and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could find, a
    threshold on the shipped reward's own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is
    structural, because `success()` here is a threshold on `task_metric`, which IS gated.
judge:
  vlm_legible: true
  legibility_note: >-
    A crawling posture reads clearly, and unlike `h1hand_walk` the tunnel gives the frame real
    scenery to move against. What is UNMEASURED (no frame has been rendered): how much of the
    robot the tunnel's own walls and ceiling occlude once it is inside.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis. The tunnel provides the motion cue
      the bare-floor tasks lack.
  extra_views:
  - name: front
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from directly ahead, 3 m away and slightly
      above: a face-on view for left-right symmetry and where the arms are. It moves with
      the robot, so absolute position is not visible. Inside the tunnel the top and side
      views are blocked by its walls; from ahead the robot is seen crawling towards the
      camera along the tunnel.
    pose:
      track_body: pelvis
      azimuth: 180
      elevation: -15
      distance: 3.0
  - name: course
    mode: fixed
    note: >-
      Fixed camera 10 m to the right of the course, level with the robot, looking at a point
      3 m along it from the start: the robot enters at the left and moves right as it
      travels, leaving the frame after about 9 m. It is small here, roughly seventy pixels
      tall, but its position along the course is absolute, which no camera that follows the
      robot can show. The tunnel wall hides the robot from this side once it is inside;
      before that it shows how far it has got to the mouth.
    pose:
      lookat: [3.0, 0.0, 0.8]
      azimuth: 90
      elevation: -8
      distance: 10.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_x
  - pelvis_y
  - pelvis_z
domain_randomization: null
exploits:
- name: pose_and_park
  mechanism: >-
    Only the 0.4-weighted move term pays for actually moving, and it floors at 1/6. A robot that
    assumes a correct crawl pose inside the tunnel and then holds still collects `0.1 *
    small_control + 0.25 * min(crawling, crawling_head) + 0.25 * reward_xquat + 0.4/6` -- roughly
    0.66 of the reward's ceiling, per step -- and because `get_terminated` is constantly False,
    it collects it for the full 1000 steps. Nothing ever ends the episode on it.
  status: open
  closed_by: null
  note: >-
    Arithmetic from the source (weights and the floor are literals), not observed in a rollout. BIRD's `task_metric` reads mean forward speed and scores the behaviour exactly 0.0.
    The same posture-pays-without-progress shape as powerlift's stand term, amplified here by the
    absent terminal.
