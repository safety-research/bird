judge:
  vlm_legible: true
  legibility_note: 'Gait reads clearly in a frame but SPEED DOES NOT: a still of a running humanoid and
    a still of a walking one differ only in posture, and the axis this task scores is velocity. A VLM
    judging stills cannot separate 1 m/s from 5 m/s, which is precisely the distinction between this task
    and walk.'
  camera:
    name: cam_default
    mode: tracking
    note: '`cam_default` is a `mode="trackcom"` camera on the pelvis, so the robot stays centred and absolute
      travel is hidden. On a scenery-free plain this hides almost all progress.'
  extra_views:
  - name: course
    mode: fixed
    note: 'Fixed camera 10 m to the right of the course, level with the robot, looking at a point 3 m
      along it from the start: the robot enters at the left and moves right as it travels, leaving the
      frame after about 9 m. It is small here, roughly seventy pixels tall, but its position along the
      course is absolute, which no camera that follows the robot can show. At running speed the robot
      crosses this frame in a few seconds; a run that never enters from the left did not move.'
    pose:
      lookat:
      - 3.0
      - 0.0
      - 0.8
      azimuth: 90
      elevation: -8
      distance: 10.0
  - name: side
    mode: tracking
    note: 'Camera following the robot''s centre of mass from its right-hand side, level with it and 3
      m away: a side profile in which lean, gait, crouch and the height of anything held read directly.
      It moves with the robot, so absolute position is not visible; only the floor grid slides past.'
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_x
  - forward_velocity
  - pelvis_z
domain_randomization: null
exploits:
- name: move_floor_pays_standing
  mechanism: '`move = (5 * tolerance(com_vx, bounds=(5, inf), margin=5, linear) + 1) / 6` floors at 1/6
    for any velocity at or below zero, so a robot that simply stands upright collects `small_control *
    stand_reward / 6` -- roughly 0.16 per step -- for all 1000 steps while travelling nowhere. Identical
    in construction to walk''s instance of the same floor, and WORSE in effect here: the bound it is measured
    against is five times further away, so the free 1/6 is a larger share of what a policy can realistically
    reach.'
  status: open
  closed_by: null
  note: Arithmetic from the source (the floor is a literal), not observed in a rollout. BIRD's
    `task_metric` reads mean forward speed and scores standing exactly 0.0.
- name: success_bar_not_raised_for_the_harder_speed
  mechanism: '`Run` sets `_move_speed = _RUN_SPEED` but does not override `success_bar`, so it inherits
    Walk''s 700 while asking for five times the velocity. A return that would be a mediocre walk clears
    the same bar as a competent run, which makes the published bar a much weaker claim on this task than
    on the one it was chosen for.'
  status: open
  closed_by: null
  note: 'A defect in the BENCHMARK''S REPORTING rather than in the reward -- it cannot be exploited by
    a policy, only by a table. Recorded because BIRD never adopts `success_bar` as its metric, and this
    is a concrete instance of why: `continuous_success` above is measured against the task''s own 5 m/s
    bound, not against 700.'
