# h1hand_run -- HumanoidBench `h1hand-run-v0` on the Unitree H1 with two Shadow Hands.
#
# DERIVED from the h1hand_walk spec,
# which was accepted as the donor only after
# scripts/derive_humanoid_facts.py confirmed h1hand/run's own model has the
# same 61 actuators and the same 151 qpos+qvel
# block. The observation table below is therefore the target model's fact, not a
# resemblance to another task's.
#
# Everything task-specific -- the prose, the scene, the reward reference, the
# metric and the exploits -- was authored per task and read off upstream's
# source; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.
schema_version: 1
id: h1hand_run
env:
  env_id: h1hand-run-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: The episode ends immediately if the pelvis drops below 0.2 m. Nothing else ends it.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      lines: 936-986
      symbol: _H1HandBase._reset
    rng_note: 'One draw on the stream: `rng.uniform(-0.01, 0.01, size=n_q)` at line 942. The task defines
      no reset hook, so `_task_reset` is the base identity (970-972).'
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: 'keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 76 position coordinates
          (metres on the pelvis position, radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream''s
          `DEFAULT_RANDOMNESS`). The four pelvis quaternion components are perturbed componentwise and
          then renormalised by `set_state`''s `mj_forward`, so all four move. No literal box: keyframe
          plus noise.'
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: 'Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read
        from a checkout of that commit) -- humanoid_bench is neither installed nor vendored, so nothing
        in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS = 0.01`; `env.py:229-242`
        `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r, r, size=nq)` added to qpos
        with qvel untouched, then the task''s own `reset_model`.'
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      value: 0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943),
        and the single `<key>` in `assets/envs/h1hand_pos_run.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: goal
      value: none -- no target; `H1HandRun.task_metric` is mean forward pelvis speed from the spawn against
        the task's own 5 m/s, and the ground is open in every direction.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 2026-2041
        symbol: H1HandRun.task_metric
      basis: read
    stochastic_transitions: null
    upstream_divergence: 'RNG source only, not distribution: upstream draws the keyframe perturbation
      from gymnasium''s per-env `np_random` (`env.py:238`) and `Run` adds nothing (`class Run(Walk)`,
      basic_locomotion_envs.py:105-107; neither defines `reset_model`); this adapter draws everything
      from the episode Generator (`_reset`, 941-944), so a BIRD episode is reproducible from its seed
      where an upstream one is not.'
    prompt_states: a standing humanoid with two Shadow Hands
    prompt_field: scene
    prompt_omits:
    - agent_pose
  spaces:
    obs_dim: 151
    action_dim: 61
    action_low: -1.0
    action_high: 1.0
    action_semantics: Sixty-one position targets, each in [-1, 1]. -1 and +1 are the two ends of that
      actuator's OWN range, so the same number means a different angle at different joints. These are
      targets for a position servo, not torques.
    action_fields:
    - name: left_hip_yaw
      low: -1.0
      high: 1.0
      description: 'left hip yaw -- the whole leg rotated about the vertical axis. A POSITION TARGET:
        -1 and +1 are the two ends of this actuator''s own range, [-0.43, 0.43] rad'
    - name: left_hip_roll
