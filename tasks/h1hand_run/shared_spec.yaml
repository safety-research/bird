description:
  natural_language: Run forward at five metres per second or faster on flat, open ground, and keep running
    for the whole episode.
  l_task: Run forward along the positive x direction as fast as possible on flat, open ground. The episode
    lasts 1000 control steps at 50 Hz. Full credit begins at five metres per second of forward centre-of-mass
    velocity; below that the credit falls off linearly to zero at standstill. The ground is flat and empty
    in every direction, so there is no obstacle and no path to choose -- only pace.
  env_prose: 'The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder roll,
    shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators. The
    count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single command
    curls both. Every actuator is a POSITION servo -- the control signal names an angle for that joint
    to move towards, it does not apply a torque directly, and the same numeric command means a different
    angle at different joints because -1 and +1 are the two ends of each actuator''s own range. The pelvis
    is unattached to anything, so the robot is free to translate in all three directions and to rotate
    arbitrarily; it can and does fall over. The robot weighs about 53 kg. The ground is flat, infinite
    and empty -- no obstacle, no target, no scenery. The episode ends early only if the pelvis drops below
    0.2 m.'
  scene: Flat infinite ground and a standing humanoid with two Shadow Hands. The scene is identical to
    walk's; only the speed the reward asks for differs.
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/basic_locomotion_envs.py
    lines: 21-106
state_surface:
  fields:
  - name: s.pelvis_pos
    shape: (3,)
    units: m
    slice: 0:3
    description: World position of the pelvis (the free root body).
  - name: s.pelvis_quat
    shape: (4,)
    units: null
    slice: '3:7'
    description: Pelvis orientation as a unit quaternion in (w, x, y, z) order.
  - name: s.joint_angles
    shape: (69,)
    units: rad
    slice: 7:76
    description: 'All sixty-nine hinge angles: twenty-one body joints then twenty-four in each Shadow
      Hand. Individual names and ranges are in flat_fields.'
  - name: s.pelvis_linvel
    shape: (3,)
    units: m/s
    slice: 76:79
    description: Linear velocity of the pelvis in world axes.
  - name: s.pelvis_angvel
    shape: (3,)
    units: rad/s
    slice: 79:82
    description: Angular velocity of the pelvis. NOTE three numbers where the orientation above is four
      -- that is why the state has 76 positions and 75 velocities.
  - name: s.joint_velocities
    shape: (69,)
    units: rad/s
    slice: 82:151
    description: The sixty-nine hinge velocities, in the same order as the angles.
  helpers:
  - name: pelvis_pos
    signature: pelvis_pos(s)
    description: = s[0:3], the robot's root position in metres
    kind: inline_expression
    expression: s[0:3]
  - name: pelvis_height
    signature: pelvis_height(s)
    description: = s[2], about 0.98 when standing
    kind: inline_expression
    expression: s[2]
  - name: uprightness
    signature: uprightness(s)
    description: '= 1 - 2*(s[4]**2 + s[5]**2), the world-z component of the pelvis''s own z axis: +1 upright,
      0 horizontal, -1 upside-down'
    kind: inline_expression
    expression: 1 - 2*(s[4]**2 + s[5]**2)
  - name: joint_angles
    signature: joint_angles(s)
    description: = s[7:76], all sixty-nine hinge angles
    kind: inline_expression
    expression: s[7:76]
  - name: control_cost
    signature: control_cost(a)
    description: = np.sum(np.square(a)), a measure of commanded effort
    kind: inline_expression
    expression: np.sum(np.square(a))
