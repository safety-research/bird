# h1hand_door -- HumanoidBench `h1hand-door-v0` on the Unitree H1 with two Shadow Hands.
#
# A 155-D task: nq 78, nv 77 and NO task tail -- both task degrees
# of freedom are real joints (`door_hinge` at qpos 76, `door_hatch_hinge` at 77), so restoring qpos
# restores the door and none of package's extra-state machinery is needed.
#
# DERIVED, NOT TRANSCRIBED -- model facts from a mujoco==3.1.6 build of the task's
# own asset at cb11890 (nq 78, nv 77, nu 61, nbody 74). The robot half of the observation table is
# spliced from the h1hand_push spec and RENUMBERED: push has nq 83, so every velocity index here is
# five lower. Nothing is copied from a sibling unshifted; see `provenance.measured`.
#
# The adapter is `bird/envs/humanoid_hand.py::H1HandDoor`; read its module docstring first.
schema_version: 1
id: h1hand_door
env:
  env_id: h1hand-door-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately if the pelvis drops below 0.58 m -- that is, if the robot collapses.
      Otherwise it runs its full 1000 steps. There is no way to finish early by succeeding.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: _H1HandBase._reset
      lines: 936-986
    rng_note: >-
      One call, `rng.uniform(-0.01, 0.01, size=78)` (line 942), and nothing else: H1HandDoor defines no
      `_task_reset`, so the base hooks are the identity (lines 970-978). `domain_randomization` is null
      on this spec, so no DR draw precedes it (bird/envs/base.py:401-406).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 78 position coordinates
          (76 robot + 2 door hinges, the hinges' described separately; metres on the pelvis position, radians
          on the 69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The keyframe
          stands the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity quaternion.
          The four pelvis quaternion components are perturbed componentwise and then renormalised by `set_state`'s
          `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal box: keyframe
          plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: object_pose
      quantity: door_hinge_noise
      fields:
      - s.door_angles
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- entries 76:78: `door_hinge`
          (range [0, 1.4] rad) and `door_hatch_hinge` (range [0, 2] rad) start at their keyframe value 0
          (`h1hand_pos_door.xml` `<key>`, 78 entries, the last two 0) plus U(-0.01, 0.01) rad. `set_state`
          does not clamp, so the door can begin up to 0.01 rad (0.6 deg) past its own closed stop, in either
          direction -- the `scene` prose's 'closed wooden door' is closed to within that.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    constants:
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_door.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: door_velocities
      fields:
      - s.door_velocities
      value: >-
        0 -- both door joints start at rest: the keyframe carries no qvel (`assets/envs/h1hand_pos_door.xml`
        `<key>` declares `qpos` only) and no hook writes a velocity.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
        symbol: _H1HandBase._reset
      basis: read
    - role: goal
      quantity: goal
      value: >-
        none -- no marker beyond the door. `task_metric` is the fraction of arriving states with pelvis
        x > `_DOOR_FAR_FACE` = 0.87 m (line 621: panel at x = 0.8 plus 0.07 half-thickness), fixed scene
        geometry.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 3444-3468
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Door` adds nothing (`class Door(Task)`, door.py:12; no `reset_model`,
      so `Task.reset_model`, tasks.py:44-45, just returns the observation; the base `uniform(size=nq)` reaches
      the two door joints there exactly as it does here); this adapter draws everything from the episode
      Generator (`_reset`, 941-944), so a BIRD episode is reproducible from its seed where an upstream one
      is not.
    prompt_states: The door is directly ahead in a wall
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    - object_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
