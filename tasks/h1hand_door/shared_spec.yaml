reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/door.py
      lines: '65-132'
      symbol: Door.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 1ddf3f889420c826f8acc37f0e22f5e94f713c91bd2fbb5fb232e05136406a62
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.door:Door.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      A weighted sum of five terms: `0.1 * stand_reward * small_control + 0.45 *
      door_openness_reward + 0.05 * door_hatch_openness_reward + 0.05 * hand_hatch_proximity_reward
      + 0.35 * passage_reward`, where `door_openness_reward = min(1, q * |q|)` on the panel hinge (a
      signed square, saturating at 1 rad) and `passage_reward` is a linear tolerance on the imu
      site's x with bounds (1.2, inf) and margin 1. Note that 0.80 of the total is reachable without
      the handle -- see `exploits`. Read against source at cb11890, not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    The same gate as the other h1hand specs, for the same reasons: three of the four BIRD entries
    name ADAPTER INTERNALS -- the routes to the quantity a candidate is scored on in this repo --
    and `success_bar` is the benchmark symbol nothing upstream reads but a candidate could find, a
    threshold on the shipped reward's own episode return. `success` is DELIBERATELY ABSENT --
    listing it rejects candidates that name their OWN proxy
    `success` (15 of 15 on Meta-World, tasks/drawer_close); the defence that holds is
    structural, because `success()` here is a threshold on `task_metric`, which IS gated.
judge:
  vlm_legible: true
  legibility_note: >-
    This is the most legible task in the tier: 'is the door open' and 'is the robot through it' are
    both unmistakable in a single frame, and the door's angle is a large, high-contrast cue. What a
    frame CANNOT show is whether the handle was used -- the distinction the `barge_without_handle`
    entry turns on -- because a hand near the lever and a hand gripping it look identical. Whether
    that survives 448x320 is UNMEASURED (no frame has been rendered). At clip scale (360 px wide) a
    human rater could not see the hands at the handle from `cam_default` at all and flagged the
    clip: the door's state reads, the hand-door interaction does not. `cam_hand_visible` below is
    the model camera that frames the hands and what is in front of them.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis. Because the door is directly ahead and
      the robot must face it, the object of the task stays in frame for once -- unlike package,
      whose marker leaves it.
  extra_views:
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      At the start the default camera shows only the door; from above the robot behind it
      and the door's opening angle both read.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  - name: side
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from its right-hand side, level with it
      and 3 m away: a side profile in which lean, gait, crouch and the height of anything
      held read directly. It moves with the robot, so absolute position is not visible; only
      the floor grid slides past.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, at about three times the pixels
      the default camera gives them. For this task that is the handle and the door's edge, so
      whether the hand is ON the lever or merely near it -- the distinction a single default
      frame cannot make -- has a chance of reading. Where the robot is in
      the room is not visible from here.
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_pos
  - door_angle
  - hatch_angle
  - through_doorway
domain_randomization: null
exploits:
- name: barge_without_handle
  mechanism: >-
    At the REWARD level the barge is open: the metric is traversal (pelvis x past the panel) and the
    shipped reward pays 0.45 for panel angle and 0.35 for passage while asking only 0.05 for the
    hatch, so a robot that got the panel open with the handle untouched would collect 0.80 of the
    maximum and this check would pay it in full. PHYSICALLY it is not available: a static
    reading of the joint list said nothing couples the handle to the panel, but stepping the built
    model shows the far-side `door_lock` cylinder on the `door_hatch` body entering the frame after
    0.02 rad of `door_hinge` travel -- 60 N.m on the hinge opens the door 0.019 rad -- a contact
    latch freed only by pressing the lever past about 0.85-0.9 rad. A lever-up door released from
    any angle >= 0.35 rad rests at 0.275 rad with its bolt on the frame's inner face.
  status: open
  closed_by: null
  note: >-
    Open because the CHECK does not require the handle, not because a barge is feasible; the
    metric is left as traversal on purpose. Corrected the same day: the door swings TOWARD the
    robot (free edge x = 0.30 at 0.6 rad, -0.20 at 1.4 rad), a pull door that sweeps the spawn,
    where this file said it swings away. Passage needs theta >= ~1.05 for a 0.45 m robot with the
    robot standing at x <= -0.3 while something holds >= 53 N.m through a 1.3 m walk; a simple scripted controller manages neither: one that frees the latch (10/10 seeds) cracks the
    door 0.1 rad but scores 0.0.
- name: stand_still_and_collect
  mechanism: >-
    `0.1 * stand_reward * small_control` pays about 0.1 per step for standing upright and quiet,
    with no reference to the door -- roughly 100 over a 1000-step episode against a success_bar of
    600. The same additive floor every HumanoidBench task composing this term inherits.
  status: open
  closed_by: bird task_metric (door_traversal_fraction)
  note: >-
    Read off door.py:107-113. The metric is traversal, so standing still scores exactly 0.0 and the
    gap between fitness and return is the measurement.
- name: approach_pays_before_passage
  mechanism: >-
    `passage_reward = tolerance(imu_x, bounds=(1.2, inf), margin=1, sigmoid='linear')` gives PARTIAL
    credit from x = 0.2 onward, so merely walking up to the closed door -- which stands at x = 0.8
    -- collects a fraction of the 0.35 weight without the door moving at all. Combined with the
    standing floor and the 0.05 hand-proximity term, a policy that walks to the door and waits with
    a hand near the handle collects a substantial return while never opening anything.
  status: open
  closed_by: bird task_metric (door_traversal_fraction)
  note: >-
    Arithmetic from the tolerance kernel's own margin, not observed. The metric requires
    the pelvis PAST the panel's far face at x = 0.87, which is unreachable while the door is shut,
    so it scores this 0.0.
- name: hatch_proximity_without_grasp
  mechanism: >-
    `hand_hatch_proximity_reward` is a tolerance on the DISTANCE from the nearer hand to the hatch
    body, bounded (0, 0.25) with margin 1. Nothing requires contact, a closed grip, or any force --
    a hand hovering near the handle collects the full 0.05.
  status: open
  closed_by: bird task_metric (door_traversal_fraction)
  note: >-
    Small in weight and recorded for completeness, since the task's stated point is handle use.
    Read off door.py:120-127. Metric scores it 0.0.
