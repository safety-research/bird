    lines: 1-135
    what: 'Door: qpos0_robot for h1hand, dof 2, success_bar 600, observation_space, get_reward,
      get_terminated (no get_obs and no reset_model -- the base Task supplies both)'
  - path: humanoid_bench/assets/envs/h1hand_pos_door.xml
    lines: null
    what: 'the composed model -- nq 78, nv 77, nu 61, nbody 74'
  - path: humanoid_bench/assets/tasks/door.xml
    lines: 1-52
    what: 'the scene: body door at (0.8, 0, 0) with joint door_hinge (axis z, range 0-1.4,
      stiffness 50) and child body door_hatch at local (0, 0.4, 1.2) with joint door_hatch_hinge
      (axis x, range 0-2, stiffness 2, gravcomp 1); enclosing walls on body door_wall_connects'
  rule: source and asset, not docstrings
  measured:
  - >-
    Built with mujoco==3.1.6 against humanoid-bench cb11890 on 2026-08-31. STATIC READ ONLY: every
    shape, name, range, mass and position here is read from MjModel.from_xml_path on the task's own
    assets/envs XML (no gym.make -- humanoid_bench imports torch and jax at module scope). The env
    has NOT been constructed or stepped: no reward-at-reset figure, no step-purity run, no frame, no
    anchor.
  - >-
    Robot identical to the other h1hand tasks: 69 hinge joints, 61 actuators, nq 76 / nv 75 /
    nu 61, obs_dim 151 = nq + nv (the default Task.get_obs, plain qpos+qvel), and the whole
    flat_fields table spliced verbatim from the h1hand_hurdle spec after asserting the two
    models' joint and actuator tables are equal at derivation time.
  - >-
    Door: body `door` at (0.8, 0, 0), 159.67 kg including its children, panel half-thickness 0.07
    so the panel occupies x in [0.73, 0.87]. Joint `door_hinge` at qposadr 76 / dofadr 75, range
    [0, 1.4] rad, stiffness 50.
  - >-
    Handle: body `door_hatch` at world (0.8, 0.4, 1.2), 2.16 kg, joint `door_hatch_hinge` at qposadr
    77 / dofadr 76, range [0, 2] rad, stiffness 2. No equality constraint or tendon couples it to
    `door_hinge`, but a CONTACT latch does: the far-side `door_lock` cylinder on the hatch body
    (collision geom 168) meets the frame (geom 173) after 0.0195 rad of hinge travel, so 60 N.m on
    the hinge opens the door 0.019 rad with the lever down and 0.51 rad in one second with the lever
    held at 1.0 rad; the latch frees between lever 0.80 and 0.85 rad. Measured by stepping the built
    model; a static reading of the joint list alone missed the contact pair, and the
    `barge_without_handle` entry records both halves.
  - >-
    Source sha256 1ddf3f889420c826f8acc37f0e22f5e94f713c91bd2fbb5fb232e05136406a62 at commit cb1189039151c8aadaaa987b442da54383c87fab.
  verified_by: BIRD authors
  date: '2026-08-31'
