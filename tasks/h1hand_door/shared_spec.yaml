description:
  natural_language: >-
    Open the door and walk through the doorway. The door is directly ahead in a wall; it has a lever
    handle at chest height and swings TOWARD you (a pull door); the lever must be pressed past
    about 0.9 rad to free the latch that otherwise holds the panel shut. The task is to get to the far side of the
    doorway -- approaching the door, or opening it and staying put, is not doing this task.
  l_task: >-
    Open the door and walk through the doorway. The door is directly ahead in a wall; it has a lever
    handle at chest height and swings TOWARD you (a pull door); the lever must be pressed past
    about 0.9 rad to free the latch that otherwise holds the panel shut. The task is to get to the far side of the
    doorway -- approaching the door, or opening it and staying put, is not doing this task.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    Directly ahead at x = 0.8 is a wall containing a hinged door, with a lever handle on the near face
    at about 1.2 m. The door swings TOWARD the robot (a pull door whose free edge sweeps the spawn) through up to about 80 degrees against a
    spring that pulls it shut. Walls enclose the robot behind and to both sides, so the doorway is
    the only way out. The episode ends early only if the pelvis drops below 0.58 m.
  scene: >-
    A humanoid standing in a small room facing a closed wooden door with a metal lever handle. Walls
    to the left, right and behind; the doorway ahead is the only opening. Whether the door is open,
    and by how much, is the one thing in the frame that changes.
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/door.py
    lines: 1-135
