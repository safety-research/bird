discrete_success:
  kind: continuous_only
  no_discrete_success_because: >-
    This task ships no boolean success check: `Door.get_reward`'s info dict carries only its own
    five reward terms, and `Door.get_terminated` is a collapse terminal (pelvis below 0.58 m), not a
    success. What the class does declare is `success_bar` (600), a threshold on the episode
    RETURN of the task's own hand-written reward, read by zero lines of upstream code -- a plotting
    constant from the paper. Adopting it would make ground truth a monotone function of the shipped
    reward. Ground truth is therefore the state-derived continuous metric below.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: door_traversal_fraction
    expr: >-
      mean over arriving states of (s[0] > 0.87) -- the fraction of the episode the pelvis spends past
      the far face of the door panel. Fixed scene geometry only: the panel body is at x = 0.8 with
      half-thickness 0.07. Upstream's own passage bound of 1.2 is deliberately NOT used, being a
      reward constant. bird/envs/humanoid_hand.py::H1HandDoor.task_metric
    unit: fraction of arriving states past the doorway
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: >-
      identity -- the raw metric is already a fraction in [0, 1], and no anchor pair exists to
      normalise against (see `anchors`)
    success_threshold: 0.1
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: >-
      NOT MEASURED: no uniform-random population has been scored on this task, so read any number
      from it as unanchored. A uniform-random policy is expected to score exactly 0.0: random
      position targets take a 61-DoF humanoid to the floor within a couple of seconds, the pelvis
      terminal at 0.58 m ends the episode, and the door is shut the whole time.
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: >-
      No expert exists in any sense the schema accepts: no scripted policy, no demonstrations, and
      HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None
      and fitness stays RAW, per the absence-is-explicit rule.
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 331.75
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 14.69
      env_steps: 12800000
      success_bar: 600.0
      success_bar_source: >-
        humanoid-bench @ cb11890 (this spec's pinned commit), humanoid_bench/envs/door.py:48
        (`success_bar = 600`).
      source: >-
        FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_door
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final
        point of the authors' released plotting data behind that figure
        (data/humanoidbench_result.json @ 77922d0 in younggyoseo/FastTD3, committed 2025-09-21),
        key h1hand_door; std is half the released band width (return_min/return_max are exactly
        mean -/+ std).
      note: >-
        A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation
        point of the paper's own training run, not a separately evaluated frozen policy. Below the
        task's 600 success bar -- FastTD3 does not reach door's threshold.
      date: '2026-09-01'
budget:
  train_steps: 2000000
  learning_verified:
    verified: false
    reward_used: none
    algo: null
    seeds: null
    result: >-
      NOT CHECKED, and the number above is the same order-of-magnitude placeholder the other h1hand
      specs carry. No run has checked it. Runs will complete and produce
