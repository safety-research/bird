# AUTHORED FOR BIRD. This environment is implemented in this repo rather than
# vendored from a benchmark, so this spec has no upstream counterpart
# -- but the same rules apply as everywhere else in the catalogue: absence is explicit, and every claim came
# off the adapter or a config rather than a docstring.
schema_version: 1
id: toy_reacher
env:
  env_id: toy_reacher
  library:
    name: bird
    version_verified: in-repo
    commit: null
    stack:
      numpy: '>=1.24'
      python: '>=3.10'
  horizon: 25
  control_hz: null
  termination:
    early_terminate: false
    autoreset: false
    partial_reset: null
    prompt_states: The episode always runs the full 25 steps; reaching the goal does not end it.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/toy.py
      symbol: ToyReacher._reset
      lines: 129-138
    draws:
    - role: agent_pose
      quantity: start_position
      fields:
      - x
      - y
      distribution:
        family: uniform
        text: 'x, y ~ U(-0.85, -0.25) each: the quadrant far from the goal at (0.5, 0.5), so every episode
          requires real travel.'
        low:
        - -0.85
        - -0.85
        high:
        - -0.25
        - -0.25
      source:
        path: bird/envs/toy.py
        lines: 133-134
      basis: measured
      note: '24 seeded resets: x in [-0.80, -0.28], y in [-0.75, -0.26]; vx, vy, goal_x, goal_y never move;
        reset(default_rng(3)) twice is bitwise-equal.'
    constants:
    - role: agent_velocity
      quantity: initial_velocity
      value: vx = vy = 0.0 -- the mass starts at rest.
      fields:
      - vx
      - vy
      source:
        path: bird/envs/toy.py
        lines: 135-136
      basis: measured
    - role: goal
      quantity: goal_position
      value: (0.5, 0.5) (`goal`), fixed for every episode and written into the observation; task_metric
        is the fraction of arriving states within goal_radius 0.22 of it.
      fields:
      - goal_x
      - goal_y
      source:
        path: bird/envs/toy.py
        lines: '105'
      basis: measured
      note: Written at toy.py:137; task_metric (toy.py:189-196) reads the goal back from states[:, 4:6].
        flat_fields call goal_x/goal_y 'constant within an episode', which understates it -- the goal is
        the same in every episode.
    stochastic_transitions: null
    upstream_divergence: null
    prompt_states: with a goal at a fixed position
    prompt_field: scene
    prompt_omits:
    - agent_pose
    note: 'Deterministic at nominal DR only: `_step` (toy.py:145-147) draws two
      `self._rng.normal(0, action_noise)` per step when `action_noise` > 0; nominal is 0.0, so the draw
      exists only under domain randomisation.'
  spaces:
    obs_dim: 6
    action_dim: 2
    action_low:
    - -1.0
    - -1.0
    action_high:
    - 1.0
    - 1.0
    action_semantics: 'fx: force along the first axis, clipped to [-1, 1]; fy: force along the
      second axis, clipped to [-1, 1]'
    action_fields:
    - name: fx
      description: force along the first axis, clipped to [-1, 1]
      low: -1.0
      high: 1.0
    - name: fy
      description: force along the second axis, clipped to [-1, 1]
      low: -1.0
      high: 1.0
description:
  env_prose: A point mass slides on a 2-D plane bounded by [-1, 1] in each axis. The action is
    a force in [-1, 1]^2; velocity is damped, so the mass carries momentum and overshoots if it
    is not slowed down. The task is to move the mass to the goal and remain there for the rest
    of the episode.
  l_task: move the end effector to the goal and stay there
  natural_language: A point mass slides on a 2-D plane bounded by [-1, 1] in each axis. The action
    is a force in [-1, 1]^2; velocity is damped, so the mass carries momentum and overshoots if
    it is not slowed down. The task is to move the mass to the goal and remain there for the rest
    of the episode.
  scene: A point mass on a 2-D plane bounded by [-1, 1] in each axis, with a goal at a fixed position.
    The action is a force. There is no renderer.
  success_criterion_prose: null
  full_source:
    path: bird/envs/toy.py
    lines: null
state_surface:
  fields:
  - name: x
    shape: scalar
    units: null
    description: position along the first axis, in [-1, 1]
    source: null
    slice: 0:1
  - name: y
    shape: scalar
    units: null
    description: position along the second axis, in [-1, 1]
    source: null
    slice: '1:2'
  - name: vx
    shape: scalar
    units: null
    description: velocity along the first axis, in [-1, 1]
    source: null
    slice: '2:3'
  - name: vy
    shape: scalar
    units: null
    description: velocity along the second axis, in [-1, 1]
    source: null
    slice: '3:4'
  - name: goal_x
    shape: scalar
    units: null
    description: goal position, first axis (constant within an episode)
    source: null
    slice: '4:5'
  - name: goal_y
    shape: scalar
    units: null
    description: goal position, second axis (constant within an episode)
    source: null
    slice: '5:6'
  helpers:
  - name: distance_to_goal
    signature: distance_to_goal(s)
    description: Euclidean distance from the mass to the goal
    kind: inline_expression
    expression: null
  - name: speed
    signature: speed(s)
    description: magnitude of the velocity vector
    kind: inline_expression
    expression: null
  - name: is_at_goal
    signature: is_at_goal(s)
    description: True when distance_to_goal(s) <= 0.22
    kind: inline_expression
    expression: null
  helpers_note: 'Advertised as inlineable EXPRESSIONS and deliberately not implemented as methods:
    verification binds a proxy `self` and training binds `self=None`, so a helper that existed
    would let a `self.x(s)` candidate pass the gate and then die in training -- a wasted policy
    run charged to the reward that did not cause it.'
  flat_fields:
  - index: 0
    name: x
    description: position along the first axis, in [-1, 1]
  - index: 1
    name: y
    description: position along the second axis, in [-1, 1]
  - index: 2
    name: vx
    description: velocity along the first axis, in [-1, 1]
  - index: 3
    name: vy
    description: velocity along the second axis, in [-1, 1]
  - index: 4
    name: goal_x
    description: goal position, first axis (constant within an episode)
  - index: 5
    name: goal_y
    description: goal position, second axis (constant within an episode)
discrete_success:
  kind: native_authored
  no_discrete_success_because: This env is authored end to end in this repo, so the repo IS the vendor
    and `EnvAdapter.success()` here (a threshold on this repo's own task_metric) IS the native success
    -- there is no separate vendor-shipped block to record (shipped and hardened null). `kind` is `native_authored`
    to mark exactly this under the native-signal rule -- a repo-owned env whose own success check counts
    as native_success.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: at_goal_fraction
    expr: fraction of the episode's arriving states within the goal radius
    unit: fraction of steps
    direction: maximize
    saturates_at: 1.0
  normalized:
    method: explicit
    formula: 'identity -- the raw metric is already a fraction of steps and therefore already
      in [0, 1]. `method: anchors` would need an expert anchor this environment cannot have.'
    success_threshold: 0.2
anchors:
  scripted:
    value: 0.4128
    method: scripted_policy
    policy_id: simple_suite/toy_reacher_pd
    status: partial
    unit: bird_task_metric
    reduction: per_step_fraction
    n_seeds: 25
    n_episodes: 25
    reason: null
    date: '2026-09-03'
    source: 'REGISTRY 2026-09-04: policies/simple_suite/policies.yaml entry `simple_suite/toy_reacher_pd`
      (status partial), score 0.4128 bird_task_metric under per_step_fraction, n=25, verified through
      bird_adapter. The manifest is the primary record. n_episodes equals n_seeds: one episode per seed,
      as the registry counts them.'
  reduction: per_step_fraction
  by_reduction:
    per_step_fraction:
      random:
        value: 0.008
        method: random_policy
        source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, `scripts/measure_anchors.py
          --env toy_reacher --n 30`, seed 0.'
        n_seeds: 30
        n_episodes: 30
        reason: null
        date: '2026-08-25'
      expert:
        value: null
        method: unavailable
        source: null
        n_seeds: null
        n_episodes: null
        reason: No scripted expert exists for this environment. It is implemented in this repo
          and ships no reference policy, and inventing a ceiling would make every `human_normalised`
          number on it a ratio against a number nobody measured. Recorded as absent so `baselines_of`
          returns None and `_normalise_pool` leaves fitness raw.
        date: null
  random:
    value: 0.008
    method: random_policy
    source: 'MEASURED 2026-08-25: mean `task_metric` over n=30 uniform-random episodes, seed 0.
      See anchors.by_reduction.'
    n_seeds: 30
    n_episodes: 30
    reason: null
    date: '2026-08-25'
  expert:
    value: null
    method: unavailable
    source: null
    n_seeds: null
    n_episodes: null
    reason: No scripted expert exists for this environment. It is implemented in this repo and
      ships no reference policy, and inventing a ceiling would make every `human_normalised` number
      on it a ratio against a number nobody measured. Recorded as absent so `baselines_of` returns
      None and `_normalise_pool` leaves fitness raw.
    date: null
budget:
  train_steps: 2000
  learning_verified:
    verified: false
    reward_used: none
    algo: null
    seeds: null
    result: Not established as a floor by a dedicated sweep.
    date: null
  saturates_at: null
reward:
  human:
    kind: tuned_dense
    scope: value_determining
    reference:
      path: bird/envs/toy.py
      lines: null
      symbol: ToyReacher.reference_reward
      commit: null
      sha256: null
    depends_on: []
    import_path: bird.envs.toy:ToyReacher.reference_reward
    verified_against: This repo at the commit that ran. The environment is implemented here, so there
      is no external library to pin -- what pins it is the repository version (tag or commit) a sweep
      is launched from.
    notes: Written for this repo.
  contract:
    signature: 'def compute_reward(state, action=None, next_state=None):'
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    - math
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: 'One scalar out, over the FLAT observation array. There is no `self` and no env
      handle: the compiler binds arguments by name and maps `self`/`env` to None deliberately.'
    reward_utils: []
  forbidden_symbols: []
judge:
  vlm_legible: false
  legibility_note: No renderer at all. This env exists so the whole loop can run offline in about
    a second; it is substrate, not a measurement.
  camera:
    name: none
    mode: fixed
    note: 'No camera: frames are rasterised in pure numpy where a renderer exists at all.'
  subtasks_sequential: false
  telemetry_fields:
  - distance_to_goal
  - speed
domain_randomization:
  parameters:
    mass:
    - 0.3
    - 3.0
    damping:
    - 0.2
    - 0.9
    force_scale:
    - 0.3
    - 1.2
    action_noise:
    - 0.0
    - 0.4
  nominal:
    mass: 1.0
    damping: 0.5
    force_scale: 0.8
    action_noise: 0.0
exploits: []
symbol_mapping:
  end_effector_position: s[0:2]
  end_effector_velocity: s[2:4]
  goal_position: s[4:6]
  distance_to_goal: np.linalg.norm(s[0:2] - s[4:6])
  applied_force: a[0:2]
provenance:
  authored_from:
  - path: bird/envs/toy.py
    lines: null
    what: '`ToyReacher` -- the observation and action tables, the helper vocabulary, the symbol
      map, the randomisation axes, the horizon and the success threshold, all read off the class; the l_task, the forbidden-symbol list and the step
      budget were authored for BIRD alongside the class'
  rule: source, not docstrings
  measured:
  - 'Random anchor: n=30 uniform-random episodes through the adapter, 2026-08-25.'
  verified_by: BIRD authors
  date: '2026-08-25'
