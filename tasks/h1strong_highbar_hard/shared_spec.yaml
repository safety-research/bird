description:
  natural_language: >-
    Swing all the way around the high bar. The robot starts hanging from a bar 2.8 m above the ground
    with both hands on it; drive the hips and legs to build a swing and carry the body right over
    the top and round, as a gymnast's giant swing. Hanging still, or swinging back and forth without
    ever going over the bar, does not count as doing this task.
  l_task: >-
    Swing all the way around the high bar. The robot starts hanging from a bar 2.8 m above the ground
    with both hands on it; drive the hips and legs to build a swing and carry the body right over
    the top and round, as a gymnast's giant swing. Hanging still, or swinging back and forth without
    ever going over the bar, does not count as doing this task.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The finger servos on this robot
    are stiffer than the standard ones -- gain 50 and a 50 N force limit against the stock 0.4-8 and
    2-5 N -- which is what lets it hold its own 53 kg weight by the hands. A gymnastic high bar stands
    in front of the robot: a horizontal steel rod 2.4 m long and 4 cm thick, held 2.8 m above the
    ground by two uprights 2.4 m apart. The robot begins hanging from it, both hands closed on the
    rod, feet clear of the floor. Nothing attaches the hands to the bar but friction and the grip
    of the fingers. The episode ends the moment the head falls below 2.0 m.
  scene: >-
    A high bar on two uprights against an otherwise empty floor, with a humanoid hanging from it by
    both hands. The whole task happens in the air within about a metre of the bar: the readable quantities
    are where the body is relative to the bar and whether the hands are still on it.
  success_criterion_prose: null
