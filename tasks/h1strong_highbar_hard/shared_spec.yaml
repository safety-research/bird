provenance:
  authored_from:
  - path: humanoid_bench/__init__.py
    lines: 1-19
    what: 'the gym id registration: f''{robot}-{task}-v0'' over ROBOTS x TASKS'
  - path: humanoid_bench/env.py
    lines: 66-100
    what: ROBOTS and TASKS, and the assert robot.dof + task.dof == len(qpos)
  - path: humanoid_bench/robots.py
    lines: 1-86
    what: 'H1 / H1Hand / H1Strong: dof, and the site accessors the rewards read'
  - path: humanoid_bench/tasks.py
    lines: 1-72
    what: 'Task: frame_skip 10, get_obs = concat(qpos, qvel), unnormalize_action'
  - path: humanoid_bench/envs/highbar.py
    lines: 9-92
    what: >-
      HighBarBase: observation_space, get_reward, get_terminated, reset_model; and HighBarSimple /
      HighBarHard, whose qpos0_robot keys are h1 and h1strong ONLY
  - path: humanoid_bench/assets/tasks/highbar_hard.xml
    lines: null
    what: 'the bar: holding_bar at local (-0.19, 0, 2.8) on a body at (0.5, 0, 0)'
  - path: README.md
    lines: 56-72
    what: >-
      upstream's Main Benchmark Tasks list, which names h1strong-highbar_hard-v0 and no h1hand highbar,
      with the comment 'Make hands stronger to be able to hang from the high bar'
  rule: source and asset, not docstrings
  measured:
  - >-
    Built with mujoco==3.1.6 against humanoid-bench cb11890 on 2026-08-28. Every shape, name, range
    and mass below is read from the model, not from the paper. TWO PASSES, and which one a figure
    came from matters: the tables were derived from MjModel.from_xml_path on the task's own
    assets/envs XML (no gym.make -- humanoid_bench imports torch and jax at module scope), and the
    env was then CONSTRUCTED and stepped for real, which is where the reward figures come from. No
    policy has been trained, so no anchor and no fitness here is measured.
  - >-
    Robot: 69 hinge joints (21 body + 24 per Shadow Hand) and 61 actuators. The eight-joint gap is
    tendon coupling, not a missing actuator: the middle and fingertip joints of the index, middle,
    ring and little fingers share one `A_<finger>J0` actuator per finger per hand, ctrlrange [0, 3.1415].
    Robot mass 53.24 kg.
  - >-
    THE ID IS NOT h1hand. `humanoid_bench/__init__.py` registers the full cross product, so `h1hand-highbar_simple-v0`
    and `h1hand-highbar_hard-v0` both register and NEITHER can be constructed: `assets/envs/` contains
    only `h1_pos_highbar_simple.xml` and `h1strong_pos_highbar_hard.xml`. `HighBarSimple.qpos0_robot`
    has a key for `h1` alone and `HighBarHard.qpos0_robot` for `h1strong` alone.
  - >-
    `h1strong` IS the Shadow-Hands robot: `h1strong_pos.xml` and `h1hand_pos.xml` are both 545 lines
    with 93 position definitions and identical geometry, differing only in the FINGER servos' gains
    and force limits (kp=50 / forcerange -50 50, against kp 0.4-8 and forces 2-5 N). `robots.py` gives
    both dof = 76.
  - >-
    nq 76, nv 75, nu 61; obs_dim 151 = nq + nv, matching HighBarBase.observation_space's robot.dof*2
    - 1.
  - >-
    Geometry at the keyframe: holding_bar at (0.31, 0, 2.80); pelvis at (0.27, 0, 1.62), head site
    at 2.32 m -- 0.32 m above the 2.0 m terminal -- and the two hand sites at (0.269, +-0.234, 2.70),
    just under the bar. Nothing welds the hands to it; the grip is the fingers and friction. The pelvis
    hangs 1.181 m below the bar, which is the radius the rotation metric sweeps.
  verified_by: BIRD authors
  date: '2026-08-28'
