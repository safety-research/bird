reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/highbar.py
      lines: 9-62
      symbol: HighBarBase.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 4508ddb024583a62e4ba1baa445aef66defb0efe31cea88a6756d701e9a84ba1
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.highbar:HighBarHard.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `upright_reward * feet_reward * small_control`, where `upright_reward` is a linear `tolerance`
      on NEGATIVE torso uprightness (i.e. it pays for being upside-down), `feet_reward = (1 + tolerance(mean
      foot height, bounds=(4.8, inf), margin=2)) / 2` and `small_control = (4 + tolerance(actuator_forces))
      / 5`. Note that both of the last two are rescaled to have a FLOOR of 0.5 and 0.8 respectively
      -- but the product still reaches exactly 0, because `upright_reward` does: MEASURED 0.0000 hanging
      upright and 0.8586 fully inverted. THIS IS THE ARTIFACT UNDER CRITICISM -- see `exploits`. Read
      against source at cb11890; not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    BIRD's gate, and it is a different SET from the flat list above rather than a superset. Three
    of the four name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `_env` -- which are not
    properties of the task; they are the routes by which a candidate could reach the quantity it is
    scored on IN THIS REPO. `success_bar` is the fourth and it is a BENCHMARK symbol: HumanoidBench
    declares one on every task class, and while nothing upstream reads it, a candidate that found
    it would be reading a threshold on the shipped reward's own episode return.


    `success` IS DELIBERATELY ABSENT. Listing it would reject any candidate that names its own
    proxy `success`, which on Meta-World rejected 15 of 15 candidates (tasks/drawer_close). An
    identifier gate on this word is both too strict and too weak -- a candidate that spells the same
    quantity `hit` passes either way.


    The defence that does hold is STRUCTURAL and needs no gate: a generated reward can influence the
    POLICY and nothing else, and `success()` here is a threshold on `task_metric`, which IS gated.
    A candidate that re-derives the check from the observation has written a sparse reward -- a legitimate
    design point that trains poorly at this tier's budget and loses on its merits.
judge:
  vlm_legible: true
  legibility_note: >-
    Good, and better than the other three: the bar is a fixed landmark in the scene, so unlike `hurdle`
    and `half_cheetah` a tracking camera does not hide the quantity that matters. Where the body is
    relative to the bar -- hanging, horizontal, above it -- is exactly what a still shows. What a
    still cannot show is which way it is going, so a judge given single frames can distinguish 'hanging'
    from 'rotating' but not one direction of swing from the other.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis. It hides absolute travel, which is
      irrelevant here: the robot never leaves the bar's neighbourhood, and the bar and its uprights
      stay in frame as the reference the pose is read against.
  extra_views:
  - name: side
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from its right-hand side, level with it
      and 3 m away: a side profile in which lean, gait, crouch and the height of anything
      held read directly. It moves with the robot, so absolute position is not visible; only
      the floor grid slides past. The swing around the bar is a rotation in this plane, so
      the angle reached reads directly.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: front
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from directly ahead, 3 m away and slightly
      above: a face-on view for left-right symmetry and where the arms are. It moves with
      the robot, so absolute position is not visible.
    pose:
      track_body: pelvis
      azimuth: 180
      elevation: -15
      distance: 3.0
  subtasks_sequential: false
  telemetry_fields:
  - net_rotation_turns
  - pelvis_z
  - pelvis_x
  - head_z
domain_randomization: null
exploits:
- name: static_inverted_hold
  mechanism: >-
    MEASURED 2026-08-28 by sweeping the pelvis around the bar at the hang radius under
    mujoco==3.1.6. The reward is `upright_reward * feet_reward * small_control`; `feet_reward`
    floors at 0.5 and `small_control` sits at 0.859, so the whole dynamic range is `upright_reward`,
    a tolerance on NEGATIVE torso uprightness -- it pays for being upside-down. Pitch 0 deg (hanging
    upright) scores 0.0000; 90 deg 0.2259; 180 deg (feet straight up) 0.8586; 270 deg 0.2304. So the
    reward is a function of POSE, not of rotation, and its maximum is a STATIC INVERTED HOLD: a
    robot that reaches 180 deg and stays there collects 0.859 every step for the rest of the episode
    without ever completing a rotation, while a real giant swing spends most of its time away from
    180 deg and therefore scores LESS. Nothing ends the episode -- `get_terminated` fires only below
    a 2.0 m head height and an inverted robot on the bar is far above it.
  status: open
  closed_by: null
  note: >-
    The shipped reward's central defect. BIRD KEEPS the terminal rather than removing it for the
    reason `bird/envs/mujoco_control.py` records, because the incentive it creates is the
    object of study; the cost -- that SAC's entropy bonus can earn return from survival alone -- is
    accepted and stated in `bird/envs/humanoid_hand.py`. THE MEASUREMENT MAKES THE REWARD/METRIC DIVERGENCE
    SHARPER THAN FIRST CLAIMED, not weaker: `task_metric` is net rotation, so it reads 0.0 for the
    static hold this reward pays 0.859 for, and 1.0 for the giant swing it pays less for -- the widest
    gap between shipped return and ground truth among the defective-reward tasks.
- name: rescaled_factors_cannot_fall
  mechanism: >-
    `feet_reward = (1 + tolerance(...)) / 2` has a floor of 0.5 and `small_control = (4 + tolerance(...))
    / 5` a floor of 0.8, so two of the reward's three factors are bounded below by construction. Only
    `upright_reward` can reach zero, which means the reward's whole dynamic range on a hanging robot
    is one term about torso orientation -- MEASURED, that range is 0.0000 upright to 0.8586 inverted,
    with the other two factors contributing a constant 0.5 * 0.859 to every pose.
  status: open
  closed_by: null
  note: >-
    Read off the source arithmetic and then MEASURED. It is why the reward has one effective dimension
    -- torso orientation -- and therefore why its optimum is a pose rather than a manoeuvre.
- name: swing_without_going_over
  mechanism: >-
    Building a back-and-forth swing raises the feet and inverts the torso periodically, so it collects
    more than a still hang does, without the body ever passing over the bar. This is the natural local
    optimum a policy reaches from the hang.
  status: open
  closed_by: null
  note: >-
    Closed on BIRD's side of the measurement, and this is the one place where the metric's design
    does real work: `task_metric` sums SIGNED unwrapped angle before taking the absolute value, so
    an oscillation cancels to about zero and only a completed rotation accumulates. A metric using
    |dtheta| would have scored the swing highly and hidden the finding.
