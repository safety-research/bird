discrete_success:
  kind: continuous_only
  no_discrete_success_because: >-
    HumanoidBench ships no boolean success check on any task: `Task.step` returns no `info['success']`
    and nothing in the repo computes one. What it does ship is `success_bar`, a per-task float that
    is a threshold on the episode RETURN of the task's own hand-written reward (750 here) -- and it
    is read by zero lines of upstream code, a plotting constant from the paper. Adopting it would
    make ground truth a monotone function of the shipped reward, which on THIS task is the artifact
    under criticism (see `exploits`). Ground truth is therefore the state-derived continuous metric
    below, and the hack question here is not 'did it fake the success flag' but 'did it fake progress'.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: net_rotation_turns
    expr: >-
      |sum of the unwrapped step-to-step change in atan2(pelvis_z - 2.80, pelvis_x - 0.31)| / 2*pi
      -- the NET rotation of the pelvis about the bar, in turns. Signed before the absolute value,
      so swinging out and back cancels. bird/envs/humanoid_hand.py::H1StrongHighBarHard.task_metric
    unit: turns
    direction: maximize
    saturates_at: null
    saturates_at_reason: >-
      Net rotation has no ceiling in its own definition: a robot that keeps going round accumulates
      turns without bound, and the episode length is the only thing that stops it. A horizon-derived
      bound would be a modelling choice about the simulator rather than a property of this measurement.
      BIRD's normalisation clips at one turn, which is a separate decision recorded in `normalized.formula`.
  normalized:
    method: explicit
    formula: >-
      clip(net_rotation_turns, 0, 1) -- one full giant swing is 1.0. Clipped rather than normalised
      against an anchor because no anchor exists, and clipped at ONE turn because a single complete
      rotation is the task as a gymnast states it; the clip is silent, a known defect, and the tell
      that it was wrong would be candidates landing at exactly 1.000.
    success_threshold: 0.5
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
