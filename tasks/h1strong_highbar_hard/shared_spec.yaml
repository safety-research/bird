# h1strong_highbar_hard -- HumanoidBench `h1strong-highbar_hard-v0` on the Unitree H1 with two Shadow Hands.
#
# THIS TASK'S SHIPPED REWARD HAS DOCUMENTED DEFECTS. `exploits` below records each one: a
# documented way in which the published reward pays for something other than the task,
# recorded as data rather than prose so that tooling and a screen can both read it. They
# are `status: open` BY DESIGN -- they describe the shipped reward as published, which
# BIRD does not modify.
#
# CONSEQUENCES, ACCEPTED AND NOT BUGS. There is no trustworthy ground-truth fitness and no
# human-designed reference reward here: `anchors.expert` is null, `anchors.random` is
# unmeasured, `budget.learning_verified.verified` is false, and `evaluate.fitness.source:
# none` is the right setting for a run on this task. `continuous_success` is a STATED
# PROXY built from state and fixed scene geometry -- read its `formula` before quoting a
# number from it.
#
# DERIVED, NOT TRANSCRIBED. Every row of `flat_fields`, every entry of `action_fields` and
# every joint range came from building `assets/envs/h1strong_pos_highbar_hard.xml` with mujoco==3.1.6
# against humanoid-bench cb11890; `tests/test_humanoid_hand.py::
# test_the_flat_fields_are_the_models_own_joint_table` rebuilds the table from the live
# model and fails if this file drifts from the asset.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.

schema_version: 1
id: h1strong_highbar_hard
env:
  env_id: h1strong-highbar_hard-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately if the head drops below 2.0 m -- that is, as soon as the robot
      lets go of the bar and falls. Otherwise it runs its full 1000 steps. There is no way to finish
      early by succeeding, only by failing.
  reset:
    kind: deterministic
    deterministic_because: >-
      `H1StrongHighBarHard._randomness = 0.0` (bird/envs/humanoid_hand.py:1583) makes the base `_reset`
      add `0.0` instead of drawing (`rng.uniform(-r, r, size=76) if r > 0 else 0.0`, line 942), and the
      class defines no task hook, so the Generator is never read: reset(seed 0) == reset(seed 7) exactly,
      as `tests/test_humanoid_hand.py:775-786` asserts where humanoid_bench is installed. The task wants
      that because the keyframe places the hands closed on the bar and a perturbation large enough to see
      would drop the robot off it (lines 1502-1503).
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: _H1HandBase._reset
      lines: 936-986
    rng_note: >-
      No draw at all: the `r > 0` guard on line 942 skips the uniform, `_task_reset_state` is the identity
      (lines 974-978), and `domain_randomization` is null on this spec.
    draws: []
    constants:
    - role: agent_pose
      quantity: keyframe_pose
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - s.joint_angles
      value: >-
        `model.key_qpos[keyframe]` exactly, every episode: the single `<key>` of `assets/envs/h1strong_pos_highbar_hard.xml`
        (read in the cb11890 clone) -- pelvis at (0.27, 0, 1.62) m, identity quaternion, both hands closed
        on the bar at (0.31, 0, 2.80) m, feet clear of the floor (provenance.measured). All 76 position
        coordinates are identical across seeds.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
        symbol: _H1HandBase._reset
      basis: read
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1strong_pos_highbar_hard.xml` declares `qpos` and `ctrl` only, so
        MuJoCo's `key_qvel` is zeros (read in the cb11890 clone). Identical across seeds either way.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: goal
      quantity: goal
      value: >-
        none -- there is no target pose or marker. `task_metric` is |net pelvis rotation| about the bar
        axis at (`_BAR_X`, `_BAR_Z`) = (0.31, 2.80) m (line 505), in turns, clipped at 1; `_success_flag`
        is pelvis z > 2.80 m. The bar is fixed model geometry.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1622-1645
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      Real and deliberate, read at cb11890: `HighBarBase.reset_model` (highbar.py:59-61) sets `self._env.randomness
      = 0` and only then calls `super().reset_model()`, but `HumanoidEnv.reset_model` (env.py:229-242) has
      already drawn `uniform(-r, r, size=nq)` with the constructor's `randomness = DEFAULT_RANDOMNESS` (env.py:117,
      206) before it reaches `task.reset_model` -- so on a fresh upstream env the FIRST episode is perturbed
      by up to 0.01 per coordinate and every later one is not. This adapter (1469-1481) takes the steady
      state -- upstream's episodes 2..N -- for every episode, so BIRD's episode 1 differs from upstream's
      episode 1 and matches every other.
    prompt_states: The robot starts hanging from a bar 2.8 m above the ground with both hands on it
    prompt_field: l_task
    prompt_omits: []
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
