reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/room.py
      lines: 80-131
      symbol: Room.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: 2ac7de278d44f75466ff424566bf957e7889b9fe5317586daea9b87925771a41
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.room:Room.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `0.2 * (small_control * stand_reward) + 0.8 * room_object_organized`, where `room_object_organized
      = tolerance(max(var_x, var_y), margin=3)` over the six objects' world positions. THIS IS THE
      ARTIFACT UNDER CRITICISM: the objective is literally variance minimisation, which is a statement
      about how spread out the objects are and not about whether the room is tidy -- see `exploits`.
      Read against source at cb11890; not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    BIRD's gate, and it is a different SET from the flat list above rather than a superset. Three
    of the four name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `_env` -- which are not
    properties of the task; they are the routes by which a candidate could reach the quantity it is
    scored on IN THIS REPO. `success_bar` is the fourth and it is a BENCHMARK symbol: HumanoidBench
    declares one on every task class, and while nothing upstream reads it, a candidate that found
    it would be reading a threshold on the shipped reward's own episode return.


    `success` IS DELIBERATELY ABSENT. Listing it would reject any candidate that names its own
    proxy `success`, which on Meta-World rejected 15 of 15 candidates (tasks/drawer_close). An
    identifier gate on this word is both too strict and too weak -- a candidate that spells the same
    quantity `hit` passes either way.


    The defence that does hold is STRUCTURAL and needs no gate: a generated reward can influence the
    POLICY and nothing else, and `success()` here is a threshold on `task_metric`, which IS gated.
    A candidate that re-derives the check from the observation has written a sparse reward -- a legitimate
    design point that trains poorly at this tier's budget and loses on its merits.
judge:
  vlm_legible: true
  legibility_note: >-
    Highly legible: six recognisable household objects and their arrangement on the
    floor is exactly the kind of scene a VLM reads well, and a heap in the middle of the room versus
    objects on a shelf is an obvious difference in a still. The weakness is the opposite of `half_cheetah`'s
    -- posture and object identity read, but the objects are small and a judge asked whether the snow
    globe specifically is on the shelf may be guessing.
  camera:
    name: cam_default
    mode: tracking
    note: >-
      `cam_default` is a `mode="trackcom"` camera on the pelvis, so the room's far side leaves frame
      whenever the robot walks. A judge scoring 'is the room tidy' from a tracking camera is scoring
      the part of the room the robot happens to be standing in; prefer the telemetry below.
  extra_views:
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      Where the objects are relative to each other and to the robot is the whole task, and
      it reads in plan.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  - name: cam_hand_visible
    mode: tracking
    note: >-
      Camera following the pelvis from behind the robot's left shoulder, close and low: the
      hands and whatever is in front of them fill the frame, with the robot at about three
      times the pixels the default camera gives it. Where the robot is in the room is not
      visible from here.
  subtasks_sequential: false
  telemetry_fields:
  - objects_stowed
  - object_positions
  - pelvis_z
domain_randomization: null
exploits:
- name: heap_minimises_variance
  mechanism: >-
    `room_object_organized = tolerance(max(var(x), var(y)), margin=3)` is maximised when the six objects'
    positions have zero variance -- that is, when they are all in the same place. Shoving everything
    into one pile anywhere on the floor, including the middle of the room, saturates the reward's
    0.8-weighted term regardless of whether the room is tidy in any meaningful sense.
  status: open
  closed_by: null
  note: >-
    The shipped reward's central defect, so it is open by design. BIRD's `task_metric` scores objects
    stowed on the furniture and reads 0.0 for the heap, which is what makes the gap between fitness
    and shipped return the measurement.
- name: variance_starts_low_at_the_keyframe
  mechanism: >-
    The composed keyframe places all six free bodies at the origin; `Room.reset_model` then scatters
    them. Any dynamics that returns them toward one another -- including the robot simply walking
    through the middle and knocking things together -- moves the reward toward its maximum without
    a tidying intention anywhere in the loop.
  status: open
  closed_by: null
  note: null
- name: stand_still_and_collect
  mechanism: >-
    As on powerlift: the 0.2-weighted `small_control * stand_reward` term pays a robot that stands
    upright and does nothing, for all 1000 steps, and the only terminal is a collapse below 0.3 m.
  status: open
  closed_by: null
  note: >-
    Shared with powerlift and with every task in the benchmark that composes a stand term additively.
    Listed per task rather than once, because a scorer reads one spec.
- name: reset_corrupts_two_finger_joints
  mechanism: >-
    NOT A REWARD HACK -- an upstream defect, recorded here because this is the field a reader checks
    before trusting a number from this task. `Room.reset_model` loops `for i in range(-7, 0)` over
    SIX objects and writes `position[i*7]` and `position[i*7+1]`. With nq = 118 the first iteration
    writes indices 69 and 70, which are the right hand's `rh_LFJ2` and `rh_LFJ1` -- both limited to
    [0, 1.571] rad and both set to roughly -3 rad and +-[1.2, 3.5] rad. Every episode begins with
    the right little finger folded far outside its own range.
  status: open
  closed_by: null
  note: >-
    BIRD reproduces it rather than correcting it: a different initial distribution is a different
    environment, and a quiet fix would make these numbers incomparable with anyone else's on `h1hand-room-v0`.
    Pinned by `tests/test_humanoid_hand.py`, so an upstream fix arrives as a failing test rather than
    as a silent change of environment. The same method also draws from the GLOBAL `np.random`, so
    upstream's own placement is not reproducible from a seed; BIRD's adapter draws from `ctx.rng`
    and is.
