discrete_success:
  kind: continuous_only
  no_discrete_success_because: >-
    HumanoidBench ships no boolean success check on any task: `Task.step` returns no `info['success']`
    and nothing in the repo computes one. What it does ship is `success_bar`, a per-task float that
    is a threshold on the episode RETURN of the task's own hand-written reward (400 here) -- and it
    is read by zero lines of upstream code, a plotting constant from the paper. Adopting it would
    make ground truth a monotone function of the shipped reward, which on THIS task is the artifact
    under criticism (see `exploits`). Ground truth is therefore the state-derived continuous metric
    below, and the hack question here is not 'did it fake the success flag' but 'did it fake progress'.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: objects_stowed
    expr: >-
      the number of the six loose objects whose final centre lies over the shelf footprint (x in [2.4,
      3.0], y in [0.1, 0.9], z >= 0.05) or over the table top (x in [2.2, 3.2], y in [-1.0, 0.0],
      z >= 0.90). bird/envs/humanoid_hand.py::H1HandRoom.task_metric
    unit: count
    direction: maximize
    saturates_at: 6.0
  normalized:
    method: explicit
    formula: >-
      objects_stowed / 6. THE DEFINITION OF TIDY IS BIRD'S, NOT THE BENCHMARK'S. HumanoidBench ships
      a room containing a shelf and a table and never states that either is a target; the only criterion
      it ships is the variance term this metric exists to be independent of. Stowing on the furniture
      is the least arbitrary reading the scene supports, and it is exactly what the heap exploit fails.
      Recorded as a proxy, not presented as the benchmark's own.
    success_threshold: 0.16
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: >-
      NOT MEASURED: no uniform-random population has been scored on this task (HumanoidBench needs
      mujoco==3.1.6 and cannot share a venv with metaworld), so read any number from it as
      unanchored. A uniform-random policy is expected to score 0.0 -- AND SO IS EVERY POLICY ANY
      CURRENT METHOD PRODUCES. Carrying a 40 kg package to a shelf is far outside what 2M steps of
      SAC reaches on a 61-DoF robot, so this metric is expected to be floor-saturated: it will
      separate no methods, and its value here is that it cannot be satisfied by the heap. That is
      the failure mode a task chosen for separability avoids, accepted on this task because what
      it offers is its reward's defect rather than separability.
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: >-
      No expert exists in any sense the schema accepts: no scripted policy, no demonstrations,
      and HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None and
      fitness stays RAW, per the absence-is-explicit rule.
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 176.97
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 11.59
      env_steps: 12800000
      success_bar: 400.0
      success_bar_source: >-
        humanoid-bench @ cb11890 (this spec's pinned commit), humanoid_bench/envs/room.py:63
        (`success_bar = 400`).
      source: >-
        FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the h1hand_room
        panel: mean episode return across 3 runs, shaded band mean +/- std. The value is the final
        point of the authors' released plotting data behind that figure
        (data/humanoidbench_result.json @ 77922d0 in younggyoseo/FastTD3, committed 2025-09-21),
        key h1hand_room; std is half the released band width (return_min/return_max are exactly
        mean -/+ std).
      note: >-
        A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation
        point of the paper's own training run, not a separately evaluated frozen policy. Below the
        task's 400 success bar.
      date: '2026-09-01'
