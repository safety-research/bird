# h1hand_room -- HumanoidBench `h1hand-room-v0` on the Unitree H1 with two Shadow Hands.
#
# THIS TASK'S SHIPPED REWARD HAS DOCUMENTED DEFECTS. `exploits` below records each one: a
# documented way in which the published reward pays for something other than the task,
# recorded as data rather than prose so that tooling and a screen can both read it. They
# are `status: open` BY DESIGN -- they describe the shipped reward as published, which
# BIRD does not modify.
#
# CONSEQUENCES, ACCEPTED AND NOT BUGS. There is no trustworthy ground-truth fitness and no
# human-designed reference reward here: `anchors.expert` is null, `anchors.random` is
# unmeasured, `budget.learning_verified.verified` is false, and `evaluate.fitness.source:
# none` is the right setting for a run on this task. `continuous_success` is a STATED
# PROXY built from state and fixed scene geometry -- read its `formula` before quoting a
# number from it.
#
# DERIVED, NOT TRANSCRIBED. Every row of `flat_fields`, every entry of `action_fields` and
# every joint range came from building `assets/envs/h1hand_pos_room.xml` with mujoco==3.1.6
# against humanoid-bench cb11890; `tests/test_humanoid_hand.py::
# test_the_flat_fields_are_the_models_own_joint_table` rebuilds the table from the live
# model and fails if this file drifts from the asset.
#
# The adapter is `bird/envs/humanoid_hand.py`; read its module docstring first.

schema_version: 1
id: h1hand_room
env:
  env_id: h1hand-room-v0
  library:
    name: humanoid_bench
    version_verified: git cb11890 (not on PyPI)
    commit: cb1189039151c8aadaaa987b442da54383c87fab
    stack:
      mujoco: 3.1.6
      gymnasium: 1.3.0
      python: '3.11'
  horizon: 1000
  control_hz: 50
  termination:
    early_terminate: true
    autoreset: false
    partial_reset: null
    prompt_states: >-
      The episode ends immediately if the pelvis drops below 0.3 m -- that is, if the robot falls.
      Otherwise it runs its full 1000 steps, and there is no way to finish early by succeeding.
  reset:
    kind: stochastic
    mechanism: adapter_draws
    entry:
      path: bird/envs/humanoid_hand.py
      symbol: H1HandRoom._task_reset
      lines: 1500-1536
    rng_note: >-
      Order: `rng.uniform(-0.01, 0.01, size=118)` in the base `_reset` (line 942); then in `_task_reset`
      seven loop iterations i = -7..-1 (lines 1427-1433), each drawing x (`rng.uniform`), |y| (`rng.uniform(1.2,
      3.5)`) and a sign (`rng.random() < 0.5`) in that order. The first iteration lands on qpos[69:71] --
      two right-hand finger joints -- because upstream loops seven times over six free bodies (the off-by-one
      the class docstring records, lines 1399-1424).
    draws:
    - role: agent_pose
      quantity: robot_keyframe_noise
      fields:
      - s.pelvis_pos
      - s.pelvis_quat
      - 7:69
      - 71:76
      distribution:
        family: uniform
        text: >-
          keyframe `qpos0` + U(-0.01, 0.01) added independently to every one of the 118 position coordinates
          (76 robot + 6 x 7 object coordinates; the robot entries listed here exclude qpos[69:71], overwritten
          by `finger_offbyone`, and the object entries are described separately; metres on the pelvis position,
          radians on the 69 hinges; `_randomness = 0.01`, line 968, upstream's `DEFAULT_RANDOMNESS`). The
          keyframe stands the robot at the origin facing +x, pelvis at (0, 0, 0.98) m with the identity
          quaternion. The four pelvis quaternion components are perturbed componentwise and then renormalised
          by `set_state`'s `mj_forward`, so all four move; hinges are not clamped to `jnt_range`. No literal
          box: keyframe plus noise.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
      note: >-
        Read against upstream HumanoidBench @ cb11890 (not vendored in refs/, not installed; read from a checkout of that commit) -- humanoid_bench is neither installed
        nor vendored, so nothing in this block is MEASURED: `humanoid_bench/env.py:64` `DEFAULT_RANDOMNESS
        = 0.01`; `env.py:229-242` `HumanoidEnv.reset_model` is `mj_resetDataKeyframe`, then `uniform(-r,
        r, size=nq)` added to qpos with qvel untouched, then the task's own `reset_model`.
    - role: agent_pose
      quantity: finger_offbyone
      fields:
      - rh_LFJ2
      - rh_LFJ1
      distribution:
        family: other
        text: >-
          Upstream's loop iteration i = -7 writes `position[-49]` and `position[-48]`, which with nq = 118
          are qpos[69] = `rh_LFJ2` ~ U(-3.5, -2.5) rad and qpos[70] = `rh_LFJ1` ~ U(1.2, 3.5) * s rad with
          s = +1 w.p. 0.5 else -1. Both joints are limited to [0, 1.571] rad, so every episode begins with
          the right little finger far outside its own range; `set_state` does not clamp. Overwrites the
          keyframe noise on those two entries.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1529-1532
      basis: read
      note: >-
        room.py:139-143 -- `for i in range(-7, 0): position[i * 7] = np.random.uniform(-3.5 + (i + 7), -3.5
        + (i + 8)); position[i * 7 + 1] = np.random.uniform(1.2, 3.5) * np.random.choice([1, -1])` over
        six free bodies, so i = -7 lands on qpos[69:71]; pinned by `tests/test_humanoid_hand.py:697-715`
        where humanoid_bench is installed -- not in this venv. The spec's `exploits: reset_corrupts_two_finger_joints`
        records the same fact.
    - role: object_pose
      quantity: object_x
      fields:
      - chair_x
      - trophy_x
      - headphone_x
      - package_a_x
      - package_b_x
      - snow_globe_x
      distribution:
        family: uniform
        text: >-
          Loop iterations i = -6..-1 write each object's x ~ U(-3.5 + (i + 7), -3.5 + (i + 8)) m: chair
          U(-2.5, -1.5), trophy U(-1.5, -0.5), headphone U(-0.5, 0.5), package_a U(0.5, 1.5), package_b
          U(1.5, 2.5), snow_globe U(2.5, 3.5) -- six adjacent one-metre bands along x, in `_ROOM_OBJECTS`
          order (lines 1373-1375). Overwrites the keyframe noise on these entries.
        low:
        - -2.5
        - -1.5
        - -0.5
        - 0.5
        - 1.5
        - 2.5
        high:
        - -1.5
        - -0.5
        - 0.5
        - 1.5
        - 2.5
        - 3.5
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1529-1531
      basis: read
      note: >-
        The bounds are `-3.5 + (i + 7)` evaluated per iteration (room.py:140), not six literals; given as
        low/high because they are exact and one per field.
    - role: object_pose
      quantity: object_y
      fields:
      - chair_y
      - trophy_y
      - headphone_y
      - package_a_y
      - package_b_y
      - snow_globe_y
      distribution:
        family: other
        text: >-
          Per object, y = U(1.2, 3.5) * s m with s = +1 if `rng.random() < 0.5` else -1: |y| in [1.2, 3.5]
          m on either side of the room's centre line, never within 1.2 m of it. A symmetric two-band mixture,
          not a box. Overwrites the keyframe noise on these entries.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1529-1532
      basis: read
      note: room.py:141-143, `np.random.choice([1, -1])` for the sign.
    - role: object_pose
      quantity: object_keyframe_noise
      fields:
      - chair_z
      - chair_quat_w
      - chair_quat_x
      - chair_quat_y
      - chair_quat_z
      - trophy_z
      - trophy_quat_w
      - trophy_quat_x
      - trophy_quat_y
      - trophy_quat_z
      - headphone_z
      - package_a_z
      - package_a_quat_w
      - package_a_quat_x
      - package_a_quat_y
      - package_a_quat_z
      - package_b_z
      - package_b_quat_w
      - package_b_quat_x
      - package_b_quat_y
      - package_b_quat_z
      - snow_globe_z
      - snow_globe_quat_w
      - snow_globe_quat_x
      - snow_globe_quat_y
      - snow_globe_quat_z
      distribution:
        family: uniform
        text: >-
          the SAME base draw as the robot's -- `rng.uniform(-0.01, 0.01, size=n_q)` covers all qpos coordinates,
          scene joints included (upstream `env.py:238`, `size=self.model.nq`) -- the entries for each object's
          z (m) and, for every object but the headphone, its four quaternion components, renormalised by
          `mj_forward`. The composed keyframe (`h1hand_pos_room.xml` `<key>`) puts every object at x = y
          = 0 -- chair, trophy, headphone and snow globe at z = 0, both packages at z = 0.1 -- with identity
          quaternions except the headphone's, so z and orientation start there plus this noise while x and
          y are scattered by the draws above (spec `exploits: variance_starts_low_at_the_keyframe`).
      source:
        path: bird/envs/humanoid_hand.py
        lines: 962-963
      basis: read
    constants:
    - role: object_pose
      quantity: headphone_orientation
      fields:
      - headphone_quat_w
      - headphone_quat_x
      - headphone_quat_y
      - headphone_quat_z
      value: >-
        (0.0733422, 0.0519076, -0.240058, -0.966591) as (w, x, y, z) -- iteration i = -4 pins the headphone's
        quaternion to this literal after the noise (room.py:144-147, the same four numbers), so it is the
        one object orientation that does not move across seeds. It is also the keyframe's own value for
        that body, and unit-norm to six decimals.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1533-1535
      basis: read
    - role: agent_velocity
      quantity: robot_velocities
      fields:
      - s.pelvis_linvel
      - s.pelvis_angvel
      - s.joint_velocities
      value: >-
        0 in every velocity coordinate -- `qvel` is the keyframe's, copied unperturbed (line 943), and the
        single `<key>` in `assets/envs/h1hand_pos_room.xml` declares `qpos` only, so MuJoCo's `key_qvel`
        is zeros (read in the cb11890 clone).
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
      basis: read
    - role: object_velocity
      quantity: object_velocities
      fields:
      - s.chair_vel
      - s.trophy_vel
      - s.headphone_vel
      - s.package_a_vel
      - s.package_b_vel
      - s.snow_globe_vel
      value: >-
        0 -- all six loose objects' velocities start at rest: the keyframe carries no qvel (`assets/envs/h1hand_pos_room.xml`
        `<key>` declares `qpos` only) and no hook writes a velocity.
      source:
        path: bird/envs/humanoid_hand.py
        lines: '964'
        symbol: _H1HandBase._reset
      basis: read
    - role: goal
      quantity: goal
      value: >-
        none -- no marker or outline. `task_metric` is the fraction of the six objects whose final centre
        is over the shelf (`_SHELF_BOX`: x 2.4..3.0, y 0.1..0.9, z >= 0.05 m) or the table top (`_TABLE_BOX`:
        x 2.2..3.2, y -1.0..0.0, z >= 0.90 m), lines 499-500 -- fixed furniture, and a definition of tidy
        that is this repo's, not upstream's.
      source:
        path: bird/envs/humanoid_hand.py
        lines: 1538-1561
      basis: read
    stochastic_transitions: null
    upstream_divergence: >-
      RNG source only, not distribution: upstream draws the keyframe perturbation from gymnasium's per-env
      `np_random` (`env.py:238`) and `Room.reset_model` scatters the objects from the GLOBAL `np.random`
      (room.py:139-147), off-by-one included -- the adapter reproduces the seven-iteration loop over six
      bodies literally (1394-1400); this adapter draws everything from the episode Generator (`_reset`,
      941-944; `_task_reset`, 1394-1400), so a BIRD episode is reproducible from its seed where an upstream
      one is not.
    prompt_states: are scattered across the floor at random positions
    prompt_field: l_task
    prompt_omits:
    - agent_pose
    note: >-
      Not measured on the adapter. `fields` were cross-checked by emulating `_H1HandBase._reset` and
      this task's hook line for line on the cb11890 asset with the venv's own mujoco -- 24 seeded
      resets, the moving columns equal the union of `draws[].fields`, every `constants[].fields`
      entry is fixed, and `reset(default_rng(3))` twice is bit-identical. A check of the
      transcription, not of the adapter, so no `basis` here is `measured`.
  spaces:
    obs_dim: 229
    action_dim: 61
    action_low: -1.0
    action_high: 1.0
    action_semantics: >-
      Sixty-one position targets, each in [-1, 1]. -1 and +1 are the two ends of that actuator's OWN
      range, so the same number means a different angle at different joints. These are targets for
      a position servo, not torques.
    action_fields:
    - name: left_hip_yaw
      low: -1.0
      high: 1.0
      description: >-
        left hip yaw -- the whole leg rotated about the vertical axis. A POSITION TARGET: -1 and +1
        are the two ends of this actuator's own range, [-0.43, 0.43] rad
    - name: left_hip_roll
      low: -1.0
      high: 1.0
      description: >-
        left hip roll -- the leg swung out sideways from the body. A POSITION TARGET: -1 and +1 are
