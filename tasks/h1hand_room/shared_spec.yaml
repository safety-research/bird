description:
  natural_language: >-
    Tidy the room. Six loose objects -- a chair, a trophy, a pair of headphones, two packages and
    a snow globe -- are scattered across the floor at random positions, and there is a shelf and a
    table against one wall. Put the objects away on the furniture and stay standing while doing it.
    Sweeping everything into one pile on the floor is not tidying, and neither is standing still in
    a room that is still a mess.
  l_task: >-
    Tidy the room. Six loose objects -- a chair, a trophy, a pair of headphones, two packages and
    a snow globe -- are scattered across the floor at random positions, and there is a shelf and a
    table against one wall. Put the objects away on the furniture and stay standing while doing it.
    Sweeping everything into one pile on the floor is not tidying, and neither is standing still in
    a room that is still a mess.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    The robot stands in the middle of a room about 8 m square, walled on all four sides. Against one
    wall stand two pieces of furniture: a seven-board shelf unit roughly 1.9 m tall centred at (2.7,
    0.5), and a table 0.95 m high centred at (2.7, -0.5). Six loose objects lie scattered on the floor
    at positions redrawn every episode -- a wooden chair (16 kg), a metal trophy (1.5 kg), a pair
    of headphones (2.9 kg), two cardboard packages (24 kg and 40 kg) and a snow globe (5 kg). Each
    is a free body that can be pushed, lifted, carried or knocked over. The episode ends early if
    the pelvis drops below 0.3 m.
  scene: >-
    A walled room seen from a camera that tracks the robot. A tall shelf unit and a table stand together
    against one side; six household objects of very different sizes lie on the open floor. There is
    no target marker, no outline on the floor and nothing in the scene that states where anything
    is supposed to end up.
  success_criterion_prose: null
  full_source:
    path: humanoid_bench/envs/room.py
    lines: 80-131
