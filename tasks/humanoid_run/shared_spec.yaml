    - "set_state does NOT renormalise the free-joint quaternion (a norm-2.0 quaternion goes in and comes back out at 2.0), so the env's own non-unit reset state (|q| in [0.9904, 1.0090] over 24 seeds) is restorable bit for bit; mj_step does renormalise, and raw vs normalised differ by 5.6e-17 after one step."
