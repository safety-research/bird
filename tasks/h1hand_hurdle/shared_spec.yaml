reward:
  human:
    kind: published_dense
    scope: value_determining
    reference:
      path: humanoid_bench/envs/basic_locomotion_envs.py
      lines: 228-293
      symbol: Hurdle.get_reward
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: d05cb3ee859fa523aa0fd42b4b70c8ade40f29d491d6c96cef04036d3b6e8fbb
    depends_on:
    - path: humanoid_bench/robots.py
      lines: 1-86
      symbol: >-
        H1: head_height, torso_upright, actuator_forces, center_of_mass_velocity -- every quantity
        the reward reads
      commit: cb1189039151c8aadaaa987b442da54383c87fab
      sha256: b9e8e6a033a760cee76b224613efecd88f4d5ddaf1f60f60f4909b44e2edd01a
    - path: dm_control/utils/rewards.py
      lines: null
      symbol: tolerance (the shaping primitive every term is built from)
      commit: null
      sha256: null
    import_path: humanoid_bench.envs.basic_locomotion_envs:Hurdle.get_reward
    verified_against: humanoid-bench cb11890 (source read; NOT executed)
    notes: >-
      `small_control * stand_reward * move * wall_collision_discount`, with `move` a linear `tolerance`
      on forward centre-of-mass velocity bounded at _RUN_SPEED = 5 m/s and rescaled to `(5*move +
      1)/6`, and `wall_collision_discount` set to 0.1 on contact with the three CORRIDOR barriers.
      Inherits `Walk.get_terminated` (pelvis below 0.2 m) and `Walk.success_bar` (700). THIS IS THE
      ARTIFACT UNDER CRITICISM -- see `exploits`. Read against source at cb11890; not executed.
  contract:
    signature: >-
      def compute_dense_reward(s, action) -> tuple[float, dict[str, float]]:
          # single env, plain NumPy; `s` is the flat observation documented above
    framework: numpy
    batched: false
    allowed_modules:
    - numpy
    returns: (scalar, components)
    max_reward: <float>, declared by the candidate
    idiom_rule: >-
      One scalar out, not a batch. Single environment, plain NumPy: return a Python float for `reward`
      and a float for each entry of `components`.
    reward_utils:
    - name: tolerance
      signature: tolerance(x, bounds=(0, 0), margin=0, sigmoid='gaussian', value_at_margin=0.1)
      provenance:
        path: dm_control/utils/rewards.py
        lines: null
        symbol: tolerance
        commit: null
        sha256: null
  forbidden_symbols:
  - success_bar
  - get_reward
  - get_terminated
  forbidden_symbols_by_consumer:
    bird:
    - task_metric
    - reference_reward
    - success_bar
    - _env
  forbidden_symbols_note: >-
    BIRD's gate, and it is a different SET from the flat list above rather than a superset. Three
    of the four name ADAPTER INTERNALS -- `task_metric`, `reference_reward`, `_env` -- which are not
    properties of the task; they are the routes by which a candidate could reach the quantity it is
    scored on IN THIS REPO. `success_bar` is the fourth and it is a BENCHMARK symbol: HumanoidBench
    declares one on every task class, and while nothing upstream reads it, a candidate that found
    it would be reading a threshold on the shipped reward's own episode return.


    `success` IS DELIBERATELY ABSENT. Listing it would reject any candidate that names its own
    proxy `success`, which on Meta-World rejected 15 of 15 candidates (tasks/drawer_close). An
    identifier gate on this word is both too strict and too weak -- a candidate that spells the same
    quantity `hit` passes either way.


    The defence that does hold is STRUCTURAL and needs no gate: a generated reward can influence the
    POLICY and nothing else, and `success()` here is a threshold on `task_metric`, which IS gated.
    A candidate that re-derives the check from the observation has written a sparse reward -- a legitimate
    design point that trains poorly at this tier's budget and loses on its merits.
judge:
  vlm_legible: false
  legibility_note: >-
    Partly. Posture reads well -- upright, mid-stride, sprawled, braced against a wall are all distinguishable.
    HOW FAR the robot has come does not, and that is the quantity the task is about. `cam_hurdle` follows
    the pelvis exactly as the default camera does, only from higher and further back, and the hurdles
    are evenly spaced and identical, so a frame with one hurdle passed looks like a frame with six.
    Progress cannot be read off pixels here -- the same blind spot as the tracking camera on
    `half_cheetah`.
  camera:
    name: cam_hurdle
    mode: tracking
    note: >-
      `Hurdle.camera_name = "cam_hurdle"`, overriding `cam_default`: also a `mode="trackcom"` camera on
      the pelvis, 3 m behind the robot, 3 m to its left and 3 m up (read off the live camera pose),
      so the corridor and the hurdles ahead stay in
      frame as the robot travels and absolute progress does not. gymnasium's MujocoRenderer resolves
      the name to a camera id once at construction, so BIRD's `render(state)` honours it even though
      it calls the renderer directly rather than `env.render()`.
  extra_views:
  - name: side
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from its right-hand side, level with it
      and 3 m away: a side profile in which lean, gait, crouch and the height of anything
      held read directly. It moves with the robot, so absolute position is not visible; only
      the floor grid slides past. The hurdle under the robot and its clearance over it read
      in profile.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -10
      distance: 3.0
  - name: overhead
    mode: tracking
    note: >-
      Camera following the robot's centre of mass from 4 m directly above: the robot and
      everything within about two metres of it seen in plan, for where it is relative to
      nearby objects and which way it is heading. Height and posture do not read from here.
      Hurdles passed lie below the robot in this view and hurdles ahead above it.
    pose:
      track_body: pelvis
      azimuth: 90
      elevation: -80
      distance: 4.0
  subtasks_sequential: false
  telemetry_fields:
  - pelvis_x
  - hurdles_cleared
  - forward_velocity
domain_randomization: null
exploits:
- name: brace_against_a_hurdle
  mechanism: >-
    `wall_collision_discount` is applied only for contact with `left_barrier_collision`, `right_barrier_collision`
    and `behind_barrier_collision` -- the corridor's own sides. The ten hurdle walls are not in that
    list, so pressing against a hurdle costs nothing. A conservative stance that leans on a hurdle
    keeps `stand_reward` high, keeps `small_control` high, never terminates, and collects the `(5*move+1)/6`
    floor of 1/6 on the movement term forever.
  status: open
  closed_by: null
  note: >-
    The shipped reward's central defect: the documented outcome is that the robot finds conservative
    poses that let it collide with the hurdle and stabilise instead of exploring jumping behaviours.
    BIRD's `task_metric` counts hurdles PASSED, so this scores 0.0 while the shipped return stays
    high.
- name: movement_term_has_a_floor
  mechanism: >-
    `move = (5 * tolerance(...) + 1) / 6`, so the movement factor never falls below 1/6 no matter
    how still the robot is. Multiplied into a stand term a motionless upright robot maxes out, standing
    still is worth about a sixth of the per-step reward for the full 1000 steps.
  status: open
  closed_by: null
  note: >-
    Inherited from `Walk.get_reward` and shared with every locomotion task in the benchmark; recorded
    here because it is what makes the brace-and-stand pose profitable rather than merely harmless.
- name: run_speed_bound_is_unreachable
  mechanism: >-
    `_move_speed = _RUN_SPEED = 5 m/s` sets the `bounds` at which `move` reaches 1, with `margin`
    also 5 and a linear sigmoid. A humanoid that walks at 1 m/s sits at 0.2 of the term's range, so
    most of the reward's dynamic range is in a region no policy visits and the gradient over the reachable
    region is shallow.
  status: open
  closed_by: null
  note: >-
    Not a hack a policy performs -- a shaping defect that makes the reward uninformative where learning
    actually happens. Recorded because it is the reason 'the reward is bad here' is not only about
    the collision list.
