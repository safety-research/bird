provenance:
  authored_from:
  - path: humanoid_bench/__init__.py
    lines: 1-19
    what: 'the gym id registration: f''{robot}-{task}-v0'' over ROBOTS x TASKS'
  - path: humanoid_bench/env.py
    lines: 66-100
    what: ROBOTS and TASKS, and the assert robot.dof + task.dof == len(qpos)
  - path: humanoid_bench/robots.py
    lines: 1-86
    what: 'H1 / H1Hand / H1Strong: dof, and the site accessors the rewards read'
  - path: humanoid_bench/tasks.py
    lines: 1-72
    what: 'Task: frame_skip 10, get_obs = concat(qpos, qvel), unnormalize_action'
  - path: humanoid_bench/envs/basic_locomotion_envs.py
    lines: 21-96, 228-293
    what: Walk (qpos0_robot, observation_space, get_terminated) and Hurdle.get_reward
  - path: humanoid_bench/assets/locomotion/generated_xml_hurdles.xml
    lines: 1-14, 698-707
    what: the three corridor barriers and the ten collision hurdle walls
  - path: humanoid_bench/assets/envs/h1hand_pos_hurdle.xml
    lines: null
    what: the composed model -- nq 76, nv 75, nu 61, keyframe
  rule: source and asset, not docstrings
  measured:
  - >-
    Built with mujoco==3.1.6 against humanoid-bench cb11890 on 2026-08-28. Every shape, name, range
    and mass below is read from the model, not from the paper. TWO PASSES, and which one a figure
    came from matters: the tables were derived from MjModel.from_xml_path on the task's own
    assets/envs XML (no gym.make -- humanoid_bench imports torch and jax at module scope), and the
    env was then CONSTRUCTED and stepped for real, which is where the reward figures come from. No
    policy has been trained, so no anchor and no fitness here is measured.
  - >-
    Robot: 69 hinge joints (21 body + 24 per Shadow Hand) and 61 actuators. The eight-joint gap is
    tendon coupling, not a missing actuator: the middle and fingertip joints of the index, middle,
    ring and little fingers share one `A_<finger>J0` actuator per finger per hand, ctrlrange [0, 3.1415].
    Robot mass 53.24 kg.
  - >-
    nq 76, nv 75, nu 61; obs_dim 151 = nq + nv, matching Walk.observation_space's robot.dof*2 - 1.
    Hurdle adds no free bodies -- its scenery is static geometry.
  - >-
    The ten hurdles that actually collide are ten `class="collision"` boxes at pos="7k 0 0.1875" size="0.03
    5 0.1875" for k = 1..10: 0.375 m high, spanning the full corridor. EVERY geom in that file with
    'hurdle' in its body name is `class="visual"` and collides with nothing, so the visible hurdle
    frames are decoration and the walls behind them are the obstacle.
  - >-
    The three barriers the reward's collision discount DOES watch are left/right_barrier_collision
    at y = -+4.725 and behind_barrier_collision at x = -0.525.
  verified_by: BIRD authors
  date: '2026-08-28'
