description:
  natural_language: >-
    Run forwards along the corridor, getting over each hurdle in turn. The hurdles are solid walls
    a little over a third of a metre high, set seven metres apart, and they have to be crossed rather
    than pushed through -- the robot has to leave the ground. Leaning on a hurdle and standing there
    does not count as doing this task, and neither does running on the spot.
  l_task: >-
    Run forwards along the corridor, getting over each hurdle in turn. The hurdles are solid walls
    a little over a third of a metre high, set seven metres apart, and they have to be crossed rather
    than pushed through -- the robot has to leave the ground. Leaning on a hurdle and standing there
    does not count as doing this task, and neither does running on the spot.
  env_prose: >-
    The robot is a full-size Unitree H1: a pelvis, a torso, two legs and two arms, with a five-fingered
    Shadow Hand on each wrist. It has sixty-nine hinge joints -- five in each leg (hip yaw, hip roll,
    hip pitch, knee, ankle), one that twists the torso, five in each arm (shoulder pitch, shoulder
    roll, shoulder yaw, elbow, wrist yaw) and twenty-four in each hand -- driven by sixty-one actuators.
    The count differs because four joints per hand are not commanded separately: the middle and fingertip
    joints of the index, middle, ring and little fingers share one tendon actuator each, so a single
    command curls both. Every actuator is a POSITION servo -- the control signal names an angle for
    that joint to move towards, it does not apply a torque directly, and the same numeric command
    means a different angle at different joints because -1 and +1 are the two ends of each actuator's
    own range. The pelvis is unattached to anything, so the robot is free to translate in all three
    directions and to rotate arbitrarily; it can and does fall over. The robot weighs about 53 kg.
    The robot stands at one end of a straight corridor about 9.5 m wide, closed by solid walls on
    both long sides and behind it, and open ahead for seventy metres. Crossing the corridor at seven-metre
    intervals are ten solid walls, each 0.375 m high and spanning the full width -- the hurdles. Painted
    hurdle frames stand beside them but are decoration only and collide with nothing. The episode
    ends early if the pelvis drops below 0.2 m.
  scene: >-
    A long straight corridor on flat ground, seen from a camera that follows the robot from behind its left shoulder and above. Two long side walls
    and a wall behind the start; ten low walls crossing the floor ahead at even spacing, with decorative
    hurdle uprights beside them. No goal marker and nothing in the scene that counts how far the robot
    has come.
