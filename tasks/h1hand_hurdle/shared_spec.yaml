discrete_success:
  kind: continuous_only
  no_discrete_success_because: >-
    HumanoidBench ships no boolean success check on any task: `Task.step` returns no `info['success']`
    and nothing in the repo computes one. What it does ship is `success_bar`, a per-task float that
    is a threshold on the episode RETURN of the task's own hand-written reward (700 here) -- and it
    is read by zero lines of upstream code, a plotting constant from the paper. Adopting it would
    make ground truth a monotone function of the shipped reward, which on THIS task is the artifact
    under criticism (see `exploits`). Ground truth is therefore the state-derived continuous metric
    below, and the hack question here is not 'did it fake the success flag' but 'did it fake progress'.
  shipped: null
  hardened: null
continuous_success:
  raw:
    name: hurdles_cleared
    expr: >-
      the number of the ten hurdle walls (solid geoms at x = 7, 14, ..., 70) whose x the pelvis's
      high-water mark passed during the episode. bird/envs/humanoid_hand.py::H1HandHurdle.task_metric
    unit: count
    direction: maximize
    saturates_at: 10.0
  normalized:
    method: explicit
    formula: >-
      hurdles_cleared / 10. Resolution is deliberately 0.1: this counts a task-defined event rather
      than smoothing distance, so a robot braced against the first hurdle reads 0.0 rather than 'nearly
      there'.
    success_threshold: 0.1
anchors:
  # null: no `policies/` entry has been run on this task. Absence is explicit.
  scripted: null
  random:
    value: null
    method: unavailable
    source: null
    reason: >-
      NOT MEASURED: no uniform-random population has been scored on this task (HumanoidBench needs
      mujoco==3.1.6 and cannot share a venv with metaworld), so read any number from it as
      unanchored. A uniform-random policy is expected to score 0.0 -- it falls inside the first
      second and the episode terminates seven metres short of the first hurdle.
    n_seeds: null
    n_episodes: null
    date: null
  expert:
    value: null
    method: unavailable
    source: null
    reason: >-
      No expert exists in any sense the schema accepts: no scripted policy, no demonstrations,
      and HumanoidBench publishes no figure in this metric -- its `success_bar` is a threshold on the
      episode RETURN of its own shipped reward, a different quantity. `baselines` is therefore None and
      fitness stays RAW, per the absence-is-explicit rule.
    n_seeds: null
    n_episodes: null
    date: null
  published:
    fasttd3:
      value: 886.83
      unit: hb_episode_return
      algo: FastTD3
      n_runs: 3
      std: 7.93
      env_steps: 19840000
      success_bar: 700.0
      success_bar_source: >-
        humanoid-bench @ cb11890 (this spec's pinned commit),
        humanoid_bench/envs/basic_locomotion_envs.py:228 -- `class Hurdle(Walk)` declares no bar
        of its own and inherits `Walk.success_bar = 700` (:31).
      source: >-
        FastTD3 (Seo et al., arXiv:2505.22642v3), Figure 9 (Appendix A.1, p. 12), the
        h1hand_hurdle panel: mean episode return across 3 runs, shaded band mean +/- std. The
        value is the final point of the authors' released plotting data behind that figure
        (data/humanoidbench_result.json @ 77922d0 in younggyoseo/FastTD3, committed 2025-09-21),
        key h1hand_hurdle; std is half the released band width (return_min/return_max are exactly
        mean -/+ std).
      note: >-
        A published BASELINE in HB episode-return units -- not this spec's task_metric and not an
        in-repo expert; never use it to normalise fitness. It is an end-of-training evaluation
        point of the paper's own training run, not a separately evaluated frozen policy. Clears
        the task's 700 success bar. The released log also runs past Figure 9's 10,800 s x-limit
        (final point at 11,207 s / 19.8M steps; ~890 at the visible end).
      date: '2026-09-01'
