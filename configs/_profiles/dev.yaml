# Profile `dev`: small but real. Claude writes real reward code, Stable-Baselines3 trains
# on it for 20k steps, rollouts are recorded to mp4 and logged to Weights & Biases. Minutes
# per run, not hours. Pick the environment separately (problem.env_id, e.g. `pendulum` for
# a quick check or `acrobot` for a task that does not saturate).
#
# A profile says how expensively a method runs, never which method it is. It is merged last
# (_default.yaml <- the method's extends chain <- profile), so on the keys a profile may set
# (PROFILE_KEY_PREFIXES in bird/config.py) it overrides the method config, and any other key
# in a profile is refused. Method choices such as generate.n_candidates, train.algorithm,
# train.architecture and evaluate.fitness.metric therefore stay with the method.

llm:
  generator:
    provider: anthropic
    model: claude-opus-5              # the papers used gpt-4-* / gpt-5
  evaluator:
    provider: anthropic
    model: claude-sonnet-5            # secondary roles; RDA's in-loop judge uses llm.generator

loop:
  n_iterations: 3
  n_restarts: 1                       # the papers used 5 / 10 / 3

final_retrain:
  max_env_steps: same_as_train        # cap the method's retrain budget at train.env_steps

train:
  backend: sb3
  env_steps: 20000                    # the papers used 1M / 393M / 1.8M / 50M
  n_parallel_envs: 1                  # the papers used 8 / 16384 / 2048

output:
  tracker: wandb
  wandb:
    entity: null                      # null = the wandb account default
  video:
    format: mp4

verify:
  enabled: true                       # leak gate for forbidden_symbols, not a method choice
  static_checks:
    - signature_parse
    - ast_syntax
    - forbidden_symbols
