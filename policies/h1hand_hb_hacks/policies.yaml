  caveats:
  - 'INTENTIONAL REWARD HACK, built on purpose to show that HumanoidBench''s
    crawl success bar -- episode return >= 700 on the shipped reward -- is cleared by a robot that never
    enters the tunnel and never crawls: it gets down on hands and knees about a metre short of the mouth
    and rocks its trunk fore and aft over planted hands and knees for the rest of the episode. The shipped
    reward''s in_tunnel factor reads only the robot''s y (never x), its posture terms pay for being on
    all fours anywhere, and its move term is one-sided in COM x velocity, so a zero-mean rock earns on
    every forward half-stroke and pays nothing back on the backward one. It is NOT a crawling policy:
    never use it as a crawl prior, a BC/DAgger target or a ''crawling'' baseline'
  - 'status is `reference`, not `solved`, deliberately: bird.policies.reference_for_env ranks solved and partial
    entries first, so this entry never becomes h1hand_crawl''s scripted anchor or the registry''s default policy for the env. The registry has no status that says ''a deliberate metric hack'';
    `reference` is the one that claims nothing about solving the task, and the notes line and the first caveat
    carry the label'
  - 'a MARGINAL pass: HB return 715.69 mean, 100/100 >= 700 on seeds 0-99 (min 712.63) and 715.85, 100/100
    on 3000-3099 (min 713.50), a few points over the bar per episode'
  - 'BIRD''s own crawl metric is NOT fooled: task_metric is mean forward pelvis speed over 1 m/s gated
    on |y| <= 1 m, and reads 0.0329 (max 0.0355) against the 0.25 threshold, 0/100 successes -- the small
    positive value is the net forward travel of the get-down itself (pelvis x +0.59..+0.70 m at step 250),
    not crawling; the opposite of the walk hacks, where both scores are fooled'
  - 'HB return is far BELOW FastTD3''s published 956.24 (tasks/h1hand_crawl spec): the point is that the
    bar is reachable without doing the task, not that the hack out-scores a crawl'
  - 'the gym-env held-out blocks (NOTES_crawl.md, hk.Rig over plain gym.make): 300/300 >= 700
    on seeds 3000-3299 (715.6 mean, min 709.7) for these constants; the pre-robustness constants failed
    3/200 and the round-2 constants failed seed 54 on both instruments, so the tail rate is low, not proven
    zero'
  notes: 'INTENTIONAL REWARD HACK, not a crawling policy: built on purpose against HumanoidBench''s
    shipped crawl reward, never to be used as a crawl prior, a BC/DAgger target or a crawling baseline.
    rock.py: a gravity-led LEAN -> CATCH -> SETTLE get-down onto hands and knees short of the tunnel
    mouth, then NO gait
    at all -- hips, knees, ankles and shoulders driven by one sinusoid so the trunk rocks fore and aft
    over planted hands and knees, a zero-mean fore-aft COM velocity that the one-sided move term pays
    on every forward half-stroke. Constants: robust3_rock_final.json (three CEM robustness rounds on a
    growing seed set that included every failure found so far). Measured with
    scripts/eval_policy.py --seeds 0-99 and 3000-3099 from a clean clone; records/adapter_positions_crawl_rock_*
    is poscheck_crawl.py''s position pass through the same adapter.'
