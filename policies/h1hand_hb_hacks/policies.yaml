  - '5/100 seeds fall during or just after the turn (seeds 14, 31, 38, 73, 82 fall at steps 127-306, returns
    36.0-113.3). Held-out status: moon_t15 is the CEM''s constants with the turn start moved, and that setting came
    from a grid run on 20 seeds chosen by evaluating the CEM''s constants on 10-29 and 30-89, so of this
    block only 90-99 is clean (NOTES_moonhop.md: gym 90-149 is the only clean held-out set, 790.8 mean, 59/60). On
    adapter seeds 90-99 this record reads 804.09 mean, min 801.69, 10/10 >= 700; on the 78 seeds outside
    the CEM pair and the grid it reads 795.26, 77/78 -- a weaker statement than held-out, since every seed
    of 10-89 was looked at'
  - 'BIRD''s own walk metric is fooled too: task_metric reads 1.0 on every full episode (mean 0.9655);
    travelling backwards at ~1.2 m/s is +x progress to it'
  - the rendered floor ends at x = 20 m and the moonhop covers ~21 m, so a render's last frames show the robot past the drawn edge; a MuJoCo plane collides everywhere, only its drawing is finite
  notes: 'INTENTIONAL REWARD HACK, not a walking policy: built on purpose against HumanoidBench''s
    shipped walk reward, never to be used as a walking prior, a BC/DAgger target or a walking baseline.
    moon.py subclasses an earlier version of the hopper (snap_hop3.py, a snapshot of hop3.py, the
    predecessor of hop4.py) with re-tuned knobs (snap_hop3_cem_a.json overlaid by gallop_best_d0.json,
    feet together), and adds only a heading servo whose reference slews 0 -> pi
    from t_turn0 = 1.5 s and, once the robot faces back, a negative speed command in its own heading frame,
    which is +x in the world. Constants: moon_t15.json (an 11-knob CEM on seeds 0-1, with the turn start moved
    0.79 -> 1.5 s on a 20-seed grid). Measured with scripts/eval_policy.py --seeds 0-99 from a clean
    clone.'
