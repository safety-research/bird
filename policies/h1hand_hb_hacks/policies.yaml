    180 degrees on the spot, then hops BACKWARDS for the rest of the episode, so it never faces the way
    it is going. HumanoidBench''s move term reads the world-frame COM x velocity and never asks which
    way the robot faces. It is NOT a walking policy: never use it as a walking prior, a BC/DAgger target
    or a ''walking'' baseline'
  - 'status is `reference`, not `solved`, deliberately: bird.policies.reference_for_env ranks solved and partial
    entries first, so this entry never becomes h1hand_walk''s scripted anchor or the registry''s default policy for the env. The registry has no status that says ''a
