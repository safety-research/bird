  caveats:
  - 'INTENTIONAL REWARD HACK, built on purpose to show that HumanoidBench''s
    walk success bar -- episode return >= 700 on the shipped reward -- is cleared by a gait no human would
    use: both legs get the same command on every step, so the robot hops with its feet together like a
    kangaroo and never alternates them. It is NOT a walking policy: never use it as a walking prior, a
    BC/DAgger target or a ''walking'' baseline'
  - 'status is `reference`, not `solved`, deliberately: bird.policies.reference_for_env ranks solved and partial
    entries first, so this entry never becomes h1hand_walk''s scripted anchor or the registry''s default policy for the env. The registry has no status that says ''a
    deliberate metric hack''; `reference` is the one that claims nothing about solving the task, and the notes
    line and the first caveat carry the label'
  - 'BIRD''s own walk metric is fooled too: task_metric is mean forward speed over 1 m/s, clipped, and
    reads 1.0000 (min 0.9997) over 100 seeds -- it cannot tell a hop from a walk either'
  - 'HB return 890.65 against FastTD3''s published 928.26 (tasks/h1hand_walk spec): a trained walker
    OUT-SCORES the hop on the benchmark''s own score, and the hop claims to beat no walking policy -- what
    it shows is that the score cannot tell the two gaits apart, since both clear the bar'
  notes: 'INTENTIONAL REWARD HACK, not a walking policy: built on purpose against HumanoidBench''s
    shipped walk reward, never to be used as a walking prior, a BC/DAgger target or a walking baseline.
    Two-footed Raibert kangaroo hop: hop4.py, the final controller, both legs one virtual
    leg in the heading frame, a four-phase event-gated machine (init crouch, thrust, flight with Raibert
    foot placement, compression), stance pitch and roll held by hip torques issued through the position
    servos, and an event-gated speed ramp to v_des 1.25. Constants: final_params.json (its own provenance
    key: CEM a -> CEM b -> speed ramp -> gentle first push). The gait census (NOTES_hop.md, gym seeds 1000-1099) has both feet airborne on 55.7% of steps and exactly one foot down on 1.6%. Measured with scripts/eval_policy.py --seeds 0-99 from a clean clone.'
