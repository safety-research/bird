campaign: h1hand_hb_hacks
family: humanoidbench
pattern: rig
runtime:
  mujoco: 3.1.6
  notes: HumanoidBench family (humanoid_bench @ cb11890, mujoco 3.1.6), measured in the HumanoidBench
    venv (scripts/setup_humanoid.sh). The controllers were written and tuned against hk.Rig over a plain gym.make env (the
    upstream instrument HB's success_bar thresholds); entry.py re-seats the same controllers on the BIRD
    adapter's own simulator, which zeroes qacc_warmstart every step. Every score below is the adapter's.
code:
- hk.py
- hop4.py
- final_params.json
- snap_hop3.py
- snap_hop3_cem_a.json
- gallop_best_d0.json
- moon.py
- moon_t15.json
- entry.py
- rock.py
- entry_crawl.py
- robust3_rock_final.json
- poscheck_crawl.py
source:
  archive: 'not distributed: only the policy code, its constants, write-ups and evaluation records are included'
  date: '2026-09-23'
  log: policies/h1hand_hb_hacks/NOTES_hop.md
assets:
- file: NOTES_hop.md
  what: write-up of the hop -- the gym-env evaluation on seeds 0-9, 10-29 and 1000-1099, the
    ankle-contact gait census and the mechanism
- file: NOTES_moonhop.md
  what: write-up of the moonhop -- its gym-env evaluation on held-out seeds 90-149, how moon_t15 was
    chosen, and the loophole checks on the walk reward that came back negative
- file: NOTES_crawl.md
  what: write-up of the kneel-and-rock crawl (crawl_rock) -- the shipped Crawl reward and the three
    misalignments it exploits, its gym-env numbers on held-out seeds 1000-1299, 2000-2299 and 3000-3299,
    the robustness rounds, and the do-nothing and kneel-only ablations
- file: poscheck_crawl.py
  what: 'a position pass through the SAME adapter path as scripts/eval_policy.py (load_policy +
    run_episode), recording per seed the max x over every body frame and site of the ROBOT (only bodies
    whose kinematic root is the pelvis count, so the tunnel''s own frame at x = 2.200 is excluded), the
    head-site x, max |imu y|, the pelvis-x range and the drift after step 250, because eval rows carry no
    position; it wrote records/adapter_positions_crawl_rock_seeds{0-99,3000-3099}_2026-09-24.json,
    and its returns equal the eval records'' to 5e-4'
